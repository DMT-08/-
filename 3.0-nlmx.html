<!-- 版本 9.1：状态语义分离与关系图例精简。能力主线、具体能力级别、星级掌握、学习权限、后台状态与当前查看分别建模；依赖关系以具体能力级别节点为准，待解锁仍可查看但学习入口禁用，同时精简关系图注释并重整状态配色。 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#EFF6FF">
    <title>抖学 AI 能力模型 · 状态语义分离与关系图例精简</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#1F5FFF',
                        ink: '#172033'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        soft: '0 4px 20px -4px rgba(0,0,0,0.03), 0 2px 8px -2px rgba(0,0,0,0.02)'
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js"></script>
    <style>
        :root {
            --brand: #1F5FFF;
            --ink: #172033;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #EFF6FF 0%, #DFE7FF 100%);
        }

        button {
            -webkit-appearance: none;
        }

        .app-shell {
            width: min(1300px, 100vw);
            height: 100vh;
            height: 100dvh;
        }

        .page-view {
            display: none;
        }

        .page-view.is-active {
            display: flex;
            animation: page-enter 180ms ease-out;
        }

        .native-scroll {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .no-scrollbar {
            scrollbar-width: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .ability-card {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 24px -22px rgba(15, 23, 42, 0.32);
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        #ability-grid {
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }

        @media (hover: hover) and (pointer: fine) {
            .ability-card:hover {
                transform: translateY(-2px);
                border-color: #BFD0FF;
                box-shadow: 0 18px 34px -27px rgba(31, 95, 255, 0.42);
            }
        }

        .star-row {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .star-row i {
            color: #D7DFEA;
            font-size: 18px;
        }

        .star-row i.is-filled {
            color: #F59E0B;
        }

        .overview-stars .star-row {
            gap: 2px;
        }

        .overview-stars .star-row i {
            font-size: 15px;
        }

        .star-row.is-large {
            gap: 5px;
        }

        .star-row.is-large i {
            font-size: 26px;
        }

        .local-graph-surface {
            background-color: #FBFCFE;
            background-image: radial-gradient(circle, rgba(148, 163, 184, 0.2) 1px, transparent 1.1px);
            background-size: 26px 26px;
        }

        .learning-card {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 20px -20px rgba(15, 23, 42, 0.34);
            transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
        }

        .ability-level-flow {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr);
            align-items: stretch;
            gap: 12px;
        }

        @media (hover: hover) and (pointer: fine) {
            .learning-card:hover {
                transform: translateY(-1px);
                border-color: #BFD0FF;
                box-shadow: 0 14px 26px -22px rgba(31, 95, 255, 0.5);
            }
        }

        .topology-surface {
            background-color: #FAFCFF;
        }

        #topology-svg {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .topology-node-group {
            cursor: pointer;
            outline: none;
            transition: opacity 180ms ease;
        }

        .topology-node-visual {
            transform-box: fill-box;
            transform-origin: center;
            transition: transform 150ms ease;
        }

        .topology-node-group.is-learning .topology-node-visual {
            filter: drop-shadow(0 6px 10px rgba(31, 95, 255, 0.18));
        }

        .topology-node-group:active .topology-node-visual {
            transform: scale(0.97);
        }

        .topology-selection-ring {
            transition: opacity 150ms ease;
        }

        .topology-node-group:focus-visible .topology-selection-ring {
            opacity: 1;
        }

        .ability-card.status-learning {
            border-color: #B8CBFF;
            background: #F8FAFF;
            box-shadow: 0 10px 28px -24px rgba(31, 95, 255, 0.62);
        }

        .ability-card.status-completed {
            border-color: #BFE7CB;
            background: #F3FCF6;
            box-shadow: 0 10px 28px -24px rgba(22, 101, 52, 0.38);
        }

        .ability-card.status-locked {
            border-color: #DDE4EC;
            background: #F8FAFC;
            color: #94A3B8;
        }

        .learning-card:disabled {
            border-color: #E2E8F0;
            background: #F8FAFC;
            box-shadow: none;
            color: #94A3B8;
            cursor: not-allowed;
        }

        .learning-card:disabled img {
            filter: grayscale(1);
            opacity: 0.42;
        }

        .graph-surface {
            position: relative;
            overflow: hidden;
            touch-action: none;
            background-color: #FAFCFF;
            background-image: radial-gradient(circle, rgba(148, 163, 184, 0.2) 1px, transparent 1.1px);
            background-size: 26px 26px;
            cursor: grab;
        }

        .graph-surface:active {
            cursor: grabbing;
        }

        #local-graph {
            height: 166px;
            touch-action: manipulation;
            cursor: default;
            transition: height 180ms ease;
        }

        #local-graph.is-pan-enabled {
            touch-action: none;
            cursor: grab;
        }

        #local-graph.is-pan-enabled:active {
            cursor: grabbing;
        }

        #local-graph-svg,
        #topology-svg {
            display: block;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: visible;
            user-select: none;
            -webkit-user-select: none;
        }

        .graph-edge,
        .graph-edge-underlay {
            fill: none;
            vector-effect: non-scaling-stroke;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .graph-node {
            cursor: pointer;
            outline: none;
        }

        .graph-node-visual {
            transform-box: fill-box;
            transform-origin: center;
            transition: transform 150ms ease;
        }

        .graph-node:active .graph-node-visual {
            transform: scale(0.97);
        }

        .graph-node:focus-visible .graph-focus-ring {
            opacity: 1;
        }

        .graph-controls {
            position: absolute;
            z-index: 5;
            right: 12px;
            bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px;
            border: 1px solid rgba(226, 232, 240, 0.94);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 10px 24px -18px rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(10px);
        }

        .graph-control-button {
            display: inline-flex;
            min-width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 10px;
            color: #475569;
            font-size: 12px;
            font-weight: 800;
            transition: transform 150ms ease, background 150ms ease, color 150ms ease;
        }

        .graph-control-button:active {
            transform: scale(0.9);
        }

        @media (hover: hover) and (pointer: fine) {
            .graph-control-button:hover {
                background: #EFF6FF;
                color: #1F5FFF;
            }
        }

        @keyframes page-enter {
            from {
                opacity: 0;
                transform: translateY(3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            #ability-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 760px) {
            #ability-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            .ability-level-flow {
                grid-template-columns: minmax(0, 1fr);
                gap: 8px;
            }

            .ability-flow-arrow {
                min-height: 28px;
                transform: rotate(90deg);
            }

        }

        @media (max-width: 620px) {
            .learning-grid {
                grid-template-columns: minmax(0, 1fr);
            }

        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="font-sans text-ink antialiased">

<script>
        (function () {

            function getTopologyLongEdgeRoutesV9() {

                const grouped = { top: [], bottom: [] };
                graphEdgesV9.forEach(function (edge) {
                    const rankSpan = baseLayout.rank.get(edge.target) - baseLayout.rank.get(edge.source);
                    if (rankSpan <= 1) return;
                    const source = baseLayout.positions.get(edge.source);
                    const target = baseLayout.positions.get(edge.target);
                    const averageY = (nodeCenterYV9(source) + nodeCenterYV9(target)) / 2;
                    const side = averageY <= baseLayout.height / 2 ? 'top' : 'bottom';
                    grouped[side].push({ edge: edge, averageY: averageY });
                });
                topologyLongEdgeRoutesV9 = new Map();
                ['top', 'bottom'].forEach(function (side) {

            function topologyEdgePathV9(edge, port, layout) {
                const rankSpan = layout.rank.get(edge.target) - layout.rank.get(edge.source);
                if (rankSpan <= 1) return smoothEdgePathV9(port);

                const route = getTopologyLongEdgeRoutesV9().get(edge.id);
                const laneSpacing = 15;
                const laneY = route && route.side === 'bottom'
                    ? layout.height - 26 - route.laneIndex * laneSpacing
                    : 26 + (route ? route.laneIndex : 0) * laneSpacing;
                const distance = port.end.x - port.start.x;
                const corridor = Math.min(36, Math.max(28, distance * 0.16));
                const exitX = port.start.x + corridor;
                const entryX = port.end.x - corridor;
                const firstDirection = laneY >= port.start.y ? 1 : -1;
                const secondDirection = port.end.y >= laneY ? 1 : -1;
                const radius = 9;

                return [
                    'M', roundedV9(port.start.x), roundedV9(port.start.y),
                    'L', roundedV9(exitX - radius), roundedV9(port.start.y),
                    'Q', roundedV9(exitX), roundedV9(port.start.y), roundedV9(exitX), roundedV9(port.start.y + firstDirection * radius),
                    'L', roundedV9(exitX), roundedV9(laneY - firstDirection * radius),
                    'Q', roundedV9(exitX), roundedV9(laneY), roundedV9(exitX + radius), roundedV9(laneY),
                    'L', roundedV9(entryX - radius), roundedV9(laneY),
                    'Q', roundedV9(entryX), roundedV9(laneY), roundedV9(entryX), roundedV9(laneY + secondDirection * radius),
                    'L', roundedV9(entryX), roundedV9(port.end.y - secondDirection * radius),
                    'Q', roundedV9(entryX), roundedV9(port.end.y), roundedV9(entryX + radius), roundedV9(port.end.y),
                    'L', roundedV9(port.end.x), roundedV9(port.end.y)

                return position.y + padding + span * index / (count - 1);

            function allocateEdgePortsV9(edges, positions, sortPositions) {

                const outgoing = new Map();
                const incoming = new Map();
                const ports = new Map();

                edges.forEach(function (edge) {
                    if (!outgoing.has(edge.source)) outgoing.set(edge.source, []);
                    if (!incoming.has(edge.target)) incoming.set(edge.target, []);
                    outgoing.get(edge.source).push(edge);
                    incoming.get(edge.target).push(edge);
                    ports.set(edge.id, {});

                    const firstPosition = sortingPositions.get(firstId);
                    const secondPosition = sortingPositions.get(secondId);
                    const yDifference = nodeCenterYV9(firstPosition) - nodeCenterYV9(secondPosition);
                    if (Math.abs(yDifference) > 0.01) return yDifference;
                    return (abilityOrderV9.get(firstId) || 0) - (abilityOrderV9.get(secondId) || 0);

                            y: portYV9(source, index, items.length)

            function computeLocalLayoutV9(ability) {
                const related = relatedAbilitiesV9(ability.id);

                const nodeHeight = 46;

                const currentHeight = 64;
                const gapY = 6;
                const maxCount = abilitiesV9.reduce(function (largestCount, item) {
                    const incomingCount = graphEdgesV9.filter(function (edge) { return edge.target === item.id; }).length;
                    const outgoingCount = graphEdgesV9.filter(function (edge) { return edge.source === item.id; }).length;
                    return Math.max(largestCount, incomingCount, outgoingCount);

                const height = Math.max(166, contentHeight + 30);
                const measuredWidth = localSurfaceV9.clientWidth || 0;
                const width = Math.max(820, measuredWidth);
                const leftX = 30;
                const rightX = width - 30 - nodeWidth;
                const currentX = (width - currentWidth) / 2;

                stackPositionsV9(related.incoming, leftX, nodeWidth, nodeHeight, gapY, height).forEach(function (position, id) {

                positions.set(ability.id, {
                    x: currentX,
                    y: (height - currentHeight) / 2 + 8,
                    width: currentWidth,
                    height: currentHeight
                });

                const edges = related.incomingEdges.concat(related.outgoingEdges).map(function (edge) {

                        source: edge.source,
                        target: edge.target,
                        sourceLevelNodeId: edge.sourceLevelNodeId,
                        targetLevelNodeId: edge.targetLevelNodeId

                const roles = new Map();

                related.outgoing.forEach(function (item) { roles.set(item.id, 'outgoing'); });

                return {
                    width: width,
                    height: height,
                    nodeWidth: nodeWidth,
                    nodeHeight: nodeHeight,
                    related: related,

                    edges: edges,

            let topologyStructureV9 = null;

            function buildTopologyStructureV9() {

                const rank = new Map();

                nodeIds.forEach(function (id) {
                    incoming.set(id, []);
                    outgoing.set(id, []);
                    indegree.set(id, 0);
                    rank.set(id, 0);
                });
                graphEdgesV9.forEach(function (edge) {
                    outgoing.get(edge.source).push(edge.target);
                    incoming.get(edge.target).push(edge.source);
                    indegree.set(edge.target, indegree.get(edge.target) + 1);
                });

                const queue = nodeIds.filter(function (id) {
                    return indegree.get(id) === 0;
                });
                const ordered = [];
                while (queue.length) {
                    queue.sort(function (first, second) {
                        return abilityOrderV9.get(first) - abilityOrderV9.get(second);
                    });
                    const id = queue.shift();
                    ordered.push(id);
                    outgoing.get(id).forEach(function (targetId) {
                        rank.set(targetId, Math.max(rank.get(targetId), rank.get(id) + 1));
                        indegree.set(targetId, indegree.get(targetId) - 1);
                        if (indegree.get(targetId) === 0) queue.push(targetId);
                    });
                }

                if (ordered.length !== nodeIds.length) {
                    throw new Error('能力关系存在循环，无法生成有向图。');
                }

                const maxRank = Math.max.apply(null, Array.from(rank.values()));
                const layers = Array.from({ length: maxRank + 1 }, function () { return []; });
                ordered.forEach(function (id) {
                    layers[rank.get(id)].push(id);
                });

                function normalizedPosition(id) {
                    const layer = layers[rank.get(id)];
                    if (layer.length <= 1) return 0.5;
                    return layer.indexOf(id) / (layer.length - 1);
                }

                function sortLayerByNeighbours(layerIndex, neighbourMap) {
                    const layer = layers[layerIndex];
                    const previousOrder = new Map(layer.map(function (id, index) {
                        return [id, index];
                    }));
                    layer.sort(function (firstId, secondId) {
                        function score(id) {
                            const neighbours = neighbourMap.get(id);
                            if (!neighbours.length) return 0.5;
                            return neighbours.reduce(function (sum, neighbourId) {
                                return sum + normalizedPosition(neighbourId);
                            }, 0) / neighbours.length;
                        }
                        const difference = score(firstId) - score(secondId);
                        return Math.abs(difference) > 0.0001
                            ? difference
                            : previousOrder.get(firstId) - previousOrder.get(secondId);
                    });
                }

                for (let pass = 0; pass < 4; pass += 1) {
                    for (let layerIndex = 1; layerIndex < layers.length; layerIndex += 1) {
                        sortLayerByNeighbours(layerIndex, incoming);
                    }
                    for (let layerIndex = layers.length - 2; layerIndex >= 0; layerIndex -= 1) {
                        sortLayerByNeighbours(layerIndex, outgoing);
                    }
                }

                return {
                    incoming: incoming,
                    outgoing: outgoing,
                    rank: rank,
                    layers: layers
                };

                        graphEdgesV9.forEach(function (edge) {

                            if (!matches) return;
                            const nextId = direction === 'incoming' ? edge.source : edge.target;

                            focusedNodeIds.add(nextId);
                            relationNodeIds.add(nextId);

                    focusedEdgeIds: focusedEdgeIds,
                    upstreamNodeIds: upstreamNodeIds,
                    downstreamNodeIds: downstreamNodeIds

            function centeredFocusedSlotsV9(layer, focus) {
                if (!focus.selectedId) return layer.slice();
                const focusedIds = layer.filter(function (id) {
                    return focus.focusedNodeIds.has(id);
                });
                if (!focusedIds.length || focusedIds.length === layer.length) return layer.slice();

                const slotIndexes = layer.map(function (_, index) { return index; });
                const center = (layer.length - 1) / 2;
                const focusedSlots = slotIndexes
                    .slice()
                    .sort(function (first, second) {
                        const distanceDifference = Math.abs(first - center) - Math.abs(second - center);
                        return distanceDifference || first - second;
                    })
                    .slice(0, focusedIds.length)
                    .sort(function (first, second) { return first - second; });
                const remainingSlots = slotIndexes.filter(function (index) {
                    return focusedSlots.indexOf(index) === -1;
                });
                const unrelatedIds = layer.filter(function (id) {
                    return !focus.focusedNodeIds.has(id);
                });
                const orderedBySlot = new Array(layer.length);
                focusedIds.forEach(function (id, index) {
                    orderedBySlot[focusedSlots[index]] = id;
                });
                unrelatedIds.forEach(function (id, index) {
                    orderedBySlot[remainingSlots[index]] = id;
                });

            function computeTopologyLayoutV9(selectedAbilityId) {

                const focus = collectTopologyFocusV9(selectedAbilityId);
                const nodeWidth = 184;
                const nodeHeight = 76;
                const gapX = 94;
                const gapY = 34;
                const paddingX = 58;
                const graphHeight = 500;
                const graphWidth = paddingX * 2
                    + topologyStructureV9.layers.length * nodeWidth
                    + Math.max(0, topologyStructureV9.layers.length - 1) * gapX;
                const positions = new Map();
                const visualLayers = [];

                topologyStructureV9.layers.forEach(function (baseLayer, layerIndex) {

                    visualLayers.push(visualLayer);
                    const layerHeight = visualLayer.length * nodeHeight + Math.max(0, visualLayer.length - 1) * gapY;
                    const layerTop = (graphHeight - layerHeight) / 2;
                    visualLayer.forEach(function (id, itemIndex) {

                            y: layerTop + itemIndex * (nodeHeight + gapY),
                            width: nodeWidth,
                            height: nodeHeight

                    });
                });

                    height: graphHeight,
                    positions: positions,
                    rank: topologyStructureV9.rank,

            function hexToRgbV9(color) {

                return {

                    g: parseInt(normalized.slice(2, 4), 16),
                    b: parseInt(normalized.slice(4, 6), 16)
                };

            function mixColorV9(firstColor, secondColor, amount) {
                const first = hexToRgbV9(firstColor);
                const second = hexToRgbV9(secondColor);
                const progress = Math.max(0, Math.min(1, amount));
                const channel = function (firstValue, secondValue) {
                    return Math.round(firstValue + (secondValue - firstValue) * progress)
                        .toString(16)
                        .padStart(2, '0');
                };
                return '#' + channel(first.r, second.r) + channel(first.g, second.g) + channel(first.b, second.b);
            }

            function lerpV9(first, second, amount) {

            }

            function interpolateLayoutV9(fromLayout, toLayout, amount) {

                abilitiesV9.forEach(function (ability) {

                    positions.set(ability.id, {

                        y: lerpV9(from.y, to.y, amount),
                        width: to.width,
                        height: to.height
                    });
                });
                return {
                    width: toLayout.width,
                    height: toLayout.height,
                    positions: positions,
                    rank: toLayout.rank,
                    layers: toLayout.layers,

            function interpolatePortsV9(fromPorts, toPorts, amount) {

                            y: lerpV9(from.start.y, to.start.y, amount)

                        end: {

                            y: lerpV9(from.end.y, to.end.y, amount)

            function renderTopologyInitialV9() {
                stateV9.topologyTransitionToken += 1;
                destroyPanZoomV9(topologyPanZoomV9, topologyViewportV9);
                topologyPanZoomV9 = null;
                const layout = computeTopologyLayoutV9(stateV9.topologySelectedAbilityId);
                const focus = layout.focus;

                stateV9.topologyLayout = layout;

            function animateTopologySelectionV9(nextId, fitAfter) {
                if (nextId && !abilityByIdV9(nextId)) return;
                if (nextId === stateV9.topologySelectedAbilityId && stateV9.topologyLayout) {
                    if (fitAfter) fitTopologyCanvasV9();
                    return;
                }

                stateV9.topologyTransitionToken += 1;
                const transitionToken = stateV9.topologyTransitionToken;
                const fromLayout = stateV9.topologyLayout || computeTopologyLayoutV9(stateV9.topologySelectedAbilityId);
                const fromFocus = stateV9.topologyFocus || fromLayout.focus;
                const toLayout = computeTopologyLayoutV9(nextId);
                const toFocus = toLayout.focus;
                const fromPorts = allocateEdgePortsV9(graphEdgesV9, fromLayout.positions);
                const toPorts = allocateEdgePortsV9(graphEdgesV9, toLayout.positions);
                stateV9.topologySelectedAbilityId = nextId;

                renderTopologyFrameV9(fromLayout, nextId, fromFocus, fromFocus, 0, fromPorts);

                const delay = reducedMotionV9 ? 0 : 34;
                const duration = reducedMotionV9 ? 0 : 220;
                const startAt = performance.now() + delay;

                function finish() {
                    stateV9.topologyLayout = toLayout;
                    stateV9.topologyFocus = toFocus;
                    renderTopologyFrameV9(toLayout, nextId, toFocus, toFocus, 1, toPorts);
                    if (fitAfter) window.requestAnimationFrame(fitTopologyCanvasV9);
                }

                if (!duration) {
                    finish();
                    return;
                }

                    if (transitionToken !== stateV9.topologyTransitionToken) return;
                    if (now < startAt) {
                        window.requestAnimationFrame(step);
                        return;
                    }
                    const linear = Math.min(1, (now - startAt) / duration);
                    const eased = 1 - Math.pow(1 - linear, 3);
                    const layout = interpolateLayoutV9(fromLayout, toLayout, eased);
                    const ports = interpolatePortsV9(fromPorts, toPorts, eased);
                    renderTopologyFrameV9(layout, nextId, fromFocus, toFocus, eased, ports);
                    if (linear < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        finish();
                    }
                }

            document.getElementById('detail-back-button').addEventListener('click', function () {

            document.getElementById('detail-breadcrumb-overview').addEventListener('click', function () {

            document.getElementById('detail-topology-button').addEventListener('click', openTopologyV9);
            document.getElementById('topology-back-button').addEventListener('click', function () {

                animateTopologySelectionV9(null, true);

            if (typeof ResizeObserver !== 'undefined') {
                let resizeTimer = null;
                const layoutResizeObserver = new ResizeObserver(function () {
                    window.clearTimeout(resizeTimer);
                    resizeTimer = window.setTimeout(function () {
                        if (stateV9.view === 'detail') {
                            if (localSceneV9 && localSceneV9.animating) {
                                localResizePendingV9 = true;
                            } else {
                                renderLocalGraphV9(abilityByIdV9(stateV9.selectedAbilityId));
                            }
                        }
                        if (stateV9.view === 'topology') {
                            if (topologyPanZoomV9) topologyPanZoomV9.resize();
                            if (stateV9.topologyLayout && stateV9.topologyFocus) {
                                const ports = allocateEdgePortsV9(graphEdgesV9, stateV9.topologyLayout.positions);
                                renderTopologyFrameV9(
                                    stateV9.topologyLayout,
                                    stateV9.topologySelectedAbilityId,
                                    stateV9.topologyFocus,
                                    stateV9.topologyFocus,
                                    1,
                                    ports
                                );
                            }
                        }
                    }, 90);
                });
                layoutResizeObserver.observe(document.getElementById('detail-page'));
                layoutResizeObserver.observe(topologySurfaceV9);
            }

            validateDataContractV9();
            renderOverviewV9();
            renderDetailV9(false);
        }());
    </script>
