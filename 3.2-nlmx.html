    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#1F5FFF',
                        ink: '#172033'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']

                    boxShadow: {

        :root {

            --ink: #172033;
            --soft-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.03), 0 2px 8px -2px rgba(0, 0, 0, 0.02);
            --type-page-title: 32px;
            --type-section-title: 20px;
            --type-card-title: 17px;
            --type-body: 14px;
            --type-meta: 12px;
            --type-label: 11px;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #EFF6FF 0%, #DFE7FF 100%);
        }

        button {
            -webkit-appearance: none;
        }

        button:focus-visible,
        [role="button"]:focus-visible {
            outline: 3px solid rgba(31, 95, 255, 0.25);
            outline-offset: 2px;
        }

        .app-shell {
            width: min(1300px, 100vw);
            height: 100vh;
            height: 100dvh;
        }

        .page-view {
            display: none;
        }

        .page-view.is-active {
            display: flex;
            animation: page-enter 180ms ease-out;
        }

        .native-scroll {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
        }

        .horizontal-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            scrollbar-width: none;
        }

        .horizontal-scroll::-webkit-scrollbar,
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            scrollbar-width: none;
        }

        .ability-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ability-row {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 24px -22px rgba(15, 23, 42, 0.32);
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        .ability-name-card {
            display: flex;

            flex-direction: row;
            align-items: flex-start;

            border-radius: 14px;
            background: #F4F7FF;
            padding: 0 15px;
            color: #173E9C;
            text-align: left;

        .mainline-list {
            min-width: max-content;

        .overview-mainline .mainline-node {

            padding: 9px 10px;

        .overview-mainline .mainline-connector {

            height: 78px;
            flex-basis: 24px;

        .overview-mainline .node-caption {
            max-width: 90px;
            margin-top: 3px;
            font-size: 10px;
        }

        .node-current-badge {
            position: absolute;
            right: 7px;
            top: 6px;
            border: 1px solid #F4CF79;
            border-radius: 6px;
            background: #FFF4CF;
            padding: 2px 5px;
            color: #8A4B08;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
        }

        .node-lock-badge {
            position: absolute;
            left: 8px;
            top: 7px;
            display: inline-flex;
            width: 22px;
            height: 22px;
            align-items: center;
            justify-content: center;

            background: #FFFFFF;
            color: #64748B;
            font-size: 13px;
            line-height: 1;
            box-shadow: 0 2px 5px rgba(15, 23, 42, 0.06);
            pointer-events: none;

            width: 26px;
            height: 26px;
            border-color: #F6C76B;
            background: #FFF2C2;
            color: #C56A07;
            font-size: 15px;
            box-shadow: 0 3px 8px rgba(197, 106, 7, 0.12);
        }

        .mainline-node.role-target .node-lock-badge {
            color: #64748B;
        }

        .mainline-node {
            position: relative;
            display: flex;
            min-width: 66px;
            height: 68px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #DCE4EF;
            border-radius: 12px;
            background: #FFFFFF;
            color: #475569;
            transition: transform 150ms ease, border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
        }

        .mainline-node:active {
            transform: scale(0.95);
        }

        .mainline-node.role-completed {
            border-color: #BFE7CB;
            background: #F3FCF6;
            color: #166534;
        }

        .mainline-node.role-current {
            border-color: #F0C36A;
            background: #FFF4CF;
            color: #92400E;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.09);
        }

        .mainline-node.role-current.state-locked {
            border-width: 2px;
            border-color: #F59E0B;
            border-style: dashed;
            background: #FFFCF2;
            color: #9A5B13;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.05);
        }

        .mainline-node.role-upcoming {
            border-color: #D2DAE6;
            background: #FFFFFF;
            color: #64748B;
        }

        .mainline-node.role-upcoming.state-locked {
            border-style: dashed;
        }

        .mainline-node.role-target {
            border-color: #6F98FF;
            border-style: dashed;
            background: #EDF3FF;
            color: #1746B2;
        }

        .mainline-node::after {
            position: absolute;
            inset: -3px;
            border: 1.5px solid rgba(31, 95, 255, 0.68);
            border-radius: 14px;
            content: "";
            opacity: 0;
            pointer-events: none;
            transform: scale(0.97);
            transition: opacity 180ms linear, transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .mainline-node.is-selected::after {
            opacity: 1;
            transform: scale(1);
        }

        .node-level {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .node-caption {
            margin-top: 1px;
            max-width: 60px;
            overflow: hidden;
            color: currentColor;
            font-size: 9px;
            font-weight: 800;
            line-height: 1.15;
            opacity: 0.78;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .mini-stars {
            display: flex;
            height: 11px;
            align-items: center;
            gap: 1px;
            margin-top: 3px;
        }

        .mini-stars i {
            color: #D7DFEA;
            font-size: 9px;
        }

        .mini-stars i.is-filled {
            color: #F59E0B;
        }

        .role-completed .mini-stars i.is-filled {
            color: #35A760;
        }

        .mainline-connector {
            position: relative;
            display: flex;
            width: 25px;
            height: 68px;
            flex: 0 0 25px;
            align-items: center;
            justify-content: center;
            color: #CBD5E1;
        }

        .mainline-connector::before {
            width: 100%;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            content: "";
        }

        .mainline-connector i {
            position: absolute;
            right: -3px;
            padding: 1px 0;
            background: #FFFFFF;
            font-size: 11px;
        }

        .mainline-connector.is-passed {
            color: #86C99D;
        }

        .mainline-connector.is-current {
            color: #7DA1FF;
        }

        .mainline-connector.is-target {
            color: #CBD5E1;
        }

        .detail-mainline .mainline-node {

            height: 88px;
            border-radius: 14px;
            padding: 9px 10px;

        .detail-mainline .mainline-connector {

            height: 88px;
            flex-basis: 42px;
        }

        .detail-mainline .node-level {
            font-size: 18px;
        }

        .detail-mainline .node-caption {
            max-width: 108px;
            margin-top: 3px;
            font-size: 10px;
        }

        .detail-mainline .mini-stars {
            margin-top: 5px;
        }

        .detail-mainline .mini-stars i {
            font-size: 11px;
        }

        .learning-card {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 20px -20px rgba(15, 23, 42, 0.34);
            transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
        }

        .learning-card:active:not(:disabled) {
            transform: scale(0.95);
        }

        .learning-card:disabled {
            cursor: not-allowed;
            border-color: #E2E8F0;
            background: #F8FAFC;
            box-shadow: none;
        }

        .topology-surface {
            position: relative;
            min-height: 0;
            overflow: hidden;
            background-color: #FAFCFF;
            background-image: radial-gradient(circle, rgba(148, 163, 184, 0.2) 1px, transparent 1.1px);
            background-size: 26px 26px;
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .topology-surface.is-panning {
            cursor: grabbing;
        }

        #topology-svg {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .graph-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .graph-control-button {
            display: flex;
            min-width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-radius: 10px;
            color: #475569;
            font-size: 11px;
            font-weight: 800;
            transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
        }

        .graph-control-button[hidden] {
            display: none;
        }

        .graph-control-button:active {
            transform: scale(0.9);
            background: #EFF6FF;
            color: #1F5FFF;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 50;
            display: flex;
            min-height: 44px;
            align-items: center;
            gap: 8px;
            border: 1px solid #DCE4EF;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.96);
            padding: 10px 14px;
            color: #334155;
            font-size: var(--type-meta);
            font-weight: 800;
            box-shadow: 0 16px 36px -20px rgba(15, 23, 42, 0.42);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 12px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .topology-hint {
            position: absolute;
            left: 50%;
            top: 14px;
            z-index: 4;
            display: flex;
            min-height: 40px;
            align-items: center;
            border: 1px solid rgba(191, 208, 255, 0.9);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            padding: 8px 13px;
            color: #2852B8;
            font-size: 11px;
            font-weight: 800;
            box-shadow: var(--soft-shadow);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -6px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .topology-hint.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .topology-hint.is-warning {
            border-color: #F7D7A6;
            background: rgba(255, 251, 235, 0.97);
            color: #9A5B13;
        }

        @media (hover: hover) and (pointer: fine) {
            .ability-row:hover {
                border-color: #BFD0FF;
                box-shadow: 0 18px 34px -27px rgba(31, 95, 255, 0.42);
                transform: translateY(-2px);
            }

            .mainline-node:hover {
                border-color: #7DA1FF;
                box-shadow: 0 8px 18px -14px rgba(31, 95, 255, 0.48);
                transform: translateY(-1px);
            }

            .learning-card:hover:not(:disabled) {
                border-color: #BFD0FF;
                box-shadow: 0 14px 26px -22px rgba(31, 95, 255, 0.5);
                transform: translateY(-1px);
            }

            .graph-control-button:hover {
                background: #EFF6FF;
                color: #1F5FFF;
            }
        }

        @media (max-width: 760px) {
            .app-shell {
                padding: 12px;
            }

            .ability-name-card {
                width: 164px;
            }

            .learning-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @keyframes page-enter {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 10.2：统一无衬线排版与更明确的原生点击语义 */
        body,
        button,
        .node-level,
        #topology-svg text {
            font-family: Inter, system-ui, sans-serif !important;

            function validateDataV10() {

                }
                const nodeIds = new Set();
                abilitiesV10.forEach(function (ability) {

                    ability.levels.forEach(function (node, index) {
                        if (nodeIds.has(node.id)) throw new Error('重复节点：' + node.id);
                        nodeIds.add(node.id);
                        if (node.level !== index + 1) throw new Error(ability.name + '主线等级不连续。');
                        if (!Number.isInteger(node.masteryStars) || node.masteryStars < 0 || node.masteryStars > 5) {

                        }
                        if (typeof node.canStudy !== 'boolean') throw new Error(node.id + '缺少明确学习权限。');
                    });
                    if (!levelNodeByIdV10(ability.currentLevelNodeId) || !levelNodeByIdV10(ability.targetLevelNodeId)) {
                        throw new Error(ability.name + '缺少当前或目标节点。');
                    }
                    if (currentNodeV10(ability).role !== 'current' || targetNodeV10(ability).role !== 'target') {
                        throw new Error(ability.name + '的主线角色标记不完整。');
                    }
                });

                    if (source.abilityId === target.abilityId) throw new Error('能力内部连续等级不得写入子关系。');

                    { source: 'root', target: 'branch' },

                    { source: 'branch', target: 'cycle' },
                    { source: 'cycle', target: 'branch' }
                ]);
                if (!relatedProbe.has('ancestor-2') || !relatedProbe.has('cycle') || relatedProbe.has('side-branch')) {

                    const vocabularyBranches = activeEdges.filter(function (edge) { return edge.source === 'vocabulary-l3'; });

                    if (communicationMerge.length < 4) throw new Error('正式数据缺少普通汇聚场景。');

                    requireRelationship('vocabulary-l3', 'sentence-l3', '特殊直接依赖缺少 A→B。');
                    requireRelationship('vocabulary-l3', 'reading-l2', '特殊直接依赖缺少 A→C。');
                    requireRelationship('sentence-l3', 'reading-l2', '特殊直接依赖缺少 B→C。');
                    const specialGraph = collectGlobalDependencyGraphV129('vocabulary-l3');
                    const preservesInternalEdge = specialGraph.edges.some(function (edge) {

            function detectRelationshipCycleEdgeIdsV10(edges) {
                const adjacency = new Map();
                const nodeIds = new Set();
                edges.forEach(function (edge) {
                    nodeIds.add(edge.source);
                    nodeIds.add(edge.target);
                    const outgoing = adjacency.get(edge.source) || [];
                    outgoing.push(edge);
                    adjacency.set(edge.source, outgoing);
                });
                let visitIndex = 0;
                const indexes = new Map();
                const lowLinks = new Map();
                const stack = [];
                const onStack = new Set();
                const componentByNode = new Map();
                const componentSizes = new Map();
                let componentIndex = 0;

                function visit(nodeId) {
                    indexes.set(nodeId, visitIndex);
                    lowLinks.set(nodeId, visitIndex);
                    visitIndex += 1;
                    stack.push(nodeId);
                    onStack.add(nodeId);
                    (adjacency.get(nodeId) || []).forEach(function (edge) {
                        if (!indexes.has(edge.target)) {
                            visit(edge.target);
                            lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), lowLinks.get(edge.target)));
                        } else if (onStack.has(edge.target)) {
                            lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), indexes.get(edge.target)));
                        }
                    });
                    if (lowLinks.get(nodeId) !== indexes.get(nodeId)) return;
                    let memberCount = 0;
                    let memberId = null;
                    do {
                        memberId = stack.pop();
                        onStack.delete(memberId);
                        componentByNode.set(memberId, componentIndex);
                        memberCount += 1;
                    } while (memberId !== nodeId);
                    componentSizes.set(componentIndex, memberCount);
                    componentIndex += 1;
                }

                nodeIds.forEach(function (nodeId) {
                    if (!indexes.has(nodeId)) visit(nodeId);
                });
                const cycleEdgeIds = new Set();
                edges.forEach(function (edge) {
                    const component = componentByNode.get(edge.source);
                    if (component !== componentByNode.get(edge.target)) return;
                    if (edge.source === edge.target || componentSizes.get(component) > 1) cycleEdgeIds.add(edge.id);
                });
                return cycleEdgeIds;
            }

            /* 13.8：单一 Pointer Events 控制器；节点轻点保留原生 click，超过阈值后才捕获指针并进入画布拖动。 */
            function createTopologyInteractionV138(svg, surface, signal) {
                const minimumZoom = 0.3;
                const maximumZoom = 6;
                const dragThreshold = 8;
                const pointers = new Map();
                let bounds = { x: 0, y: 0, width: 1000, height: 600 };
                let view = { x: 0, y: 0, width: 1000, height: 600 };

                function surfaceRect() {
                    const rect = svg.getBoundingClientRect();
                    return {
                        left: rect.left,
                        top: rect.top,
                        width: Math.max(1, rect.width),
                        height: Math.max(1, rect.height)
                    };
                }

                function clampZoom(value) {
                    return Math.min(maximumZoom, Math.max(minimumZoom, value));
                }

                function currentZoom() {
                    return surfaceRect().width / Math.max(1, view.width);
                }

                function applyView(nextView) {
                    if (![nextView.x, nextView.y, nextView.width, nextView.height].every(Number.isFinite)) return;
                    view = nextView;
                    svg.setAttribute('viewBox', [view.x, view.y, view.width, view.height].map(function (value) {
                        return Number(value.toFixed(3));
                    }).join(' '));
                }

                function centerAt(point, zoom) {
                    const rect = surfaceRect();
                    const nextZoom = clampZoom(zoom);
                    const width = rect.width / nextZoom;
                    const height = rect.height / nextZoom;
                    applyView({
                        x: point.x - width / 2,
                        y: point.y - height / 2,
                        width: width,
                        height: height
                    });
                }

                function clientToWorld(clientX, clientY) {
                    const rect = surfaceRect();
                    return {
                        x: view.x + (clientX - rect.left) / rect.width * view.width,
                        y: view.y + (clientY - rect.top) / rect.height * view.height
                    };
                }

                function capturePointer(pointerId) {
                    try {
                        if (!svg.hasPointerCapture(pointerId)) svg.setPointerCapture(pointerId);
                    } catch {
                        return false;
                    }
                    return true;
                }

                function releasePointer(pointerId) {
                    try {
                        if (svg.hasPointerCapture(pointerId)) svg.releasePointerCapture(pointerId);
                    } catch {
                        return false;
                    }
                    return true;
                }

                function pointerPair() {
                    return Array.from(pointers.values()).slice(0, 2);
                }

                function pairDistance(first, second) {
                    return Math.max(1, Math.hypot(second.x - first.x, second.y - first.y));
                }

                function pairMidpoint(first, second) {
                    return { x: (first.x + second.x) / 2, y: (first.y + second.y) / 2 };
                }

                function markAsDrag() {
                    dragStarted = true;
                    suppressClickUntil = performance.now() + 500;
                    surface.classList.add('is-panning');
                }

                function beginPinch() {
                    const pair = pointerPair();
                    if (pair.length < 2) {
                        pinch = null;
                        return;
                    }
                    const midpoint = pairMidpoint(pair[0], pair[1]);
                    pinch = {
                        pointerIds: [pair[0].id, pair[1].id],
                        distance: pairDistance(pair[0], pair[1]),
                        zoom: currentZoom(),
                        anchor: clientToWorld(midpoint.x, midpoint.y)
                    };
                    pair.forEach(function (pointer) { capturePointer(pointer.id); });
                    markAsDrag();
                }

                    if (!pinch) beginPinch();
                    if (!pinch) return;
                    const first = pointers.get(pinch.pointerIds[0]);
                    const second = pointers.get(pinch.pointerIds[1]);
                    if (!first || !second) {
                        beginPinch();
                        return;
                    }
                    const rect = surfaceRect();
                    const midpoint = pairMidpoint(first, second);
                    const zoom = clampZoom(pinch.zoom * pairDistance(first, second) / pinch.distance);
                    const width = rect.width / zoom;
                    const height = rect.height / zoom;
                    applyView({
                        x: pinch.anchor.x - (midpoint.x - rect.left) / rect.width * width,
                        y: pinch.anchor.y - (midpoint.y - rect.top) / rect.height * height,

                    const rect = surfaceRect();
                    applyView({
                        x: view.x - deltaX / rect.width * view.width,

                            visited.add(nextId);
                            related.add(nextId);
                            queue.push(nextId);
                        });

                traverse(outgoing);

                    if (Math.abs(start.y - end.y) < 0.1) add([start, end]);
                    xLanes.forEach(function (x) { add([start, { x: x, y: start.y }, { x: x, y: end.y }, end]); });
                } else if (!horizontalStart && !horizontalEnd) {
                    if (Math.abs(start.x - end.x) < 0.1) add([start, end]);
                    yLanes.forEach(function (y) { add([start, { x: start.x, y: y }, { x: end.x, y: y }, end]); });
                } else if (horizontalStart) {
                    add([start, { x: end.x, y: start.y }, end]);
                    xLanes.forEach(function (x) {
                        yLanes.forEach(function (y) { add([start, { x: x, y: start.y }, { x: x, y: y }, { x: end.x, y: y }, end]); });
                    });
                } else {
                    add([start, { x: start.x, y: end.y }, end]);
                    yLanes.forEach(function (y) {
                        xLanes.forEach(function (x) { add([start, { x: start.x, y: y }, { x: x, y: y }, { x: x, y: end.y }, end]); });
                    });
                }
                return candidates;
            }

            function topologyRouteAttemptV137(graph, layout, orderedEdges, lanes) {
                const usedPorts = new Set();
                const routed = [];
                orderedEdges.forEach(function (edge) {
                    const sourceMetrics = layout.metricsById.get(edge.source);
                    const targetMetrics = layout.metricsById.get(edge.target);
                    const baseline = topologyEdgeBaselineV137(edge, layout);
                    const maximumLength = baseline * 2 + 12;
                    const candidates = [];
                    topologySidePairsV137(sourceMetrics, targetMetrics).forEach(function (sides, sidePriority) {
                        const startPort = topologyAvailablePortV137(edge.source, sourceMetrics, sides[0], usedPorts);
                        const endPort = topologyAvailablePortV137(edge.target, targetMetrics, sides[1], usedPorts);
                        if (!startPort || !endPort || startPort.key === endPort.key) return;
                        topologyCandidatePathsV137(startPort, endPort, lanes, baseline).forEach(function (points) {
                            if (!topologyPortDirectionValidV137(startPort.side, points[0], points[1], true)) return;
                            if (!topologyPortDirectionValidV137(endPort.side, points[points.length - 2], points[points.length - 1], false)) return;
                            if (!topologyCandidatePathClearV137(points, edge, layout)) return;
                            const length = topologyPathLengthV132(points);
                            if (length > maximumLength + 0.1) return;
                            const relation = topologyCandidateConflictV137(points, routed);
                            if (relation.conflict) return;
                            candidates.push({
                                points: points,
                                length: length,
                                bends: points.length - 2,
                                crossings: relation.crossings,
                                sidePriority: sidePriority,
                                startPort: startPort,
                                endPort: endPort
                            });
                        });
                    });
                    candidates.sort(function (first, second) {
                        return first.length - second.length || first.crossings - second.crossings || first.bends - second.bends || first.sidePriority - second.sidePriority || first.startPort.slotIndex - second.startPort.slotIndex || first.endPort.slotIndex - second.endPort.slotIndex;
                    });
                    const selected = candidates[0];
                    if (!selected) throw new Error(edge.id + '在 2 倍合理最短路径与 3 个折点内没有可用通道。');
                    usedPorts.add(selected.startPort.key);
                    usedPorts.add(selected.endPort.key);
                    routed.push({
                        edge: edge,
                        points: selected.points,
                        d: topologyOrthogonalPathDataV132(selected.points),
                        kind: selected.bends === 0 ? 'direct' : 'local-orthogonal',
                        laneIndex: selected.sidePriority,
                        length: selected.length,
                        bends: selected.bends
                    });
                });
                validateTopologyRoutesV133(graph, layout, routed);
                return routed;
            }

            function topologyRoutesV132(graph, layout) {
                const lanes = topologyRoutingLanesV137(layout);
                const degree = new Map(graph.nodes.map(function (node) { return [node.id, 0]; }));
                graph.edges.forEach(function (edge) {
                    degree.set(edge.source, (degree.get(edge.source) || 0) + 1);
                    degree.set(edge.target, (degree.get(edge.target) || 0) + 1);
                });
                const shortestFirst = graph.edges.slice().sort(function (first, second) {
                    return topologyEdgeBaselineV137(first, layout) - topologyEdgeBaselineV137(second, layout) || first.id.localeCompare(second.id);
                });
                const busiestFirst = graph.edges.slice().sort(function (first, second) {
                    const firstDegree = (degree.get(first.source) || 0) + (degree.get(first.target) || 0);
                    const secondDegree = (degree.get(second.source) || 0) + (degree.get(second.target) || 0);
                    return secondDegree - firstDegree || topologyEdgeBaselineV137(first, layout) - topologyEdgeBaselineV137(second, layout) || first.id.localeCompare(second.id);
                });
                const strategies = [shortestFirst, busiestFirst, graph.edges.slice()];
                const successful = [];
                let lastError = null;
                strategies.forEach(function (orderedEdges) {
                    try {
                        const routes = topologyRouteAttemptV137(graph, layout, orderedEdges, lanes);
                        successful.push({
                            routes: routes,
                            length: routes.reduce(function (sum, route) { return sum + route.length; }, 0),
                            bends: routes.reduce(function (sum, route) { return sum + route.bends; }, 0)
                        });
                    } catch (error) {
                        lastError = error;
                    }
                });
                successful.sort(function (first, second) { return first.length - second.length || first.bends - second.bends; });
                if (!successful.length) throw lastError || new Error('全局依赖图自动布线失败。');
                return successful[0].routes;
            }

            function validateTopologyRoutesV133(graph, layout, routes) {
                if (routes.length !== graph.edges.length) throw new Error('依赖路由数量不完整。');
                const routedEdgeIds = new Set();
                const endpointAnchors = new Map();
                const incomingArrowPoints = new Map();
                function pointKey(point) {
                    return point.x.toFixed(2) + ':' + point.y.toFixed(2);
                }
                function onNodeBoundary(point, metrics) {
                    const epsilon = 0.11;
                    const vertical = (Math.abs(point.x - metrics.x) < epsilon || Math.abs(point.x - metrics.x - metrics.width) < epsilon) && point.y >= metrics.y - epsilon && point.y <= metrics.y + metrics.height + epsilon;
                    const horizontal = (Math.abs(point.y - metrics.y) < epsilon || Math.abs(point.y - metrics.y - metrics.height) < epsilon) && point.x >= metrics.x - epsilon && point.x <= metrics.x + metrics.width + epsilon;
                    return vertical || horizontal;
                }
                function recordAnchor(map, nodeId, point) {
                    if (!map.has(nodeId)) map.set(nodeId, new Set());
                    const key = pointKey(point);
                    if (map.get(nodeId).has(key)) throw new Error(nodeId + '存在重叠依赖锚点。');
                    map.get(nodeId).add(key);
                }

                routes.forEach(function (route) {
                    if (!route || !route.edge || !route.d || route.points.length < 2) throw new Error('依赖关系缺少连续路径。');
                    if (routedEdgeIds.has(route.edge.id)) throw new Error(route.edge.id + '被重复路由。');
                    routedEdgeIds.add(route.edge.id);
                    const sourceMetrics = layout.metricsById.get(route.edge.source);
                    const targetMetrics = layout.metricsById.get(route.edge.target);
                    const start = route.points[0];
                    const end = route.points[route.points.length - 1];
                    if (!onNodeBoundary(start, sourceMetrics) || !onNodeBoundary(end, targetMetrics)) throw new Error(route.edge.id + '未连接固定节点锚点。');
                    recordAnchor(endpointAnchors, route.edge.source, start);
                    recordAnchor(endpointAnchors, route.edge.target, end);
                    if (!incomingArrowPoints.has(route.edge.target)) incomingArrowPoints.set(route.edge.target, []);
                    incomingArrowPoints.get(route.edge.target).push(end);
                    route.points.forEach(function (point) {
                        if (point.x < 0 || point.x > layout.viewWidth || point.y < 0 || point.y > layout.viewHeight) throw new Error(route.edge.id + '超出关系画布。');
                    });
                    for (let index = 0; index < route.points.length - 1; index += 1) {
                        const first = route.points[index];
                        const second = route.points[index + 1];
                        const orthogonal = Math.abs(first.x - second.x) < 0.1 || Math.abs(first.y - second.y) < 0.1;
                        if (!orthogonal || topologySegmentHitsNodeV132(first, second, route.edge, layout.metricsById)) throw new Error(route.edge.id + '存在穿越节点的非连续路由。');
                    }
                });

                incomingArrowPoints.forEach(function (points, nodeId) {
                    for (let firstIndex = 0; firstIndex < points.length; firstIndex += 1) {
                        for (let secondIndex = firstIndex + 1; secondIndex < points.length; secondIndex += 1) {
                            const distance = Math.hypot(points[firstIndex].x - points[secondIndex].x, points[firstIndex].y - points[secondIndex].y);
                            if (distance < 11.5) throw new Error(nodeId + '的依赖箭头发生重叠。');
                        }
                    }
                });

                function routeSegments(route) {
                    const segments = [];
                    for (let index = 0; index < route.points.length - 1; index += 1) {
                        const first = route.points[index];
                        const second = route.points[index + 1];
                        const horizontal = Math.abs(first.y - second.y) < 0.1;
                        segments.push({
                            horizontal: horizontal,
                            fixed: horizontal ? first.y : first.x,
                            minimum: horizontal ? Math.min(first.x, second.x) : Math.min(first.y, second.y),
                            maximum: horizontal ? Math.max(first.x, second.x) : Math.max(first.y, second.y)
                        });
                    }
                    return segments;
                }

                for (let firstRouteIndex = 0; firstRouteIndex < routes.length; firstRouteIndex += 1) {
                    const firstSegments = routeSegments(routes[firstRouteIndex]);
                    for (let secondRouteIndex = firstRouteIndex + 1; secondRouteIndex < routes.length; secondRouteIndex += 1) {
                        const secondSegments = routeSegments(routes[secondRouteIndex]);
                        firstSegments.forEach(function (firstSegment) {
                            secondSegments.forEach(function (secondSegment) {
                                if (firstSegment.horizontal !== secondSegment.horizontal) return;
                                const overlap = Math.min(firstSegment.maximum, secondSegment.maximum) - Math.max(firstSegment.minimum, secondSegment.minimum);
                                if (overlap <= 0.5) return;
                                const separation = Math.abs(firstSegment.fixed - secondSegment.fixed);
                                if (separation < 11.5) {
                                    throw new Error(routes[firstRouteIndex].edge.id + '与' + routes[secondRouteIndex].edge.id + '存在小于 12px 的平行黏线。');
                                }
                            });
                        });
                    }
                }
            }

            function appendTopologyPortsV132(stage, metrics) {
                ['left', 'right', 'top', 'bottom'].forEach(function (side) {
                    const point = topologyFixedPortV132(metrics, side);
                    stage.appendChild(svgElementV10('circle', {
                        class: 'topology-port-dot',
                        cx: point.x,
                        cy: point.y,
                        r: '3',
                        'pointer-events': 'none'
                    }));
                });
            }

            function appendTopologyNodeV132(parent, node, metrics, selected) {
                appendTopologyNodeV129(parent, node, metrics, selected);
                const stage = parent.lastElementChild;
                if (stage) appendTopologyPortsV132(stage, metrics);
            }

            function drawTopologyLayoutV132(layout, graph, selectedNode) {
                const selectedMetrics = layout.metricsById.get(selectedNode.id);
                topologyFocusPointV130 = selectedMetrics
                    ? { x: selectedMetrics.centerX, y: selectedMetrics.centerY }
                    : { x: layout.viewWidth / 2, y: layout.viewHeight / 2 };
                topologyInteractionV138.setBounds({ x: 0, y: 0, width: layout.viewWidth, height: layout.viewHeight });
                while (topologyViewportV10.firstChild) topologyViewportV10.removeChild(topologyViewportV10.firstChild);

                const defs = svgElementV10('defs');
                appendTopologyMarkerV10(defs, 'topology-global-arrow-v133', '#8EA3C2', 8.5);
                appendTopologyMarkerV10(defs, 'topology-global-arrow-v133-focus', '#1F5FFF', 8.5);
                topologyViewportV10.appendChild(defs);

                const routes = topologyRoutesV132(graph, layout);
                routes.sort(function (first, second) {
                    const firstFocus = first.edge.source === selectedNode.id || first.edge.target === selectedNode.id;
                    const secondFocus = second.edge.source === selectedNode.id || second.edge.target === selectedNode.id;
                    if (firstFocus !== secondFocus) return firstFocus ? 1 : -1;
                    return first.edge.id.localeCompare(second.edge.id);
                });
                const edgeLayer = svgElementV10('g', { 'aria-label': '正交有向依赖连线', 'pointer-events': 'none' });
                routes.forEach(function (route) {
                    const edge = route.edge;
                    const focused = edge.source === selectedNode.id || edge.target === selectedNode.id;
                    const cycle = layout.cycleEdgeIds.has(edge.id);
                    const stroke = focused ? '#1F5FFF' : '#8EA3C2';
                    const marker = focused ? 'url(#topology-global-arrow-v133-focus)' : 'url(#topology-global-arrow-v133)';
                    edgeLayer.appendChild(svgElementV10('path', {
                        d: route.d,
                        fill: 'none',
                        stroke: '#FFFFFF',
                        'stroke-width': '5.5',
                        'stroke-linecap': 'round',
                        'stroke-linejoin': 'round',
                        opacity: '0.96',
                        'vector-effect': 'non-scaling-stroke',
                        'data-topology-edge-halo': edge.id
                    }));
                    const path = svgElementV10('path', {
                        d: route.d,
                        fill: 'none',
                        stroke: stroke,
                        'stroke-width': '1.5',
                        'stroke-linecap': 'round',
                        'stroke-linejoin': 'round',
                        opacity: '1',
                        'vector-effect': 'non-scaling-stroke',
                        'marker-end': marker,
                        'data-topology-edge-id': edge.id,
                        'data-topology-edge-source': edge.source,
                        'data-topology-edge-target': edge.target,
                        'data-route-kind': route.kind,
                        'data-route-lane': String(route.laneIndex),
                        'data-cycle-edge': cycle ? 'true' : 'false'
                    });
                    const sourceNode = levelNodeByIdV10(edge.source);
                    const targetNode = levelNodeByIdV10(edge.target);
                    path.appendChild(svgElementV10('title', {}, nodeNamingV137(sourceNode).canonical + ' 指向 ' + nodeNamingV137(targetNode).canonical));
                    edgeLayer.appendChild(path);
                });
                topologyViewportV10.appendChild(edgeLayer);

                const nodeLayer = svgElementV10('g', { 'aria-label': '分层依赖能力节点' });
                graph.nodes.slice().sort(function (first, second) {
                    const firstMetrics = layout.metricsById.get(first.id);
                    const secondMetrics = layout.metricsById.get(second.id);
                    return firstMetrics.rank - secondMetrics.rank || firstMetrics.lane - secondMetrics.lane || topologyNodeOrderV129(first, second);
                }).forEach(function (node) {
                    const metrics = layout.metricsById.get(node.id);
                    if (metrics) appendTopologyNodeV132(nodeLayer, node, metrics, node.id === selectedNode.id);
                });
                topologyViewportV10.appendChild(nodeLayer);
            }

            const topologyReadableScaleV132 = 0.96;

            function centerTopologyAtOneHundredV130() {
                if (!topologyFocusPointV130) return;
                topologyInteractionV138.focusAt(topologyFocusPointV130, topologyReadableScaleV132);
            }

            function scheduleTopologyCenterV138() {
                window.cancelAnimationFrame(topologyCenterFrameV138);
                topologyCenterFrameV138 = window.requestAnimationFrame(function () {
                    topologyCenterFrameV138 = 0;
                    if (stateV10.dependencyMode === 'global') centerTopologyAtOneHundredV130();
                });
            }

            function renderTopologyV10() {
                if (stateV10.dependencyMode !== 'global') return;
                let selectedNode = levelNodeByIdV10(stateV10.topologySelectedNodeId);
                if (!selectedNode) {
                    selectedNode = selectedNodeV10() || levelNodesV10[0];
                    stateV10.topologySelectedNodeId = selectedNode.id;
                }
                const graph = collectGlobalDependencyGraphV129(selectedNode.id);
                updateTopologyContextV129(selectedNode, graph);
                topologyLoadingV127.classList.add('is-visible');
                try {
                    const layout = topologyLayeredLayoutV132(graph);
                    drawTopologyLayoutV132(layout, graph, selectedNode);
                    topologyLoadingV127.classList.remove('is-visible');
                    scheduleTopologyCenterV138();
                } catch {
                    topologyLoadingV127.classList.remove('is-visible');
                    while (topologyViewportV10.firstChild) topologyViewportV10.removeChild(topologyViewportV10.firstChild);
                    const message = svgElementV10('g', { 'aria-label': '依赖图暂时无法加载' });
                    message.appendChild(svgElementV10('text', { x: '500', y: '282', 'text-anchor': 'middle', fill: '#64748B', 'font-size': '17', 'font-weight': '900' }, '依赖图暂时无法加载'));
                    message.appendChild(svgElementV10('text', { x: '500', y: '312', 'text-anchor': 'middle', fill: '#94A3B8', 'font-size': '12', 'font-weight': '750' }, '请稍后重试'));
                    topologyViewportV10.appendChild(message);
                    topologyInteractionV138.setBounds({ x: 0, y: 0, width: 1000, height: 600 });
                    showTopologyMessageV10('依赖图布局失败，请稍后重试', 2600, true);
                }
            }

            abilityGridV10.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const moreButton = element.closest('[data-ability-more]');
                if (moreButton) {
                    event.stopPropagation();
                    const row = moreButton.closest('[data-ability-row]');
                    const scroller = row ? row.querySelector('[data-ability-scroll]') : null;
                    if (scroller) {
                        const remaining = scroller.scrollWidth - scroller.clientWidth - scroller.scrollLeft;
                        if (remaining > 3) {
                            scroller.scrollBy({ left: Math.max(360, scroller.clientWidth * 0.58), behavior: 'smooth' });
                            window.clearTimeout(overviewOverflowTimerV138);
                            overviewOverflowTimerV138 = window.setTimeout(function () {
                                overviewOverflowTimerV138 = 0;
                                updateAbilityRowOverflowV10();
                            }, 360);
                        } else if (row) {
                            openDetailV10(row.dataset.abilityRow);
                        }
                    }
                    return;
                }
                const levelButton = element.closest('[data-level-node-id]');
                if (levelButton) {
                    const node = levelNodeByIdV10(levelButton.dataset.levelNodeId);
                    if (node) openDetailV10(node.abilityId, node.id);
                    return;
                }
                const abilityRow = element.closest('[data-ability-row]');
                if (abilityRow) openDetailV10(abilityRow.dataset.abilityRow);
            }, { signal: eventAbortV138.signal });

            overviewScrollV10.addEventListener('scroll', updateOverviewScrollCueV10, { passive: true, signal: eventAbortV138.signal });
            abilityGridV10.addEventListener('scroll', function (event) {
                if (event.target instanceof Element && event.target.matches('[data-ability-scroll]')) updateAbilityRowOverflowV10();
            }, { passive: true, capture: true, signal: eventAbortV138.signal });

            document.getElementById('detail-mainline').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-level-node-id]') : null;
                if (target) selectDetailNodeV10(target.dataset.levelNodeId);
            }, { signal: eventAbortV138.signal });

            document.getElementById('dependency-view').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-jump-level-node]') : null;
                if (!target) return;
                const node = levelNodeByIdV10(target.dataset.jumpLevelNode);
                if (node) openDetailV10(node.abilityId, node.id);
            }, { signal: eventAbortV138.signal });

            document.getElementById('learning-grid').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-learning-task-id]') : null;
                if (!target || target.disabled) return;
                const node = selectedNodeV10();
                const task = (learningTasksByNodeV127[node.id] || []).find(function (item) { return item.id === target.dataset.learningTaskId; });
                if (task) showToastV10(learningTaskActionV127(task) + ' · ' + task.title);
            }, { signal: eventAbortV138.signal });

            topologySvgV10.addEventListener('click', function (event) {
                if (topologyInteractionV138.shouldSuppressClick()) return;
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const stageTarget = element.closest('[data-topology-node-id]');
                if (stageTarget) {
                    navigateTopologyNodeV136(stageTarget.dataset.topologyNodeId);
                    return;
                }
                hideTopologyHintV10();
            }, { signal: eventAbortV138.signal });

            topologySvgV10.addEventListener('keydown', function (event) {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const rawTarget = event.target instanceof Element ? event.target : null;
                if (!rawTarget) return;
                const element = rawTarget.closest('[data-topology-node-id]');
                if (!element) return;
                event.preventDefault();
                navigateTopologyNodeV136(element.dataset.topologyNodeId);
            }, { signal: eventAbortV138.signal });

            document.getElementById('overview-back-button').addEventListener('click', function () {
                window.history.back();
            }, { signal: eventAbortV138.signal });
            document.getElementById('detail-back-button').addEventListener('click', navigateBackFromDetailV10, { signal: eventAbortV138.signal });
            document.getElementById('detail-breadcrumb-overview').addEventListener('click', function () {
                showPageV10('overview');
            }, { signal: eventAbortV138.signal });
            document.getElementById('dependency-global-button').addEventListener('click', openTopologyV10, { signal: eventAbortV138.signal });
            document.getElementById('topology-zoom-out').addEventListener('click', function () {
                window.cancelAnimationFrame(topologyCenterFrameV138);
                topologyCenterFrameV138 = 0;
                topologyInteractionV138.zoomBy(1 / 1.2);
            }, { signal: eventAbortV138.signal });
            document.getElementById('topology-zoom-in').addEventListener('click', function () {
                window.cancelAnimationFrame(topologyCenterFrameV138);
                topologyCenterFrameV138 = 0;
                topologyInteractionV138.zoomBy(1.2);
            }, { signal: eventAbortV138.signal });
            document.getElementById('topology-fit').addEventListener('click', fitTopologyV10, { signal: eventAbortV138.signal });
            topologyResetButtonV10.addEventListener('click', clearTopologyFocusV10, { signal: eventAbortV138.signal });

            topologyResizeObserverV138 = new ResizeObserver(function () {
                if (stateV10.view === 'detail' && stateV10.dependencyMode === 'global') scheduleTopologyCenterV138();
            });
            topologyResizeObserverV138.observe(topologySurfaceV138);
            overviewResizeObserverV138 = new ResizeObserver(function () {
                if (stateV10.view === 'overview') scheduleOverviewMetricsV138();
            });
            overviewResizeObserverV138.observe(overviewScrollV10);
            overviewResizeObserverV138.observe(abilityGridV10);

            window.addEventListener('pagehide', function () {
                eventAbortV138.abort();
                topologyInteractionV138.destroy();
                topologyResizeObserverV138.disconnect();
                overviewResizeObserverV138.disconnect();
                if (localDependencyResizeObserverV132) localDependencyResizeObserverV132.disconnect();
                window.cancelAnimationFrame(topologyCenterFrameV138);
                window.cancelAnimationFrame(overviewMetricsFrameV138);
                window.cancelAnimationFrame(detailRevealFrameV138);
                window.cancelAnimationFrame(dependencyPanelFrameV138);
                window.cancelAnimationFrame(localDependencyLineFrameV132);
                window.clearTimeout(overviewOverflowTimerV138);
                window.clearTimeout(dependencyPanelTimerV138);
                window.clearTimeout(toastTimerV10);
                window.clearTimeout(topologyHintTimerV10);
                resetDetailSwitchMotionV10();
            }, { once: true });

            document.fonts.ready.then(function () {
                if (!eventAbortV138.signal.aborted) scheduleLocalDependencyLinesV132();
            });

            validateDataV10();
            renderOverviewV10();
            renderDetailV10();
        }());
    </script>
