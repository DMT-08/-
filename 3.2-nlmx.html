<!DOCTYPE html>
<!-- 版本 13.7：删除未经确认的任务发布语义；任务卡固定收窄；统一能力阶段命名；全局依赖改为 12px 独占通道、多端口与跨层外环分流。 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#EFF6FF">
    <title>抖学 AI 能力模型 13.7 · 独立依赖分流与节点命名统一</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#1F5FFF',
                        ink: '#172033'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        soft: '0 4px 20px -4px rgba(0,0,0,0.03), 0 2px 8px -2px rgba(0,0,0,0.02)'
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        :root {
            --brand: #1F5FFF;
            --ink: #172033;
            --soft-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.03), 0 2px 8px -2px rgba(0, 0, 0, 0.02);
            --type-page-title: 32px;
            --type-section-title: 20px;
            --type-card-title: 17px;
            --type-body: 14px;
            --type-meta: 12px;
            --type-label: 11px;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #EFF6FF 0%, #DFE7FF 100%);
        }

        button {
            -webkit-appearance: none;
        }

        button:focus-visible,
        [role="button"]:focus-visible {
            outline: 3px solid rgba(31, 95, 255, 0.25);
            outline-offset: 2px;
        }

        .app-shell {
            width: min(1300px, 100vw);
            height: 100vh;
            height: 100dvh;
        }

        .page-view {
            display: none;
        }

        .page-view.is-active {
            display: flex;
            animation: page-enter 180ms ease-out;
        }

        .native-scroll {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
        }

        .horizontal-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            scrollbar-width: none;
        }

        .horizontal-scroll::-webkit-scrollbar,
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            scrollbar-width: none;
        }

        .ability-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ability-row {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 24px -22px rgba(15, 23, 42, 0.32);
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        .ability-row-track {
            min-width: max-content;
        }

        .ability-name-card {
            display: flex;
            width: 176px;
            height: 78px;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            border: 1px solid #C9D8FF;
            border-radius: 14px;
            background: #F4F7FF;
            padding: 0 15px;
            color: #173E9C;
            text-align: left;
        }

        .mainline-list {
            min-width: max-content;
        }

        .overview-mainline .mainline-node {
            width: 112px;
            min-width: 112px;
            height: 78px;
            padding: 9px 10px;
        }

        .overview-mainline .mainline-connector {
            width: 24px;
            height: 78px;
            flex-basis: 24px;
        }

        .overview-mainline .node-caption {
            max-width: 90px;
            margin-top: 3px;
            font-size: 10px;
        }

        .node-current-badge {
            position: absolute;
            right: 7px;
            top: 6px;
            border: 1px solid #F4CF79;
            border-radius: 6px;
            background: #FFF4CF;
            padding: 2px 5px;
            color: #8A4B08;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
        }

        .node-lock-badge {
            position: absolute;
            left: 8px;
            top: 7px;
            display: inline-flex;
            width: 22px;
            height: 22px;
            align-items: center;
            justify-content: center;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            background: #FFFFFF;
            color: #64748B;
            font-size: 13px;
            line-height: 1;
            box-shadow: 0 2px 5px rgba(15, 23, 42, 0.06);
            pointer-events: none;
        }

        .mainline-node.role-current.state-locked .node-lock-badge {
            width: 26px;
            height: 26px;
            border-color: #F6C76B;
            background: #FFF2C2;
            color: #C56A07;
            font-size: 15px;
            box-shadow: 0 3px 8px rgba(197, 106, 7, 0.12);
        }

        .mainline-node.role-target .node-lock-badge {
            color: #64748B;
        }

        .mainline-node {
            position: relative;
            display: flex;
            min-width: 66px;
            height: 68px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #DCE4EF;
            border-radius: 12px;
            background: #FFFFFF;
            color: #475569;
            transition: transform 150ms ease, border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
        }

        .mainline-node:active {
            transform: scale(0.95);
        }

        .mainline-node.role-completed {
            border-color: #BFE7CB;
            background: #F3FCF6;
            color: #166534;
        }

        .mainline-node.role-current {
            border-color: #F0C36A;
            background: #FFF4CF;
            color: #92400E;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.09);
        }

        .mainline-node.role-current.state-locked {
            border-width: 2px;
            border-color: #F59E0B;
            border-style: dashed;
            background: #FFFCF2;
            color: #9A5B13;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.05);
        }

        .mainline-node.role-upcoming {
            border-color: #D2DAE6;
            background: #FFFFFF;
            color: #64748B;
        }

        .mainline-node.role-upcoming.state-locked {
            border-style: dashed;
        }

        .mainline-node.role-target {
            border-color: #6F98FF;
            border-style: dashed;
            background: #EDF3FF;
            color: #1746B2;
        }

        .mainline-node::after {
            position: absolute;
            inset: -3px;
            border: 1.5px solid rgba(31, 95, 255, 0.68);
            border-radius: 14px;
            content: "";
            opacity: 0;
            pointer-events: none;
            transform: scale(0.97);
            transition: opacity 180ms linear, transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .mainline-node.is-selected::after {
            opacity: 1;
            transform: scale(1);
        }

        .node-level {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .node-caption {
            margin-top: 1px;
            max-width: 60px;
            overflow: hidden;
            color: currentColor;
            font-size: 9px;
            font-weight: 800;
            line-height: 1.15;
            opacity: 0.78;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .mini-stars {
            display: flex;
            height: 11px;
            align-items: center;
            gap: 1px;
            margin-top: 3px;
        }

        .mini-stars i {
            color: #D7DFEA;
            font-size: 9px;
        }

        .mini-stars i.is-filled {
            color: #F59E0B;
        }

        .role-completed .mini-stars i.is-filled {
            color: #35A760;
        }

        .mainline-connector {
            position: relative;
            display: flex;
            width: 25px;
            height: 68px;
            flex: 0 0 25px;
            align-items: center;
            justify-content: center;
            color: #CBD5E1;
        }

        .mainline-connector::before {
            width: 100%;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            content: "";
        }

        .mainline-connector i {
            position: absolute;
            right: -3px;
            padding: 1px 0;
            background: #FFFFFF;
            font-size: 11px;
        }

        .mainline-connector.is-passed {
            color: #86C99D;
        }

        .mainline-connector.is-current {
            color: #7DA1FF;
        }

        .mainline-connector.is-target {
            color: #CBD5E1;
        }

        .detail-mainline .mainline-node {
            min-width: 126px;
            height: 88px;
            border-radius: 14px;
            padding: 9px 10px;
        }

        .detail-mainline .mainline-connector {
            width: 42px;
            height: 88px;
            flex-basis: 42px;
        }

        .detail-mainline .node-level {
            font-size: 18px;
        }

        .detail-mainline .node-caption {
            max-width: 108px;
            margin-top: 3px;
            font-size: 10px;
        }

        .detail-mainline .mini-stars {
            margin-top: 5px;
        }

        .detail-mainline .mini-stars i {
            font-size: 11px;
        }

        .dependency-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 30px minmax(148px, 0.58fr) 30px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
        }

        .dependency-column {
            min-height: 126px;
            border: 1px solid #E1E9F5;
            border-radius: 16px;
            background: #FFFFFF;
            padding: 13px;
        }

        .dependency-column.is-empty {
            border-color: transparent;
            background: transparent;
            padding-inline: 7px;
        }

        .dependency-arrow {
            position: relative;
            display: flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            color: #5274C9;
        }

        .dependency-arrow::before {
            position: absolute;
            right: 3px;
            left: 3px;
            height: 2px;
            border-radius: 999px;
            background: #B8C8EB;
            content: "";
        }

        .dependency-arrow i {
            position: relative;
            right: -8px;
            z-index: 1;
            background: #FFFFFF;
            padding-left: 2px;
        }

        .dependency-chip {
            display: flex;
            width: 100%;
            min-height: 44px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            background: #FFFFFF;
            padding: 8px 10px;
            color: #475569;
            text-align: left;
            transition: transform 150ms ease, border-color 150ms ease, background-color 150ms ease;
        }

        .dependency-chip.role-completed {
            border-color: #E2E8F0;
            background: #FFFFFF;
        }

        .dependency-chip.role-current {
            border-color: #E2E8F0;
            background: #FFFFFF;
        }

        .dependency-chip.role-target {
            border-color: #E2E8F0;
            border-style: solid;
            background: #FFFFFF;
        }

        .dependency-relation-kind,
        .dependency-node-state {
            display: inline-flex;
            min-height: 20px;
            align-items: center;
            gap: 4px;
            border-radius: 6px;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
        }

        .dependency-relation-kind.is-mainline {
            border: 1px solid #CAD8E8;
            background: #F3F7FB;
            color: #526B85;
        }

        .dependency-relation-kind.is-crossline {
            border: 1px solid #DDD3EA;
            background: #F8F5FB;
            color: #6B5D7D;
        }

        .dependency-node-state.is-completed {
            border: 1px solid #BFE7CB;
            background: #F3FCF6;
            color: #166534;
        }

        .dependency-node-state.is-current {
            border: 1px solid #F4CF79;
            background: #FFF4CF;
            color: #8A4B08;
        }

        .dependency-node-state.is-target {
            border: 1px dashed #5D8AFF;
            background: #EDF3FF;
            color: #1746B2;
        }

        .dependency-node-state.is-locked {
            border: 1px solid #CBD5E1;
            background: #FFFFFF;
            color: #526174;
        }

        .dependency-chip:active {
            transform: scale(0.97);
        }

        .dependency-focus {
            display: flex;
            min-height: 108px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #1F5FFF;
            border-radius: 14px;
            background: #F7F9FF;
            padding: 12px;
            text-align: center;
            box-shadow: 0 0 0 4px rgba(31, 95, 255, 0.07);
        }

        .dependency-focus-label {
            display: inline-flex;
            min-height: 22px;
            align-items: center;
            gap: 4px;
            border: 1px solid #BFD0FF;
            border-radius: 6px;
            background: #EAF0FF;
            padding: 0 7px;
            color: #1F5FFF;
            font-size: 11px;
            font-weight: 700;
        }

        .dependency-empty {
            display: flex;
            min-height: 46px;
            align-items: center;
            gap: 7px;
            border-top: 1px solid #E9EEF5;
            padding: 10px 2px 2px;
            color: #94A3B8;
            font-size: 11px;
            font-weight: 700;
        }

        .learning-card {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 20px -20px rgba(15, 23, 42, 0.34);
            transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
        }

        .learning-card:active:not(:disabled) {
            transform: scale(0.95);
        }

        .learning-card:disabled {
            cursor: not-allowed;
            border-color: #E2E8F0;
            background: #F8FAFC;
            box-shadow: none;
        }

        .topology-surface {
            position: relative;
            min-height: 0;
            overflow: hidden;
            background-color: #FAFCFF;
            background-image: radial-gradient(circle, rgba(148, 163, 184, 0.2) 1px, transparent 1.1px);
            background-size: 26px 26px;
            touch-action: none;
        }

        #topology-svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .graph-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .graph-control-button {
            display: flex;
            min-width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-radius: 10px;
            color: #475569;
            font-size: 11px;
            font-weight: 800;
            transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
        }

        .graph-control-button[hidden] {
            display: none;
        }

        .graph-control-button:active {
            transform: scale(0.9);
            background: #EFF6FF;
            color: #1F5FFF;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 50;
            display: flex;
            min-height: 44px;
            align-items: center;
            gap: 8px;
            border: 1px solid #DCE4EF;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.96);
            padding: 10px 14px;
            color: #334155;
            font-size: var(--type-meta);
            font-weight: 800;
            box-shadow: 0 16px 36px -20px rgba(15, 23, 42, 0.42);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 12px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .topology-hint {
            position: absolute;
            left: 50%;
            top: 14px;
            z-index: 4;
            display: flex;
            min-height: 40px;
            align-items: center;
            border: 1px solid rgba(191, 208, 255, 0.9);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            padding: 8px 13px;
            color: #2852B8;
            font-size: 11px;
            font-weight: 800;
            box-shadow: var(--soft-shadow);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -6px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .topology-hint.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .topology-hint.is-warning {
            border-color: #F7D7A6;
            background: rgba(255, 251, 235, 0.97);
            color: #9A5B13;
        }

        @media (hover: hover) and (pointer: fine) {
            .ability-row:hover {
                border-color: #BFD0FF;
                box-shadow: 0 18px 34px -27px rgba(31, 95, 255, 0.42);
                transform: translateY(-2px);
            }

            .mainline-node:hover {
                border-color: #7DA1FF;
                box-shadow: 0 8px 18px -14px rgba(31, 95, 255, 0.48);
                transform: translateY(-1px);
            }

            .dependency-chip:hover {
                border-color: #BFD0FF;
                background: #F8FAFF;
            }

            .learning-card:hover:not(:disabled) {
                border-color: #BFD0FF;
                box-shadow: 0 14px 26px -22px rgba(31, 95, 255, 0.5);
                transform: translateY(-1px);
            }

            .graph-control-button:hover {
                background: #EFF6FF;
                color: #1F5FFF;
            }
        }

        @media (max-width: 760px) {
            .app-shell {
                padding: 12px;
            }

            .ability-name-card {
                width: 164px;
            }

            .dependency-layout {
                grid-template-columns: minmax(0, 1fr);
            }

            .dependency-arrow {
                min-height: 20px;
                transform: rotate(90deg);
            }

            .learning-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @keyframes page-enter {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 10.2：统一无衬线排版与更明确的原生点击语义 */
        body,
        button,
        .node-level,
        #topology-svg text {
            font-family: Inter, system-ui, sans-serif !important;
            font-variant-numeric: tabular-nums;
        }

        .page-title {
            font-size: var(--type-page-title);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.035em;
        }

        .section-title {
            font-size: var(--type-section-title);
            font-weight: 800;
            line-height: 1.25;
        }

        .card-title {
            font-size: var(--type-card-title);
            font-weight: 800;
            line-height: 1.25;
        }

        .meta-text {
            font-size: var(--type-meta);
        }

        .label-text {
            font-size: var(--type-label);
        }

        button:not(:disabled),
        [role="button"] {
            cursor: pointer;
        }

        .overview-surface {
            border-radius: 24px;
            background: #FFFFFF;
            box-shadow: var(--soft-shadow);
        }

        .topology-context {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 10px;
        }

        .topology-mode-badge {
            display: inline-flex;
            min-height: 26px;
            flex: 0 0 auto;
            align-items: center;
            border: 1px solid #DCE3EC;
            border-radius: 6px;
            background: #F8FAFC;
            padding: 0 8px;
            color: #475569;
            font-size: var(--type-label);
            font-weight: 850;
            letter-spacing: 0.04em;
        }

        .topology-mode-badge.is-focus {
            border-color: #BFD0FF;
            background: #EAF0FF;
            color: #1F5FFF;
        }

        .topology-context-copy {
            overflow: hidden;
            color: #64748B;
            font-size: var(--type-meta);
            font-weight: 750;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .overview-scroll {
            background: #FFFFFF;
        }

        .overview-surface {
            position: relative;
            isolation: isolate;
        }

        .ability-list {
            gap: 0;
        }

        .ability-row {
            position: relative;
            border: 0;
            border-bottom: 1px solid #F1F5F9;
            border-radius: 0 !important;
            background: transparent;
            box-shadow: none;
            cursor: pointer;
            transform: none;
            transition: background-color 150ms ease;
        }

        .ability-row:last-child {
            border-bottom: 0;
        }

        .ability-row-scroll {
            padding: 7px 52px 7px 6px;
            scroll-padding-inline: 6px 52px;
        }

        .ability-row-entry {
            position: absolute;
            right: 0;
            top: 0;
            z-index: 3;
            display: flex;
            width: 52px;
            height: 100%;
            align-items: center;
            justify-content: center;
            border: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.9) 52%, #FFFFFF 100%);
            color: #5274C9;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: opacity 150ms ease, visibility 150ms ease;
        }

        .ability-row-entry.is-visible {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        .ability-row-entry i {
            font-size: 15px;
            transition: color 150ms ease, transform 150ms ease;
        }

        .ability-row:active {
            background: #F8FAFF;
        }

        .ability-row:active .ability-row-entry i {
            color: #7DA1FF;
            transform: translateX(1px) scale(0.9);
        }

        .overview-scroll-cue {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 6;
            display: flex;
            height: 46px;
            align-items: flex-end;
            justify-content: center;

            function validateTopologyLayoutV10() {

                abilitiesV10.forEach(function (ability) {

                    const targetRow = topologyAbilityOrderV10.indexOf(targetNode.abilityId);

                    const targetMetrics = topologyMetricsForNodeV10(edge.target);
                    if (!route) throw new Error(edge.id + '缺少有效路由。');
                    const isDownward = route.direction === 'down';
                    const expectedStartX = isDownward ? sourceMetrics.x + sourceMetrics.width : sourceMetrics.x;
                    const expectedEndX = isDownward ? targetMetrics.x : targetMetrics.x + targetMetrics.width;
                    if (route.start.x !== expectedStartX || route.end.x !== expectedEndX) throw new Error(edge.id + '未按真实方向对齐节点锚点。');
                    if (route.start.y <= sourceMetrics.y || route.start.y >= sourceMetrics.y + sourceMetrics.height || route.end.y <= targetMetrics.y || route.end.y >= targetMetrics.y + targetMetrics.height) {
                        throw new Error(edge.id + '的锚点超出节点边界。');
                    }
                    const targetGap = topologyHorizontalGapV10(targetNode, isDownward ? 'left' : 'right');
                    if (route.targetChannelX <= targetGap.min || route.targetChannelX >= targetGap.max) {
                        throw new Error(edge.id + '的独立入线通道超出节点侧方间距。');
                    }
                    const channelKey = route.direction + '-' + String(targetNode.level);
                    const levelChannels = targetChannelsByDirectionAndLevel.get(channelKey) || [];
                    levelChannels.push(route.targetChannelX);
                    targetChannelsByDirectionAndLevel.set(channelKey, levelChannels);
                    const sourcePorts = sourcePortsByNode.get(edge.source) || [];
                    sourcePorts.push(route.start.y);
                    sourcePortsByNode.set(edge.source, sourcePorts);
                    const targetPorts = targetPortsByNode.get(edge.target) || [];
                    targetPorts.push(route.end.y);
                    targetPortsByNode.set(edge.target, targetPorts);

                targetChannelsByDirectionAndLevel.forEach(function (channels) {
                    const uniqueChannels = new Set(channels.map(function (value) { return value.toFixed(2); }));
                    if (uniqueChannels.size !== channels.length) throw new Error('跨主线入线通道发生重叠。');
                });
                [sourcePortsByNode, targetPortsByNode].forEach(function (portMap) {

                    }
                    const cycleProbeIds = detectRelationshipCycleEdgeIdsV10([downwardProbe, upwardProbe]);
                    if (!cycleProbeIds.has(downwardProbe.id) || !cycleProbeIds.has(upwardProbe.id)) {

            function validateDataV10() {

                    const scroller = document.getElementById('detail-mainline');

            function detailSwitchTargetsV10(includeHeader) {
                const selectors = [

            function clearDetailSwitchGhostsV10() {
                detailSwitchGhostsV10.forEach(function (ghost) { ghost.remove(); });
                detailSwitchGhostsV10 = [];
            }

            function captureDetailSwitchGhostsV10(targets) {
                if (!detailMotionLayerV10) return [];
                const viewportWidth = document.documentElement.clientWidth;
                const viewportHeight = document.documentElement.clientHeight;
                detailSwitchGhostsV10 = targets.map(function (target) {
                    const rect = target.getBoundingClientRect();
                    if (rect.width < 1 || rect.height < 1 || rect.right <= 0 || rect.bottom <= 0 || rect.left >= viewportWidth || rect.top >= viewportHeight) return null;
                    const shell = document.createElement('div');
                    const clone = target.cloneNode(true);
                    shell.className = 'detail-switch-ghost';
                    shell.style.left = rect.left + 'px';
                    shell.style.top = rect.top + 'px';
                    shell.style.width = rect.width + 'px';
                    shell.style.height = rect.height + 'px';
                    clone.removeAttribute('id');
                    clone.removeAttribute('aria-live');
                    clone.setAttribute('aria-hidden', 'true');
                    clone.setAttribute('inert', '');
                    clone.querySelectorAll('[id]').forEach(function (element) { element.removeAttribute('id'); });
                    clone.querySelectorAll('button, a, input, [tabindex]').forEach(function (element) { element.setAttribute('tabindex', '-1'); });
                    shell.appendChild(clone);
                    detailMotionLayerV10.appendChild(shell);
                    clone.scrollLeft = target.scrollLeft;
                    clone.scrollTop = target.scrollTop;
                    return shell;
                }).filter(Boolean);
                return detailSwitchGhostsV10;
            }

            function resetDetailSwitchMotionV10() {
                detailSwitchSequenceV10 += 1;
                if (detailSwitchTimelineV10) {
                    detailSwitchTimelineV10.kill();
                    detailSwitchTimelineV10 = null;
                }
                clearDetailSwitchGhostsV10();
                if (window.gsap) {
                    const activeTargets = detailSwitchTargetsV10(true);
                    if (activeTargets.length) window.gsap.set(activeTargets, { clearProps: 'opacity,transform,willChange' });
                }
                pagesV10.detail.removeAttribute('aria-busy');
            }

            function updateDetailMainlineSelectionV10(ability, node) {
                const mainline = document.getElementById('detail-mainline');
                if (!mainline) return;
                mainline.querySelectorAll('[data-level-node-id]').forEach(function (button) {
                    const buttonNode = levelNodeByIdV10(button.dataset.levelNodeId);
                    if (!buttonNode) return;
                    const isViewed = buttonNode.id === node.id;
                    button.classList.toggle('is-selected', isViewed);
                    button.setAttribute('aria-pressed', isViewed ? 'true' : 'false');
                    button.setAttribute('aria-label', ability.name + ' ' + formatLevelV10(buttonNode.level) + '，' + buttonNode.definition + '，' + roleLabelV10(buttonNode) + (isViewed ? '，正在查看' : ''));
                });

            function detailSwitchDirectionV10(ability, node) {
                const previousNode = selectedNodeV10();
                if (!previousNode) return 1;
                if (previousNode.abilityId === ability.id) {
                    const previousIndex = ability.levels.findIndex(function (item) { return item.id === previousNode.id; });
                    const nextIndex = ability.levels.findIndex(function (item) { return item.id === node.id; });
                    return nextIndex < previousIndex ? -1 : 1;
                }
                const previousAbilityIndex = abilitiesV10.findIndex(function (item) { return item.id === previousNode.abilityId; });
                const nextAbilityIndex = abilitiesV10.findIndex(function (item) { return item.id === ability.id; });
                return nextAbilityIndex < previousAbilityIndex ? -1 : 1;
            }

            function commitDetailSelectionV10(ability, node, resetScroll, smoothScroll, abilityChanged) {
                stateV10.selectedAbilityId = ability.id;
                stateV10.selectedLevelNodeId = node.id;
                if (abilityChanged) {
                    renderDetailV10();
                } else {
                    updateDetailMainlineSelectionV10(ability, node);
                    renderDependenciesV10(node);
                    renderLearningV10(ability, node);
                }
                if (!abilityChanged && stateV10.dependencyMode === 'global') {
                    stateV10.topologySelectedNodeId = node.id;
                    renderTopologyV10();
                }
                revealSelectedDetailNodeV10(smoothScroll);
                if (resetScroll) {
                    const detailScroller = document.querySelector('#detail-page .native-scroll');
                    if (detailScroller) detailScroller.scrollTop = 0;
                }
                updateDetailBackButtonV10();
            }

            function animateDetailSelectionV10(ability, node, resetScroll, recordHistory) {
                if (!ability || !node) return;
                const abilityChanged = ability.id !== stateV10.selectedAbilityId;
                if (!abilityChanged && node.id === stateV10.selectedLevelNodeId) return;
                if (recordHistory !== false) recordCurrentDetailNodeV10();
                const reducedMotion = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const direction = detailSwitchDirectionV10(ability, node);
                resetDetailSwitchMotionV10();
                const sequence = detailSwitchSequenceV10;
                if (!window.gsap || reducedMotion) {
                    commitDetailSelectionV10(ability, node, resetScroll, false, abilityChanged);
                    return;
                }

                const outgoingTargets = detailSwitchTargetsV10(abilityChanged);
                const outgoingGhosts = captureDetailSwitchGhostsV10(outgoingTargets);
                commitDetailSelectionV10(ability, node, resetScroll, true, abilityChanged);
                const incomingTargets = detailSwitchTargetsV10(abilityChanged);
                pagesV10.detail.setAttribute('aria-busy', 'true');
                window.gsap.set(incomingTargets, {
                    opacity: 0,
                    x: direction * 12,
                    force3D: true,
                    willChange: 'transform,opacity'
                });
                detailSwitchTimelineV10 = window.gsap.timeline({
                    onComplete: function () {
                        if (sequence !== detailSwitchSequenceV10) return;
                        clearDetailSwitchGhostsV10();
                        pagesV10.detail.removeAttribute('aria-busy');
                        detailSwitchTimelineV10 = null;
                    }
                });
                if (outgoingGhosts.length) {
                    detailSwitchTimelineV10.to(outgoingGhosts, {
                        opacity: 0,
                        x: direction * -12,
                        duration: 0.28,
                        ease: 'sine.inOut'
                    }, 0);
                }
                detailSwitchTimelineV10.to(incomingTargets, {
                    opacity: 1,
                    x: 0,
                    duration: 0.28,
                    ease: 'sine.inOut',
                    clearProps: 'opacity,transform,willChange'
                }, 0);
            }

            function showPageV10(name) {
                if (name !== 'detail') resetDetailSwitchMotionV10();
                if (name === 'overview') clearDetailNodeHistoryV10();
                if (name !== 'detail' && stateV10.dependencyMode === 'global') setDependencyModeV127('direct', false);
                Object.keys(pagesV10).forEach(function (pageName) {
                    pagesV10[pageName].classList.toggle('is-active', pageName === name);
                });
                stateV10.view = name;
                if (name === 'overview') {

            function openDetailV10(abilityId, levelNodeId) {

            function graphStageEdgesV10() {
                return levelRelationshipsV10.map(function (relationship, index) {
                    const sourceNode = levelNodeByIdV10(relationship.source);
                    const targetNode = levelNodeByIdV10(relationship.target);
                    return {
                        id: relationship.id || 'stage-edge-' + index,
                        source: sourceNode.id,

                        sourceAbilityId: sourceNode.abilityId,
                        targetAbilityId: targetNode.abilityId,

            function collectTopologyFocusV10(selectedNodeId) {
                const nodeIds = new Set();
                const incomingNodeIds = new Set();
                const outgoingNodeIds = new Set();
                const edgeIds = new Set();
                const mainlineEdgeIds = new Set();
                function result() {
                    return {
                        nodeIds: nodeIds,
                        incomingNodeIds: incomingNodeIds,
                        outgoingNodeIds: outgoingNodeIds,
                        edgeIds: edgeIds,
                        mainlineEdgeIds: mainlineEdgeIds
                    };
                }
                function includeNode(node) {
                    if (!node) return;
                    nodeIds.add(node.id);
                }
                if (!selectedNodeId) return result();
                const selectedNode = levelNodeByIdV10(selectedNodeId);
                if (!selectedNode) return result();
                includeNode(selectedNode);
                const selectedAbility = abilityForNodeV10(selectedNode);
                const selectedIndex = selectedAbility.levels.findIndex(function (node) { return node.id === selectedNode.id; });
                const previousNode = selectedIndex > 0 ? selectedAbility.levels[selectedIndex - 1] : null;
                const nextNode = selectedIndex < selectedAbility.levels.length - 1 ? selectedAbility.levels[selectedIndex + 1] : null;
                if (previousNode) {
                    incomingNodeIds.add(previousNode.id);
                    mainlineEdgeIds.add(previousNode.id + '->' + selectedNode.id);
                    includeNode(previousNode);
                }
                if (nextNode) {
                    outgoingNodeIds.add(nextNode.id);
                    mainlineEdgeIds.add(selectedNode.id + '->' + nextNode.id);
                    includeNode(nextNode);
                }
                const edges = graphStageEdgesV10();
                edges.forEach(function (edge) {
                    if (edge.source !== selectedNode.id && edge.target !== selectedNode.id) return;
                    edgeIds.add(edge.id);
                    if (edge.target === selectedNode.id) {
                        incomingNodeIds.add(edge.source);
                        includeNode(levelNodeByIdV10(edge.source));
                    }
                    if (edge.source === selectedNode.id) {
                        outgoingNodeIds.add(edge.target);
                        includeNode(levelNodeByIdV10(edge.target));
                    }
                });
                return result();
            }

            function topologyNodePaletteV10(node) {
                if (node.role === 'completed') return { fill: '#F3FCF6', stroke: '#BFE7CB', text: '#166534', dash: '' };
                if (node.role === 'current' && node.studyState === 'locked') return { fill: '#FFFBF1', stroke: '#EDC66F', text: '#9A6B17', dash: '' };
                if (node.role === 'current') return { fill: '#FFF4CF', stroke: '#F0C36A', text: '#92400E', dash: '' };
                if (node.studyState === 'locked') return { fill: '#F1F5F9', stroke: '#CBD5E1', text: '#64748B', dash: '5 3' };
                if (node.role === 'target') return { fill: '#EDF3FF', stroke: '#5D8AFF', text: '#1746B2', dash: '6 4' };
                return { fill: '#F7F9FF', stroke: '#C9D8FF', text: '#405572', dash: '' };
            }

            function topologyStageMetricsV10(ability, levelIndex) {
                const rowIndex = topologyAbilityOrderV10.indexOf(ability.id);
                const x = topologyLayoutV10.stageStartX + levelIndex * topologyLayoutV10.stageStepX;
                const y = topologyLayoutV10.rowStartY + rowIndex * topologyLayoutV10.rowPitch;
                return {
                    x: x,
                    y: y,
                    width: topologyLayoutV10.stageWidth,
                    height: topologyLayoutV10.stageHeight,
                    centerX: x + topologyLayoutV10.stageWidth / 2,
                    centerY: y + topologyLayoutV10.stageHeight / 2
                };
            }

            function topologyMetricsForNodeV10(nodeId) {
                const node = levelNodeByIdV10(nodeId);
                const ability = abilityForNodeV10(node);
                if (!node || !ability) return null;
                return topologyStageMetricsV10(ability, ability.levels.findIndex(function (item) { return item.id === node.id; }));
            }

            function topologyNodeRowV10(nodeId) {
                const node = levelNodeByIdV10(nodeId);
                return node ? topologyAbilityOrderV10.indexOf(node.abilityId) : -1;
            }

            function topologyRelationshipDirectionV10(edge) {
                return topologyNodeRowV10(edge.target) > topologyNodeRowV10(edge.source) ? 'down' : 'up';
            }

            function topologyEndpointPeersV10(edges, edge, endpoint) {
                const peerEndpoint = endpoint === 'source' ? 'target' : 'source';
                return edges.filter(function (item) {
                    return item[endpoint] === edge[endpoint] && topologyRelationshipDirectionV10(item) === topologyRelationshipDirectionV10(edge);
                }).sort(function (first, second) {
                    const rowDifference = topologyNodeRowV10(first[peerEndpoint]) - topologyNodeRowV10(second[peerEndpoint]);
                    const firstPeer = levelNodeByIdV10(first[peerEndpoint]);
                    const secondPeer = levelNodeByIdV10(second[peerEndpoint]);
                    const levelDifference = firstPeer.level - secondPeer.level;
                    return rowDifference || levelDifference || edges.indexOf(first) - edges.indexOf(second);
                });
            }

            function topologyTargetChannelPeersV10(edges, edge) {
                const targetNode = levelNodeByIdV10(edge.target);
                const direction = topologyRelationshipDirectionV10(edge);
                return edges.filter(function (item) {
                    const itemTarget = levelNodeByIdV10(item.target);
                    return itemTarget && targetNode && itemTarget.level === targetNode.level && topologyRelationshipDirectionV10(item) === direction;
                }).sort(function (first, second) {
                    const targetRowDifference = topologyNodeRowV10(first.target) - topologyNodeRowV10(second.target);
                    const sourceRowDifference = topologyNodeRowV10(first.source) - topologyNodeRowV10(second.source);
                    return targetRowDifference || sourceRowDifference || edges.indexOf(first) - edges.indexOf(second);
                });
            }

            function topologyHorizontalGapV10(node, side) {
                const ability = abilityForNodeV10(node);
                const index = ability.levels.findIndex(function (item) { return item.id === node.id; });
                const metrics = topologyStageMetricsV10(ability, index);
                if (side === 'left') {
                    const previousRight = index === 0
                        ? topologyLayoutV10.labelX + topologyLayoutV10.labelWidth
                        : topologyStageMetricsV10(ability, index - 1).x + topologyLayoutV10.stageWidth;
                    return { min: previousRight + 4, max: metrics.x - 4 };
                }
                const nextLeft = index === ability.levels.length - 1
                    ? topologyLayoutV10.viewWidth - 8
                    : topologyStageMetricsV10(ability, index + 1).x;
                return { min: metrics.x + metrics.width + 4, max: nextLeft - 4 };
            }

            function topologyChannelXInGapV10(node, side, peerCount, peerIndex) {
                const gap = topologyHorizontalGapV10(node, side);
                const fraction = (peerIndex + 1) / (peerCount + 1);
                return side === 'left'
                    ? gap.max - (gap.max - gap.min) * fraction
                    : gap.min + (gap.max - gap.min) * fraction;
            }

            function topologyPortYV10(metrics, peerCount, peerIndex, half) {
                const topMin = metrics.y + 13;
                const topMax = metrics.centerY - 6;
                const bottomMin = metrics.centerY + 6;
                const bottomMax = metrics.y + metrics.height - 13;
                const start = half === 'top' ? topMin : bottomMin;
                const end = half === 'top' ? topMax : bottomMax;
                if (peerCount <= 1) return (start + end) / 2;
                return start + (end - start) * peerIndex / (peerCount - 1);
            }

            function topologySourceLaneYV10(metrics, direction, peerCount, peerIndex) {
                const rowGap = topologyLayoutV10.rowPitch - topologyLayoutV10.stageHeight;
                const start = direction === 'down'
                    ? metrics.y + metrics.height + rowGap / 2 + 1
                    : metrics.y - rowGap + 4;
                const end = direction === 'down'
                    ? metrics.y + metrics.height + rowGap - 4
                    : metrics.y - rowGap / 2 - 1;
                if (peerCount <= 1) return (start + end) / 2;
                return start + (end - start) * peerIndex / (peerCount - 1);
            }

            function topologyPathV10(edge, edges) {
                const sourceMetrics = topologyMetricsForNodeV10(edge.source);
                const targetMetrics = topologyMetricsForNodeV10(edge.target);
                if (!sourceMetrics || !targetMetrics) return null;
                const sourceNode = levelNodeByIdV10(edge.source);
                const targetNode = levelNodeByIdV10(edge.target);
                const sourcePeers = topologyEndpointPeersV10(edges, edge, 'source');
                const targetPeers = topologyEndpointPeersV10(edges, edge, 'target');
                const targetChannelPeers = topologyTargetChannelPeersV10(edges, edge);
                const sourceIndex = sourcePeers.findIndex(function (item) { return item.id === edge.id; });
                const targetIndex = targetPeers.findIndex(function (item) { return item.id === edge.id; });
                const targetChannelIndex = targetChannelPeers.findIndex(function (item) { return item.id === edge.id; });
                const direction = topologyRelationshipDirectionV10(edge);
                const sourceSide = direction === 'down' ? 'right' : 'left';
                const targetSide = direction === 'down' ? 'left' : 'right';
                const start = {
                    x: sourceSide === 'right' ? sourceMetrics.x + sourceMetrics.width : sourceMetrics.x,
                    y: topologyPortYV10(sourceMetrics, sourcePeers.length, sourceIndex, direction === 'down' ? 'bottom' : 'top')
                };
                const end = {
                    x: targetSide === 'left' ? targetMetrics.x : targetMetrics.x + targetMetrics.width,
                    y: topologyPortYV10(targetMetrics, targetPeers.length, targetIndex, direction === 'down' ? 'top' : 'bottom')
                };
                const sourceExitX = topologyChannelXInGapV10(sourceNode, sourceSide, sourcePeers.length, sourceIndex);
                const sourceLaneY = topologySourceLaneYV10(sourceMetrics, direction, sourcePeers.length, sourceIndex);
                const targetChannelX = topologyChannelXInGapV10(targetNode, targetSide, targetChannelPeers.length, targetChannelIndex);
                return {

            function detectRelationshipCycleEdgeIdsV10(edges) {
                const adjacency = new Map();
                const nodeIds = new Set();
                edges.forEach(function (edge) {
                    nodeIds.add(edge.source);
                    nodeIds.add(edge.target);
                    const outgoing = adjacency.get(edge.source) || [];
                    outgoing.push(edge);
                    adjacency.set(edge.source, outgoing);
                });
                let visitIndex = 0;
                const indexes = new Map();
                const lowLinks = new Map();
                const stack = [];
                const onStack = new Set();
                const componentByNode = new Map();
                const componentSizes = new Map();
                let componentIndex = 0;

                function visit(nodeId) {
                    indexes.set(nodeId, visitIndex);
                    lowLinks.set(nodeId, visitIndex);
                    visitIndex += 1;
                    stack.push(nodeId);
                    onStack.add(nodeId);
                    (adjacency.get(nodeId) || []).forEach(function (edge) {
                        if (!indexes.has(edge.target)) {
                            visit(edge.target);
                            lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), lowLinks.get(edge.target)));
                        } else if (onStack.has(edge.target)) {
                            lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), indexes.get(edge.target)));
                        }
                    });
                    if (lowLinks.get(nodeId) !== indexes.get(nodeId)) return;
                    let memberCount = 0;
                    let memberId = null;
                    do {
                        memberId = stack.pop();
                        onStack.delete(memberId);
                        componentByNode.set(memberId, componentIndex);
                        memberCount += 1;
                    } while (memberId !== nodeId);
                    componentSizes.set(componentIndex, memberCount);
                    componentIndex += 1;
                }

                nodeIds.forEach(function (nodeId) {
                    if (!indexes.has(nodeId)) visit(nodeId);
                });
                const cycleEdgeIds = new Set();
                edges.forEach(function (edge) {
                    const component = componentByNode.get(edge.source);
                    if (component !== componentByNode.get(edge.target)) return;
                    if (edge.source === edge.target || componentSizes.get(component) > 1) cycleEdgeIds.add(edge.id);
                });
                return cycleEdgeIds;
            }

                    const visited = new Set([rootNodeId]);
                    const queue = [rootNodeId];
                    while (queue.length) {
                        const currentId = queue.shift();
                        edges.forEach(function (edge) {
                            const matched = direction === 'incoming' ? edge.target === currentId : edge.source === currentId;
                            if (!matched) return;
                            const nextId = direction === 'incoming' ? edge.source : edge.target;
                            nodeIds.add(nextId);
                            if (visited.has(nextId)) return;
                            visited.add(nextId);
                            queue.push(nextId);
                        });
                    }
                }

                collectReachable('incoming');
                collectReachable('outgoing');

                const componentEdges = edges.filter(function (edge) {
                    return nodeIds.has(edge.source) && nodeIds.has(edge.target);
                });
                const nodes = Array.from(nodeIds).map(levelNodeByIdV10).filter(Boolean);
                const indegree = new Map(nodes.map(function (node) { return [node.id, 0]; }));
                const outgoing = new Map(nodes.map(function (node) { return [node.id, []]; }));
                componentEdges.forEach(function (edge) {
                    indegree.set(edge.target, (indegree.get(edge.target) || 0) + 1);
                    outgoing.get(edge.source).push(edge);
                });
                const ranks = new Map(nodes.map(function (node) { return [node.id, 0]; }));
                const ready = nodes.filter(function (node) { return indegree.get(node.id) === 0; }).sort(function (first, second) {
                    return topologyAbilityIndexV123(first.abilityId) - topologyAbilityIndexV123(second.abilityId);
                });
                let processedCount = 0;
                while (ready.length) {
                    const sourceNode = ready.shift();
                    processedCount += 1;
                    (outgoing.get(sourceNode.id) || []).forEach(function (edge) {
                        ranks.set(edge.target, Math.max(ranks.get(edge.target) || 0, (ranks.get(sourceNode.id) || 0) + 1));
                        indegree.set(edge.target, indegree.get(edge.target) - 1);
                        if (indegree.get(edge.target) === 0) {
                            const targetNode = levelNodeByIdV10(edge.target);
                            if (targetNode) ready.push(targetNode);
                            ready.sort(function (first, second) {
                                return topologyAbilityIndexV123(first.abilityId) - topologyAbilityIndexV123(second.abilityId);
                            });
                        }
                    });
                }

                if (processedCount !== nodes.length) {
                    nodes.forEach(function (node) {
                        ranks.set(node.id, topologyAbilityIndexV123(node.abilityId));
                    });
                }
                return { rootNodeId: rootNodeId, nodes: nodes, edges: componentEdges, ranks: ranks };
            }

            function topologyGraphLayoutV123(graph) {
                const nodeWidth = 224;
                const nodeHeight = 108;
                const horizontalStep = 292;
                const verticalStep = 136;
                const rootRank = graph.ranks.get(graph.rootNodeId) || 0;
                const rankValues = graph.nodes.map(function (node) { return graph.ranks.get(node.id) || 0; });
                const minimumRank = rankValues.length ? Math.min.apply(Math, rankValues) : rootRank;
                const maximumRank = rankValues.length ? Math.max.apply(Math, rankValues) : rootRank;
                const groups = new Map();
                graph.nodes.forEach(function (node) {
                    const rank = graph.ranks.get(node.id) || 0;
                    if (!groups.has(rank)) groups.set(rank, []);
                    groups.get(rank).push(node);
                });
                groups.forEach(function (nodes) {
                    nodes.sort(function (first, second) {
                        const abilityDifference = topologyAbilityIndexV123(first.abilityId) - topologyAbilityIndexV123(second.abilityId);
                        return abilityDifference || first.level - second.level;
                    });
                });
                const maximumColumnSize = Math.max.apply(Math, Array.from(groups.values()).map(function (nodes) { return nodes.length; }).concat([1]));
                const maximumDepth = Math.max(rootRank - minimumRank, maximumRank - rootRank, 0);
                const contentWidth = nodeWidth + maximumDepth * horizontalStep * 2;
                const viewWidth = Math.max(1320, contentWidth + 260);
                const viewHeight = Math.max(700, nodeHeight + 190 + Math.max(0, maximumColumnSize - 1) * verticalStep);
                const centerX = viewWidth / 2;
                const centerY = viewHeight / 2 + 18;
                const metricsById = new Map();

                groups.forEach(function (nodes, rank) {
                    const rootIndex = nodes.findIndex(function (node) { return node.id === graph.rootNodeId; });
                    let orderedNodes = nodes;
                    let slots;
                    if (rootIndex >= 0) {
                        const rootNode = nodes[rootIndex];
                        const peerNodes = nodes.filter(function (node) { return node.id !== graph.rootNodeId; });
                        orderedNodes = [rootNode].concat(peerNodes);
                        slots = [centerY].concat(peerNodes.map(function (_, index) {
                            const distance = Math.ceil((index + 1) / 2) * verticalStep;
                            return centerY + (index % 2 === 0 ? -distance : distance);
                        }));
                        groups.set(rank, orderedNodes);
                    } else {
                        slots = nodes.map(function (_, index) {
                            return centerY + (index - (nodes.length - 1) / 2) * verticalStep;
                        });
                    }
                    orderedNodes.forEach(function (node, index) {
                        const centerNodeX = centerX + (rank - rootRank) * horizontalStep;
                        const centerNodeY = slots[index];
                        metricsById.set(node.id, {
                            x: centerNodeX - nodeWidth / 2,
                            y: centerNodeY - nodeHeight / 2,
                            width: nodeWidth,
                            height: nodeHeight,
                            centerX: centerNodeX,
                            centerY: centerNodeY,
                            rank: rank
                        });
                    });
                });
                return {
                    viewWidth: viewWidth,
                    viewHeight: viewHeight,
                    centerX: centerX,
                    centerY: centerY,
                    rootRank: rootRank,
                    minimumRank: minimumRank,
                    maximumRank: maximumRank,
                    horizontalStep: horizontalStep,
                    groups: groups,
                    metricsById: metricsById
                };
            }

            function topologyPortOffsetV123(index, count) {
                if (count <= 1) return 0;
                const step = Math.min(18, 48 / (count - 1));
                return (index - (count - 1) / 2) * step;
            }

            function topologyGraphPathV123(edge, graph, layout) {
                const source = layout.metricsById.get(edge.source);
                const target = layout.metricsById.get(edge.target);
                if (!source || !target) return null;
                const sourcePeers = graph.edges.filter(function (item) { return item.source === edge.source; }).sort(function (first, second) {
                    return layout.metricsById.get(first.target).centerY - layout.metricsById.get(second.target).centerY;
                });
                const targetPeers = graph.edges.filter(function (item) { return item.target === edge.target; }).sort(function (first, second) {
                    return layout.metricsById.get(first.source).centerY - layout.metricsById.get(second.source).centerY;
                });
                const start = {
                    x: source.x + source.width,
                    y: source.centerY + topologyPortOffsetV123(sourcePeers.findIndex(function (item) { return item.id === edge.id; }), sourcePeers.length)
                };
                const end = {
                    x: target.x,
                    y: target.centerY + topologyPortOffsetV123(targetPeers.findIndex(function (item) { return item.id === edge.id; }), targetPeers.length)
                };
                const middleX = start.x + (end.x - start.x) / 2;
                return {
                    start: start,
                    end: end,
                    d: 'M ' + start.x.toFixed(2) + ' ' + start.y.toFixed(2) +
                        ' H ' + middleX.toFixed(2) +
                        ' V ' + end.y.toFixed(2) +
                        ' H ' + end.x.toFixed(2)
                };
            }

            /* 13.0 全局依赖：真实有向关系默认以当前能力 100% 居中，图例与关系统计按最终反馈精简。 */
            function topologyNodeOrderV129(first, second) {
                const abilityDifference = topologyAbilityIndexV123(first.abilityId) - topologyAbilityIndexV123(second.abilityId);
                return abilityDifference || first.level - second.level || first.id.localeCompare(second.id);
            }

            /* 13.3：严格按有向可达性收集祖先与后续，禁止把共享分叉或汇聚点的旁支带入。 */
            function collectRelatedNodeIdsV133(rootNodeId, edges) {
                const outgoing = new Map();
                const incoming = new Map();
                edges.forEach(function (edge) {
                    if (!outgoing.has(edge.source)) outgoing.set(edge.source, []);
                    if (!incoming.has(edge.target)) incoming.set(edge.target, []);
                    outgoing.get(edge.source).push(edge.target);
                    incoming.get(edge.target).push(edge.source);
                });

                const related = new Set([rootNodeId]);
                function traverse(adjacency) {
                    const visited = new Set([rootNodeId]);
                    const queue = [rootNodeId];
                    while (queue.length) {
                        const currentId = queue.shift();
                        (adjacency.get(currentId) || []).forEach(function (nextId) {
                            if (visited.has(nextId)) return;
                            visited.add(nextId);
                            related.add(nextId);
                            queue.push(nextId);
                        });
                    }
                }

                traverse(incoming);
                traverse(outgoing);
                return related;
            }

            function collectGlobalDependencyGraphV129(rootNodeId) {
                const rootNode = levelNodeByIdV10(rootNodeId);
                if (!rootNode) return { rootNodeId: rootNodeId, nodes: [], edges: [] };
                const allEdges = graphStageEdgesV10();
                const nodeIds = collectRelatedNodeIdsV133(rootNodeId, allEdges);
                const nodes = Array.from(nodeIds).map(levelNodeByIdV10).filter(Boolean).sort(function (first, second) {
                    if (first.id === rootNodeId) return -1;
                    if (second.id === rootNodeId) return 1;
                    return topologyNodeOrderV129(first, second);
                });
                const edges = allEdges.filter(function (edge) {
                    return nodeIds.has(edge.source) && nodeIds.has(edge.target);
                });
                return { rootNodeId: rootNodeId, nodes: nodes, edges: edges };
            }

            function topologyElkInputV129(graph) {
                return {
                    id: 'topology-root-v129',
                    layoutOptions: {
                        'elk.algorithm': 'stress',
                        'elk.spacing.nodeNode': '78',
                        'elk.spacing.edgeNode': '34',
                        'elk.stress.desiredEdgeLength': '285',
                        'elk.stress.iterationLimit': '520',
                        'elk.stress.epsilon': '0.0001',
                        'elk.separateConnectedComponents': 'false',
                        'elk.randomSeed': '29',
                        'elk.padding': '[top=70,left=70,bottom=70,right=70]'
                    },
                    children: graph.nodes.map(function (node) {
                        return { id: node.id, width: 210, height: 112 };
                    }),
                    edges: graph.edges.map(function (edge) {
                        return { id: edge.id, sources: [edge.source], targets: [edge.target] };
                    })
                };
            }

            function topologyFallbackLayoutV129(graph) {
                const nodeWidth = 210;
                const nodeHeight = 112;
                const adjacency = new Map(graph.nodes.map(function (node) { return [node.id, []]; }));
                graph.edges.forEach(function (edge) {
                    if (adjacency.has(edge.source)) adjacency.get(edge.source).push(edge.target);
                    if (adjacency.has(edge.target)) adjacency.get(edge.target).push(edge.source);
                });
                const distances = new Map([[graph.rootNodeId, 0]]);
                const queue = [graph.rootNodeId];
                while (queue.length) {
                    const currentId = queue.shift();
                    const nextDistance = (distances.get(currentId) || 0) + 1;
                    (adjacency.get(currentId) || []).forEach(function (nextId) {
                        if (distances.has(nextId)) return;
                        distances.set(nextId, nextDistance);
                        queue.push(nextId);
                    });
                }
                const rings = new Map();
                graph.nodes.forEach(function (node) {
                    const distance = distances.get(node.id) || 0;
                    if (!rings.has(distance)) rings.set(distance, []);
                    rings.get(distance).push(node);
                });
                const children = [];
                Array.from(rings.keys()).sort(function (first, second) { return first - second; }).forEach(function (distance) {
                    const nodes = rings.get(distance).sort(topologyNodeOrderV129);
                    if (distance === 0) {
                        nodes.forEach(function (node) {
                            children.push({ id: node.id, x: -nodeWidth / 2, y: -nodeHeight / 2, width: nodeWidth, height: nodeHeight });
                        });
                        return;
                    }
                    const radius = 280 + (distance - 1) * 230;
                    nodes.forEach(function (node, index) {
                        const angle = -Math.PI / 2 + (Math.PI * 2 * index / Math.max(1, nodes.length)) + distance * 0.31;
                        const centerX = Math.cos(angle) * radius;
                        const centerY = Math.sin(angle) * radius;
                        children.push({ id: node.id, x: centerX - nodeWidth / 2, y: centerY - nodeHeight / 2, width: nodeWidth, height: nodeHeight });
                    });
                });
                return { id: 'topology-fallback-v129', children: children, edges: [] };
            }

            function topologyGraphMetricsV129(layout, graph) {
                const byId = new Map((layout.children || []).map(function (node) { return [node.id, node]; }));
                if (graph.nodes.some(function (node) { return !byId.has(node.id); })) {
                    return topologyGraphMetricsV129(topologyFallbackLayoutV129(graph), graph);
                }
                const root = byId.get(graph.rootNodeId);
                const rootCenterX = root.x + root.width / 2;
                const rootCenterY = root.y + root.height / 2;
                let minimumX = root.x;
                let maximumX = root.x + root.width;
                let minimumY = root.y;
                let maximumY = root.y + root.height;
                byId.forEach(function (node) {
                    minimumX = Math.min(minimumX, node.x);
                    maximumX = Math.max(maximumX, node.x + node.width);
                    minimumY = Math.min(minimumY, node.y);
                    maximumY = Math.max(maximumY, node.y + node.height);
                });
                const halfWidth = Math.max(rootCenterX - minimumX, maximumX - rootCenterX) + 96;
                const halfHeight = Math.max(rootCenterY - minimumY, maximumY - rootCenterY) + 86;
                const viewWidth = Math.max(1060, halfWidth * 2);
                const viewHeight = Math.max(620, halfHeight * 2);
                const shiftX = viewWidth / 2 - rootCenterX;

            function localDependencyPathDataV132(points) {

            function drawLocalDependencyLinesV132() {
                const map = document.querySelector('[data-local-dependency-map]');
                if (!map || map.clientWidth < 1 || map.clientHeight < 1) return;

                const layer = svg.querySelector('[data-local-dependency-line-layer]');
                const mapRect = map.getBoundingClientRect();
                const currentRect = current.getBoundingClientRect();
                const currentCenterY = currentRect.top - mapRect.top + currentRect.height / 2;
                const currentLeftX = currentRect.left - mapRect.left;
                const currentRightX = currentRect.right - mapRect.left;
                const incoming = Array.from(map.querySelectorAll('[data-local-dependency-node="incoming"]')).map(function (element) {
                    const rect = element.getBoundingClientRect();
                    return { x: rect.right - mapRect.left, y: rect.top - mapRect.top + rect.height / 2 };

                const outgoing = Array.from(map.querySelectorAll('[data-local-dependency-node="outgoing"]')).map(function (element) {
                    const rect = element.getBoundingClientRect();

                function appendVerticalTrunk(x, yValues) {
                    if (yValues.length < 2) return;

                    appendVerticalTrunk(trunkX, incoming.map(function (start) { return start.y; }).concat(currentCenterY));
                    appendLocalDependencyPathV132(layer, [{ x: trunkX, y: currentCenterY }, { x: currentLeftX, y: currentCenterY }], true);
                }

                if (outgoing.length) {
                    const branchEndX = outgoing[0].x;
                    const availableWidth = Math.max(1, branchEndX - currentRightX);
                    const branchLength = Math.max(22, Math.min(32, availableWidth * 0.3));
                    const trunkX = branchEndX - branchLength;
                    appendLocalDependencyPathV132(layer, [{ x: currentRightX, y: currentCenterY }, { x: trunkX, y: currentCenterY }], false);
                    appendVerticalTrunk(trunkX, outgoing.map(function (end) { return end.y; }).concat(currentCenterY));
                    outgoing.forEach(function (end) {
                        appendLocalDependencyPathV132(layer, [{ x: trunkX, y: end.y }, end], true);
                    });
