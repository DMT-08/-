            /* 13.3：相关子图先计算强连通分量与拓扑层，再用分流锚点执行正交连线。 */
            function topologyStrongComponentsV132(graph) {
                const adjacency = new Map(graph.nodes.map(function (node) { return [node.id, []]; }));
                graph.edges.forEach(function (edge) {
                    if (adjacency.has(edge.source)) adjacency.get(edge.source).push(edge.target);
                });
                let visitIndex = 0;
                let componentIndex = 0;
                const indexes = new Map();
                const lowLinks = new Map();
                const stack = [];
                const onStack = new Set();
                const componentByNode = new Map();
                const components = [];

                function visit(nodeId) {
                    indexes.set(nodeId, visitIndex);
                    lowLinks.set(nodeId, visitIndex);
                    visitIndex += 1;
                    stack.push(nodeId);
                    onStack.add(nodeId);
                    (adjacency.get(nodeId) || []).forEach(function (targetId) {
                        if (!indexes.has(targetId)) {
                            visit(targetId);
                            lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), lowLinks.get(targetId)));
                        } else if (onStack.has(targetId)) {
                            lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), indexes.get(targetId)));
                        }
                    });
                    if (lowLinks.get(nodeId) !== indexes.get(nodeId)) return;
                    const members = [];
                    let memberId = null;
                    do {
                        memberId = stack.pop();
                        onStack.delete(memberId);
                        componentByNode.set(memberId, componentIndex);
                        members.push(memberId);
                    } while (memberId !== nodeId);
                    components.push(members);
                    componentIndex += 1;
                }

                graph.nodes.forEach(function (node) {
                    if (!indexes.has(node.id)) visit(node.id);
                });
                return { componentByNode: componentByNode, components: components };
            }

            function topologyComponentOrderV132(componentId, components) {
                return components[componentId].map(levelNodeByIdV10).filter(Boolean).sort(topologyNodeOrderV129)[0];
            }

            function topologyRankDataV132(graph) {
                const strong = topologyStrongComponentsV132(graph);
                const outgoing = new Map(strong.components.map(function (_, index) { return [index, new Set()]; }));
                const indegree = new Map(strong.components.map(function (_, index) { return [index, 0]; }));
                graph.edges.forEach(function (edge) {
                    const sourceComponent = strong.componentByNode.get(edge.source);
                    const targetComponent = strong.componentByNode.get(edge.target);
                    if (sourceComponent === targetComponent || outgoing.get(sourceComponent).has(targetComponent)) return;
                    outgoing.get(sourceComponent).add(targetComponent);
                    indegree.set(targetComponent, indegree.get(targetComponent) + 1);
                });
                const componentRanks = new Map(strong.components.map(function (_, index) { return [index, 0]; }));
                const compareComponents = function (first, second) {
                    const firstNode = topologyComponentOrderV132(first, strong.components);
                    const secondNode = topologyComponentOrderV132(second, strong.components);
                    return topologyNodeOrderV129(firstNode, secondNode);
                };
                const ready = Array.from(indegree.keys()).filter(function (componentId) { return indegree.get(componentId) === 0; }).sort(compareComponents);
                while (ready.length) {
                    const componentId = ready.shift();
                    Array.from(outgoing.get(componentId)).sort(compareComponents).forEach(function (targetComponent) {
                        componentRanks.set(targetComponent, Math.max(componentRanks.get(targetComponent), componentRanks.get(componentId) + 1));
                        indegree.set(targetComponent, indegree.get(targetComponent) - 1);
                        if (indegree.get(targetComponent) === 0) {
                            ready.push(targetComponent);
                            ready.sort(compareComponents);
                        }
                    });
                }
                const rootComponent = strong.componentByNode.get(graph.rootNodeId);
                const rootRank = componentRanks.get(rootComponent) || 0;
                const rankById = new Map();
                graph.nodes.forEach(function (node) {
                    rankById.set(node.id, (componentRanks.get(strong.componentByNode.get(node.id)) || 0) - rootRank);
                });
                return {
                    rankById: rankById,
                    componentByNode: strong.componentByNode,
                    cycleEdgeIds: detectRelationshipCycleEdgeIdsV10(graph.edges)
                };
            }

            function topologyLaneSlotsV132(graph, rankById) {
                const adjacency = new Map(graph.nodes.map(function (node) { return [node.id, new Set()]; }));
                graph.edges.forEach(function (edge) {
                    adjacency.get(edge.source).add(edge.target);
                    adjacency.get(edge.target).add(edge.source);
                });
                const distances = new Map([[graph.rootNodeId, 0]]);
                const queue = [graph.rootNodeId];
                while (queue.length) {
                    const currentId = queue.shift();
                    Array.from(adjacency.get(currentId) || []).sort().forEach(function (nextId) {
                        if (distances.has(nextId)) return;
                        distances.set(nextId, distances.get(currentId) + 1);
                        queue.push(nextId);
                    });
                }
                const groups = new Map();
                graph.nodes.forEach(function (node) {
                    const rank = rankById.get(node.id) || 0;
                    if (!groups.has(rank)) groups.set(rank, []);
                    groups.get(rank).push(node);
                });
                const slots = new Map();
                groups.forEach(function (nodes, rank) {
                    const ordered = nodes.slice().sort(function (first, second) {
                        if (first.id === graph.rootNodeId) return -1;
                        if (second.id === graph.rootNodeId) return 1;
                        const distanceDifference = (distances.get(first.id) || 999) - (distances.get(second.id) || 999);
                        if (distanceDifference) return distanceDifference;
                        const degreeDifference = adjacency.get(second.id).size - adjacency.get(first.id).size;
                        return degreeDifference || topologyNodeOrderV129(first, second);
                    });
                    if (rank === 0 && ordered.some(function (node) { return node.id === graph.rootNodeId; })) {
                        slots.set(graph.rootNodeId, 0);
                        ordered.filter(function (node) { return node.id !== graph.rootNodeId; }).forEach(function (node, index) {
                            const distance = Math.floor(index / 2) + 1;
                            slots.set(node.id, index % 2 === 0 ? -distance : distance);
                        });
                        return;
                    }
                    ordered.forEach(function (node, index) {
                        slots.set(node.id, index - (ordered.length - 1) / 2);
                    });
                });
                return slots;
            }

            function topologyLayeredLayoutV132(graph) {
                const nodeWidth = 168;
                const nodeHeight = 76;
                const rowStep = 98;
                const rankData = topologyRankDataV132(graph);
                const routingPlan = topologyRoutingPlanV137(graph, rankData.rankById);
                const channelCounts = new Map();
                function reserveChannels(gapRank, count) {
                    channelCounts.set(gapRank, (channelCounts.get(gapRank) || 0) + count);
                }
                routingPlan.corridorGroups.forEach(function (edges, key) {
                    reserveChannels(Number(key.split(':')[0]), edges.length);
                });
                routingPlan.outer.forEach(function (record) {
                    [record.edge.source, record.edge.target].forEach(function (nodeId) {
                        const rank = rankData.rankById.get(nodeId) || 0;
                        reserveChannels(record.side === 'right' ? rank : rank - 1, 1);
                    });
                });
                const maximumChannelDemand = Math.max(1, ...Array.from(channelCounts.values()));
                const corridorGap = Math.max(72, 24 + (maximumChannelDemand - 1) * 12);
                const columnStep = nodeWidth + corridorGap;
                const laneSlots = topologyLaneSlotsV132(graph, rankData.rankById);
                const rawMetrics = new Map();
                graph.nodes.forEach(function (node) {
                    const centerX = (rankData.rankById.get(node.id) || 0) * columnStep;
                    const centerY = (laneSlots.get(node.id) || 0) * rowStep;
                    rawMetrics.set(node.id, {
                        id: node.id,
                        x: centerX - nodeWidth / 2,
                        y: centerY - nodeHeight / 2,
                        width: nodeWidth,
                        height: nodeHeight,
                        centerX: centerX,
                        centerY: centerY,
                        rank: rankData.rankById.get(node.id) || 0,
                        lane: laneSlots.get(node.id) || 0
                    });
                });
                let minimumX = Infinity;
                let maximumX = -Infinity;
                let minimumY = Infinity;
                let maximumY = -Infinity;
                rawMetrics.forEach(function (metrics) {
                    minimumX = Math.min(minimumX, metrics.x);
                    maximumX = Math.max(maximumX, metrics.x + metrics.width);
                    minimumY = Math.min(minimumY, metrics.y);
                    maximumY = Math.max(maximumY, metrics.y + metrics.height);
                });
                if (!Number.isFinite(minimumX)) {
                    minimumX = -nodeWidth / 2;
                    maximumX = nodeWidth / 2;
                    minimumY = -nodeHeight / 2;
                    maximumY = nodeHeight / 2;
                }
                const outerRouteCount = graph.edges.filter(function (edge) {
                    const sourceRank = rankData.rankById.get(edge.source) || 0;
                    const targetRank = rankData.rankById.get(edge.target) || 0;
                    return rankData.cycleEdgeIds.has(edge.id) || targetRank <= sourceRank;
                }).length;
                const outerLaneDepth = Math.max(1, Math.ceil(outerRouteCount / 2));
                const paddingX = Math.max(170, 92 + outerLaneDepth * 28);
                const paddingY = Math.max(150, 92 + outerLaneDepth * 28);
                const horizontalExtent = Math.max(Math.abs(minimumX), Math.abs(maximumX));
                const verticalExtent = Math.max(Math.abs(minimumY), Math.abs(maximumY));
                const viewWidth = Math.max(1100, (horizontalExtent + paddingX) * 2);
                const viewHeight = Math.max(680, (verticalExtent + paddingY) * 2);
                const shiftX = viewWidth / 2;
                const shiftY = viewHeight / 2;
                const metricsById = new Map();
                rawMetrics.forEach(function (metrics, nodeId) {
                    metricsById.set(nodeId, {
                        id: nodeId,
                        x: metrics.x + shiftX,
                        y: metrics.y + shiftY,
                        width: metrics.width,
                        height: metrics.height,
                        centerX: metrics.centerX + shiftX,
                        centerY: metrics.centerY + shiftY,
                        rank: metrics.rank,
                        lane: metrics.lane
                    });
                });
                const bounds = { left: Infinity, right: -Infinity, top: Infinity, bottom: -Infinity };
                const layerCenters = new Map();
                metricsById.forEach(function (metrics) {
                    bounds.left = Math.min(bounds.left, metrics.x);
                    bounds.right = Math.max(bounds.right, metrics.x + metrics.width);
                    bounds.top = Math.min(bounds.top, metrics.y);
                    bounds.bottom = Math.max(bounds.bottom, metrics.y + metrics.height);
                    layerCenters.set(metrics.rank, metrics.centerX);
                });
                return {
                    viewWidth: viewWidth,
                    viewHeight: viewHeight,
                    metricsById: metricsById,
                    rankById: rankData.rankById,
                    cycleEdgeIds: rankData.cycleEdgeIds,
                    componentByNode: rankData.componentByNode,
                    bounds: bounds,
                    layerCenters: layerCenters,
                    nodeWidth: nodeWidth,
                    columnStep: columnStep,
                    rankZeroX: shiftX
                };
            }

            function appendTopologyLayerGuidesV132(parent, layout) {
                // 13.5：列位置仅服务布局，不显示固定“上游 / 下游 / 当前层”语义。
            }

            function topologyFixedPortV132(metrics, side) {
                if (side === 'left') return { x: metrics.x, y: metrics.centerY };
                if (side === 'right') return { x: metrics.x + metrics.width, y: metrics.centerY };
                if (side === 'top') return { x: metrics.centerX, y: metrics.y };
                return { x: metrics.centerX, y: metrics.y + metrics.height };
            }

            function topologyCompactOrthogonalPointsV132(points) {
                const compact = [];
                points.forEach(function (point) {
                    const previous = compact[compact.length - 1];
                    if (previous && Math.abs(previous.x - point.x) < 0.1 && Math.abs(previous.y - point.y) < 0.1) return;
                    compact.push({ x: point.x, y: point.y });
                    while (compact.length >= 3) {
                        const first = compact[compact.length - 3];
                        const middle = compact[compact.length - 2];
                        const last = compact[compact.length - 1];
                        const sameX = Math.abs(first.x - middle.x) < 0.1 && Math.abs(middle.x - last.x) < 0.1;
                        const sameY = Math.abs(first.y - middle.y) < 0.1 && Math.abs(middle.y - last.y) < 0.1;
                        if (!sameX && !sameY) break;
                        compact.splice(compact.length - 2, 1);
                    }
                });
                return compact;
            }

            function topologyOrthogonalPathDataV132(points) {
                const compact = topologyCompactOrthogonalPointsV132(points);
                return compact.map(function (point, index) {
                    if (index === 0) return 'M ' + point.x.toFixed(2) + ' ' + point.y.toFixed(2);
                    const previous = compact[index - 1];
                    if (Math.abs(previous.y - point.y) < 0.1) return 'H ' + point.x.toFixed(2);
                    if (Math.abs(previous.x - point.x) < 0.1) return 'V ' + point.y.toFixed(2);
                    return 'H ' + point.x.toFixed(2) + ' V ' + point.y.toFixed(2);
                }).join(' ');
            }

            function topologySegmentHitsNodeV132(first, second, edge, metricsById) {
                const horizontal = Math.abs(first.y - second.y) < 0.1;
                const vertical = Math.abs(first.x - second.x) < 0.1;
                if (!horizontal && !vertical) return true;
                let blocked = false;
                metricsById.forEach(function (metrics, nodeId) {
                    if (blocked || nodeId === edge.source || nodeId === edge.target) return;
                    const padding = 12;
                    const left = metrics.x - padding;
                    const right = metrics.x + metrics.width + padding;
                    const top = metrics.y - padding;
                    const bottom = metrics.y + metrics.height + padding;
                    if (horizontal) {
                        const minimumX = Math.min(first.x, second.x);
                        const maximumX = Math.max(first.x, second.x);
                        if (first.y > top && first.y < bottom && maximumX > left && minimumX < right) blocked = true;
                    } else {
                        const minimumY = Math.min(first.y, second.y);
                        const maximumY = Math.max(first.y, second.y);
                        if (first.x > left && first.x < right && maximumY > top && minimumY < bottom) blocked = true;
                    }
                });
                return blocked;
            }

            function topologyPathClearV132(points, edge, metricsById) {
                for (let index = 0; index < points.length - 1; index += 1) {
                    if (topologySegmentHitsNodeV132(points[index], points[index + 1], edge, metricsById)) return false;
                }
                return true;
            }

            function topologyPathLengthV132(points) {
                let length = 0;
                for (let index = 0; index < points.length - 1; index += 1) {
                    length += Math.abs(points[index + 1].x - points[index].x) + Math.abs(points[index + 1].y - points[index].y);
                }
                return length;
            }

            function topologyProperCrossingsV132(points, routed) {
                let crossings = 0;
                for (let firstIndex = 0; firstIndex < points.length - 1; firstIndex += 1) {
                    const firstA = points[firstIndex];
                    const firstB = points[firstIndex + 1];
                    const firstHorizontal = Math.abs(firstA.y - firstB.y) < 0.1;
                    routed.forEach(function (record) {
                        for (let secondIndex = 0; secondIndex < record.points.length - 1; secondIndex += 1) {
                            const secondA = record.points[secondIndex];
                            const secondB = record.points[secondIndex + 1];
                            const secondHorizontal = Math.abs(secondA.y - secondB.y) < 0.1;
                            if (firstHorizontal === secondHorizontal) continue;
                            const horizontalA = firstHorizontal ? firstA : secondA;
                            const horizontalB = firstHorizontal ? firstB : secondB;
                            const verticalA = firstHorizontal ? secondA : firstA;
                            const verticalB = firstHorizontal ? secondB : firstB;
                            const crossX = verticalA.x;
                            const crossY = horizontalA.y;
                            const withinHorizontal = crossX > Math.min(horizontalA.x, horizontalB.x) + 2 && crossX < Math.max(horizontalA.x, horizontalB.x) - 2;
                            const withinVertical = crossY > Math.min(verticalA.y, verticalB.y) + 2 && crossY < Math.max(verticalA.y, verticalB.y) - 2;
                            if (withinHorizontal && withinVertical) crossings += 1;
                        }
                    });
                }
                return crossings;
            }

            function topologyRoutingPlanV137(graph, rankById) {
                const corridorGroups = new Map();
                const outerEdges = [];
                graph.edges.forEach(function (edge) {
                    const sourceRank = rankById.get(edge.source) || 0;
                    const targetRank = rankById.get(edge.target) || 0;
                    const cycle = targetRank <= sourceRank;
                    if (!cycle && targetRank === sourceRank + 1) {
                        const key = sourceRank + ':' + targetRank;
                        if (!corridorGroups.has(key)) corridorGroups.set(key, []);
                        corridorGroups.get(key).push(edge);
                        return;
                    }
                    outerEdges.push(edge);
                });
                outerEdges.sort(function (first, second) {
                    const firstSpan = Math.abs((rankById.get(first.target) || 0) - (rankById.get(first.source) || 0));
                    const secondSpan = Math.abs((rankById.get(second.target) || 0) - (rankById.get(second.source) || 0));
                    return secondSpan - firstSpan || first.id.localeCompare(second.id);
                });
                let upperLaneCount = 0;
                let lowerLaneCount = 0;
                const outer = outerEdges.map(function (edge, index) {
                    const upper = index % 2 === 0;
                    return {
                        edge: edge,
                        side: upper ? 'right' : 'left',
                        band: upper ? 'top' : 'bottom',
                        laneIndex: upper ? upperLaneCount++ : lowerLaneCount++
                    };
                });
                return { corridorGroups: corridorGroups, outer: outer };
            }

            function topologyRouteDescriptorsV133(graph, layout, rootNodeId) {
                const plan = topologyRoutingPlanV137(graph, layout.rankById);
                const descriptors = [];
                Array.from(plan.corridorGroups.keys()).sort(function (first, second) {
                    return Number(first.split(':')[0]) - Number(second.split(':')[0]);
                }).forEach(function (key) {
                    const edges = plan.corridorGroups.get(key).slice();
                    edges.sort(function (first, second) {
                        const firstSource = layout.metricsById.get(first.source);
                        const secondSource = layout.metricsById.get(second.source);
                        const firstTarget = layout.metricsById.get(first.target);
                        const secondTarget = layout.metricsById.get(second.target);
                        const firstMiddle = (firstSource.centerY + firstTarget.centerY) / 2;
                        const secondMiddle = (secondSource.centerY + secondTarget.centerY) / 2;
                        return firstMiddle - secondMiddle || firstSource.centerY - secondSource.centerY || firstTarget.centerY - secondTarget.centerY || first.id.localeCompare(second.id);
                    });
                    edges.forEach(function (edge, index) {
                        descriptors.push({
                            edge: edge,
                            kind: 'corridor',
                            sourceSide: 'right',
                            targetSide: 'left',
                            corridorKey: key,
                            corridorIndex: index,
                            corridorCount: edges.length,
                            outerLaneIndex: -1
                        });
                    });
                });
                plan.outer.forEach(function (record) {
                    descriptors.push({
                        edge: record.edge,
                        kind: 'outer-loop',
                        sourceSide: record.side,
                        targetSide: record.side,
                        outerBand: record.band,
                        outerLaneIndex: record.laneIndex
                    });
                });
                return descriptors;
            }

            function topologyPortAssignmentsV133(descriptors, layout) {
                const groups = new Map();
                descriptors.forEach(function (descriptor) {
                    [
                        { endpoint: 'source', nodeId: descriptor.edge.source, otherId: descriptor.edge.target, side: descriptor.sourceSide },
                        { endpoint: 'target', nodeId: descriptor.edge.target, otherId: descriptor.edge.source, side: descriptor.targetSide }
                    ].forEach(function (record) {
                        record.descriptor = descriptor;
                        const key = record.nodeId + ':' + record.side;
                        if (!groups.has(key)) groups.set(key, []);
                        groups.get(key).push(record);
                    });
                });
                const assignments = new Map();
                groups.forEach(function (records) {
                    records.sort(function (first, second) {
                        const firstOther = layout.metricsById.get(first.otherId);
                        const secondOther = layout.metricsById.get(second.otherId);
                        const verticalSide = first.side === 'left' || first.side === 'right';
                        const coordinateDifference = verticalSide
                            ? firstOther.centerY - secondOther.centerY
                            : firstOther.centerX - secondOther.centerX;
                        return coordinateDifference || first.descriptor.edge.id.localeCompare(second.descriptor.edge.id) || first.endpoint.localeCompare(second.endpoint);
                    });
                    records.forEach(function (record, index) {
                        const metrics = layout.metricsById.get(record.nodeId);
                        const verticalSide = record.side === 'left' || record.side === 'right';
                        const dimension = verticalSide ? metrics.height : metrics.width;
                        const step = records.length > 1 ? 12 : 0;
                        const requiredHalfSpan = (records.length - 1) * step / 2;
                        const availableHalfSpan = (dimension - 24) / 2;
                        if (requiredHalfSpan > availableHalfSpan + 0.1) throw new Error(record.nodeId + '的固定锚点空间不足。');
                        const offset = (index - (records.length - 1) / 2) * step;
                        let point;
                        if (record.side === 'left') point = { x: metrics.x, y: metrics.centerY + offset };
                        else if (record.side === 'right') point = { x: metrics.x + metrics.width, y: metrics.centerY + offset };
                        else if (record.side === 'top') point = { x: metrics.centerX + offset, y: metrics.y };
                        else point = { x: metrics.centerX + offset, y: metrics.y + metrics.height };
                        assignments.set(record.descriptor.edge.id + ':' + record.endpoint, {
                            point: point,
                            index: index,
                            count: records.length,
                            side: record.side
                        });
                    });
                });
                return assignments;
            }

            function topologyChannelAssignmentsV137(descriptors, layout, ports) {
                const groups = new Map();
                function addRecord(record) {
                    if (!groups.has(record.gapRank)) groups.set(record.gapRank, []);
                    groups.get(record.gapRank).push(record);
                }
                descriptors.forEach(function (descriptor) {
                    const edge = descriptor.edge;
                    if (descriptor.kind === 'corridor') {
                        const sourceRank = layout.rankById.get(edge.source) || 0;
                        const start = ports.get(edge.id + ':source').point;
                        const end = ports.get(edge.id + ':target').point;
                        addRecord({ key: edge.id + ':corridor', gapRank: sourceRank, y: (start.y + end.y) / 2, edgeId: edge.id });
                        return;
                    }
                    ['source', 'target'].forEach(function (endpoint) {
                        const nodeId = edge[endpoint];
                        const rank = layout.rankById.get(nodeId) || 0;
                        const side = endpoint === 'source' ? descriptor.sourceSide : descriptor.targetSide;
                        addRecord({
                            key: edge.id + ':' + endpoint + '-channel',
                            gapRank: side === 'right' ? rank : rank - 1,
                            y: ports.get(edge.id + ':' + endpoint).point.y,
                            edgeId: edge.id,
                            endpoint: endpoint
                        });
                    });
                });
                const assignments = new Map();
                groups.forEach(function (records, gapRank) {
                    records.sort(function (first, second) {
                        return first.y - second.y || first.edgeId.localeCompare(second.edgeId) || String(first.endpoint || '').localeCompare(String(second.endpoint || ''));
                    });
                    const gapLeft = layout.rankZeroX + gapRank * layout.columnStep + layout.nodeWidth / 2;
                    const gapWidth = layout.columnStep - layout.nodeWidth;
                    records.forEach(function (record, index) {
                        const x = gapLeft + gapWidth / 2 + (index - (records.length - 1) / 2) * 12;
                        if (x < gapLeft + 11.9 || x > gapLeft + gapWidth - 11.9) throw new Error('依赖通道未保留 12px 节点间距。');
                        assignments.set(record.key, { x: x, index: index, count: records.length, gapRank: gapRank });
                    });
                });
                return assignments;
            }

            function topologyForwardRouteV132(descriptor, graph, layout, routed, ports, channels) {
                const edge = descriptor.edge;
                const startRecord = ports.get(edge.id + ':source');
                const endRecord = ports.get(edge.id + ':target');
                const start = startRecord.point;
                const end = endRecord.point;
                const laneX = channels.get(edge.id + ':corridor').x;
                const points = topologyCompactOrthogonalPointsV132([
                    start,
                    { x: laneX, y: start.y },
                    { x: laneX, y: end.y },
                    end
                ]);
                if (!topologyPathClearV132(points, edge, layout.metricsById)) throw new Error(edge.id + '的独占走廊穿越节点。');
                return { edge: edge, points: points, d: topologyOrthogonalPathDataV132(points), kind: descriptor.kind, laneIndex: descriptor.corridorIndex };
            }

            function topologyOuterRouteV132(descriptor, layout, ports, channels) {
                const edge = descriptor.edge;
                const start = ports.get(edge.id + ':source').point;
                const end = ports.get(edge.id + ':target').point;
                const upper = descriptor.outerBand === 'top';
                const laneIndex = descriptor.outerLaneIndex;
                const laneY = upper ? layout.bounds.top - 56 - laneIndex * 16 : layout.bounds.bottom + 56 + laneIndex * 16;
                const sourceChannelX = channels.get(edge.id + ':source-channel').x;
                const targetChannelX = channels.get(edge.id + ':target-channel').x;
                const points = [
                    start,
                    { x: sourceChannelX, y: start.y },
                    { x: sourceChannelX, y: laneY },
                    { x: targetChannelX, y: laneY },
                    { x: targetChannelX, y: end.y },
                    end
                ];
                const compact = topologyCompactOrthogonalPointsV132(points);
                if (!topologyPathClearV132(compact, edge, layout.metricsById)) throw new Error(edge.id + '的独占外环穿越节点。');
                return { edge: edge, points: compact, d: topologyOrthogonalPathDataV132(compact), kind: descriptor.kind, laneIndex: laneIndex };
            }

            function topologyRoutesV132(graph, layout, rootNodeId) {
                const descriptors = topologyRouteDescriptorsV133(graph, layout, rootNodeId);
                const ports = topologyPortAssignmentsV133(descriptors, layout);
                const channels = topologyChannelAssignmentsV137(descriptors, layout, ports);
                const routed = [];
                descriptors.forEach(function (descriptor) {
                    const route = descriptor.kind === 'outer-loop'
                        ? topologyOuterRouteV132(descriptor, layout, ports, channels)
                        : topologyForwardRouteV132(descriptor, graph, layout, routed, ports, channels);
                    routed.push(route);
                });
                return routed;
            }

            function validateTopologyRoutesV133(graph, layout, routes) {
                if (routes.length !== graph.edges.length) throw new Error('依赖路由数量不完整。');
                const routedEdgeIds = new Set();
                const endpointAnchors = new Map();
                const incomingArrowPoints = new Map();
                function pointKey(point) {
                    return point.x.toFixed(2) + ':' + point.y.toFixed(2);
                }
                function onNodeBoundary(point, metrics) {
                    const epsilon = 0.11;
                    const vertical = (Math.abs(point.x - metrics.x) < epsilon || Math.abs(point.x - metrics.x - metrics.width) < epsilon) && point.y >= metrics.y - epsilon && point.y <= metrics.y + metrics.height + epsilon;
                    const horizontal = (Math.abs(point.y - metrics.y) < epsilon || Math.abs(point.y - metrics.y - metrics.height) < epsilon) && point.x >= metrics.x - epsilon && point.x <= metrics.x + metrics.width + epsilon;
                    return vertical || horizontal;
                }
                function recordAnchor(map, nodeId, point) {
                    if (!map.has(nodeId)) map.set(nodeId, new Set());
                    const key = pointKey(point);
                    if (map.get(nodeId).has(key)) throw new Error(nodeId + '存在重叠依赖锚点。');
                    map.get(nodeId).add(key);
                }

                routes.forEach(function (route) {
                    if (!route || !route.edge || !route.d || route.points.length < 2) throw new Error('依赖关系缺少连续路径。');
                    if (routedEdgeIds.has(route.edge.id)) throw new Error(route.edge.id + '被重复路由。');
                    routedEdgeIds.add(route.edge.id);
                    const sourceMetrics = layout.metricsById.get(route.edge.source);
                    const targetMetrics = layout.metricsById.get(route.edge.target);
                    const start = route.points[0];
                    const end = route.points[route.points.length - 1];
                    if (!onNodeBoundary(start, sourceMetrics) || !onNodeBoundary(end, targetMetrics)) throw new Error(route.edge.id + '未连接固定节点锚点。');
                    recordAnchor(endpointAnchors, route.edge.source, start);
                    recordAnchor(endpointAnchors, route.edge.target, end);
                    if (!incomingArrowPoints.has(route.edge.target)) incomingArrowPoints.set(route.edge.target, []);
                    incomingArrowPoints.get(route.edge.target).push(end);
                    route.points.forEach(function (point) {
                        if (point.x < 0 || point.x > layout.viewWidth || point.y < 0 || point.y > layout.viewHeight) throw new Error(route.edge.id + '超出关系画布。');
                    });
                    for (let index = 0; index < route.points.length - 1; index += 1) {
                        const first = route.points[index];
                        const second = route.points[index + 1];
                        const orthogonal = Math.abs(first.x - second.x) < 0.1 || Math.abs(first.y - second.y) < 0.1;
                        if (!orthogonal || topologySegmentHitsNodeV132(first, second, route.edge, layout.metricsById)) throw new Error(route.edge.id + '存在穿越节点的非连续路由。');
                    }
                });

                incomingArrowPoints.forEach(function (points, nodeId) {
                    for (let firstIndex = 0; firstIndex < points.length; firstIndex += 1) {
                        for (let secondIndex = firstIndex + 1; secondIndex < points.length; secondIndex += 1) {
                            const distance = Math.hypot(points[firstIndex].x - points[secondIndex].x, points[firstIndex].y - points[secondIndex].y);
                            if (distance < 11.5) throw new Error(nodeId + '的依赖箭头发生重叠。');
                        }
                    }
                });

                function routeSegments(route) {
                    const segments = [];
                    for (let index = 0; index < route.points.length - 1; index += 1) {
                        const first = route.points[index];
                        const second = route.points[index + 1];
                        const horizontal = Math.abs(first.y - second.y) < 0.1;
                        segments.push({
                            horizontal: horizontal,
                            fixed: horizontal ? first.y : first.x,
                            minimum: horizontal ? Math.min(first.x, second.x) : Math.min(first.y, second.y),
                            maximum: horizontal ? Math.max(first.x, second.x) : Math.max(first.y, second.y)
                        });
                    }
                    return segments;
                }

                for (let firstRouteIndex = 0; firstRouteIndex < routes.length; firstRouteIndex += 1) {
                    const firstSegments = routeSegments(routes[firstRouteIndex]);
                    for (let secondRouteIndex = firstRouteIndex + 1; secondRouteIndex < routes.length; secondRouteIndex += 1) {
                        const secondSegments = routeSegments(routes[secondRouteIndex]);
                        firstSegments.forEach(function (firstSegment) {
                            secondSegments.forEach(function (secondSegment) {
                                if (firstSegment.horizontal !== secondSegment.horizontal) return;
                                const overlap = Math.min(firstSegment.maximum, secondSegment.maximum) - Math.max(firstSegment.minimum, secondSegment.minimum);
                                if (overlap <= 0.5) return;
                                const separation = Math.abs(firstSegment.fixed - secondSegment.fixed);
                                if (separation < 11.5) {
                                    throw new Error(routes[firstRouteIndex].edge.id + '与' + routes[secondRouteIndex].edge.id + '存在小于 12px 的平行黏线。');
                                }
                            });
                        });
                    }
                }
            }

            function appendTopologyPortsV132(stage, metrics) {
                ['left', 'right', 'top', 'bottom'].forEach(function (side) {
                    const point = topologyFixedPortV132(metrics, side);

                        r: '3',

                    }));
                });
            }

            function appendTopologyNodeV132(parent, node, metrics, selected, graph) {
                appendTopologyNodeV129(parent, node, metrics, selected, graph);

            function drawTopologyLayoutV132(layout, graph, selectedNode) {

                topologyViewportV10.appendChild(defs);
                appendTopologyLayerGuidesV132(topologyViewportV10, layout);

                const routes = topologyRoutesV132(graph, layout, selectedNode.id);
                validateTopologyRoutesV133(graph, layout, routes);
                routes.sort(function (first, second) {
                    const firstFocus = first.edge.source === selectedNode.id || first.edge.target === selectedNode.id;
                    const secondFocus = second.edge.source === selectedNode.id || second.edge.target === selectedNode.id;

                routes.forEach(function (route) {
                    const edge = route.edge;

                    const cycle = layout.cycleEdgeIds.has(edge.id);
                    const stroke = focused ? '#1F5FFF' : '#8EA3C2';
                    const marker = focused ? 'url(#topology-global-arrow-v133-focus)' : 'url(#topology-global-arrow-v133)';
                    edgeLayer.appendChild(svgElementV10('path', {
                        d: route.d,
                        fill: 'none',

                        'stroke-width': '5.5',
                        'stroke-linecap': 'round',

                    }));
                    const path = svgElementV10('path', {

                        fill: 'none',
                        stroke: stroke,
                        'stroke-width': '1.5',
                        'stroke-linecap': 'round',
                        'stroke-linejoin': 'round',
                        opacity: '1',
                        'vector-effect': 'non-scaling-stroke',
                        'marker-end': marker,
                        'data-topology-edge-id': edge.id,
                        'data-topology-edge-source': edge.source,
                        'data-topology-edge-target': edge.target,

                    const targetNode = levelNodeByIdV10(edge.target);
                    path.appendChild(svgElementV10('title', {}, nodeNamingV137(sourceNode).canonical + ' 指向 ' + nodeNamingV137(targetNode).canonical));
                    edgeLayer.appendChild(path);
                });
                topologyViewportV10.appendChild(edgeLayer);

                const nodeLayer = svgElementV10('g', { 'aria-label': '分层依赖能力节点' });
                graph.nodes.slice().sort(function (first, second) {
                    const firstMetrics = layout.metricsById.get(first.id);
                    const secondMetrics = layout.metricsById.get(second.id);
                    return firstMetrics.rank - secondMetrics.rank || firstMetrics.lane - secondMetrics.lane || topologyNodeOrderV129(first, second);
                }).forEach(function (node) {
                    const metrics = layout.metricsById.get(node.id);
                    if (metrics) appendTopologyNodeV132(nodeLayer, node, metrics, node.id === selectedNode.id, graph);
                });
                topologyViewportV10.appendChild(nodeLayer);
            }

            const topologyReadableScaleV132 = 0.96;

            initialiseTopologyPanZoomV10 = function () {
                if (stateV10.dependencyMode !== 'global') return;
                if (topologyPanZoomV10) {
                    topologyPanZoomV10.resize();
                    return;
                }
                if (typeof window.svgPanZoom !== 'function') return;
                topologyPanZoomV10 = window.svgPanZoom('#topology-svg', {
                    viewportSelector: '#topology-viewport',
                    controlIconsEnabled: false,
                    zoomEnabled: true,
                    panEnabled: true,
                    dblClickZoomEnabled: false,
                    mouseWheelZoomEnabled: true,
                    preventMouseEventsDefault: true,
                    minZoom: 0.3,
                    maxZoom: 6,
                    fit: false,
                    center: false
                });
            };

            centerTopologyAtOneHundredV130 = function () {
                if (!topologyFocusPointV130) return;
                const surface = document.getElementById('topology-surface');
                const viewportWidthFallback = Math.max(1, surface ? surface.clientWidth : (topologySvgV10.clientWidth || 1000));
                const viewportHeightFallback = Math.max(1, surface ? surface.clientHeight : (topologySvgV10.clientHeight || 600));
                if (!topologyPanZoomV10 && typeof window.svgPanZoom === 'function') initialiseTopologyPanZoomV10();
                if (!topologyPanZoomV10) {
                    const viewWidth = viewportWidthFallback / topologyReadableScaleV132;
                    const viewHeight = viewportHeightFallback / topologyReadableScaleV132;
                    topologySvgV10.setAttribute('viewBox', [
                        topologyFocusPointV130.x - viewWidth / 2,
                        topologyFocusPointV130.y - viewHeight / 2,
                        viewWidth,
                        viewHeight
                    ].join(' '));
                    return;
                }
                topologyPanZoomV10.resize();
                let sizes = topologyPanZoomV10.getSizes();
                const currentZoom = typeof topologyPanZoomV10.getZoom === 'function' ? topologyPanZoomV10.getZoom() : 1;
                const currentRealZoom = sizes && Number.isFinite(sizes.realZoom) && sizes.realZoom > 0 ? sizes.realZoom : 1;
                const readableZoom = Math.max(0.3, Math.min(6, currentZoom * topologyReadableScaleV132 / currentRealZoom));
                topologyPanZoomV10.zoom(readableZoom);
                sizes = topologyPanZoomV10.getSizes();
                const viewportWidth = sizes && Number.isFinite(sizes.width) ? sizes.width : viewportWidthFallback;
                const viewportHeight = sizes && Number.isFinite(sizes.height) ? sizes.height : viewportHeightFallback;
                const realZoom = sizes && Number.isFinite(sizes.realZoom) ? sizes.realZoom : topologyReadableScaleV132;
                topologyPanZoomV10.pan({
                    x: viewportWidth / 2 - topologyFocusPointV130.x * realZoom,
                    y: viewportHeight / 2 - topologyFocusPointV130.y * realZoom
                });
            };

            renderTopologyV10 = function () {
                if (stateV10.dependencyMode !== 'global') return;
                let selectedNode = levelNodeByIdV10(stateV10.topologySelectedNodeId);
                if (!selectedNode) {
                    selectedNode = selectedNodeV10() || levelNodesV10[0];
                    stateV10.topologySelectedNodeId = selectedNode.id;
                }
                const graph = collectGlobalDependencyGraphV129(selectedNode.id);
                updateTopologyContextV129(selectedNode, graph);
                topologyRenderSequenceV127 += 1;
                topologyLoadingV127.classList.add('is-visible');
                try {
                    const layout = topologyLayeredLayoutV132(graph);
                    drawTopologyLayoutV132(layout, graph, selectedNode);
                    topologyLoadingV127.classList.remove('is-visible');
                    window.requestAnimationFrame(function () {
                        initialiseTopologyPanZoomV10();
                        centerTopologyAtOneHundredV130();
                    });
                } catch (error) {
                    topologyLoadingV127.classList.remove('is-visible');
                    while (topologyViewportV10.firstChild) topologyViewportV10.removeChild(topologyViewportV10.firstChild);
                    const message = svgElementV10('g', { 'aria-label': '依赖图暂时无法加载' });
                    message.appendChild(svgElementV10('text', { x: '500', y: '282', 'text-anchor': 'middle', fill: '#64748B', 'font-size': '17', 'font-weight': '900' }, '依赖图暂时无法加载'));
                    message.appendChild(svgElementV10('text', { x: '500', y: '312', 'text-anchor': 'middle', fill: '#94A3B8', 'font-size': '12', 'font-weight': '750' }, '请稍后重试'));
                    topologyViewportV10.appendChild(message);
                    topologySvgV10.setAttribute('viewBox', '0 0 1000 600');
                    showTopologyMessageV10('依赖图布局失败，请稍后重试', 2600, true);
                }
            };

            showTopologyGuidanceV10 = function () {
                stateV10.topologyHintShown = true;
                hideTopologyHintV10();
            };

            announceTopologyFocusV10 = function () {
                const selectedNode = levelNodeByIdV10(stateV10.topologySelectedNodeId);
                if (!selectedNode) return;
                const graph = collectGlobalDependencyGraphV129(selectedNode.id);
                if (graph.edges.length === 0) showTopologyMessageV10('该能力暂无跨主线依赖', 2200, false);
                else hideTopologyHintV10();
            };

            abilityGridV10.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const moreButton = element.closest('[data-ability-more]');
                if (moreButton) {
                    event.stopPropagation();
                    const row = moreButton.closest('[data-ability-row]');
                    const scroller = row ? row.querySelector('[data-ability-scroll]') : null;
                    if (scroller) {
                        const remaining = scroller.scrollWidth - scroller.clientWidth - scroller.scrollLeft;
                        if (remaining > 3) {
                            scroller.scrollBy({ left: Math.max(360, scroller.clientWidth * 0.58), behavior: 'smooth' });
                            window.setTimeout(updateAbilityRowOverflowV10, 360);
                        } else if (row) {
                            openDetailV10(row.dataset.abilityRow);
                        }
                    }
                    return;
                }
                const levelButton = element.closest('[data-level-node-id]');
                if (levelButton) {
                    const node = levelNodeByIdV10(levelButton.dataset.levelNodeId);
                    if (node) openDetailV10(node.abilityId, node.id);
                    return;
                }
                const abilityRow = element.closest('[data-ability-row]');
                if (abilityRow) openDetailV10(abilityRow.dataset.abilityRow);
            });

            overviewScrollV10.addEventListener('scroll', updateOverviewScrollCueV10, { passive: true });
            abilityGridV10.addEventListener('scroll', function (event) {
                if (event.target instanceof Element && event.target.matches('[data-ability-scroll]')) updateAbilityRowOverflowV10();
            }, { passive: true, capture: true });

            document.getElementById('detail-mainline').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-level-node-id]') : null;
                if (target) selectDetailNodeV10(target.dataset.levelNodeId);
            });

            document.getElementById('dependency-view').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-jump-level-node]') : null;
                if (!target) return;
                const node = levelNodeByIdV10(target.dataset.jumpLevelNode);
                if (node) openDetailV10(node.abilityId, node.id);
            });

            document.getElementById('learning-grid').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-learning-task-id]') : null;
                if (!target || target.disabled) return;
                const ability = abilityByIdV10(stateV10.selectedAbilityId);
                const node = selectedNodeV10();
                const task = (learningTasksByNodeV127[node.id] || []).find(function (item) { return item.id === target.dataset.learningTaskId; });
                if (task) showToastV10(learningTaskActionV127(task) + ' · ' + task.title);
            });

            topologySvgV10.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const stageTarget = element.closest('[data-topology-node-id]');
                if (stageTarget) {
                    navigateTopologyNodeV136(stageTarget.dataset.topologyNodeId);
                    return;
                }
                hideTopologyHintV10();
            });

            topologySvgV10.addEventListener('keydown', function (event) {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const rawTarget = event.target instanceof Element ? event.target : null;
                if (!rawTarget) return;
                const element = rawTarget.closest('[data-topology-node-id]');
                if (!element) return;
                event.preventDefault();
                navigateTopologyNodeV136(element.dataset.topologyNodeId);
            });

            document.getElementById('overview-back-button').addEventListener('click', function () {
                window.history.back();
            });
            document.getElementById('detail-back-button').addEventListener('click', navigateBackFromDetailV10);
            document.getElementById('detail-breadcrumb-overview').addEventListener('click', function () {
                showPageV10('overview');
            });
            document.getElementById('dependency-global-button').addEventListener('click', openTopologyV10);
            document.getElementById('topology-zoom-out').addEventListener('click', function () {
                if (topologyPanZoomV10) topologyPanZoomV10.zoomOut();
            });
            document.getElementById('topology-zoom-in').addEventListener('click', function () {
                if (topologyPanZoomV10) topologyPanZoomV10.zoomIn();
            });
            document.getElementById('topology-fit').addEventListener('click', fitTopologyV10);
            topologyResetButtonV10.addEventListener('click', clearTopologyFocusV10);

            if (typeof ResizeObserver !== 'undefined') {
                const topologyResizeObserver = new ResizeObserver(function () {
                    if (stateV10.view === 'detail' && stateV10.dependencyMode === 'global') window.requestAnimationFrame(centerTopologyAtOneHundredV130);
                });
                topologyResizeObserver.observe(document.getElementById('topology-surface'));
                const overviewResizeObserver = new ResizeObserver(function () {
                    if (stateV10.view === 'overview') {
                        window.requestAnimationFrame(function () {
                            updateOverviewScrollCueV10();
                            updateAbilityRowOverflowV10();
                        });
                    }
                });
                overviewResizeObserver.observe(overviewScrollV10);
                overviewResizeObserver.observe(abilityGridV10);
            }

            validateDataV10();
            renderOverviewV10();
            renderDetailV10();
        }());
    </script>
</body>
</html>
