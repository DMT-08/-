            let priorLevelsComplete = true;
            const levels = rankedGroups.map(({ rank, nodes }, index) => {
                const x = LEVEL_START_X + index * levelStep;
                const hasMultipleBranches = nodes.length > 1;
                nodes.forEach((node, nodeIndex) => {
                    nodePositions.set(node.id, {
                        x: x + (hasMultipleBranches ? MULTI_BRANCH_NODE_OFFSET_X : 0),
                        y: BRANCH_START_Y + nodeIndex * BRANCH_STEP_Y
                    });
                });

                const mastered = nodes.filter(isNodeMastered).length;
                const isComplete = nodes.length > 0 && mastered === nodes.length;
                const level = {
                    id: `level-${rank}`,
                    rank,
                    index,
                    x,
                    y: LEVEL_Y,
                    title: getLevelTitle(index, rankedGroups.length),
                    status: getLevelStatus(nodes, priorLevelsComplete),
                    mastered,
                    total: nodes.length,
                    nodes
                };
                priorLevelsComplete = priorLevelsComplete && isComplete;
                return level;
            });

            const connections = [];
            levels.forEach((level, index) => {
                if (index > 0) {
                    connections.push({
                        key: `main:${levels[index - 1].id}:${level.id}`,
                        kind: 'main',
                        source: levels[index - 1],
                        target: level,
                        status: level.status
                    });
                }

                if (level.nodes.length === 1) {
                    const node = level.nodes[0];
                    connections.push({
                        key: `branch-direct:${level.id}:${node.id}`,
                        kind: 'branch-direct',
                        source: level,
                        target: node,
                        targetPosition: nodePositions.get(node.id),
                        status: level.status === 'locked'
                            ? 'locked'
                            : isNodeMastered(node) ? 'mastered' : isNodeActive(node) ? 'active' : 'locked'
                    });
                } else if (level.nodes.length > 1) {
                    const lastNode = level.nodes[level.nodes.length - 1];
                    connections.push({
                        key: `branch-trunk:${level.id}`,
                        kind: 'branch-trunk',
                        source: level,
                        targetPosition: nodePositions.get(lastNode.id),
                        status: level.status
                    });

                    level.nodes.forEach(node => {
                        connections.push({
                            key: `branch-arm:${level.id}:${node.id}`,
                            kind: 'branch-arm',
                            source: level,
                            target: node,
                            targetPosition: nodePositions.get(node.id),
                            status: level.status === 'locked'
                                ? 'locked'
                                : isNodeMastered(node) ? 'mastered' : isNodeActive(node) ? 'active' : 'locked'
                        });
                    });
                }
            });

            return { levels, nodePositions, connections };
        }

        function getNodeViewPosition(goal, node) {
            return getHierarchyLayout(goal).nodePositions.get(node.id) || { x: node.x, y: node.y };
        }

        function createEmptyModeCompletion() {
            const completion = {};
            for (const name of MODE_NAMES) completion[name] = false;
            return completion;
        }

        function countCompletedModes(completion) {
            let count = 0;
            for (const name of MODE_NAMES) {
                if (completion[name]) count += 1;
            }
            return count;
        }

        function setNodeAccessStatus(node, nextStatus) {
            const isMilestone = String(node.status).startsWith('milestone-');
            node.status = isMilestone ? `milestone-${nextStatus}` : nextStatus;
        }

        function unlockEligibleNodes(goal) {
            if (!goal) return [];

            const unlockedNodes = [];
            let priorLevelsComplete = true;
            getRankedNodeGroups(goal).forEach(level => {
                const levelUnlocked = priorLevelsComplete;

                level.nodes.forEach(node => {
                    if (isNodeMastered(node)) return;

                    if (levelUnlocked && isNodeLocked(node)) {
                        setNodeAccessStatus(node, 'active');
                        node.progress = Number(node.progress) || 0;
                        node.modeCompletion ||= createEmptyModeCompletion();
                        unlockedNodes.push(node);
                    } else if (!levelUnlocked && !isNodeLocked(node)) {
                        setNodeAccessStatus(node, 'locked');
                    }
                });

                const levelComplete = level.nodes.length > 0 && level.nodes.every(isNodeMastered);
                priorLevelsComplete = priorLevelsComplete && levelComplete;
            });

            return unlockedNodes;
        }

        function limitGoalTitle(title) {
            const characters = Array.from(title);
            if (characters.length <= GOAL_TITLE_MAX_LENGTH) return title;
            return `${characters.slice(0, GOAL_TITLE_MAX_LENGTH - 1).join('')}…`;
        }

        function getGoalStats(goal) {
            const total = goal.nodes.length;
            let mastered = 0;
            let hasStarted = false;

            for (const node of goal.nodes) {
                const nodeMastered = isNodeMastered(node);
                if (nodeMastered) mastered += 1;
                if (nodeMastered || Number(node.progress) > 0) hasStarted = true;
            }

            const percent = total > 0 ? Math.round((mastered / total) * 100) : 0;
            const tone = total > 0 && mastered === total
                ? 'mastered'
                : hasStarted ? 'active' : 'idle';
            return { mastered, total, percent, tone };
        }

        function syncGoalGroup(goal) {
            const targetName = GROUP_NAME_BY_TONE[getGoalStats(goal).tone];
            const currentGroup = groups.find(group => group.goals.includes(goal));
            const targetGroup = groups.find(group => group.name === targetName);
            if (!currentGroup || !targetGroup || currentGroup === targetGroup) return;

            currentGroup.goals.splice(currentGroup.goals.indexOf(goal), 1);
            targetGroup.goals.push(goal);
        }

        function captureRenderedGoalProgress() {
            const progressByGoal = new Map();
            goalList.querySelectorAll('[data-goal-progress]').forEach(fill => {
                const track = fill.parentElement;
                const trackWidth = track?.getBoundingClientRect().width || 0;
                if (!trackWidth) return;

                const displayedPercent = (fill.getBoundingClientRect().width / trackWidth) * 100;
                progressByGoal.set(fill.dataset.goalProgress, Math.max(0, Math.min(100, displayedPercent)));
            });
            return progressByGoal;
        }

        function renderGoals() {
            const previousProgress = captureRenderedGoalProgress();
            const progressAnimations = [];
            const renderToken = ++goalProgressRenderToken;

            goalList.innerHTML = groups.map((group, groupIndex) => {
                const collapsed = collapsedGoalGroups.has(group.name);
                const contentId = `goal-group-${groupIndex}`;
                return `
                <section data-goal-group="${group.name}">
                    <h2>
                        <button type="button" data-group-toggle="${group.name}" aria-expanded="${!collapsed}" aria-controls="${contentId}" class="flex min-h-11 w-full items-center rounded-xl px-1.5 text-left text-[16px] font-extrabold text-slate-900 transition hover:bg-slate-50 active:scale-[0.98]">
                            <span>${group.name}（${group.goals.length}）</span>
                        </button>
                    </h2>
                    <div id="${contentId}" data-group-content class="goal-group-content${collapsed ? ' is-collapsed' : ''}" aria-hidden="${collapsed}" ${collapsed ? 'inert' : ''}>
                        <div class="goal-group-clip">
                            <div class="space-y-1.5">
                        ${group.goals.map(goal => {
                            const selected = goal.id === state.goalId;
                            const displayTitle = limitGoalTitle(goal.title);
                            const stats = getGoalStats(goal);
                            const activeTone = stats.tone === 'mastered'
                                ? 'bg-emerald-50/90 text-emerald-700'
                                : stats.tone === 'active'
                                    ? 'bg-blue-50 text-brand'
                                    : 'bg-slate-50 text-slate-600';
                            const fill = stats.tone === 'mastered' ? 'bg-emerald-500' : stats.tone === 'active' ? 'bg-brand' : 'bg-slate-300';
                            const displayedPercent = previousProgress.get(goal.id);
                            const shouldAnimateProgress = Number.isFinite(displayedPercent)
                                && stats.percent > displayedPercent + 0.1
                                && !reducedMotionQuery.matches;
                            const startPercent = shouldAnimateProgress ? displayedPercent : stats.percent;
                            if (shouldAnimateProgress) {
                                progressAnimations.push({ goalId: goal.id, targetPercent: stats.percent });
                            }
                            return `
                                <button type="button" data-goal-id="${goal.id}" aria-pressed="${selected}" aria-label="${goal.title}" title="${goal.title}" class="goal-button min-h-[72px] w-full rounded-[14px] px-4 py-3 text-left transition active:scale-[0.98] ${selected ? activeTone : 'bg-transparent text-slate-600'}">
                                    <span class="block truncate text-[14px] font-bold">${displayTitle}</span>
                                    <span class="mt-2 flex items-center gap-3">
                                        <span class="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-200/80">
                                            <span class="goal-progress-fill block h-full rounded-full ${fill}" data-goal-progress="${goal.id}" style="transform:scaleX(${startPercent / 100})"></span>
                                        </span>
                                        <span class="min-w-[48px] text-right font-mono text-[12px] font-bold">${stats.mastered}/${stats.total}</span>
                                    </span>
                                </button>
                            `;
                            }).join('')}
                            </div>
                        </div>
                    </div>
                </section>
                `;
            }).join('');

            if (!progressAnimations.length) return;

            requestAnimationFrame(() => {
                if (renderToken !== goalProgressRenderToken) return;
                requestAnimationFrame(() => {
                    if (renderToken !== goalProgressRenderToken) return;
                    progressAnimations.forEach(({ goalId, targetPercent }) => {
                        const fill = goalList.querySelector(`[data-goal-progress="${goalId}"]`);
                        if (fill) fill.style.transform = `scaleX(${targetPercent / 100})`;
                    });
                });
            });
        }

        function selectGoal(goalId) {
            if (state.goalId === goalId) return;
            collapseDrawerForGoalSwitch();
            state.goalId = goalId;
            renderGoals();
            renderStage(false, true);
            renderDrawer();
            const goal = getGoal();
            const token = stageRenderToken;
            requestAnimationFrame(() => {
                if (goal && getGoalStats(goal).tone === 'mastered') animateCanvasToGoalFit(goal, token);
                else animateCanvasToNode(getGoalFocusNode(goal), token);
            });
        }

        function toggleGoalGroup(button) {
            const groupName = button.dataset.groupToggle;
            const section = button.closest('[data-goal-group]');
            const content = section?.querySelector('[data-group-content]');
            if (!groupName || !content) return;

            const willExpand = collapsedGoalGroups.has(groupName);
            if (willExpand) collapsedGoalGroups.delete(groupName);
            else collapsedGoalGroups.add(groupName);

            button.setAttribute('aria-expanded', String(willExpand));
            content.classList.toggle('is-collapsed', !willExpand);
            content.setAttribute('aria-hidden', String(!willExpand));
            content.toggleAttribute('inert', !willExpand);
        }

        function collapseDrawerForGoalSwitch() {
            state.nodeId = null;
            state.drawerOpen = false;
            drawer.classList.remove('is-open');
            drawer.setAttribute('aria-hidden', 'true');
        }

        function getGoalFocusNode(goal) {
            if (!goal?.nodes?.length) return null;
            let mostAdvancedActiveNode = null;
            for (const node of goal.nodes) {
                if (!isNodeActive(node)) continue;
                if (!mostAdvancedActiveNode || node.progress > mostAdvancedActiveNode.progress) {
                    mostAdvancedActiveNode = node;
                }
            }
            return mostAdvancedActiveNode
                || goal.nodes.find(node => node.status === 'milestone-mastered')
                || goal.nodes[Math.floor(goal.nodes.length / 2)];
        }

        function cancelCameraAnimation() {
            if (masteryCameraTimer) {
                clearTimeout(masteryCameraTimer);
                masteryCameraTimer = 0;
            }
            if (cameraAnimationFrame) {
                cancelAnimationFrame(cameraAnimationFrame);
                cameraAnimationFrame = 0;
            }
        }

        function animateCanvasToNode(node, token, immediate = false) {
            if (!node) return;
            cancelCameraAnimation();

            const goal = getGoal();
            const position = getNodeViewPosition(goal, node);
            const startLeft = canvasScroll.scrollLeft;
            const startTop = canvasScroll.scrollTop;
            const layout = getCanvasStageLayout(state.zoom);
            const targetLeft = Math.min(layout.maxLeft, Math.max(0,
                layout.gutterX + (STAGE_OFFSET_X + position.x) * state.zoom - layout.viewportWidth * FOCUS_VIEWPORT_X
            ));
            const targetTop = Math.min(layout.maxTop, Math.max(0,
                layout.gutterY + (STAGE_OFFSET_Y + position.y) * state.zoom - layout.viewportHeight * 0.5
            ));

            if (immediate || reducedMotionQuery.matches) {
                canvasScroll.scrollLeft = targetLeft;
                canvasScroll.scrollTop = targetTop;
                return;
            }

            const duration = 920;
            const startTime = performance.now();
            const tick = now => {
                if (token !== stageRenderToken) {
                    cameraAnimationFrame = 0;
                    return;
                }

                const rawProgress = Math.min(1, (now - startTime) / duration);
                const progress = rawProgress < 0.5
                    ? 4 * rawProgress * rawProgress * rawProgress
                    : 1 - Math.pow(-2 * rawProgress + 2, 3) / 2;
                canvasScroll.scrollLeft = mixNumber(startLeft, targetLeft, progress);
                canvasScroll.scrollTop = mixNumber(startTop, targetTop, progress);

                if (rawProgress < 1) {
                    cameraAnimationFrame = requestAnimationFrame(tick);
                } else {
                    cameraAnimationFrame = 0;
                }
            };

            cameraAnimationFrame = requestAnimationFrame(tick);
        }

        function goalContentBounds(goal) {
            let minX = Infinity;
            let maxX = -Infinity;
            let minY = Infinity;
            let maxY = -Infinity;
            const hierarchy = getHierarchyLayout(goal);
            hierarchy.levels.forEach(level => {
                const x = STAGE_OFFSET_X + level.x;
                const y = STAGE_OFFSET_Y + level.y;
                minX = Math.min(minX, x - LEVEL_WIDTH * 0.5);
                maxX = Math.max(maxX, x + LEVEL_WIDTH * 0.5);
                minY = Math.min(minY, y - LEVEL_HEIGHT * 0.5);
                maxY = Math.max(maxY, y + LEVEL_HEIGHT * 0.5);
            });
            for (const node of goal.nodes) {
                const position = hierarchy.nodePositions.get(node.id);
                const x = STAGE_OFFSET_X + position.x;
                const y = STAGE_OFFSET_Y + position.y;
                minX = Math.min(minX, x - SKILL_NODE_WIDTH * 0.5);
                maxX = Math.max(maxX, x + SKILL_NODE_WIDTH * 0.5);
                minY = Math.min(minY, y - SKILL_NODE_HEIGHT * 0.5);
                maxY = Math.max(maxY, y + SKILL_NODE_HEIGHT * 0.5);
            }
            const left = Math.max(0, minX - 64);
            const right = Math.min(STAGE_WIDTH, maxX + 64);
            const top = Math.max(0, minY - 48);
            const bottom = Math.min(STAGE_HEIGHT, maxY + 72);
            return {
                left,
                top,
                width: Math.max(1, right - left),
                height: Math.max(1, bottom - top)
            };
        }

        function syncCanvasViewportGeometry() {
            const width = canvasScroll.clientWidth;
            const height = canvasScroll.clientHeight;
            if (width === canvasViewportWidth && height === canvasViewportHeight) return;

            canvasViewportWidth = width;
            canvasViewportHeight = height;
            const rootStyle = document.documentElement.style;
            rootStyle.setProperty('--stage-gutter-x', `${width * 0.5}px`);
            rootStyle.setProperty('--stage-gutter-y', `${height * 0.5}px`);
            rootStyle.setProperty('--stage-gutter-width', `${width}px`);
            rootStyle.setProperty('--stage-gutter-height', `${height}px`);
        }

        function getCanvasStageLayout(zoom) {
            syncCanvasViewportGeometry();
            return {
                viewportWidth: canvasViewportWidth,
                viewportHeight: canvasViewportHeight,
                gutterX: canvasViewportWidth * 0.5,
                gutterY: canvasViewportHeight * 0.5,
                maxLeft: Math.max(0, STAGE_WIDTH * zoom),
                maxTop: Math.max(0, STAGE_HEIGHT * zoom)
            };
        }

        function centeredGoalViewAtZoom(goal, zoom, bounds = goalContentBounds(goal)) {
            const layout = getCanvasStageLayout(zoom);
            const contentCenterX = bounds.left + bounds.width * 0.5;
            const contentCenterY = bounds.top + bounds.height * 0.5;
            return {
                zoom,
                left: Math.min(layout.maxLeft, Math.max(0, contentCenterX * zoom)),
                top: Math.min(layout.maxTop, Math.max(0, contentCenterY * zoom))
            };
        }

        function goalFitView(goal) {
            const bounds = goalContentBounds(goal);
            const layout = getCanvasStageLayout(state.zoom);
            const availableWidth = Math.max(320, layout.viewportWidth - 40);
            const availableHeight = Math.max(320, layout.viewportHeight - 40);
            const rawZoom = Math.min(availableWidth / bounds.width, availableHeight / bounds.height, 1);
            const zoom = Math.max(0.1, Math.floor(rawZoom * 100) / 100);
            return centeredGoalViewAtZoom(goal, zoom, bounds);
        }

        function applyCanvasZoom(value) {
            syncCanvasViewportGeometry();
            state.zoom = value;
            document.documentElement.style.setProperty('--zoom', value);
            zoomLabel.textContent = `${Math.round(value * 100)}%`;
        }

        function easeInOutCubic(progress) {
            return progress < 0.5
                ? 4 * progress * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 3) / 2;
        }

        function animateCanvasToView(target, token, immediate = false) {
            cancelCameraAnimation();
            const startZoom = state.zoom;
            const startLeft = canvasScroll.scrollLeft;
            const startTop = canvasScroll.scrollTop;

            if (immediate || reducedMotionQuery.matches) {
                applyCanvasZoom(target.zoom);
                canvasScroll.scrollLeft = target.left;
                canvasScroll.scrollTop = target.top;
                renderZoomOptions();
                return;
            }

            const duration = 920;
            const startTime = performance.now();
            const tick = now => {
                if (token !== stageRenderToken) {
                    cameraAnimationFrame = 0;
                    return;
                }

                const rawProgress = Math.min(1, (now - startTime) / duration);
                const progress = easeInOutCubic(rawProgress);
                applyCanvasZoom(mixNumber(startZoom, target.zoom, progress));
                canvasScroll.scrollLeft = mixNumber(startLeft, target.left, progress);
                canvasScroll.scrollTop = mixNumber(startTop, target.top, progress);

                if (rawProgress < 1) {
                    cameraAnimationFrame = requestAnimationFrame(tick);
                } else {
                    applyCanvasZoom(target.zoom);
                    canvasScroll.scrollLeft = target.left;
                    canvasScroll.scrollTop = target.top;
                    cameraAnimationFrame = 0;
                    renderZoomOptions();
                }
            };

            cameraAnimationFrame = requestAnimationFrame(tick);
        }

        function animateCanvasToGoalFit(goal, token, immediate = false) {
            if (!goal?.nodes?.length) return;
            animateCanvasToView(goalFitView(goal), token, immediate);
        }

        function pathGeometry(connection) {
            if (connection.kind === 'main') {
                const startX = STAGE_OFFSET_X + connection.source.x + LEVEL_WIDTH * 0.5 + CONNECTION_GAP;
                const endX = STAGE_OFFSET_X + connection.target.x - LEVEL_WIDTH * 0.5 - CONNECTION_GAP;
                const startY = STAGE_OFFSET_Y + connection.source.y;
                return straightGeometry(startX, startY, endX, startY);
            }

            const trunkX = STAGE_OFFSET_X + connection.source.x;
            const startY = STAGE_OFFSET_Y + connection.source.y + LEVEL_HEIGHT * 0.5 + CONNECTION_GAP;
            const targetCenterX = STAGE_OFFSET_X + connection.targetPosition.x;
            const targetCenterY = STAGE_OFFSET_Y + connection.targetPosition.y;

            if (connection.kind === 'branch-direct') {
                const endY = targetCenterY - SKILL_NODE_HEIGHT * 0.5 - CONNECTION_GAP;
                return straightGeometry(trunkX, startY, trunkX, endY);
            }

            if (connection.kind === 'branch-trunk') {
                return straightGeometry(trunkX, startY, trunkX, targetCenterY);
            }

            const endX = targetCenterX - SKILL_NODE_WIDTH * 0.5 - CONNECTION_GAP;
            return straightGeometry(trunkX, targetCenterY, endX, targetCenterY);
        }

        function straightGeometry(startX, startY, endX, endY) {
            return {
                startX,
                startY,
                control1X: startX + (endX - startX) / 3,
                control1Y: startY + (endY - startY) / 3,
                control2X: startX + (endX - startX) * 2 / 3,
                control2Y: startY + (endY - startY) * 2 / 3,
                endX,
                endY
            };
        }

        function geometryToPath(geometry) {
            return `M ${geometry.startX} ${geometry.startY} L ${geometry.endX} ${geometry.endY}`;
        }

        function mixNumber(from, to, progress) {
            return from + (to - from) * progress;
        }

        function collapsedGeometry(geometry) {
            return {
                startX: geometry.startX,
                startY: geometry.startY,
                control1X: geometry.startX,
                control1Y: geometry.startY,
                control2X: geometry.startX,
                control2Y: geometry.startY,
                endX: geometry.startX,
                endY: geometry.startY
            };
        }

        function applyBundleGeometry(bundle, geometry) {
            const pathData = geometryToPath(geometry);
            bundle.firstElementChild?.setAttribute('d', pathData);
        }

        function clearMorphVolume(bundle) {
            bundle.firstElementChild?.style.removeProperty('opacity');
        }

        function setMorphVolume(bundle, stretch) {
            bundle.firstElementChild?.style.setProperty('opacity', String(0.82 + stretch * 0.18));
        }

        function settlePath(bundle, geometry) {
            const frame = lineAnimationFrames.get(bundle);
            if (frame) cancelAnimationFrame(frame);
            lineAnimationFrames.delete(bundle);
            bundle._currentGeometry = geometry;
            bundle._targetGeometry = geometry;
            applyBundleGeometry(bundle, geometry);
            clearMorphVolume(bundle);
            bundle.classList.remove('is-morphing');
        }

        function animatePathMorph(bundle, from, to, index, token) {
            const priorFrame = lineAnimationFrames.get(bundle);
            if (priorFrame) cancelAnimationFrame(priorFrame);

            if (reducedMotionQuery.matches) {
                settlePath(bundle, to);
                return;
            }

            const delay = index * 28;
            const duration = 940;
            const startTime = performance.now() + delay;
            const origin = { ...from };
            const current = { ...from };
            bundle._targetGeometry = to;
            bundle.classList.add('is-morphing');

            const tick = now => {
                if (token !== stageRenderToken || !bundle.isConnected) {
                    lineAnimationFrames.delete(bundle);
                    clearMorphVolume(bundle);
                    bundle.classList.remove('is-morphing');
                    return;
                }

                if (now < startTime) {
                    lineAnimationFrames.set(bundle, requestAnimationFrame(tick));
                    return;
                }

                const rawProgress = Math.min(1, (now - startTime) / duration);
                const progress = 1 - Math.pow(1 - rawProgress, 3);
                const stretch = Math.sin(Math.PI * rawProgress);
                current.startX = mixNumber(origin.startX, to.startX, progress);
                current.startY = mixNumber(origin.startY, to.startY, progress);
                current.control1X = mixNumber(origin.control1X, to.control1X, progress);
                current.control1Y = mixNumber(origin.control1Y, to.control1Y, progress);
                current.control2X = mixNumber(origin.control2X, to.control2X, progress);
                current.control2Y = mixNumber(origin.control2Y, to.control2Y, progress);
                current.endX = mixNumber(origin.endX, to.endX, progress);
                current.endY = mixNumber(origin.endY, to.endY, progress);

                bundle._currentGeometry = current;
                applyBundleGeometry(bundle, current);
                setMorphVolume(bundle, stretch);

                if (rawProgress < 1) {
                    lineAnimationFrames.set(bundle, requestAnimationFrame(tick));
                } else {
                    settlePath(bundle, to);
                }
            };

            lineAnimationFrames.set(bundle, requestAnimationFrame(tick));
        }

        function lineTone(status) {
            if (status === 'mastered') return { color: '#12B981', active: false };
            if (status === 'active') return { color: '#1F5FFF', active: true };
            return { color: '#D6DFEC', active: false };
        }

        function createLineBundle(svgLayer) {
            const svgNamespace = 'http://www.w3.org/2000/svg';
            const bundle = document.createElementNS(svgNamespace, 'g');
            bundle.setAttribute('class', 'line-bundle');
            bundle.style.opacity = '0';

            const path = document.createElementNS(svgNamespace, 'path');
            path.setAttribute('class', 'graph-line');
            bundle.appendChild(path);

            svgLayer.appendChild(bundle);
            return bundle;
        }

        function ensureNodeParts(button) {
            if (button._nodeParts) return button._nodeParts;
            button.innerHTML = `
                <span data-node-shape class="node-shape flex items-center justify-center">
                    <i data-node-icon aria-hidden="true"></i>
                </span>
                <span class="min-w-0 flex-1">
                    <span data-node-title class="block truncate text-[14px] font-extrabold leading-5 text-slate-800"></span>
                    <span data-node-status class="mt-1 block text-[10px] font-bold"></span>
                </span>
            `;
            button._nodeParts = {
                icon: button.querySelector('[data-node-icon]'),
                title: button.querySelector('[data-node-title]'),
                status: button.querySelector('[data-node-status]')
            };
            return button._nodeParts;
        }

        function updateNodeParts(button, node, meta) {
            const parts = ensureNodeParts(button);
            parts.icon.className = `ph-bold ${meta.icon} text-[20px]`;
            parts.title.textContent = node.title;
            parts.status.className = `mt-1 block text-[10px] font-bold ${meta.text}`;
            parts.status.textContent = `${meta.label}${isNodeActive(node) ? ` · ${node.progress}%` : ''}`;
        }

        function ensureLevelParts(levelNode) {
            if (levelNode._levelParts) return levelNode._levelParts;
            levelNode.innerHTML = `
                <div class="flex items-center justify-between gap-3">
                    <span data-level-kicker class="text-[10px] font-extrabold tracking-[0.12em] text-brand"></span>
                    <span data-level-count class="font-mono text-[11px] font-bold text-slate-400"></span>
                </div>
                <h3 data-level-title class="mt-2 text-[18px] font-extrabold leading-6 tracking-[-0.02em] text-slate-900"></h3>
                <div class="mt-2 flex items-center gap-2 text-[11px] font-bold">
                    <span data-level-dot class="h-2 w-2 rounded-full"></span>
                    <span data-level-status></span>
                </div>
            `;
            levelNode._levelParts = {
                kicker: levelNode.querySelector('[data-level-kicker]'),
                count: levelNode.querySelector('[data-level-count]'),
                title: levelNode.querySelector('[data-level-title]'),
                dot: levelNode.querySelector('[data-level-dot]'),
                status: levelNode.querySelector('[data-level-status]')
            };
            return levelNode._levelParts;
        }

        function updateLevelParts(levelNode, level) {
            const parts = ensureLevelParts(levelNode);
            const statusMeta = {
                mastered: { label: '本级已完成', tone: 'text-emerald-600', dot: 'bg-emerald-500' },
                active: { label: '本级进行中', tone: 'text-brand', dot: 'bg-brand' },
                locked: { label: '本级待解锁', tone: 'text-slate-400', dot: 'bg-slate-300' }
            }[level.status];
            parts.kicker.textContent = `主能力 · L${String(level.index + 1).padStart(2, '0')}`;
            parts.count.textContent = `${level.mastered}/${level.total}`;
            parts.title.textContent = level.title;
            parts.dot.className = `h-2 w-2 rounded-full ${statusMeta.dot}`;
            parts.status.className = statusMeta.tone;
            parts.status.textContent = statusMeta.label;
        }

        function renderStage(isInitial = false, isGoalSwitch = false) {
            const goal = getGoal();
            const token = ++stageRenderToken;

            if (!goal || !goal.nodes.length) {
                skillStage.innerHTML = '';
                return;
            }

            const hierarchy = getHierarchyLayout(goal);

            let svgLayer = skillStage.querySelector('svg');
            if (!svgLayer) {
                svgLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svgLayer.setAttribute('class', 'absolute inset-0 h-full w-full');
                svgLayer.setAttribute('viewBox', `0 0 ${STAGE_WIDTH} ${STAGE_HEIGHT}`);
                svgLayer.setAttribute('aria-hidden', 'true');
                skillStage.prepend(svgLayer);
            }
            const existingBundles = Array.from(svgLayer.querySelectorAll('.line-bundle'));
            hierarchy.connections.forEach((connection, index) => {
                const tone = lineTone(connection.status);
                const nextGeometry = pathGeometry(connection);
                let bundle = existingBundles[index];
                const isNew = !bundle;

                if (isNew) {
                    bundle = createLineBundle(svgLayer);
                }

                bundle.dataset.connectionKey = connection.key;
                bundle.classList.remove(
                    'is-retired',
                    'connection-main',
                    'connection-branch',
                    'connection-branch-trunk',
                    'connection-branch-arm',
                    'connection-branch-direct'
                );
                bundle.classList.add(`connection-${connection.kind}`);
                bundle.classList.toggle('is-active', tone.active);
                bundle.firstElementChild.setAttribute('stroke', tone.color);

                if (isGoalSwitch) {
                    const previousGeometry = bundle._currentGeometry || bundle._targetGeometry || collapsedGeometry(nextGeometry);
                    animatePathMorph(bundle, previousGeometry, nextGeometry, index, token);
                } else {
                    settlePath(bundle, nextGeometry);
                }

                if (isNew) {
                    window.setTimeout(() => {
                        if (token === stageRenderToken && bundle.isConnected) bundle.style.opacity = '1';
                    }, (isInitial ? index * 50 : 0) + 200);
                } else {
                    bundle.style.opacity = '1';
                }
            });

            existingBundles.slice(hierarchy.connections.length).forEach(bundle => {
                const frame = lineAnimationFrames.get(bundle);
                if (frame) cancelAnimationFrame(frame);
                lineAnimationFrames.delete(bundle);
                clearMorphVolume(bundle);
                bundle.classList.remove('is-active', 'is-morphing');
                bundle.classList.add('is-retired');
                bundle.style.opacity = '0';
            });

            const existingLevels = Array.from(skillStage.querySelectorAll('.level-node'));
            hierarchy.levels.forEach((level, index) => {
                let levelNode = existingLevels[index];
                const isNew = !levelNode;

                if (isNew) {
                    levelNode = document.createElement('article');
                    levelNode.className = 'level-node is-entering';
                    skillStage.appendChild(levelNode);
                }

                levelNode.dataset.levelId = level.id;
                levelNode.setAttribute('aria-label', `主能力第 ${level.index + 1} 级，${level.title}，${level.mastered}/${level.total} 已完成`);
                levelNode.className = `level-node level-${level.status}${isNew ? ' is-entering' : ''}`;
                levelNode.style.left = `${STAGE_OFFSET_X + level.x}px`;
                levelNode.style.top = `${STAGE_OFFSET_Y + level.y}px`;
                updateLevelParts(levelNode, level);

                if (isNew) {
                    requestAnimationFrame(() => {
                        window.setTimeout(() => {
                            if (token === stageRenderToken && levelNode.isConnected) levelNode.classList.remove('is-entering');
                        }, isInitial ? index * 70 : 40 + index * 30);
                    });
                }
            });

            existingLevels.slice(hierarchy.levels.length).forEach(levelNode => {
                levelNode.classList.add('is-leaving');
                window.setTimeout(() => {
                    if (token === stageRenderToken && levelNode.classList.contains('is-leaving')) levelNode.remove();
                }, 400);
            });

            const existingNodes = Array.from(skillStage.querySelectorAll('.skill-node'));
            goal.nodes.forEach((node, index) => {
                const meta = STATUS_META[node.status];
                const selected = state.drawerOpen && node.id === state.nodeId;
                const position = hierarchy.nodePositions.get(node.id);
                let button = existingNodes[index];
                const isNew = !button;
                const shouldEnter = isNew;

                if (isNew) {
                    button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'skill-node is-entering';
                    button.addEventListener('click', () => openNode(button.dataset.nodeId));
                    skillStage.appendChild(button);
                }

                button.dataset.nodeId = node.id;
                button.setAttribute('aria-pressed', String(selected));
                button.setAttribute('aria-label', `${node.title}，${meta.label}`);
                button.className = `skill-node ${meta.nodeClass}${shouldEnter ? ' is-entering' : ''}`;
                button.style.left = `${STAGE_OFFSET_X + position.x}px`;
                button.style.top = `${STAGE_OFFSET_Y + position.y}px`;
                updateNodeParts(button, node, meta);

                if (shouldEnter) {
                    requestAnimationFrame(() => {
                        window.setTimeout(() => {
                            if (token === stageRenderToken && button.isConnected) button.classList.remove('is-entering');
                        }, isInitial ? index * 50 : 60 + index * 24);
                    });
                }
            });

            existingNodes.slice(goal.nodes.length).forEach(button => {
                button.classList.add('is-leaving');
                window.setTimeout(() => {
                    if (token === stageRenderToken && button.classList.contains('is-leaving')) button.remove();
                }, 400);
            });
        }

        function openNode(nodeId) {
            state.nodeId = nodeId;
            state.drawerOpen = true;
            renderStage();
            renderDrawer();
        }

        function closeDrawer() {
            state.drawerOpen = false;
            drawer.classList.remove('is-open');
            drawer.setAttribute('aria-hidden', 'true');
            renderStage();
        }

        function renderPlanSelection() {
            return `
                <div class="pt-0.5">
                    <div>
                        <h3 class="text-[17px] font-extrabold text-slate-900">选择训练方案</h3>
                        <p class="mt-0.5 text-[13px] leading-5 text-slate-400">选择适合你的攻坚节奏，之后可随时调整</p>
                    </div>
                    <div class="mt-4 space-y-3">
                        ${planOptions.map(plan => {
                            return `
                            <button type="button" data-plan-id="${plan.id}" class="plan-button flex min-h-[68px] w-full items-center rounded-[14px] border border-slate-200 bg-white px-4 py-2.5 text-left transition hover:border-slate-300 hover:bg-slate-50/60 active:scale-[0.98]">
                                <span class="min-w-0 flex-1">
                                    <span class="flex items-center gap-2">
                                        <span class="truncate text-[15px] font-bold text-slate-900">${plan.name}</span>
                                        ${plan.recommended ? '<span class="rounded-md bg-slate-100 px-2 py-0.5 text-[10px] font-bold text-slate-500">推荐</span>' : ''}
                                    </span>
                                    <span class="mt-0.5 block truncate text-[12px] leading-[18px] text-slate-500">${plan.description}</span>
                                </span>
                            </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function ensureModeCompletion(node) {
            if (!node.modeCompletion) {
                const mastered = isNodeMastered(node);
                node.modeCompletion = {
                    '音记': mastered,
                    '题库': mastered || node.progress >= 30,
                    '游戏': mastered || node.progress >= 60
                };
            }
            return node.modeCompletion;
        }

        function getModeKey(goalId, nodeId, modeName) {
            return `${goalId}:${nodeId}:${modeName}`;
        }

        function modeCard(iconTone, name, complete, asset, assetClass, node) {
            const key = getModeKey(state.goalId, node.id, name);
            const justCompleted = state.completedFeedbackKey === key;
            const statusText = complete ? '已完成' : '未完成';
            const statusTone = complete ? 'text-emerald-500' : 'text-slate-400';
            const cardTone = justCompleted
                ? 'border-emerald-300 bg-emerald-50/70 ring-4 ring-emerald-100/80'
                : 'border-slate-200/80 bg-white hover:border-blue-200';
            return `
                <button type="button" data-mode-name="${name}" class="mode-button flex min-h-[68px] w-full items-center gap-3 rounded-[16px] border px-3.5 py-2.5 text-left transition ${cardTone} active:scale-[0.98]">
                    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ${iconTone}">
                        <img src="${asset}" alt="" class="${assetClass} object-contain" aria-hidden="true">
                    </span>
                    <span class="min-w-0 flex-1">
                        <span class="block text-[15px] font-bold text-slate-900">${name}</span>
                        <span class="mt-0.5 block text-[12px] font-medium ${statusTone}">${statusText}</span>
                    </span>
                    ${complete
                        ? '<span class="flex h-6 w-6 items-center justify-center rounded-full bg-emerald-100 text-emerald-500"><i class="ph-bold ph-check text-sm" aria-hidden="true"></i></span>'
                        : '<i class="ph-bold ph-caret-right text-lg text-slate-400" aria-hidden="true"></i>'}
                </button>
            `;
        }

        function renderPractice(node) {
            const plan = planOptions.find(item => item.id === node.plan) || planOptions[0];
            const complete = isNodeMastered(node);
            const modeCompletion = ensureModeCompletion(node);
            return `
                <div class="mt-2 rounded-[16px] border ${complete ? 'border-emerald-200 bg-emerald-50/80' : 'border-blue-200 bg-blue-50/70'} px-3.5 py-2.5">
                    <div class="flex min-h-11 items-center justify-between gap-3">
                        <div class="min-w-0">
                            <div class="text-[11px] font-bold text-slate-500">当前训练方案</div>
                            <div class="mt-0.5 truncate text-[14px] font-bold ${complete ? 'text-emerald-700' : 'text-blue-900'}" title="${plan.description}">${plan.name} · ${plan.description}</div>
                        </div>
                        ${complete
                            ? '<span class="flex shrink-0 items-center gap-1 text-[12px] font-bold text-emerald-600"><i class="ph-fill ph-trophy text-amber-500" aria-hidden="true"></i>节点已掌握</span>'
                            : '<button id="change-plan" type="button" aria-label="更改训练方案" class="flex min-h-11 shrink-0 items-center justify-center rounded-[10px] px-0.5 transition active:scale-95"><span class="flex h-8 items-center rounded-[9px] border border-blue-200 bg-white px-2 text-[12px] font-bold text-brand">更改方案</span></button>'}
                    </div>
                </div>
                <div class="mt-4">
                    <h3 class="mb-3 text-[15px] font-bold text-slate-400">练习模式</h3>
                    <div class="space-y-3">
                        ${modeCard('bg-violet-50', '音记', modeCompletion['音记'], './icon/yinji.svg', 'h-[26px] w-[26px]', node)}
                        ${modeCard('bg-blue-50', '题库', modeCompletion['题库'], './icon/tiku.svg', 'h-[35px] w-[35px]', node)}
                        ${modeCard('bg-orange-50', '游戏', modeCompletion['游戏'], './icon/game.svg', 'h-[30px] w-[30px]', node)}
                    </div>
                </div>
            `;
        }

        function getRenderedNodeButton(nodeId) {
            return skillStage.querySelector(`.skill-node[data-node-id="${nodeId}"]`);
        }

        function showMasteryBurst(nodeId) {
            const button = getRenderedNodeButton(nodeId);
            const shape = button?.querySelector('[data-node-shape]');
            if (!shape) return;

            shape.querySelector('.mastery-burst')?.remove();
            const burst = document.createElement('span');
            const ring = document.createElement('span');
            burst.className = 'mastery-burst';
            ring.className = 'mastery-burst-ring';
            burst.setAttribute('aria-hidden', 'true');
            ring.setAttribute('aria-hidden', 'true');
            burst.appendChild(ring);
            shape.appendChild(burst);
            window.setTimeout(() => burst.remove(), 920);
        }

        function showUnlockFeedback(nodeIds) {
            nodeIds.forEach(nodeId => {
                const button = getRenderedNodeButton(nodeId);
                if (!button) return;
                button.classList.add('is-unlocking');
                window.setTimeout(() => button.classList.remove('is-unlocking'), 940);
            });
        }

        function getLatestNodeAfterMastery(goal, masteredNodeId, unlockedNodeIds) {
            const masteredNode = goal?.nodes.find(node => node.id === masteredNodeId);
            const hierarchy = getHierarchyLayout(goal);
            const unlockedNodes = unlockedNodeIds
                .map(nodeId => goal?.nodes.find(node => node.id === nodeId))
                .filter(Boolean);
            const candidates = unlockedNodes.length
                ? unlockedNodes
                : goal?.nodes.filter(isNodeActive) || [];

            if (!candidates.length) return masteredNode || null;
            return candidates.reduce((latest, node) => {
                if (!latest) return node;
                const nodePosition = hierarchy.nodePositions.get(node.id);
                const latestPosition = hierarchy.nodePositions.get(latest.id);
                const masteredPosition = masteredNode ? hierarchy.nodePositions.get(masteredNode.id) : null;
                if (nodePosition.x > latestPosition.x) return node;
                if (nodePosition.x < latestPosition.x || !masteredPosition) return latest;
                return Math.abs(nodePosition.y - masteredPosition.y) < Math.abs(latestPosition.y - masteredPosition.y)
                    ? node
                    : latest;
            }, null);
        }

        function scheduleLatestNodeFocus(goalId, masteredNodeId, unlockedNodeIds) {
            if (masteryCameraTimer) clearTimeout(masteryCameraTimer);
            masteryCameraTimer = window.setTimeout(() => {
                masteryCameraTimer = 0;
                if (state.goalId !== goalId) return;

                const goal = findGoalById(goalId);
                const latestNode = getLatestNodeAfterMastery(goal, masteredNodeId, unlockedNodeIds);
                if (latestNode) animateCanvasToNode(latestNode, stageRenderToken);
            }, 500);
        }

        function startModeTraining(button) {
            const node = getNode();
            if (!node) return;

            const modeName = button.dataset.modeName;
            const completion = ensureModeCompletion(node);
            if (completion[modeName]) {
                showToast(`${modeName}训练已完成`);
                return;
            }

            if (state.trainingKey) {
                return;
            }

            const goalId = state.goalId;
            const nodeId = node.id;
            const key = getModeKey(goalId, nodeId, modeName);
            state.trainingKey = key;
            state.completedFeedbackKey = null;

            setTimeout(() => finishModeTraining(goalId, nodeId, modeName, key), 1000);
        }

        function finishModeTraining(goalId, nodeId, modeName, key) {
            const goal = findGoalById(goalId);
            const node = goal?.nodes.find(item => item.id === nodeId);
            if (!node) {
                state.trainingKey = null;
                return;
            }

            const completion = ensureModeCompletion(node);
            completion[modeName] = true;
            const completedCount = countCompletedModes(completion);
            const calculatedProgress = Math.round((completedCount / MODE_NAMES.length) * 100);
            node.progress = Math.max(node.progress, calculatedProgress);
            let becameMastered = false;

            if (completedCount === MODE_NAMES.length) {
                node.progress = 100;
                if (isNodeActive(node)) {
                    node.status = node.status === 'milestone-active' ? 'milestone-mastered' : 'mastered';
                    becameMastered = true;
                }
            }

            const unlockedNodes = becameMastered ? unlockEligibleNodes(goal) : [];
            syncGoalGroup(goal);

            state.trainingKey = null;
            state.completedFeedbackKey = key;

            if (state.goalId === goalId) {
                if (becameMastered && state.drawerOpen) {
                    state.drawerOpen = false;
                    drawer.classList.remove('is-open');
                    drawer.setAttribute('aria-hidden', 'true');
                }
                renderGoals();
                renderStage();
                if (state.nodeId === nodeId && state.drawerOpen) renderDrawer();
                requestAnimationFrame(() => {
                    const unlockedNodeIds = unlockedNodes.map(item => item.id);
                    if (becameMastered) {
                        showMasteryBurst(nodeId);
                        scheduleLatestNodeFocus(goalId, nodeId, unlockedNodeIds);
                    }
                    showUnlockFeedback(unlockedNodeIds);
                });
            }

            if (unlockedNodes.length) {
                showToast('当前主能力已完成，下一主能力已解锁');
            } else if (becameMastered) {
                showToast('节点已掌握，进度已更新');
            } else {
                showToast(`${modeName}训练已完成，进度已更新`);
            }

            setTimeout(() => {
                if (state.completedFeedbackKey !== key) return;
                state.completedFeedbackKey = null;
                if (state.goalId === goalId && state.nodeId === nodeId && state.drawerOpen) renderDrawer();
            }, 1200);
        }

        function renderLockedNode() {
            return `
                <div class="mt-2 rounded-[16px] border border-slate-200 bg-slate-50 p-4 text-center">
                    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-[14px] bg-white text-slate-400 shadow-soft">
                        <i class="ph-bold ph-lock-key text-xl" aria-hidden="true"></i>
                    </div>
                    <h3 class="mt-3 text-[16px] font-extrabold text-slate-800">先完成当前主能力</h3>
                    <p class="mt-1.5 text-[13px] leading-5 text-slate-500">当前主能力全部完成后，下一主能力会自动解锁。</p>
                </div>
            `;
        }

        function renderDrawer() {
            const node = getNode();
            if (!node || !state.drawerOpen) {
                drawer.classList.remove('is-open');
                drawer.setAttribute('aria-hidden', 'true');
                return;
            }

            const meta = STATUS_META[node.status];
            drawerTitle.textContent = node.title;
            drawerStatus.innerHTML = `
                <span class="rounded-md px-2.5 py-1 text-[12px] font-extrabold ${meta.badge}">${meta.label}</span>
                <span class="font-mono text-[12px] font-bold text-slate-400">进度 ${node.progress}%</span>
            `;

            const locked = isNodeLocked(node);
            drawerContent.innerHTML = locked ? renderLockedNode() : node.plan ? renderPractice(node) : renderPlanSelection();
            drawer.classList.add('is-open');
            drawer.setAttribute('aria-hidden', 'false');
        }

        function choosePlan(planId) {
            const node = getNode();
            node.plan = planId;
            renderDrawer();
            const plan = planOptions.find(item => item.id === planId);
            showToast(`已切换为${plan.name}`);
        }

        function openModal() {
            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function closeModal() {
            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
        }

        function confirmPlanChange() {
            const node = getNode();
            node.plan = null;
            closeModal();
            renderDrawer();
        }

        function showToast(message) {
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.classList.remove('translate-y-4', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            toastTimer = setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 1800);
        }

        function clampZoom(value) {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue)) return state.zoom;
            return Math.min(4, Math.max(0.1, numericValue));
        }

        function getCanvasViewportPoint(clientX, clientY, fallbackX = canvasScroll.clientWidth / 2, fallbackY = canvasScroll.clientHeight / 2) {
            const rect = canvasScroll.getBoundingClientRect();
            const viewportX = Number(clientX) - rect.left;
            const viewportY = Number(clientY) - rect.top;
            const valid = Number.isFinite(viewportX)
                && Number.isFinite(viewportY)
                && viewportX >= 0
                && viewportX <= canvasScroll.clientWidth
                && viewportY >= 0
                && viewportY <= canvasScroll.clientHeight;
            return valid
                ? { x: viewportX, y: viewportY }
                : { x: fallbackX, y: fallbackY };
        }

        function zoomScrollTarget(zoom, viewportX, viewportY, focusX, focusY) {
            const layout = getCanvasStageLayout(zoom);
            return {
                left: Math.min(layout.maxLeft, Math.max(0, layout.gutterX + focusX * zoom - viewportX)),
                top: Math.min(layout.maxTop, Math.max(0, layout.gutterY + focusY * zoom - viewportY))
            };
        }

        function applyZoomAtPoint(value, viewportX, viewportY, focusX, focusY) {
            const nextZoom = clampZoom(value);
            const target = zoomScrollTarget(nextZoom, viewportX, viewportY, focusX, focusY);
            applyCanvasZoom(nextZoom);
            canvasScroll.scrollLeft = target.left;
            canvasScroll.scrollTop = target.top;
        }

        function setZoom(value, clientX, clientY, closeMenu = true) {
            cancelCameraAnimation();
            const point = getCanvasViewportPoint(clientX, clientY);
            const layout = getCanvasStageLayout(state.zoom);
            const focusX = (canvasScroll.scrollLeft + point.x - layout.gutterX) / state.zoom;
            const focusY = (canvasScroll.scrollTop + point.y - layout.gutterY) / state.zoom;
            if (closeMenu) closeZoomMenu();
            applyZoomAtPoint(value, point.x, point.y, focusX, focusY);
        }

        function animateCanvasZoomTo(value, closeMenu = true) {
            const targetZoom = clampZoom(value);
            if (closeMenu) closeZoomMenu();

            const goal = getGoal();
            if (goal?.nodes?.length) {
                animateCanvasToView(centeredGoalViewAtZoom(goal, targetZoom), stageRenderToken);
                return;
            }

            const layout = getCanvasStageLayout(state.zoom);
            const viewportX = layout.viewportWidth * 0.5;
            const viewportY = layout.viewportHeight * 0.5;
            const focusX = (canvasScroll.scrollLeft + viewportX - layout.gutterX) / state.zoom;
            const focusY = (canvasScroll.scrollTop + viewportY - layout.gutterY) / state.zoom;
            const target = zoomScrollTarget(targetZoom, viewportX, viewportY, focusX, focusY);
            animateCanvasToView({ zoom: targetZoom, ...target }, stageRenderToken);
        }

        function updateTouchPointer(event) {
            if (event.pointerType !== 'touch') return;
            activeTouchPointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
            if (activeTouchPointers.size < 2) return;

            const points = Array.from(activeTouchPointers.values());
            lastTouchCentroid = {
                clientX: points.reduce((sum, point) => sum + point.clientX, 0) / points.length,
                clientY: points.reduce((sum, point) => sum + point.clientY, 0) / points.length,
                timestamp: performance.now()
            };
        }

        function releaseTouchPointer(event) {
            if (event.pointerType !== 'touch') return;
            activeTouchPointers.delete(event.pointerId);
        }

        function getGestureClientPoint(event) {
            if (event.touches?.length >= 2) {
                const touches = Array.from(event.touches);
                return {
                    clientX: touches.reduce((sum, touch) => sum + touch.clientX, 0) / touches.length,
                    clientY: touches.reduce((sum, touch) => sum + touch.clientY, 0) / touches.length
                };
            }

            if (activeTouchPointers.size >= 2) {
                const points = Array.from(activeTouchPointers.values());
                return {
                    clientX: points.reduce((sum, point) => sum + point.clientX, 0) / points.length,
                    clientY: points.reduce((sum, point) => sum + point.clientY, 0) / points.length
                };
            }

            if (lastTouchCentroid && performance.now() - lastTouchCentroid.timestamp < 1000) {
                return lastTouchCentroid;
            }

            return { clientX: event.clientX, clientY: event.clientY };
        }

        function startMousePan(event) {
            if (event.pointerType !== 'mouse' || event.button !== 0) return;
            suppressMouseClick = false;
            mousePanState = {
                pointerId: event.pointerId,
                startX: event.clientX,
                startY: event.clientY,
                startLeft: canvasScroll.scrollLeft,
                startTop: canvasScroll.scrollTop,
                dragging: false
            };
        }

        function moveMousePan(event) {
            if (!mousePanState || event.pointerId !== mousePanState.pointerId) return;
            if ((event.buttons & 1) === 0) {
                finishMousePan(event, true);
                return;
            }

            const deltaX = event.clientX - mousePanState.startX;
            const deltaY = event.clientY - mousePanState.startY;
            if (!mousePanState.dragging) {
                if (Math.hypot(deltaX, deltaY) < 4) return;
                mousePanState.dragging = true;
                canvasScroll.classList.add('is-mouse-panning');
                if (!canvasScroll.hasPointerCapture(event.pointerId)) {
                    canvasScroll.setPointerCapture(event.pointerId);
                }
            }

            event.preventDefault();
            canvasScroll.scrollLeft = mousePanState.startLeft - deltaX;
            canvasScroll.scrollTop = mousePanState.startTop - deltaY;
        }

        function finishMousePan(event, cancelled = false) {
            if (!mousePanState || event.pointerId !== mousePanState.pointerId) return;
            const wasDragging = mousePanState.dragging;
            if (canvasScroll.hasPointerCapture(event.pointerId)) {
                canvasScroll.releasePointerCapture(event.pointerId);
            }
            canvasScroll.classList.remove('is-mouse-panning');
            mousePanState = null;

            if (wasDragging && !cancelled) {
                suppressMouseClick = true;
                setTimeout(() => {
                    suppressMouseClick = false;
                }, 0);
            }
        }

        function handleCanvasWheel(event) {
            event.preventDefault();
            const unit = event.deltaMode === 1 ? 0.035 : event.deltaMode === 2 ? 0.45 : 0.0015;
            const nextZoom = state.zoom * Math.exp(-event.deltaY * unit);
            setZoom(nextZoom, event.clientX, event.clientY, false);
        }

        function fitContent() {
            closeZoomMenu();
            animateCanvasToGoalFit(getGoal(), stageRenderToken);
        }

        function renderZoomOptions() {
            const values = [0.1, 0.25, 0.5, 0.75, 1, 2, 4];
            zoomOptions.innerHTML = values.map(value => `
                <button type="button" data-zoom="${value}" role="menuitem" class="zoom-option flex min-h-11 w-full items-center justify-between rounded-xl px-3 text-left font-mono text-[14px] font-semibold text-slate-700 transition hover:bg-slate-50 active:scale-95">
                    ${Math.round(value * 100)}%
                    ${value === state.zoom ? '<i class="ph-bold ph-check text-brand" aria-hidden="true"></i>' : ''}
                </button>
            `).join('');
        }

        function toggleZoomMenu() {
            state.zoomOpen = !state.zoomOpen;
            renderZoomOptions();
            zoomMenu.classList.toggle('is-open', state.zoomOpen);
            zoomMenu.setAttribute('aria-hidden', String(!state.zoomOpen));
            zoomTrigger.setAttribute('aria-expanded', String(state.zoomOpen));
        }

        function closeZoomMenu() {
            state.zoomOpen = false;
            zoomMenu.classList.remove('is-open');
            zoomMenu.setAttribute('aria-hidden', 'true');
            zoomTrigger.setAttribute('aria-expanded', 'false');
            renderZoomOptions();
        }

        goalList.addEventListener('click', event => {
            const target = event.target instanceof Element ? event.target : null;
            if (!target) return;

            const groupToggle = target.closest('[data-group-toggle]');
            if (groupToggle && goalList.contains(groupToggle)) {
                toggleGoalGroup(groupToggle);
                return;
            }

            const button = target.closest('.goal-button');
            if (button && goalList.contains(button)) selectGoal(button.dataset.goalId);
        });

        drawerContent.addEventListener('click', event => {
            const target = event.target instanceof Element ? event.target : null;
            if (!target) return;

            const planButton = target.closest('.plan-button');
            if (planButton && drawerContent.contains(planButton)) {
                choosePlan(planButton.dataset.planId);
                return;
            }

            const modeButton = target.closest('.mode-button');
            if (modeButton && drawerContent.contains(modeButton)) {
                startModeTraining(modeButton);
                return;
            }

            const changeButton = target.closest('#change-plan');
            if (changeButton && drawerContent.contains(changeButton)) openModal();
        });

        zoomOptions.addEventListener('click', event => {
            const button = event.target instanceof Element ? event.target.closest('.zoom-option') : null;
            if (button && zoomOptions.contains(button)) animateCanvasZoomTo(Number(button.dataset.zoom));
        });

        document.getElementById('close-drawer').addEventListener('click', closeDrawer);
        document.getElementById('cancel-change').addEventListener('click', closeModal);
        document.getElementById('confirm-change').addEventListener('click', confirmPlanChange);
        document.getElementById('zoom-trigger').addEventListener('click', toggleZoomMenu);
        document.getElementById('fit-content').addEventListener('click', fitContent);
        canvasScroll.addEventListener('pointerdown', event => {
            cancelCameraAnimation();
            updateTouchPointer(event);
            startMousePan(event);
        }, { passive: true });
        canvasScroll.addEventListener('pointermove', event => {
            updateTouchPointer(event);
            moveMousePan(event);
        }, { passive: false });
        canvasScroll.addEventListener('pointerup', event => {
            releaseTouchPointer(event);
            finishMousePan(event);
        }, { passive: true });
        canvasScroll.addEventListener('pointercancel', event => {
            releaseTouchPointer(event);
            finishMousePan(event, true);
        }, { passive: true });
        canvasScroll.addEventListener('click', event => {
            if (!suppressMouseClick) return;
            suppressMouseClick = false;
            event.preventDefault();
            event.stopPropagation();
        }, true);
        canvasScroll.addEventListener('wheel', handleCanvasWheel, { passive: false });
        canvasScroll.addEventListener('gesturestart', event => {
            cancelCameraAnimation();
            gestureStartZoom = state.zoom;
            const clientPoint = getGestureClientPoint(event);
            const viewportPoint = getCanvasViewportPoint(clientPoint.clientX, clientPoint.clientY);
            gestureViewportX = viewportPoint.x;
            gestureViewportY = viewportPoint.y;
            const layout = getCanvasStageLayout(gestureStartZoom);
            gestureFocusX = (canvasScroll.scrollLeft + gestureViewportX - layout.gutterX) / gestureStartZoom;
            gestureFocusY = (canvasScroll.scrollTop + gestureViewportY - layout.gutterY) / gestureStartZoom;
            event.preventDefault();
        }, { passive: false });
        canvasScroll.addEventListener('gesturechange', event => {
            event.preventDefault();
            const clientPoint = getGestureClientPoint(event);
            const viewportPoint = getCanvasViewportPoint(
                clientPoint.clientX,
                clientPoint.clientY,
                gestureViewportX,
                gestureViewportY
            );
            gestureViewportX = viewportPoint.x;
            gestureViewportY = viewportPoint.y;
            applyZoomAtPoint(
                gestureStartZoom * event.scale,
                gestureViewportX,
                gestureViewportY,
                gestureFocusX,
                gestureFocusY
            );
        }, { passive: false });
        canvasScroll.addEventListener('gestureend', event => {
            event.preventDefault();
            renderZoomOptions();
            lastTouchCentroid = null;
        }, { passive: false });
        document.getElementById('back-button').addEventListener('click', () => {
            if (history.length > 1) history.back();
            else showToast('当前已是能力模型首页');
        });

        if ('ResizeObserver' in window) {
            const canvasResizeObserver = new ResizeObserver(syncCanvasViewportGeometry);
            canvasResizeObserver.observe(canvasScroll);
        } else {
            window.addEventListener('resize', syncCanvasViewportGeometry, { passive: true });
        }

        groups.forEach(group => {
            group.goals.forEach(goal => {
                unlockEligibleNodes(goal);
            });
        });

        syncCanvasViewportGeometry();
        renderGoals();
        renderStage(true);
        renderDrawer();
        renderZoomOptions();
        requestAnimationFrame(() => {
            const goal = getGoal();
            if (goal && getGoalStats(goal).tone === 'mastered') animateCanvasToGoalFit(goal, stageRenderToken, true);
            else animateCanvasToNode(getGoalFocusNode(goal), stageRenderToken, true);
        });
    </script>
</body>
</html>
