                renderClassModule();
                classModuleScroll.scrollTop = 0;
                focusAfterViewChange(() => classModuleRoot.querySelector('[data-action="open-class-dorm-floor"]') || classModuleBackButton);
            }
            if (action === 'open-class-dorm-floor') {
                state.classDormPickerFloor = button.dataset.classDormFloor || '';
                state.classDormPickerLevel = 'rooms';
                renderClassModule();
                classModuleScroll.scrollTop = 0;
                focusAfterViewChange(() => classModuleRoot.querySelector('[data-action="choose-class-dorm-room"]') || classModuleBackButton);
            }
            if (action === 'choose-class-dorm-room') {
                const sourceRoom = getAllDormRooms().find(room => room.id === button.dataset.roomId);
                if (!sourceRoom) return;
                const existingRoom = classDormitorySeed.find(room => room.sourceRoomId === sourceRoom.id || (room.building === sourceRoom.building && room.roomNo === sourceRoom.roomNo));
                if (existingRoom) {
                    state.classDormRoomId = existingRoom.id;
                    state.classDormView = 'overview';
                    renderClassModule();
                    classModuleScroll.scrollTop = 0;
                    focusAfterViewChange(() => classModuleRoot.querySelector(`[data-class-dorm-room-id="${existingRoom.id}"]`) || classModuleBackButton);
                    showToast(`${sourceRoom.building}${sourceRoom.roomNo}室已在本班宿舍中`);
                    return;
                }
                const classNames = new Set(ensureClassRoster(getSelectedClass()).map(item => item.name));
                const residents = sourceRoom.beds.filter(bed => bed.occupied && bed.studentName).map((bed, index) => {
                    const mine = classNames.has(bed.studentName);
                    return { name: bed.studentName, mine, className: mine ? getClassRecordClassName() : '其他班级', bed: Number(bed.number) || index + 1 };
                });
                const roomId = `v793-dorm-${String(sourceRoom.id).replace(/[^a-zA-Z0-9-]/g, '-')}`;
                classDormitorySeed.push({ id: roomId, sourceRoomId: sourceRoom.id, building: sourceRoom.building, roomNo: sourceRoom.roomNo, capacity: sourceRoom.beds.length, residents });
                state.classDormRoomId = roomId;
                state.classDormView = 'overview';
                renderClassModule();
                classModuleScroll.scrollTop = 0;
                focusAfterViewChange(() => classModuleRoot.querySelector(`[data-class-dorm-room-id="${roomId}"]`) || classModuleBackButton);
                showToast(`已选择${sourceRoom.building}${sourceRoom.roomNo}室`);
            }
            if (action === 'open-class-dorm-room') {
                state.classDormRoomId = button.dataset.classDormRoomId || classDormitorySeed[0].id;
                state.classDormView = 'detail';
                state.classDormDetailTab = 'register';
                state.dormViolationDraft = [];
                state.dormViolationPhotoName = '';
                state.dormViolationFilter = '全部违纪';
                state.dormViolationDraftFilter = '全部违纪';
                renderClassModule();
                classModuleScroll.scrollTop = 0;
                focusAfterViewChange(classModuleBackButton);
            }
            if (action === 'set-class-dorm-detail-tab') {
                state.classDormDetailTab = button.dataset.classDormDetailTab === 'records' ? 'records' : 'register';
                renderClassModule();
                classModuleScroll.scrollTop = 0;
                requestAnimationFrame(() => classModuleRoot.querySelector(`[data-class-dorm-detail-tab="${state.classDormDetailTab}"]`)?.focus({ preventScroll: true }));
            }
            if (action === 'add-dorm-violation-item') openDormViolationItemDialog('bed', button.dataset.dormBed || '', button.dataset.dormStudent || '');
            if (action === 'add-dorm-whole-room-violation') openDormViolationItemDialog('room');
            if (action === 'trigger-dorm-violation-photo') document.getElementById('dormViolationPhotoInput')?.click();
            if (action === 'submit-dorm-violations') submitDormViolationDraft();
            if (action === 'apply-dorm-violation-filter') {
                state.dormViolationDraftFilter = document.getElementById('dormViolationFilter')?.value || '全部违纪';
                state.dormViolationFilter = state.dormViolationDraftFilter;
                renderClassModule();
                requestAnimationFrame(() => document.getElementById('dormViolationFilter')?.focus({ preventScroll: true }));
            }
            if (action === 'set-class-discipline-tab') {
                state.classDisciplineTab = button.dataset.classDisciplineTab === 'processed' ? 'processed' : 'pending';
                renderClassModule();
                classModuleScroll.scrollTop = 0;
                requestAnimationFrame(() => classModuleRoot.querySelector(`[data-class-discipline-tab="${state.classDisciplineTab}"]`)?.focus());
            }
            if (action === 'open-class-assessment-week') {
                state.classAssessmentWeek = Number(button.dataset.assessmentWeek) || 10;
                state.classAssessmentCategory = 'all';
                state.classAssessmentQuery = '';
                state.classAssessmentDraftCategory = 'all';
                state.classAssessmentDraftQuery = '';
                renderClassModule();
                classModuleScroll.scrollTop = 0;
                focusAfterViewChange(classModuleBackButton);
            }
            if (action === 'apply-class-assessment-filter') {
                state.classAssessmentDraftCategory = document.getElementById('classAssessmentCategory')?.value || 'all';
                state.classAssessmentDraftQuery = document.getElementById('classAssessmentSearch')?.value.trim() || '';
                state.classAssessmentCategory = state.classAssessmentDraftCategory;
                state.classAssessmentQuery = state.classAssessmentDraftQuery;
                renderClassModule();
                requestAnimationFrame(() => document.getElementById('classAssessmentSearch')?.focus());
            }
            if (action === 'open-class-discipline-detail') openClassDisciplineDetail(button.dataset.classDisciplineId, button.dataset.classDisciplineOrigin || 'class-discipline');
            if (action === 'set-student-realtime-status') setStudentRealtimeStatus(button.dataset.realtimeStatus);
            if (action === 'confirm-student-academic-status') confirmStudentAcademicStatus();
        });

        appDevice.addEventListener('change', event => {
            const scheduleDay = event.target.closest('[data-schedule-day]');
            if (scheduleDay) {
                const dayId = String(scheduleDay.dataset.scheduleDay || '');
                const selected = new Set((state.classScheduleSelectedDays || []).map(String));
                if (scheduleDay.checked) selected.add(dayId);
                else selected.delete(dayId);
                if (!selected.size) {
                    scheduleDay.checked = true;
                    showToast('至少保留一天课表');
                    return;
                }
                state.classScheduleSelectedDays = classScheduleDays.filter(day => selected.has(day.id)).map(day => day.id);
                renderClassModule();
                requestAnimationFrame(() => classModuleRoot.querySelector(`[data-schedule-day="${dayId}"]`)?.focus({ preventScroll: true }));
                return;
            }
            if (event.target.id !== 'studentAcademicStatusSelect') return;
            state.pendingAcademicStatus = event.target.value;
            const confirm = attendanceRoot.querySelector('[data-action="confirm-student-academic-status"]');
            if (confirm) confirm.disabled = state.pendingAcademicStatus === currentData().studentStatus;
        });

        appDevice.addEventListener('change', event => {
            if (event.target.id === 'dormViolationItemSelect') {
                const selected = dormViolationItems[Number(event.target.value) || 0];
                const points = document.getElementById('dormViolationPoints');
                if (selected && points) points.value = selected.points;
            }
            if (event.target.id === 'dormViolationPhotoInput') {
                const file = event.target.files?.[0];
                if (!file) return;
                if (!String(file.type || '').startsWith('image/')) { showToast('请选择图片文件'); event.target.value = ''; return; }
                state.dormViolationPhotoName = file.name;
                renderClassModule();
                showToast('违纪图片已添加');
            }
        });

        appDevice.addEventListener('keydown', event => {
            if (event.key !== 'Enter' || event.target.id !== 'classAssessmentSearch') return;
            event.preventDefault();
            const confirm = classModuleRoot.querySelector('[data-action="apply-class-assessment-filter"]');
            if (confirm) confirm.click();
        });

        initializeClassFilter();
        renderSchoolHome();
        renderClassDirectory();
        renderStudentList();
        renderAll();
        const previewRoute = new URLSearchParams(window.location.search).get('preview');
        if (previewRoute) document.body.classList.add('qa-static');
        if (previewRoute === 'class-list') openClassList();
        else if (previewRoute === 'class-list-scrolled') { openClassList(); requestAnimationFrame(() => requestAnimationFrame(() => { classListScroll.scrollTop = 108; })); }
        else if (previewRoute === 'class-overview') openClassDetail('CLS2403');
        else if (previewRoute === 'class-management') { openClassDetail('CLS2403'); switchClassTab('management'); }
        else if (previewRoute === 'class-info') { openClassDetail('CLS2403'); switchClassTab('info'); }
        else if (previewRoute === 'student-add') { openClassDetail('CLS2403'); switchClassTab('info'); openClassModule('student-add', 'info'); }
        else if (previewRoute === 'class-schedule') { openClassDetail('CLS2403'); openClassModule('class-schedule'); }
        else if (previewRoute === 'class-schedule-v2') { openClassDetail('CLS2403'); openClassModule('class-schedule-v2'); }
        else if (previewRoute === 'class-repair') { openClassDetail('CLS2403'); openClassModule('class-repair'); }
        else if (previewRoute === 'class-repair-processing') { openClassDetail('CLS2403'); openClassModule('class-repair'); state.repairStatusFilter = '处理中'; renderClassModule(); }
        else if (previewRoute === 'class-discipline') { openClassDetail('CLS2403'); openClassModule('class-discipline'); }
        else if (previewRoute === 'class-discipline-processed') { openClassDetail('CLS2403'); openClassModule('class-discipline'); state.classDisciplineTab = 'processed'; renderClassModule(); }
        else if (previewRoute === 'class-discipline-detail') { openClassDetail('CLS2403'); openClassModule('class-discipline'); openClassDisciplineDetail('class-discipline-6401', 'class-discipline'); }
        else if (previewRoute === 'class-assessment') { openClassDetail('CLS2403'); openClassModule('class-assessment'); }
        else if (previewRoute === 'class-assessment-week') { openClassDetail('CLS2403'); openClassModule('class-assessment'); state.classAssessmentWeek = 10; renderClassModule(); }
        else if (previewRoute === 'class-assessment-detail') { openClassDetail('CLS2403'); openClassModule('class-assessment'); state.classAssessmentWeek = 10; renderClassModule(); openClassDisciplineDetail('class-discipline-6402', 'class-assessment'); }
        else if (previewRoute === 'student-ranking') { openClassDetail('CLS2403'); openClassModule('student-ranking'); }
        else if (previewRoute === 'return-stats') { openClassDetail('CLS2403'); openClassModule('return-stats'); }
        else if (previewRoute === 'home-stats') { openClassDetail('CLS2403'); openClassModule('home-stats'); }
        else if (previewRoute === 'student-comments') { openClassDetail('CLS2403'); openClassModule('student-comments'); }
        else if (previewRoute === 'student-comment-detail') { openClassDetail('CLS2403'); openClassModule('student-comments'); state.selectedCommentStudentId = 'comment-01'; renderClassModule(); }
        else if (previewRoute === 'class-dorm') { openClassDetail('CLS2403'); openClassModule('dorm'); }
        else if (previewRoute === 'class-dorm-detail') { openClassDetail('CLS2403'); openClassModule('dorm'); state.classDormView = 'detail'; state.classDormRoomId = 'v791-dorm-01'; renderClassModule(); }
        else if (previewRoute === 'class-dorm-records') { openClassDetail('CLS2403'); openClassModule('dorm'); state.classDormView = 'detail'; state.classDormRoomId = 'v791-dorm-01'; state.classDormDetailTab = 'records'; renderClassModule(); }
        else if (previewRoute === 'students') openStudentList();
        else if (previewRoute === 'student-following') { openStudentList(); setStudentDirectoryMode('following'); }
        else if (previewRoute === 'school-dorm') openSchoolModule('school-dorm');
        else if (previewRoute === 'dorm-stats') openSchoolModule('school-dorm-stats');
        else if (previewRoute === 'dorm-stats-class') { openSchoolModule('school-dorm-stats'); state.dormStatsTab = 'class'; renderClassModule(); }
        else if (previewRoute === 'discipline-setup') openSchoolModule('discipline-setup');
        else if (previewRoute === 'add-student') openStudentList();
        else if (previewRoute === 'student-detail') { openStudentList(); openStudentDetail(students[0].id); }
        else if (previewRoute === 'student-home-school') { openStudentList(); openStudentDetail(students[0].id); openHomeSchoolCallSheet(); }
        else if (previewRoute === 'student-status') { openStudentList(); openStudentDetail(students[0].id); openStudentAttendance(); }
        else if (previewRoute === 'student-grades') { openStudentList(); openStudentDetail(students[0].id); switchTab('grades'); }
        else if (previewRoute === 'student-materials') { openStudentList(); openStudentDetail(students[0].id); switchTab('materials'); }
        else if (previewRoute === 'student-attendance') { openStudentList(); openStudentDetail(students[0].id); openStudentAttendance(); }
        else if (previewRoute === 'student-attendance-edit') { openStudentList(); openStudentDetail(students[0].id); openStudentAttendance(); }
        else if (previewRoute === 'student-edit') { openStudentList(); openStudentDetail(students[0].id); enterEdit(); switchTab('archive'); }
        else if (previewRoute === 'student-edit-phone') { openStudentList(); openStudentDetail(students[0].id); enterEdit(); switchTab('family'); }
        else if (previewRoute === 'leave-detail') { openClassDetail('CLS2403'); openClassModule('leave'); openLeaveDetail('leave-1'); }
        else if (previewRoute === 'log-detail') { openClassDetail('CLS2403'); openClassModule('logs'); openLogDetail('log-1'); }
        else if (previewRoute === 'student-log-history') { openClassDetail('CLS2403'); openClassModule('logs'); const logStudent = ensureClassRoster(getSelectedClass()).find(item => item.name === '林知夏') || ensureClassRoster(getSelectedClass())[0]; openStudentLogHistory(logStudent.id); }
        else if (previewRoute === 'rollcall-history' || previewRoute === 'rollcall-record') { openClassDetail('CLS2403'); openClassModule('rollcall'); }
        else if (previewRoute === 'discipline-detail') { openClassDetail('CLS2403'); openClassModule('discipline'); openDisciplineDetail('discipline-1'); }
        else if (previewRoute === 'discipline-add') { openClassDetail('CLS2403'); openClassModule('discipline'); openDisciplineAddPage(); }
        else if (previewRoute === 'discipline-pending') { openClassDetail('CLS2403'); openClassModule('discipline'); state.disciplineListFilter = 'pending'; renderClassModule(); }
        else if (previewRoute === 'discipline-processed') { openClassDetail('CLS2403'); openClassModule('discipline'); state.disciplineListFilter = 'processed'; renderClassModule(); }
        else if (previewRoute === 'leave-filter') { openClassDetail('CLS2403'); openClassModule('leave'); classModuleScroll.scrollTop = 160; updateLeaveScrollTime(); }
        else if (previewRoute === 'dorm-occupied') { openClassDetail('CLS2403'); openClassModule('dorm'); const occupiedBed = classModuleRoot.querySelector('[data-action="open-occupied-bed-actions"]'); if (occupiedBed) openOccupiedBedActions(occupiedBed); }
        else if (['leave','rollcall','discipline','logs','dorm'].includes(previewRoute)) { openClassDetail('CLS2403'); openClassModule(previewRoute); }
        else setView('home');
        requestAnimationFrame(() => contentSurfaceScrollers.forEach(syncContentSurfaceBackground));
        if (previewRoute === 'dorm-picker') {
            openClassDetail('CLS2403');
            openClassModule('dorm');
            const arrangeButton = classModuleRoot.querySelector('[data-action="open-dorm-picker"]');
            if (arrangeButton) openDormPicker(arrangeButton);
        }
        if (previewRoute === 'dorm-assigned') {
            openClassDetail('CLS2403');
            openClassModule('dorm');
            const arrangeButton = classModuleRoot.querySelector('[data-action="open-dorm-picker"]');
            if (arrangeButton) {
                openDormPicker(arrangeButton);
                const previewRoom = getDormRoom(state.pickerContext?.roomId);
                const previewBed = previewRoom?.beds.find(item => !item.occupied);
                if (previewBed) {
                    selectDormBed(previewBed.number);
                    confirmDormAssignment();
                }
            }
        }
        if (previewRoute === 'leave-reject') {
            openClassDetail('CLS2403');
            openClassModule('leave');
            const rejectButton = classModuleRoot.querySelector('[data-workflow-value="已驳回"]');
            if (rejectButton) openLeaveRejectDialog(rejectButton.dataset.workflowId, rejectButton);
        }
        if (previewRoute === 'leave-reject-submitted') {
            openClassDetail('CLS2403');
            openClassModule('leave');
            const rejectButton = classModuleRoot.querySelector('[data-workflow-value="已驳回"]');
            if (rejectButton) {
                openLeaveRejectDialog(rejectButton.dataset.workflowId, rejectButton);
                document.getElementById('leaveRejectReason').value = '外出时间与提交凭证不一致，请核实后重新提交。';
                state.dialogAction?.();
                closeDialog();
            }
        }
        if (previewRoute === 'class-info' && new URLSearchParams(window.location.search).get('call') === '1') {
            requestAnimationFrame(() => {
                const firstCallButton = classInfoPanel.querySelector('[data-call-phone]');
                if (firstCallButton) openCallSheet(firstCallButton);
            });
        }
        if (new URLSearchParams(window.location.search).get('metrics') === '1') {
            requestAnimationFrame(() => requestAnimationFrame(() => {
                const activeView = document.querySelector('.app-view.active');
                const activeScroller = activeView?.querySelector('main');
                document.body.setAttribute('data-qa-metrics', JSON.stringify({
                    deviceClient: document.getElementById('device').clientWidth,
                    deviceScroll: document.getElementById('device').scrollWidth,
                    viewClient: activeView?.clientWidth || 0,
                    viewScroll: activeView?.scrollWidth || 0,
                    scrollerClient: activeScroller?.clientWidth || 0,
                    scrollerScroll: activeScroller?.scrollWidth || 0
                }));
            }));
        }
    </script>
</body>
</html>
