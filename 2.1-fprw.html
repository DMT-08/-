                    <button type="button" class="class-indicator-row risk" data-class-module="dorm"><span class="class-indicator-dot"></span><span>班级还有 <b>${classInfo.indicatorDorm}</b> 人未安排宿舍或床位</span><svg aria-hidden="true" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    <button type="button" class="class-indicator-row risk" data-action="show-auth-pending"><span class="class-indicator-dot"></span><span>班级还有 <b>${classInfo.indicatorAuth}</b> 人未进行身份认证</span><svg aria-hidden="true" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    <button type="button" class="class-indicator-row complete" data-class-module="class-discipline"><span class="class-indicator-dot"></span><span>班级还有 <b>${classInfo.indicatorDiscipline}</b> 人未进行违纪处理</span><svg aria-hidden="true" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    <button type="button" class="class-indicator-row complete" data-class-module="logs"><span class="class-indicator-dot"></span><span>班级还有 <b>${classInfo.indicatorLogs}</b> 人日志未进行批阅</span><svg aria-hidden="true" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                </section>
                <div class="class-dashboard-opened" aria-label="开班日期"><span>开班日期</span><strong>${escapeHtml(classInfo.openedAt)}</strong></div>
            </section>${renderClassProfileMarkup(classInfo)}`;
        }

        function getStudentStatusMap(classInfo = getSelectedClass()) {
            ensureClassRoster(classInfo);
            if (!classWorkflowState.studentStatusByClass[classInfo.id]) classWorkflowState.studentStatusByClass[classInfo.id] = {};
            return classWorkflowState.studentStatusByClass[classInfo.id];
        }

        function getStudentStatusHandledSet(classInfo = getSelectedClass()) {
            const dayKey = `${classInfo.id}-${formatLocalDate()}`;
            if (!classWorkflowState.studentStatusHandledByDay[dayKey]) classWorkflowState.studentStatusHandledByDay[dayKey] = [];
            state.statusDayKey = dayKey;
            return new Set(classWorkflowState.studentStatusHandledByDay[dayKey]);
        }

        function getStudentMealSet(classInfo = getSelectedClass()) {
            const dayKey = `${classInfo.id}-${formatLocalDate()}`;
            if (!classWorkflowState.studentStatusMealByDay[dayKey]) classWorkflowState.studentStatusMealByDay[dayKey] = [];
            return new Set(classWorkflowState.studentStatusMealByDay[dayKey]);
        }

        function saveStudentMealSet(mealSet, classInfo = getSelectedClass()) {
            const dayKey = `${classInfo.id}-${formatLocalDate()}`;
            classWorkflowState.studentStatusMealByDay[dayKey] = [...mealSet];
        }

        function initializeStudentStatusDay() {
            const classInfo = getSelectedClass();
            const roster = ensureClassRoster(classInfo);
            const statusMap = getStudentStatusMap(classInfo);
            const handled = getStudentStatusHandledSet(classInfo);
            roster.forEach(item => {
                if (!['在校','请假'].includes(statusMap[item.id])) statusMap[item.id] = '在校';
                handled.add(item.id);
            });
            classWorkflowState.studentStatusHandledByDay[`${classInfo.id}-${formatLocalDate()}`] = [...handled];
            getStudentMealSet();
        }

        function markStudentStatusHandled(studentId, classInfo = getSelectedClass()) {
            const dayKey = `${classInfo.id}-${formatLocalDate()}`;
            const handled = getStudentStatusHandledSet(classInfo);
            handled.add(studentId);
            classWorkflowState.studentStatusHandledByDay[dayKey] = [...handled];
        }

        function getStudentStatusCounts(classInfo = getSelectedClass()) {
            const roster = ensureClassRoster(classInfo);
            const statusMap = getStudentStatusMap(classInfo);
            const handled = getStudentStatusHandledSet(classInfo);
            const mealSet = getStudentMealSet(classInfo);
            return roster.reduce((counts, item) => {
                const isHandled = handled.has(item.id);
                const primaryStatus = isHandled && ['在校','请假'].includes(statusMap[item.id]) ? statusMap[item.id] : '';
                if (primaryStatus) counts[primaryStatus] += 1;
                if (mealSet.has(item.id)) counts['就餐'] += 1;
                if (isHandled && primaryStatus) counts.handled += 1;
                else counts.unhandled += 1;
                return counts;
            }, { '在校': 0, '请假': 0, '就餐': 0, handled: 0, unhandled: 0, total: roster.length });
        }

        function studentStatusTone(status) {
            if (!rollcallStatuses.includes(status)) return 'unset';
            return status === '请假' ? 'leave' : (status === '就餐' ? 'meal' : 'school');
        }

        function renderStudentLiveSummary(classInfo = getSelectedClass()) {
            initializeStudentStatusDay();
            const counts = getStudentStatusCounts(classInfo);
            return `<section class="student-roster-board" aria-label="${escapeHtml(getClassDisplayName(classInfo))}班级概况">
                <div class="student-roster-board-head">
                    <span class="student-roster-board-title"><strong>班级概况</strong></span>
                    <button type="button" class="student-live-manage" data-open-live-status data-status-filter="all">实时点名<svg aria-hidden="true" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                </div>
                <div class="student-roster-demographics" aria-label="班级人数构成">
                    <span class="student-roster-demographic"><strong>${classInfo.total}</strong><span>全班</span></span>
                    <span class="student-roster-demographic male"><strong>${classInfo.male}</strong><span>男生</span></span>
                    <span class="student-roster-demographic female"><strong>${classInfo.female}</strong><span>女生</span></span>
                </div>
                <div class="student-roster-statuses" aria-label="${escapeHtml(formatLocalDate())}学生实时状态">
                    <button type="button" class="student-roster-status school" data-open-live-status data-status-filter="在校"><strong>${counts['在校']}</strong><span>在校</span></button>
                    <button type="button" class="student-roster-status leave" data-open-live-status data-status-filter="请假"><strong>${counts['请假']}</strong><span>请假</span></button>
                    <button type="button" class="student-roster-status meal" data-open-live-status data-status-filter="就餐"><strong>${counts['就餐']}</strong><span>就餐</span></button>
                </div>
            </section>`;
        }

        function renderClassInfo() {
            const classInfo = getSelectedClass();
            const roster = ensureClassRoster(classInfo);
            const statusMap = getStudentStatusMap(classInfo);
            const handled = getStudentStatusHandledSet(classInfo);
            const mealSet = getStudentMealSet(classInfo);
            const filteredRoster = state.classStudentFilter === 'auth' ? roster.filter(item => !item.authenticated) : roster;
            classInfoPanel.innerHTML = `${renderStudentLiveSummary(classInfo)}
                <div class="class-section-head" id="classStudentSection"><h2 id="classRosterTitle">${state.classStudentFilter === 'auth' ? '未认证学生' : '学生列表'}（${filteredRoster.length}）</h2><button type="button" class="class-section-action" data-class-module="student-add" aria-label="添加未选班级学生"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>添加</button></div>
                ${state.classStudentFilter === 'auth' ? '<div class="class-filter-notice"><span>当前仅显示未完成身份认证的学生</span><button type="button" data-action="clear-class-student-filter">查看全部</button></div>' : ''}
                <div class="class-roster-search" role="search">${rosterSearchMarkup({ id: 'classRosterSearch', value: state.classStudentSearch, placeholder: '搜索本班学生姓名', clearAction: 'clear-class-roster-search', label: '搜索本班学生姓名', controls: 'classStudentList', describedBy: 'classRosterResultStatus' })}<span class="sr-only" id="classRosterResultStatus" role="status" aria-live="polite"></span></div>
                <div class="class-student-list" id="classStudentList">${filteredRoster.map(item => {
                    const status = handled.has(item.id) && ['在校','请假'].includes(statusMap[item.id]) ? statusMap[item.id] : '';
                    const statusLabel = [status, mealSet.has(item.id) ? '就餐' : ''].filter(Boolean).join('、') || '未设置';
                    return `<button type="button" class="class-student-row${item.authenticated ? '' : ' has-pending'}" data-student-id="${escapeHtml(item.id)}" data-roster-search="${escapeHtml(item.name.toLowerCase())}" aria-label="${escapeHtml(item.name)}，今日状态${statusLabel}，查看学生详情">
                        <span class="student-avatar ${studentGenderClass(item.gender)}">${studentAvatarMarkup(item)}</span>
                        <span class="class-student-copy"><span class="class-student-name">${escapeHtml(item.name)}</span></span>
                        ${item.authenticated ? '' : pendingBadgeMarkup(1)}
                    </button>`;
                }).join('')}<div class="roster-empty" id="classRosterEmpty" role="status" hidden>没有找到匹配的本班学生</div></div>`;
            updateClassRosterSearchResults();
        }

        function updateClassRosterSearchResults() {
            const query = state.classStudentSearch.trim().toLowerCase();
            const rows = Array.from(classInfoPanel.querySelectorAll('.class-student-row'));
            let visible = 0;
            rows.forEach(row => {
                const matched = !query || String(row.dataset.rosterSearch || '').includes(query);
                row.hidden = !matched;
                if (matched) visible += 1;
            });
            const title = document.getElementById('classRosterTitle');
            const label = state.classStudentFilter === 'auth' ? '未认证学生' : '学生列表';
            if (title) title.textContent = `${label}（${query ? `${visible}/${rows.length}` : rows.length}）`;
            const clear = classInfoPanel.querySelector('.roster-search-clear');
            if (clear) clear.classList.toggle('visible', Boolean(state.classStudentSearch));
            const empty = document.getElementById('classRosterEmpty');
            if (empty) empty.hidden = visible > 0;
            const resultStatus = document.getElementById('classRosterResultStatus');
            if (resultStatus) resultStatus.textContent = query ? `找到 ${visible} 名学生，共 ${rows.length} 名` : `共 ${rows.length} 名学生`;
        }

        function getFilteredRollcallRoster() {
            const roster = ensureClassRoster(getSelectedClass());
            const statusMap = getStudentStatusMap();
            const handled = getStudentStatusHandledSet();
            const mealSet = getStudentMealSet();
            const query = state.rollcallSearch.trim().toLowerCase();
            return roster.filter(item => {
                const isHandled = handled.has(item.id) && ['在校','请假'].includes(statusMap[item.id]);
                const primaryStatus = isHandled ? statusMap[item.id] : '';
                const matchesSearch = !query || String(item.name || '').toLowerCase().includes(query);
                const matchesPrimary = state.rollcallPrimaryFilter === 'all' || state.rollcallPrimaryFilter === primaryStatus;
                const matchesMeal = !state.rollcallMealFilter || mealSet.has(item.id);
                return matchesSearch && matchesPrimary && matchesMeal;
            });
        }

        function renderStatusManagerHero() {
            const counts = getStudentStatusCounts();
            return `<section class="status-manager-hero" id="statusManagerHero" aria-label="学生实时状态统计">
                <div class="status-manager-head"><span><strong>${escapeHtml(getClassDisplayName(getSelectedClass()))}</strong></span><em>${counts.handled}/${counts.total} 已处理</em></div>
                <div class="status-manager-metrics" aria-label="点击看板筛选学生">
                    <button type="button" class="status-manager-metric school${state.rollcallPrimaryFilter === '在校' ? ' active' : ''}" data-action="set-live-status-filter" data-live-filter="在校" aria-pressed="${state.rollcallPrimaryFilter === '在校' ? 'true' : 'false'}"><strong>${counts['在校']}</strong><span>在校</span></button>
                    <button type="button" class="status-manager-metric leave${state.rollcallPrimaryFilter === '请假' ? ' active' : ''}" data-action="set-live-status-filter" data-live-filter="请假" aria-pressed="${state.rollcallPrimaryFilter === '请假' ? 'true' : 'false'}"><strong>${counts['请假']}</strong><span>请假</span></button>
                    <button type="button" class="status-manager-metric meal${state.rollcallMealFilter ? ' active' : ''}" data-action="set-live-status-filter" data-live-filter="就餐" aria-pressed="${state.rollcallMealFilter ? 'true' : 'false'}"><strong>${counts['就餐']}</strong><span>就餐</span></button>
                </div>
            </section>`;
        }

        function renderRollcallListMarkup() {
            const roster = getFilteredRollcallRoster();
            const fullRoster = ensureClassRoster(getSelectedClass());
            const sequenceById = new Map(fullRoster.map((item, index) => [item.id, index + 1]));
            const statusMap = getStudentStatusMap();
            const handled = getStudentStatusHandledSet();
            const mealSet = getStudentMealSet();
            if (!roster.length) return '<div class="todo-empty">没有符合当前搜索或筛选条件的学生</div>';
            return roster.map(item => {
                const isHandled = handled.has(item.id) && ['在校','请假'].includes(statusMap[item.id]);
                const primaryStatus = isHandled ? statusMap[item.id] : '';
                const hasMeal = mealSet.has(item.id);
                const sequence = sequenceById.get(item.id) || 0;
                const statusLabel = [primaryStatus, hasMeal ? '就餐' : ''].filter(Boolean).join('、') || '状态未处理';
                return `<article class="live-status-card status-${studentStatusTone(primaryStatus)}${isHandled ? ' is-handled' : ''}" data-live-status-id="${escapeHtml(item.id)}" aria-label="${String(sequence).padStart(2,'0')}号${escapeHtml(item.name)}，${escapeHtml(statusLabel)}">
                    <div class="live-status-card-head"><span class="status-sequence" aria-hidden="true">${String(sequence).padStart(2,'0')}</span><strong class="compact-status-name">${escapeHtml(item.name)}</strong></div>
                    <div class="live-status-actions" aria-label="设置${escapeHtml(item.name)}当前状态">${rollcallStatuses.map(option => {
                        const active = option === '就餐' ? hasMeal : primaryStatus === option;
                        const indicator = option === '就餐'
                            ? '<svg viewBox="0 0 24 24"><polyline points="5 12 10 17 19 7"></polyline></svg>'
                            : '<i class="status-radio-dot"></i>';
                        return `<button type="button" class="live-status-action ${studentStatusTone(option)}${option === '就餐' ? ' meal' : ''}${active ? ' active' : ''}" data-workflow="rollcall" data-workflow-id="${escapeHtml(item.id)}" data-workflow-value="${option}" aria-label="${active ? '取消' : '选择'}${escapeHtml(item.name)}${option}" aria-pressed="${active ? 'true' : 'false'}"><span class="status-checkbox" aria-hidden="true">${indicator}</span></button>`;
                    }).join('')}</div>
                </article>`;
            }).join('');
        }

        function renderRollcallModule() {
            initializeStudentStatusDay();
            return `${renderStatusManagerHero()}<section class="status-toolbar" aria-label="搜索实时点名名单">
                <div class="rollcall-search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="rollcallSearch" type="search" value="${escapeHtml(state.rollcallSearch)}" placeholder="搜索本班学生姓名" autocomplete="off" aria-label="搜索学生姓名"></div>
            </section><section class="status-roster-surface" aria-label="实时点名名单"><div class="status-column-head"><span id="rollcallCount">学生（${getFilteredRollcallRoster().length}）</span><span>在校</span><span>请假</span><span>就餐</span></div><div class="live-status-list" id="liveStatusList">${renderRollcallListMarkup()}</div></section>`;
        }

        function updateRollcallList() {
            const list = document.getElementById('liveStatusList');
            const count = document.getElementById('rollcallCount');
            const hero = document.getElementById('statusManagerHero');
            if (list) list.innerHTML = renderRollcallListMarkup();
            if (count) count.textContent = `学生（${getFilteredRollcallRoster().length}）`;
            if (hero) hero.outerHTML = renderStatusManagerHero();
        }

        function toggleLiveStatusFilter(filter) {
            if (filter === '就餐') {
                state.rollcallMealFilter = !state.rollcallMealFilter;
            } else if (['在校','请假'].includes(filter)) {
                state.rollcallPrimaryFilter = state.rollcallPrimaryFilter === filter ? 'all' : filter;
            }
            updateRollcallList();
        }

        function renderCheckinModule(kind) {
            const taskType = kind === 'home' ? 'home' : 'return';
            const tasks = classWorkflowState.checkinTasks.filter(task => task.type === taskType);
            const roster = ensureClassRoster(getSelectedClass());
            tasks.filter(task => task.status === '已完成' && !task.checkedIds.length).forEach(task => { task.checkedIds = roster.map(item => item.id); });
            const selected = tasks.find(task => task.id === state.selectedCheckinTaskId) || tasks.find(task => task.status === '进行中') || tasks[0];
            if (selected) state.selectedCheckinTaskId = selected.id;
            const checked = new Set(selected?.checkedIds || []);
            return `<section class="checkin-source-card"><span>学工任务</span><strong>${taskType === 'return' ? '返校点到' : '回家点到'}</strong><small>任务由学工侧创建，班主任只能进入已有任务完成点到，本页不提供创建入口。</small></section>
                <div class="checkin-task-list">${tasks.map(task => `<button type="button" class="checkin-task-card${task.status === '已完成' ? ' completed' : ''}" data-action="open-checkin-task" data-checkin-task-id="${escapeHtml(task.id)}"><span><strong>${escapeHtml(task.title)}</strong><small>${escapeHtml(task.window)} · ${escapeHtml(task.createdBy)}</small></span><em>${task.status}</em></button>`).join('')}</div>
                ${selected ? `<div class="class-section-head"><h2>${escapeHtml(selected.title)}</h2><span>${checked.size}/${roster.length} 已点到</span></div><div class="checkin-roster">${roster.map((item, index) => {
                    const done = checked.has(item.id);
                    return `<div class="checkin-row"><span class="student-sequence" aria-hidden="true">${String(index + 1).padStart(2,'0')}</span><strong>${escapeHtml(item.name)}</strong><button type="button" class="checkin-toggle${done ? ' done' : ''}" data-action="toggle-checkin-student" data-checkin-task-id="${escapeHtml(selected.id)}" data-checkin-student-id="${escapeHtml(item.id)}"${selected.status === '已完成' ? ' disabled' : ''}>${done ? '已点到' : '未点到'}</button></div>`;
                }).join('')}</div>` : '<div class="todo-empty">学工侧尚未创建对应任务</div>'}`;
        }

        function ensureDormMasterRecords() {
            Object.entries(dormInventory).forEach(([gender, rooms]) => rooms.forEach(room => room.beds.forEach(bed => {
                if (!bed.occupied || !bed.studentName) return;
                let record = classWorkflowState.dorm.find(item => item.roomId === room.id && Number(item.bedNumber) === Number(bed.number))
                    || classWorkflowState.dorm.find(item => item.name === bed.studentName);
                const known = students.find(item => item.name === bed.studentName);
                if (!record) {
                    record = { id: known?.id || `dorm-${room.id}-${bed.number}`, studentId: known?.id || '', name: bed.studentName, gender, roomId: room.id, bedNumber: bed.number, assignment: formatDormBedLabel(room, bed) };
                    classWorkflowState.dorm.push(record);
                } else {
                    if (!record.studentId && known?.id) record.studentId = known.id;
                    record.gender = gender;
                    record.roomId = room.id;
                    record.bedNumber = bed.number;
                    record.assignment = formatDormBedLabel(room, bed);
                }
            })));
        }

        function syncSelectedClassDormRoster() {
            const roster = ensureClassRoster(getSelectedClass());
            roster.forEach(item => {
                let record = classWorkflowState.dorm.find(candidate => candidate.studentId === item.id);
                if (!record) record = classWorkflowState.dorm.find(candidate => !candidate.studentId && candidate.name === item.name);
                if (record) record.studentId = item.id;
                else classWorkflowState.dorm.push({ id: `dorm-${item.id}`, studentId: item.id, name: item.name, gender: item.gender, roomId: '', bedNumber: '', assignment: '' });
            });
        }

        function getScopedDormRecords() {
            ensureDormMasterRecords();
            if (state.classModuleOrigin === 'school') return classWorkflowState.dorm;
            syncSelectedClassDormRoster();
            const roster = ensureClassRoster(getSelectedClass());
            const ids = new Set(roster.map(item => item.id));
            const names = new Set(roster.map(item => item.name));
            return classWorkflowState.dorm.filter(item => ids.has(item.studentId || item.id) || (!item.studentId && names.has(item.name)));
        }

        

        function getDormStudentCandidates(gender = '', query = '') {
            const keyword = String(query || '').trim().toLowerCase();
            return getScopedDormRecords().filter(item => {
                const matchesGender = !gender || item.gender === gender;
                const matchesSearch = !keyword || [item.name, item.assignment].some(value => String(value || '').toLowerCase().includes(keyword));
                const matchesAssignment = state.dormStudentTab === 'assigned' ? Boolean(item.assignment) : !item.assignment;
                return matchesGender && matchesSearch && matchesAssignment;
            }).sort((left, right) => {
                if (Boolean(left.assignment) !== Boolean(right.assignment)) return left.assignment ? 1 : -1;
                return String(left.name).localeCompare(String(right.name), 'zh-CN');
            });
        }

        function renderDormPlan(room, context = null) {
            if (!room) return '<div class="todo-empty">暂无宿舍床位信息</div>';
            const record = context ? classWorkflowState.dorm.find(item => item.id === context.recordId) : null;
            const scopedNames = new Set(getScopedDormRecords().map(item => item.name));
            const classScoped = state.classModuleOrigin === 'class' && state.classModule === 'dorm';
            const occupiedCount = room.beds.filter(bed => bed.occupied).length;
            const renderBed = bed => {
                const bedName = getDormBedName(bed);
                const isCurrentBed = Boolean(record && record.roomId === room.id && Number(record.bedNumber) === bed.number);
                const selected = Number(context?.bedNumber) === bed.number;
                const foreignStudent = classScoped && bed.occupied && !scopedNames.has(bed.studentName);
                const disabled = Boolean((context && bed.occupied && !isCurrentBed) || foreignStudent);
                const stateText = bed.occupied ? '已住' : '空床';
                const studentText = bed.studentName || '已住学生';
                const actionAttrs = context
                    ? ` data-action="select-dorm-bed" data-bed-number="${bed.number}"`
                    : (bed.occupied ? ` data-action="open-occupied-bed-actions" data-room-id="${room.id}" data-bed-number="${bed.number}"` : ` data-action="open-vacant-bed-picker" data-room-id="${room.id}" data-bed-number="${bed.number}"`);
                const occupantMarkup = bed.occupied
                    ? `<span class="dorm-bed-occupant"><strong class="dorm-bed-student-name">${escapeHtml(studentText)}</strong></span>`
                    : `<span class="dorm-bed-assign-cta"><svg aria-hidden="true" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><strong>${context ? '选择此床位' : '分配学生'}</strong></span>`;
                return `<button type="button" class="dorm-bed-option dorm-bed-card ${bed.occupied ? 'occupied' : 'vacant'}${selected ? ' active' : ''}"${actionAttrs}${disabled ? ' disabled' : ''} aria-label="${escapeHtml(bedName)}，${escapeHtml(stateText)}${bed.occupied ? `，${escapeHtml(studentText)}` : `，${context ? '选择此床位' : '分配学生'}`}${foreignStudent ? '，非本班学生不可管理' : ''}">
                    <span class="dorm-bed-card-head"><strong class="dorm-bed-name">${escapeHtml(bedName)}</strong><span class="dorm-bed-status"><i aria-hidden="true"></i>${escapeHtml(stateText)}</span></span>
                    ${occupantMarkup}
                </button>`;
            };
            return `<div class="dorm-plan dorm-bed-directory" aria-label="${escapeHtml(room.name)}床位列表">
                <div class="dorm-plan-head"><div class="dorm-plan-current"><strong>${escapeHtml(formatDormRoomName(room))}</strong><span>空 ${room.beds.length - occupiedCount} 床</span></div><div class="dorm-plan-legend"><span><i aria-hidden="true"></i>已住</span><span><i aria-hidden="true"></i>空床</span></div></div>
                <div class="dorm-bed-grid dorm-card-grid">${getDormDisplayBeds(room.beds).map(renderBed).join('')}</div>
            </div>`;
        }

        

        function getDormFloorNumber(room) {
            const digits = String(room?.roomNo || '').match(/\d+/)?.[0] || '';
            if (!digits) return '';
            return digits.length > 2 ? digits.slice(0, -2) : digits.charAt(0);
        }

        function getDormFloorKey(room) {
            return `${room?.building || '其他楼栋'}::${getDormFloorNumber(room) || '其他'}`;
        }

        function getDormEmptyRoomCount(rooms = []) {
            return rooms.filter(room => room.beds.length && room.beds.every(bed => !bed.occupied)).length;
        }

        function getDormEmptyBedCount(rooms = []) {
            return rooms.reduce((sum, room) => sum + room.beds.filter(bed => !bed.occupied).length, 0);
        }

        function updateSchoolDormNavigation() {
            if (state.classModule !== 'school-dorm') return;
            const level = state.schoolDormLevel || 'buildings';
            const selectedBuildingRoom = getAllDormRooms().find(room => room.building === state.schoolDormBuilding);
            const selectedBuildingGender = getDormRoomGender(selectedBuildingRoom?.id);
            const selectedDormType = selectedBuildingGender === '男' ? '男寝' : (selectedBuildingGender === '女' ? '女寝' : '宿舍');
            if (level === 'floors') classModuleTitle.textContent = `${state.schoolDormBuilding || '宿舍楼'} · 选择楼层`;
            else if (level === 'rooms') classModuleTitle.textContent = `${state.schoolDormBuilding || '宿舍楼'}（${selectedDormType}）`;
            else classModuleTitle.textContent = '全校宿舍';
            const backLabel = level === 'rooms'
                ? '返回楼层选择'
                : (level === 'floors' ? '返回楼栋选择' : '返回学校管理');
            classModuleBackButton.setAttribute('aria-label', backLabel);
        }

        function renderSchoolDormModule() {
            ensureDormMasterRecords();
            const allRooms = getAllDormRooms();
            const buildingGroups = [...allRooms.reduce((map, room) => {
                const building = room.building || '其他楼栋';
                if (!map.has(building)) map.set(building, []);
                map.get(building).push(room);
                return map;
            }, new Map()).entries()].sort((left, right) => {
                const leftIndex = dormStatsBuildingOrder.indexOf(left[0]);
                const rightIndex = dormStatsBuildingOrder.indexOf(right[0]);
                if (leftIndex >= 0 && rightIndex >= 0) return leftIndex - rightIndex;
                if (leftIndex >= 0) return -1;
                if (rightIndex >= 0) return 1;
                return left[0].localeCompare(right[0], 'zh-CN', { numeric: true });
            });

            const arrow = '<svg class="school-dorm-level-arrow" aria-hidden="true" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>';
            const level = ['buildings','floors','rooms'].includes(state.schoolDormLevel) ? state.schoolDormLevel : 'buildings';
            state.schoolDormLevel = level;

            if (level === 'buildings') {
                const quickQuery = state.schoolDormSearch.trim().toLowerCase();
                const quickSearch = `<div class="school-dorm-quick-search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="schoolDormSearch" type="search" value="${escapeHtml(state.schoolDormSearch)}" placeholder="输入宿舍号，如 401" autocomplete="off" aria-label="快速搜索所有楼栋的宿舍"></div>`;
                if (quickQuery) {
                    const matchedRooms = allRooms
                        .filter(room => `${room.building || ''} ${room.roomNo || ''} ${room.name || ''}`.toLowerCase().includes(quickQuery))
                        .sort((left, right) => `${left.roomNo}-${left.building}`.localeCompare(`${right.roomNo}-${right.building}`, 'zh-CN', { numeric: true }));
                    const results = matchedRooms.length ? matchedRooms.map(room => {
                        const used = room.beds.filter(bed => bed.occupied).length;
                        const floorNumber = getDormFloorNumber(room) || '其他';
                        const gender = getDormRoomGender(room.id);
                        const emptyBeds = room.beds.length - used;
                        return `<button type="button" class="school-dorm-search-result" data-action="open-school-dorm-search-room" data-school-dorm-building="${escapeHtml(room.building || '其他楼栋')}" data-school-dorm-floor="${escapeHtml(floorNumber)}" data-room-id="${escapeHtml(room.id)}" aria-label="${escapeHtml(formatDormRoomName(room))}，空${emptyBeds}床"><span><strong>${escapeHtml(formatDormRoomName(room))}（空 ${emptyBeds} 床）</strong><small>${floorNumber === '其他' ? '其他楼层' : `${escapeHtml(floorNumber)}层`} · ${escapeHtml(gender)}生宿舍</small></span><span>${arrow}</span></button>`;
                    }).join('') : '<div class="school-dorm-search-empty">没有找到匹配的宿舍号</div>';
                    return `<div class="school-dorm-level level-buildings">${quickSearch}<div class="school-dorm-section-title"><span>搜索结果</span><i aria-hidden="true"></i><small>${matchedRooms.length} 间</small></div><div class="school-dorm-search-results">${results}</div></div>`;
                }
                const groupedBuildings = { '男': [], '女': [], '其他': [] };
                buildingGroups.forEach(group => {
                    const counts = group[1].reduce((sum, room) => {
                        const gender = getDormRoomGender(room.id);
                        if (gender === '男' || gender === '女') sum[gender] += 1;
                        return sum;
                    }, { '男': 0, '女': 0 });
                    const gender = counts['男'] || counts['女'] ? (counts['男'] >= counts['女'] ? '男' : '女') : '其他';
                    groupedBuildings[gender].push(group);
                });
                const renderBuildingCard = ([building, buildingRooms]) => {
                    const emptyRooms = getDormEmptyRoomCount(buildingRooms);
                    const emptyBeds = getDormEmptyBedCount(buildingRooms);
                    return `<button type="button" class="school-dorm-level-card" data-action="open-school-dorm-building" data-school-dorm-building="${escapeHtml(building)}" aria-label="${escapeHtml(building)}，空房${emptyRooms}间，空床${emptyBeds}个">
                        <span class="school-dorm-level-copy"><strong>${escapeHtml(building)}（空房 ${emptyRooms} 间，空床 ${emptyBeds} 个）</strong></span>
                        <span class="school-dorm-level-side">${arrow}</span>
                    </button>`;
                };
                const groupMarkup = [
                    ['男', '男生宿舍'],
                    ['女', '女生宿舍'],
                    ['其他', '其他宿舍']
                ].filter(([gender]) => groupedBuildings[gender].length).map(([gender, label]) => `<section class="school-dorm-group" aria-label="${label}"><div class="school-dorm-group-title"><span>${label}</span><i aria-hidden="true"></i></div><div class="school-dorm-level-list">${groupedBuildings[gender].map(renderBuildingCard).join('')}</div></section>`).join('');
                return `<div class="school-dorm-level level-buildings">${quickSearch}<div class="school-dorm-building-groups">${groupMarkup}</div></div>`;
            }

            const selectedBuildingGroup = buildingGroups.find(([building]) => building === state.schoolDormBuilding);
            if (!selectedBuildingGroup) {
                state.schoolDormLevel = 'buildings';
                state.schoolDormBuilding = 'all';
                state.schoolDormFloor = '';
                return renderSchoolDormModule();
            }
            const buildingRooms = selectedBuildingGroup[1];
            const floorGroups = [...buildingRooms.reduce((map, room) => {
                const floorNumber = getDormFloorNumber(room) || '其他';
                if (!map.has(floorNumber)) map.set(floorNumber, []);
                map.get(floorNumber).push(room);
                return map;
            }, new Map()).entries()].sort((left, right) => {
                const leftNumber = Number(left[0]);
                const rightNumber = Number(right[0]);
                if (Number.isFinite(leftNumber) && Number.isFinite(rightNumber)) return rightNumber - leftNumber;
                if (Number.isFinite(leftNumber)) return 1;
                if (Number.isFinite(rightNumber)) return -1;
                return String(left[0]).localeCompare(String(right[0]), 'zh-CN', { numeric: true });
            });

            if (level === 'floors') {
                const cards = floorGroups.map(([floorNumber, floorRooms]) => {
                    const floorLabel = floorNumber === '其他' ? '其他楼层' : `${floorNumber}层`;
                    const emptyRooms = getDormEmptyRoomCount(floorRooms);
                    const emptyBeds = getDormEmptyBedCount(floorRooms);
                    return `<button type="button" class="school-dorm-level-card" data-action="open-school-dorm-floor" data-school-dorm-floor="${escapeHtml(floorNumber)}" aria-label="${escapeHtml(state.schoolDormBuilding)}${escapeHtml(floorLabel)}，空房${emptyRooms}间，空床${emptyBeds}个">
                        <span class="school-dorm-level-copy"><strong>${escapeHtml(floorLabel)}（空房 ${emptyRooms} 间，空床 ${emptyBeds} 个）</strong></span>
                        <span class="school-dorm-level-side">${arrow}</span>
                    </button>`;
                }).join('');
                return `<div class="school-dorm-level level-floors"><div class="school-dorm-section-title"><span>楼层</span><i aria-hidden="true"></i><small>${floorGroups.length} 层</small></div><div class="school-dorm-level-list">${cards}</div></div>`;
            }

            const selectedFloorGroup = floorGroups.find(([floorNumber]) => String(floorNumber) === String(state.schoolDormFloor));
            if (!selectedFloorGroup) {
                state.schoolDormLevel = 'floors';
                state.schoolDormFloor = '';
                return renderSchoolDormModule();
            }
            const floorRooms = [...selectedFloorGroup[1]].sort((left, right) => String(left.roomNo).localeCompare(String(right.roomNo), 'zh-CN', { numeric: true }));
            const selectedRoom = floorRooms.find(room => room.id === state.dormRoomId) || floorRooms[0];
            state.dormRoomId = selectedRoom?.id || '';
            const roomCards = floorRooms.map(room => {
                const used = room.beds.filter(bed => bed.occupied).length;
                const gender = getDormRoomGender(room.id);
                const emptyBeds = room.beds.length - used;
                const roomLabel = String(room.roomNo || room.name || '未命名房间');
                return `<button type="button" class="school-room-card${room.id === state.dormRoomId ? ' active' : ''}" data-action="select-dorm-overview-room" data-room-id="${escapeHtml(room.id)}" aria-pressed="${room.id === state.dormRoomId ? 'true' : 'false'}" aria-label="${escapeHtml(roomLabel)}，${escapeHtml(gender)}生宿舍，空${emptyBeds}床"><strong>${escapeHtml(roomLabel)}（空 ${emptyBeds} 床）</strong></button>`;
            }).join('');
            return `<div class="school-dorm-level level-rooms"><div class="school-dorm-section-title"><span>房间</span><i aria-hidden="true"></i><small>${floorRooms.length} 间</small></div><div class="school-dorm-room-grid">${roomCards}</div><div class="school-dorm-room-preview">${renderDormPlan(selectedRoom)}</div></div>`;
        }

        function getDormBuildingSummaryData() {
            const roomGroups = getAllDormRooms().reduce((map, room) => {
                if (!map.has(room.building)) map.set(room.building, []);
                map.get(room.building).push(room);
                return map;
            }, new Map());
            return dormStatsBuildingOrder.map(building => {
                const rooms = roomGroups.get(building) || [];
                const fullRooms = rooms.filter(room => room.beds.every(bed => bed.occupied)).length;
                const emptyRooms = rooms.filter(room => room.beds.every(bed => !bed.occupied)).length;
                const totalBeds = rooms.reduce((sum, room) => sum + room.beds.length, 0);
                const occupiedBeds = rooms.reduce((sum, room) => sum + room.beds.filter(bed => bed.occupied).length, 0);
                return {
                    building,
                    totalRooms: rooms.length,
                    fullRooms,
                    emptyRooms,
                    partialRooms: Math.max(0, rooms.length - fullRooms - emptyRooms),
                    totalBeds,
                    occupiedBeds,
                    emptyBeds: totalBeds - occupiedBeds
                };
            });
        }

        

        function getDormBuildingTotals(rows = getDormBuildingSummaryData()) {
            return rows.reduce((sum, item) => ({
                totalRooms: sum.totalRooms + item.totalRooms,
                fullRooms: sum.fullRooms + item.fullRooms,
                emptyRooms: sum.emptyRooms + item.emptyRooms,
                partialRooms: sum.partialRooms + item.partialRooms,
                totalBeds: sum.totalBeds + item.totalBeds,
                occupiedBeds: sum.occupiedBeds + item.occupiedBeds,
                emptyBeds: sum.emptyBeds + item.emptyBeds
            }), { totalRooms: 0, fullRooms: 0, emptyRooms: 0, partialRooms: 0, totalBeds: 0, occupiedBeds: 0, emptyBeds: 0 });
        }

        function getDormClassSummaryData() {
            return dormClassDetailData.reduce((sum, item) => {
                sum.stayMale += item.stay.male;
                sum.stayFemale += item.stay.female;
                sum.commuteMale += item.commute.male;
                sum.commuteFemale += item.commute.female;
                sum.unknownMale += item.unknown.male;
                sum.unknownFemale += item.unknown.female;
                return sum;
            }, {
                stayMale: 0,
                stayFemale: 0,
                commuteMale: 0,
                commuteFemale: 0,
                unknownMale: 0,
                unknownFemale: 0
            });
        }

        function renderDormBuildingSummaryTable() {
            const rows = getDormBuildingSummaryData();
            const totals = getDormBuildingTotals(rows);
            const rowMarkup = rows.map(item => {
                const rate = item.totalBeds ? Math.round(item.occupiedBeds / item.totalBeds * 100) : 0;
                return `<tr>
                    <th scope="row">${escapeHtml(item.building)}</th>
                    <td>${item.totalRooms}</td>
                    <td>${item.emptyRooms}</td>
                    <td>${item.emptyBeds}</td>
                    <td><span class="dorm-table-rate">${rate}%</span></td>
                </tr>`;
            }).join('');
            const totalRate = totals.totalBeds ? Math.round(totals.occupiedBeds / totals.totalBeds * 100) : 0;
            return `<section class="dorm-table-section" aria-label="全校宿舍楼栋汇总">
                <div class="dorm-table-scroll">
                    <table class="dorm-stats-table dorm-building-table">
                        <caption><span>楼栋床位汇总</span><em>更新至今日</em></caption>
                        <thead><tr><th scope="col">楼栋</th><th scope="col">房间</th><th scope="col">空房</th><th scope="col">空床</th><th scope="col">入住率</th></tr></thead>
                        <tbody>${rowMarkup}</tbody>
                        <tfoot><tr><th scope="row">合计</th><td>${totals.totalRooms}</td><td>${totals.emptyRooms}</td><td>${totals.emptyBeds}</td><td><span class="dorm-table-rate total">${totalRate}%</span></td></tr></tfoot>
                    </table>
                </div>
            </section>`;
        }

        function renderDormClassDetailTable() {
            const expandedClasses = new Set(state.dormStatsExpandedClasses || []);
            const rows = dormClassDetailData.map(item => {
                const hasAssignments = item.assignments.length > 0;
                const expanded = hasAssignments && expandedClasses.has(item.className);
                const total = item.stay.male + item.stay.female + item.commute.male + item.commute.female + item.unknown.male + item.unknown.female;
                const assignmentMarkup = expanded
                    ? `<tr class="dorm-class-assignment-row"><td colspan="5"><div><span>已分配宿舍</span><div>${item.assignments.map(label => `<span>${escapeHtml(label)}</span>`).join('')}</div></div></td></tr>`
                    : '';
                const pair = group => `<span class="dorm-table-pair"><b class="male">${group.male}</b><i>/</i><b class="female">${group.female}</b></span>`;
                return `<tr class="${expanded ? 'expanded' : ''}">
                    <th scope="row"><button type="button" class="dorm-class-table-trigger" ${hasAssignments ? `data-action="toggle-dorm-stats-class" data-dorm-class-name="${escapeHtml(item.className)}" aria-expanded="${expanded ? 'true' : 'false'}"` : 'disabled aria-disabled="true"'}><span><strong>${escapeHtml(item.className)}</strong><small>${total}人</small></span>${hasAssignments ? '<svg aria-hidden="true" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>' : ''}</button></th>
                    <td>${pair(item.stay)}</td>
                    <td>${pair(item.commute)}</td>
                    <td>${pair(item.unknown)}</td>
                    <td>${hasAssignments ? `${item.assignments.length}间` : '—'}</td>
                </tr>${assignmentMarkup}`;
            }).join('');
            const totals = getDormClassSummaryData();
            return `<section class="dorm-table-section" aria-label="全校班级住宿明细">
                <div class="dorm-table-scroll">
                    <table class="dorm-stats-table dorm-class-table">
                        <caption><span>班级住宿明细</span><em>人数均为男 / 女</em></caption>
                        <thead><tr><th scope="col">班级</th><th scope="col">住宿</th><th scope="col">走读</th><th scope="col">待确认</th><th scope="col">宿舍</th></tr></thead>
                        <tbody>${rows}</tbody>
                        <tfoot><tr><th scope="row">合计</th><td><span class="dorm-table-pair"><b class="male">${totals.stayMale}</b><i>/</i><b class="female">${totals.stayFemale}</b></span></td><td><span class="dorm-table-pair"><b class="male">${totals.commuteMale}</b><i>/</i><b class="female">${totals.commuteFemale}</b></span></td><td><span class="dorm-table-pair"><b class="male">${totals.unknownMale}</b><i>/</i><b class="female">${totals.unknownFemale}</b></span></td><td>—</td></tr></tfoot>
                    </table>
                </div>
            </section>`;
        }

        function renderDormStatsModule() {
            state.dormStatsTab = state.dormStatsTab === 'class' ? 'class' : 'building';
            const buildingActive = state.dormStatsTab === 'building';
            const body = buildingActive ? renderDormBuildingSummaryTable() : renderDormClassDetailTable();

                <button type="button" class="dorm-stats-tab${buildingActive ? '' : ' active'}" data-action="set-dorm-stats-tab" data-dorm-stats-tab="class" role="tab" aria-selected="${buildingActive ? 'false' : 'true'}">班级明细</button>
            </nav>${body}</section>`;
        }

            const itemsActive = state.disciplineSetupTab === 'items';
            const body = itemsActive
                ? `<div class="discipline-item-list">${disciplineItems.map(item => `<article class="discipline-item-card"><div class="discipline-item-head"><strong>${escapeHtml(item.name)}</strong><span class="discipline-level${item.level === '严重' ? ' severe' : ''}">${escapeHtml(item.level)} · ${item.points}分</span></div><div class="discipline-scope-row">${item.scopes.map(scope => `<span class="discipline-scope">${escapeHtml(scope)}违纪</span>`).join('')}</div><div class="discipline-item-meta">凭证：${escapeHtml(item.evidence)} · ${item.enabled ? '已启用' : '已停用'}</div></article>`).join('')}</div>`

" data-action="choose-discipline-photo"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m4 17 5-5 4 4 2-2 5 4"></path></svg>选择图片</button></div><div class="discipline-draft-photos" id="disciplineDraftPhotos"></div></div></section>`;

        function saveDisciplineRecord() {
            const roster = ensureClassRoster(getSelectedClass());
            const studentItems = roster.filter(item => state.disciplineStudentIds.includes(item.id));
            const disciplineItem = disciplineItems.find(item => item.id === document.getElementById('disciplineItemSelect')?.value);

            const selected = getStudentAddSelectedSet();

        function toggleSelectAllUnassigned() {
            const records = getFilteredUnassignedStudents();
            if (!records.length) return;
            const selected = getStudentAddSelectedSet();
            const allVisibleSelected = records.every(item => selected.has(item.id));
            records.forEach(item => {

        function addSelectedStudentsToClass(studentIds) {
            const classInfo = getSelectedClass();
            if (!classInfo) return false;
            const selectedIds = new Set(studentIds || []);
            const candidates = unassignedStudentPool.filter(item => selectedIds.has(item.id) && !item.assignedClassId);
            if (!candidates.length) return false;
            const roster = ensureClassRoster(classInfo);
            candidates.forEach(candidate => {
                const studentItem = createStudentFromUnassigned(candidate, classInfo);
                candidate.assignedClassId = classInfo.id;
                students.push(studentItem);
                roster.push(studentItem);
                classInfo.total += 1;
                if (studentItem.gender === '男') classInfo.male += 1;
                else if (studentItem.gender === '女') classInfo.female += 1;
            });
            state.classStudentAddSelectedIds = [];
            renderClassModule();
            showToast(`已将 ${candidates.length} 名学生添加到${getClassDisplayName(classInfo)}`);
            return true;
        }

        function requestAddSelectedStudents() {
            const selected = getStudentAddSelectedSet();
            const candidates = unassignedStudentPool.filter(item => selected.has(item.id) && !item.assignedClassId);
            const classInfo = getSelectedClass();
            if (!candidates.length || !classInfo) return showToast('请先选择学生');
            openDialog({
                title: `确认添加 ${candidates.length} 名学生？`,
                desc: `将添加到${getClassDisplayName(classInfo)}。`,
                confirmLabel: '确认添加',
                cancelLabel: '返回选择',
                onConfirm: () => addSelectedStudentsToClass(candidates.map(item => item.id))
            });
        }

        let leaveScrollTimeHideTimer = 0;

        function hideLeaveScrollTime() {
            window.clearTimeout(leaveScrollTimeHideTimer);
            leaveScrollTime?.classList.remove('visible');
            leaveScrollTime?.setAttribute('aria-hidden', 'true');
        }

        function updateLeaveScrollTime() {
            if (!leaveScrollTime || state.view !== 'class-module' || state.classModule !== 'leave' || classModuleScroll.scrollTop < 6) {
                hideLeaveScrollTime();
                return;
            }
            const cards = Array.from(classModuleRoot.querySelectorAll('.leave-card[data-leave-time]'));
            if (!cards.length) {
                hideLeaveScrollTime();
                return;
            }
            const scrollerTop = classModuleScroll.getBoundingClientRect().top;
            const toolbarHeight = classModuleRoot.querySelector('.leave-toolbar')?.offsetHeight || 0;
            const threshold = scrollerTop + toolbarHeight + 18;
            let currentCard = cards[0];
            cards.forEach(card => {
                if (card.getBoundingClientRect().top <= threshold) currentCard = card;
            });
            const label = currentCard.dataset.leaveTime || '';
            const labelNode = leaveScrollTime.querySelector('span');
            if (labelNode) labelNode.textContent = `提交于 ${label}`;
            leaveScrollTime.setAttribute('aria-label', `当前假条提交于${label}`);
            leaveScrollTime.setAttribute('aria-hidden', 'false');
            leaveScrollTime.classList.add('visible');
            window.clearTimeout(leaveScrollTimeHideTimer);
            leaveScrollTimeHideTimer = window.setTimeout(hideLeaveScrollTime, 1800);
        }

            if (type === 'leave') {
                const item = classWorkflowState.leave.find(record => record.id === id);
                if (button.dataset.workflowValue === '已驳回') return openLeaveRejectDialog(id, button);
                if (item) {
                    item.status = '已通过';

                refreshClassWorkflowViews();

                return;

            if (type === 'rollcall') {
                const nextStatus = rollcallStatuses.includes(button.dataset.workflowValue) ? button.dataset.workflowValue : '在校';
                if (nextStatus === '请假' && !STATUS_POLICY.allowTeacherLeaveEdit) return showToast('请假状态当前由正式审批流程更新');
                const savedScrollTop = classModuleScroll.scrollTop;
                const statusMap = getStudentStatusMap();
                const mealSet = getStudentMealSet();
                const studentItem = ensureClassRoster(getSelectedClass()).find(item => item.id === id);
                const studentName = studentItem?.name || '该学生';
                let feedback = '';
                if (nextStatus === '就餐') {
                    if (mealSet.has(id)) {
                        mealSet.delete(id);
                        feedback = `${studentName}已取消就餐`;
                    } else {
                        mealSet.add(id);
                        if (!['在校','请假'].includes(statusMap[id])) statusMap[id] = '在校';
                        markStudentStatusHandled(id);
                        feedback = `${studentName}已勾选就餐`;
                    }
                    saveStudentMealSet(mealSet);
                } else {
                    statusMap[id] = nextStatus;
                    markStudentStatusHandled(id);
                    feedback = `${studentName}已设为${nextStatus}`;
                }
                renderClassInfo();
                showToast(feedback);
                updateRollcallList();
                classModuleScroll.scrollTop = savedScrollTop;
                requestAnimationFrame(() => classModuleRoot.querySelector(`[data-workflow="rollcall"][data-workflow-id="${id}"][data-workflow-value="${nextStatus}"]`)?.focus({ preventScroll: true }));

        function finishQuickSort(pointerId, commit = true) {
            const gesture = quickSortGesture;
            if (!gesture || gesture.pointerId !== pointerId) return;
            window.clearTimeout(gesture.timer);
            const wasActive = gesture.active;
            gesture.item.classList.remove('is-sorting');
            try {
                if (gesture.item.hasPointerCapture(pointerId)) gesture.item.releasePointerCapture(pointerId);
            } catch (error) {}
            quickSortGesture = null;
            if (!wasActive || !commit) return;
            const order = Array.from(gesture.grid.querySelectorAll('.quick-entry[data-quick-token]')).map(item => item.dataset.quickToken);
            quickSortSuppressUntil = Date.now() + 450;
            setQuickOrder(gesture.context, order);
            showToast('高频入口排序已更新');

        appDevice.addEventListener('pointerdown', event => {
            const item = event.target.closest?.('.quick-entry[data-quick-token]');
            if (!item || event.button !== 0) return;
            const context = item.dataset.quickContext;
            if (!isQuickManageContext(context)) return;
            const grid = item.closest('[data-quick-grid]');
            if (!grid) return;
            const gesture = {
                pointerId: event.pointerId,
                item,
                grid,
                context,
                startX: event.clientX,
                startY: event.clientY,
                active: false,
                timer: 0
            };
            gesture.timer = window.setTimeout(() => {
                if (quickSortGesture !== gesture) return;
                gesture.active = true;
                item.classList.add('is-sorting');
                try { item.setPointerCapture(event.pointerId); } catch (error) {}
                navigator.vibrate?.(18);
            }, 280);
            quickSortGesture = gesture;
        }, true);

        appDevice.addEventListener('pointermove', event => {
            const gesture = quickSortGesture;
            if (!gesture || gesture.pointerId !== event.pointerId) return;
            const distance = Math.hypot(event.clientX - gesture.startX, event.clientY - gesture.startY);
            if (!gesture.active) {
                if (distance > 8) {
                    window.clearTimeout(gesture.timer);
                    quickSortGesture = null;
                }
                return;
            }
            event.preventDefault();
            const over = document.elementFromPoint(event.clientX, event.clientY)?.closest?.('.quick-entry[data-quick-token]');
            if (!over || over === gesture.item || over.closest('[data-quick-grid]') !== gesture.grid) return;
            const items = Array.from(gesture.grid.querySelectorAll('.quick-entry[data-quick-token]'));
            const currentIndex = items.indexOf(gesture.item);
            const overIndex = items.indexOf(over);
            if (currentIndex < overIndex) gesture.grid.insertBefore(gesture.item, over.nextSibling);
            else gesture.grid.insertBefore(gesture.item, over);
        }, { passive: false, capture: true });

        function getStudentRankingRows() {
            const classInfo = getSelectedClass();
            const rosterNames = ensureClassRoster(classInfo).map(item => item.name).filter(name => name !== '林子涵');
            const names = ['林子涵', ...new Set(rosterNames)].slice(0, classInfo.total);
            return names.map((name, index) => {
                if (index === 0) return { name, bonus: 12, deduction: 12, total: 200 };
                const bonus = (index * 3) % 12;
                const deduction = bonus + Math.ceil(index / 2);
                return { name, bonus, deduction, total: 200 + bonus - deduction };
            }).sort((left, right) => right.total - left.total || right.bonus - left.bonus || left.deduction - right.deduction || left.name.localeCompare(right.name, 'zh-CN'));
        }

        function getClassDormRoom(roomId = state.classDormRoomId) {
            return classDormitorySeed.find(item => item.id === roomId) || classDormitorySeed[0];

        function getClassDormResidentClass(person) {
            return person.mine ? getClassRecordClassName() : person.className;
        }

        function getClassDormPickerBuildingGroups() {
            return [...getAllDormRooms().reduce((map, room) => {
                const building = room.building || '其他楼栋';
                if (!map.has(building)) map.set(building, []);
                map.get(building).push(room);
                return map;
            }, new Map()).entries()].sort((left, right) => {
                const leftIndex = dormStatsBuildingOrder.indexOf(left[0]);
                const rightIndex = dormStatsBuildingOrder.indexOf(right[0]);
                if (leftIndex >= 0 && rightIndex >= 0) return leftIndex - rightIndex;
                if (leftIndex >= 0) return -1;
                if (rightIndex >= 0) return 1;
                return left[0].localeCompare(right[0], 'zh-CN', { numeric: true });
            });
        }

        function getClassDormPickerFloorGroups(rooms) {
            return [...rooms.reduce((map, room) => {
                const floorNumber = getDormFloorNumber(room) || '其他';
                if (!map.has(floorNumber)) map.set(floorNumber, []);
                map.get(floorNumber).push(room);
                return map;
            }, new Map()).entries()].sort((left, right) => {
                const leftNumber = Number(left[0]);
                const rightNumber = Number(right[0]);
                if (Number.isFinite(leftNumber) && Number.isFinite(rightNumber)) return rightNumber - leftNumber;
                if (Number.isFinite(leftNumber)) return 1;
                if (Number.isFinite(rightNumber)) return -1;
                return String(left[0]).localeCompare(String(right[0]), 'zh-CN', { numeric: true });
            });
        }

            state.classDormPickerLevel = level;

            if (level === 'buildings') {
                const groupedBuildings = { '男': [], '女': [], '其他': [] };
                buildingGroups.forEach(group => {
                    const counts = group[1].reduce((sum, room) => {
                        const gender = getDormRoomGender(room.id);
                        if (gender === '男' || gender === '女') sum[gender] += 1;
                        return sum;
                    }, { '男': 0, '女': 0 });
                    const gender = counts['男'] || counts['女'] ? (counts['男'] >= counts['女'] ? '男' : '女') : '其他';
                    groupedBuildings[gender].push(group);
                });
                const renderBuilding = ([building, rooms]) => `<button type="button" class="school-dorm-level-card" data-action="open-class-dorm-building" data-class-dorm-building="${escapeHtml(building)}" aria-label="选择${escapeHtml(building)}，空房${getDormEmptyRoomCount(rooms)}间，空床${getDormEmptyBedCount(rooms)}个"><span class="school-dorm-level-copy"><strong>${escapeHtml(building)}（空房 ${getDormEmptyRoomCount(rooms)} 间，空床 ${getDormEmptyBedCount(rooms)} 个）</strong></span><span class="school-dorm-level-side">${arrow}</span></button>`;
                const groups = [['男','男生宿舍'],['女','女生宿舍'],['其他','其他宿舍']]
                    .filter(([gender]) => groupedBuildings[gender].length)
                    .map(([gender, label]) => `<section class="school-dorm-group" aria-label="${label}"><div class="school-dorm-group-title"><span>${label}</span><i aria-hidden="true"></i><small>${groupedBuildings[gender].length} 栋</small></div><div class="school-dorm-level-list">${groupedBuildings[gender].map(renderBuilding).join('')}</div></section>`).join('');
                return `<section class="v791-surface class-dorm-picker-surface" aria-label="选择本班宿舍楼栋"><div class="school-dorm-level level-buildings"><div class="school-dorm-section-title"><span>选择楼栋</span><i aria-hidden="true"></i><small>${buildingGroups.length} 栋</small></div><div class="school-dorm-building-groups">${groups}</div></div></section>`;
            }

            const selectedBuildingGroup = buildingGroups.find(([building]) => building === state.classDormPickerBuilding);
            if (!selectedBuildingGroup) {
                state.classDormPickerLevel = 'buildings';
                state.classDormPickerBuilding = '';
                state.classDormPickerFloor = '';
                return renderClassDormPicker();
            }
            const floorGroups = getClassDormPickerFloorGroups(selectedBuildingGroup[1]);
            if (level === 'floors') {
                const floors = floorGroups.map(([floorNumber, rooms]) => {
                    const floorLabel = floorNumber === '其他' ? '其他楼层' : `${floorNumber}层`;
                    return `<button type="button" class="school-dorm-level-card" data-action="open-class-dorm-floor" data-class-dorm-floor="${escapeHtml(floorNumber)}" aria-label="选择${escapeHtml(state.classDormPickerBuilding)}${escapeHtml(floorLabel)}，空房${getDormEmptyRoomCount(rooms)}间，空床${getDormEmptyBedCount(rooms)}个"><span class="school-dorm-level-copy"><strong>${escapeHtml(floorLabel)}（空房 ${getDormEmptyRoomCount(rooms)} 间，空床 ${getDormEmptyBedCount(rooms)} 个）</strong></span><span class="school-dorm-level-side">${arrow}</span></button>`;
                }).join('');
                return `<section class="v791-surface class-dorm-picker-surface" aria-label="选择${escapeHtml(state.classDormPickerBuilding)}楼层"><div class="school-dorm-level level-floors"><div class="school-dorm-section-title"><span>${escapeHtml(state.classDormPickerBuilding)}</span><i aria-hidden="true"></i><small>${floorGroups.length} 层</small></div><div class="school-dorm-level-list">${floors}</div></div></section>`;
            }

            const selectedFloorGroup = floorGroups.find(([floorNumber]) => String(floorNumber) === String(state.classDormPickerFloor));
            if (!selectedFloorGroup) {
                state.classDormPickerLevel = 'floors';
                state.classDormPickerFloor = '';
                return renderClassDormPicker();
            }
            const rooms = [...selectedFloorGroup[1]].sort((left, right) => String(left.roomNo).localeCompare(String(right.roomNo), 'zh-CN', { numeric: true }));
            const selectedRoomIds = new Set(classDormitorySeed.map(room => room.sourceRoomId).filter(Boolean));
            const roomCards = rooms.map(room => {
                const occupied = room.beds.filter(bed => bed.occupied).length;
                const emptyBeds = room.beds.length - occupied;
                const selected = selectedRoomIds.has(room.id) || classDormitorySeed.some(item => item.building === room.building && item.roomNo === room.roomNo);
                return `<button type="button" class="school-room-card${selected ? ' active' : ''}" data-action="choose-class-dorm-room" data-room-id="${escapeHtml(room.id)}" aria-pressed="${selected ? 'true' : 'false'}" aria-label="${escapeHtml(room.roomNo)}室，${selected ? '已选为本班宿舍' : `空${emptyBeds}床，选择为本班宿舍`}"><strong>${escapeHtml(room.roomNo)}室</strong><span>${selected ? '已选择' : `空 ${emptyBeds} 床`}</span></button>`;
            }).join('');
            const floorLabel = state.classDormPickerFloor === '其他' ? '其他楼层' : `${state.classDormPickerFloor}层`;
            return `<section class="v791-surface class-dorm-picker-surface" aria-label="选择${escapeHtml(state.classDormPickerBuilding)}${escapeHtml(floorLabel)}房间"><div class="school-dorm-level level-rooms"><div class="school-dorm-section-title"><span>${escapeHtml(state.classDormPickerBuilding)} · ${escapeHtml(floorLabel)}</span><i aria-hidden="true"></i><small>${rooms.length} 间</small></div><div class="school-dorm-room-grid">${roomCards}</div></div></section>`;
        }

            const filter = state.dormViolationFilter || '全部违纪';

            const options = ['全部违纪', ...dormViolationNames].map(name => `<option value="${escapeHtml(name)}"${state.dormViolationDraftFilter === name ? ' selected' : ''}>${escapeHtml(name)}</option>`).join('');

                <div class="v791-record-list">${records.length ? records.map(item => `<article class="v791-record-row"><div><div class="v791-record-title">${escapeHtml(item.dorm)} · ${escapeHtml(item.item)} <b>（扣${item.points}分）</b></div><div class="v791-record-meta"><span>违纪班级<strong>${escapeHtml(item.className)}</strong></span><span>记录人<strong>${escapeHtml(item.recorder)}</strong></span><span>时间<strong>${escapeHtml(item.time)}</strong></span></div></div><span class="v791-status-tag${item.status === '已处理' ? ' processed' : ''}">${item.status}</span></article>`).join('') : '<div class="v791-empty">没有符合当前条件的违纪记录</div>'}</div>

            if (state.classDormView === 'detail') return renderClassDormDetail();
            if (state.classDormView === 'picker') return renderClassDormPicker();
            return renderClassDormOverview();

        function openDormViolationItemDialog(scope, target = '', studentName = '') {
            const firstItem = dormViolationItems[0];
            openDialog({
                title: scope === 'room' ? '添加全宿舍违纪项' : `添加${studentName || `${target}号床`}违纪项`,
                body: `<div class="v791-violation-form"><div><label for="dormViolationItemSelect">违纪项</label><select id="dormViolationItemSelect">${dormViolationItems.map((item, index) => `<option value="${index}">${escapeHtml(item.name)}（默认扣${item.points}分）</option>`).join('')}</select></div><div><label for="dormViolationPoints">扣分</label><input id="dormViolationPoints" type="number" min="1" max="100" inputmode="numeric" value="${firstItem.points}"></div></div>`,
                confirmLabel: '添加',
                onConfirm: () => {
                    const item = dormViolationItems[Number(document.getElementById('dormViolationItemSelect')?.value) || 0];
                    const points = Number(document.getElementById('dormViolationPoints')?.value);
                    if (!item || !Number.isFinite(points) || points < 1) { showToast('请输入有效扣分'); return false; }
                    state.dormViolationDraft.push({ scope, target: String(target), studentName, name: item.name, points });
                    renderClassModule();
                    showToast('违纪项已添加');
                }
            });
        }

        function submitDormViolationDraft() {
            const room = getClassDormRoom();
            const drafts = Array.isArray(state.dormViolationDraft) ? state.dormViolationDraft : [];
            if (!drafts.length) { showToast('请先添加违纪项'); return; }
            const time = new Date().toLocaleString('zh-CN', { hour12: false }).replaceAll('/', '-');
            drafts.forEach((draft, index) => {
                const resident = room.residents.find(item => String(item.bed) === String(draft.target));
                dormViolationRecords.unshift({
                    id: `dorm-record-${Date.now()}-${index}`,
                    roomId: room.id,
                    dorm: `${room.building} ${room.roomNo} 室`,
                    item: draft.name,
                    points: draft.points,
                    className: draft.scope === 'room' ? '全宿舍' : getClassDormResidentClass(resident || { mine: true }),
                    recorder: '周静怡',
                    time,
                    status: '待处理',
                    photo: state.dormViolationPhotoName || ''
                });
            });
            const count = drafts.length;
            state.dormViolationDraft = [];
            state.dormViolationPhotoName = '';
            state.classDormDetailTab = 'records';
            state.dormViolationFilter = '全部违纪';
            state.dormViolationDraftFilter = '全部违纪';
            renderClassModule();
            classModuleScroll.scrollTop = 0;
            showToast(`已提交 ${count} 项宿舍违纪`);
        }

            return classDisciplineSeed.find(item => item.id === recordId);

            return getClassDisplayName(getSelectedClass());

        function formatClassDisciplineTime(item) {
            return `${item.date} ${item.clock}`;
        }

        function getClassDisciplineDeduction(item) {
            return item.status === 'processed' ? Number(item.finalPoints ?? item.points) : Number(item.points);
        }

        function classDisciplineRowMarkup(item, origin = 'class-discipline', showStatus = false) {
            const deduction = getClassDisciplineDeduction(item);
            if (origin === 'class-discipline') {
                return `<button type="button" class="class-record-row class-discipline-list-row" data-action="open-class-discipline-detail" data-class-discipline-id="${escapeHtml(item.id)}" data-class-discipline-origin="class-discipline" aria-label="查看${escapeHtml(item.location)}${escapeHtml(item.item)}违纪详情，扣${deduction}分">

        function getClassAssessmentWeekSummary(week) {

            return {
                week,
                rank: classAssessmentRankByWeek[week],
                records,
                totalDeduction: processedDeduction + pendingDeduction,
                processedDeduction,
                pendingDeduction

        function getCurrentStudentClassInfo(data = currentData()) {
            return schoolClasses.find(item => item.name === data.className) || getSelectedClass();
        }

        function getCurrentStudentLiveState(data = currentData()) {
            const classInfo = getCurrentStudentClassInfo(data);
            const handled = getStudentStatusHandledSet(classInfo);
            const statusMap = getStudentStatusMap(classInfo);
            const fallbackStatus = normalizeAttendanceStatus(data.currentAttendance || '在校');
            const primary = handled.has(data.id) && ['在校','请假'].includes(statusMap[data.id])
                ? statusMap[data.id]
                : (fallbackStatus === '请假' ? '请假' : '在校');
            return { classInfo, primary, meal: getStudentMealSet(classInfo).has(data.id) || fallbackStatus === '就餐' };
        }

        function getStudentLiveStatusAudit(data = currentData()) {
            const latestRecord = [...(data.attendanceRecords || [])]
                .sort((left, right) => `${right.date || ''} ${right.time || ''}`.localeCompare(`${left.date || ''} ${left.time || ''}`))[0];
            return {
                updatedAt: data.liveStatusUpdatedAt || [latestRecord?.date, latestRecord?.time].filter(Boolean).join(' ') || data.updatedAt || '暂无记录',
                operator: getStudentStatusOperatorFullName(data.liveStatusUpdatedBy || latestRecord?.recordedBy, data)
            };
        }

        function getStudentStatusOperatorFullName(operator = '', data = currentData()) {
            const raw = String(operator || '').trim();
            const classTeacher = getCurrentStudentClassInfo(data)?.teacher || getSelectedClass()?.teacher || '';
            if (raw && !raw.endsWith('老师') && raw !== '系统同步') return raw;
            const surname = raw.endsWith('老师') ? raw.slice(0, -2) : '';
            if (surname && classTeacher.startsWith(surname)) return classTeacher;
            const matches = [...new Set(schoolClasses.map(item => item.teacher).filter(Boolean))].filter(name => surname && name.startsWith(surname));
            if (matches.length === 1) return matches[0];
            return classTeacher || '系统同步';
        }

        function getStudentAcademicStatusAudit(data = currentData()) {
            return {
                updatedAt: data.academicStatusUpdatedAt || data.statusChangedAt || data.updatedAt || '暂无记录',
                operator: getStudentStatusOperatorFullName(data.academicStatusUpdatedBy || data.statusChangedBy, data)
            };
        }

            const data = currentData();

            const academicAudit = getStudentAcademicStatusAudit(data);
            const academicStatuses = ['新生注册','在读','休学','退学','毕业'];
            if (!academicStatuses.includes(state.pendingAcademicStatus)) state.pendingAcademicStatus = academicStatuses.includes(data.studentStatus) ? data.studentStatus : '在读';
            const realtimeAvailable = canEditStudentRealtimeStatus(data);
            const realtimeStatus = live.meal ? '就餐' : live.primary;

            if (title) title.textContent = '学生状态';
            attendanceView.setAttribute('aria-label', `${data.name}的学生状态`);

                    ${realtimeAvailable ? `<div class="student-live-actions">

                        <button type="button" class="student-live-action${realtimeStatus === '请假' ? ' active' : ''}" data-action="set-student-realtime-status" data-realtime-status="请假" aria-pressed="${realtimeStatus === '请假' ? 'true' : 'false'}">请假</button>
                        <button type="button" class="student-live-action${realtimeStatus === '就餐' ? ' active' : ''}" data-action="set-student-realtime-status" data-realtime-status="就餐" aria-pressed="${realtimeStatus === '就餐' ? 'true' : 'false'}">就餐</button>

                </section>

                    <div class="student-live-section-head"><span><strong>档案状态</strong></span></div>

                        <button type="button" class="student-academic-confirm" data-action="confirm-student-academic-status"${state.pendingAcademicStatus === data.studentStatus ? ' disabled' : ''}>确认修改</button>
                    </div>
                    <div class="student-status-audit" aria-label="档案状态操作记录"><span>操作时间 ${escapeHtml(academicAudit.updatedAt)}</span><strong>操作人 ${escapeHtml(academicAudit.operator)}</strong></div>
                </section>
            </section>`;

        function openStudentAttendance() {
            const academicStatuses = ['新生注册','在读','休学','退学','毕业'];
            state.pendingAcademicStatus = academicStatuses.includes(currentData().studentStatus) ? currentData().studentStatus : '在读';
            renderAttendancePage();
            setView('attendance');
            attendanceScroll.scrollTop = 0;
            focusAfterViewChange(attendanceBackButton);
        }

        function setStudentRealtimeStatus(status) {
            if (!rollcallStatuses.includes(status)) return;
            const data = currentData();
            if (!canEditStudentRealtimeStatus(data)) {
                showToast(`当前学籍状态为${data.studentStatus || '未设置'}，不可调整实时状态`);
                return;
            }
            const classInfo = getCurrentStudentClassInfo(data);
            const statusMap = getStudentStatusMap(classInfo);
            const mealSet = getStudentMealSet(classInfo);
            let feedback = '';
            if (status === '就餐') {
                const wasMeal = mealSet.has(data.id) || normalizeAttendanceStatus(data.currentAttendance || '') === '就餐';
                if (wasMeal) {
                    mealSet.delete(data.id);
                    data.currentAttendance = ['在校','请假'].includes(statusMap[data.id]) ? statusMap[data.id] : '在校';
                    feedback = `${data.name}已取消就餐`;
                } else {
                    mealSet.add(data.id);
                    if (!['在校','请假'].includes(statusMap[data.id])) statusMap[data.id] = '在校';
                    data.currentAttendance = '就餐';
                    markStudentStatusHandled(data.id, classInfo);
                    feedback = `${data.name}已勾选就餐`;
                }
                saveStudentMealSet(mealSet, classInfo);
            } else {
                if (mealSet.delete(data.id)) saveStudentMealSet(mealSet, classInfo);
                statusMap[data.id] = status;
                data.currentAttendance = status;
                markStudentStatusHandled(data.id, classInfo);
                feedback = `${data.name}已设为${status}`;
            }
            data.liveStatusUpdatedAt = new Date().toLocaleString('zh-CN', { hour12: false }).replaceAll('/', '-');
            data.liveStatusUpdatedBy = getStudentStatusOperatorFullName('', data);
            renderAttendancePage();
            renderAll();
            requestAnimationFrame(() => attendanceRoot.querySelector(`[data-realtime-status="${status}"]`)?.focus({ preventScroll: true }));
            showToast(feedback);
        }

        function confirmStudentAcademicStatus() {
            const data = currentData();
            if (!state.pendingAcademicStatus || state.pendingAcademicStatus === data.studentStatus) return;
            data.studentStatus = state.pendingAcademicStatus;
            data.academicStatusUpdatedAt = new Date().toLocaleString('zh-CN', { hour12: false }).replaceAll('/', '-');
            data.academicStatusUpdatedBy = getStudentStatusOperatorFullName('', data);
            data.statusChangedAt = data.academicStatusUpdatedAt;
            data.updatedAt = data.academicStatusUpdatedAt;
            renderAttendancePage();
            renderAll();
            showToast(`${data.name}的学籍状态已改为${data.studentStatus}`);
