<!DOCTYPE html>
<!-- 版本 7.0：主能力水平直连，一级能力采用垂直主干与短横向分支，并增加主线逐级解锁门控 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#EFF6FF">
    <title>抖学 AI 能力模型 · 正交主线与一级分支</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#1F5FFF',
                        ink: '#172033',
                        mastered: '#12B981'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
                    },
                    boxShadow: {
                        soft: '0 4px 20px -4px rgba(0,0,0,0.03), 0 2px 8px -2px rgba(0,0,0,0.02)'
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --brand: #1F5FFF;
            --mastered: #12B981;
            --muted: #94A3B8;
            --zoom: 1;
            --stage-gutter-x: 0px;
            --stage-gutter-y: 0px;
            --stage-gutter-width: 0px;
            --stage-gutter-height: 0px;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #EFF6FF 0%, #DFE7FF 100%);
        }

        button {
            -webkit-appearance: none;
        }

        .app-shell {
            width: min(1300px, 100vw);
            height: min(813px, 100vh);
            height: min(813px, 100dvh);
        }

        .workspace {
            height: calc(100% - 64px);
            grid-template-columns: 300px minmax(0, 1fr);
        }

        .native-scroll {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        #canvas-scroll {
            background-color: #FFFFFF;
            background-image: radial-gradient(
                circle,
                #D7DEE9 calc(1.35px * var(--zoom)),
                transparent calc(1.45px * var(--zoom))
            );
            background-size: calc(26px * var(--zoom)) calc(26px * var(--zoom));
            background-attachment: local;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-scroll.is-mouse-panning,
        #canvas-scroll.is-mouse-panning * {
            cursor: grabbing !important;
        }

        .no-scrollbar {
            scrollbar-width: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .goal-progress-fill {
            width: 100%;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 880ms cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .goal-group-content {
            display: grid;
            grid-template-rows: 1fr;
            margin-top: 10px;
            opacity: 1;
            transition: grid-template-rows 260ms cubic-bezier(0.16, 1, 0.3, 1),
                        margin-top 260ms cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 180ms ease;
        }

        .goal-group-content.is-collapsed {
            grid-template-rows: 0fr;
            margin-top: 0;
            opacity: 0;
        }

        .goal-group-clip {
            min-height: 0;
            overflow: hidden;
        }

        .stage-shell {
            position: relative;
            width: calc(2100px * var(--zoom) + var(--stage-gutter-width));
            height: calc(1150px * var(--zoom) + var(--stage-gutter-height));
            min-width: calc(2100px * var(--zoom) + var(--stage-gutter-width));
            min-height: calc(1150px * var(--zoom) + var(--stage-gutter-height));
        }

        .skill-stage {
            position: absolute;
            left: var(--stage-gutter-x);
            top: var(--stage-gutter-y);
            width: 2100px;
            height: 1150px;
            transform: scale(var(--zoom));
            transform-origin: left top;
            background: transparent;
            will-change: transform;
        }

        .level-node {
            position: absolute;
            z-index: 2;
            width: 194px;
            min-height: 104px;
            transform: translate(-50%, -52px);
            border: 1px solid #DBE5F3;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 8px 28px -12px rgba(30, 64, 175, 0.20);
            padding: 14px 16px;
            opacity: 1;
            transition: left 800ms cubic-bezier(0.16, 1, 0.3, 1),
                        top 800ms cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 520ms ease,
                        background-color 520ms ease,
                        opacity 300ms ease-out,
                        transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .level-node::after {
            content: '';
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: -1px;
            height: 3px;
            border-radius: 999px 999px 0 0;
            background: #CBD5E1;
        }

        .level-node.level-mastered {
            border-color: #B7E7D6;
            background: #F7FFFC;
        }

        .level-node.level-mastered::after {
            background: #12B981;
        }

        .level-node.level-active {
            border-color: #BFD0FF;
            background: #F7F9FF;
        }

        .level-node.level-active::after {
            background: #1F5FFF;
        }

        .level-node.level-locked {
            border-color: #E2E8F0;
            background: #F8FAFC;
            box-shadow: none;
        }

        .level-node.level-locked [data-level-title] {
            color: #94A3B8;
        }

        .level-node.is-entering,
        .level-node.is-leaving {
            opacity: 0;
            transform: translate(-50%, -52px) scale(0.92);
        }

        .skill-node {
            position: absolute;
            z-index: 3;
            display: flex;
            width: 168px;
            min-height: 64px;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            transform: translate(-50%, -32px);
            transform-origin: 50% 32px;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 4px 16px -10px rgba(15, 23, 42, 0.16);
            text-align: left;
            opacity: 1;
            transition: left 800ms cubic-bezier(0.16, 1, 0.3, 1),
                        top 800ms cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 520ms ease,
                        background-color 520ms ease,
                        box-shadow 180ms ease,
                        transform 400ms cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        opacity 300ms ease-out;
        }

        .skill-node:hover {
            border-color: #CBD5E1;
            box-shadow: 0 8px 24px -10px rgba(15, 23, 42, 0.20);
        }

        .skill-node.is-entering,
        .skill-node.is-leaving {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -32px) scale(0.92);
        }

        .skill-node:not(.is-entering):not(.is-leaving):active {
            transform: translate(-50%, -32px) scale(0.95);
        }

        .node-shape {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            border-width: 1.5px;
            border-style: solid;
            border-radius: 12px;
            position: relative;
            transition: box-shadow 180ms ease,
                        transform 180ms ease,
                        color 520ms ease,
                        border-color 520ms ease,
                        background-color 520ms ease;
        }

        .node-shape i {
            display: block;
            line-height: 1;
        }

        [data-node-title],
        [data-node-status] {
            transition: color 520ms ease;
        }

        .skill-node[aria-pressed="true"] {
            border-color: #1F5FFF;
            box-shadow: 0 0 0 5px rgba(31, 95, 255, 0.10);
        }

        .node-mastered .node-shape {
            color: #12B981;
            border-color: #12B981;
            background: #FFFFFF;
            box-shadow: none;
        }

        .skill-node.node-mastered,
        .skill-node.node-milestone-mastered {
            border-color: #CDEFE2;
            background: #F7FFFC;
        }

        .node-active .node-shape,
        .node-milestone-active .node-shape {
            color: #FFFFFF;
            border-color: #1F5FFF;
            background: #1F5FFF;
            animation: pulse-glow 2s infinite;
        }

        .skill-node.node-active,
        .skill-node.node-milestone-active {
            border-color: #C9D7FF;
            background: #F7F9FF;
        }

        .node-milestone-active .node-shape {
            border-radius: 16px;
        }

        .node-locked .node-shape {
            color: #C9D4E5;
            border-color: #D7E0ED;
            background: #FFFFFF;
        }

        .skill-node.node-locked,
        .skill-node.node-milestone-locked {
            border-color: #E2E8F0;
            background: #F8FAFC;
            box-shadow: none;
        }

        .skill-node.node-locked [data-node-title],
        .skill-node.node-milestone-locked [data-node-title] {
            color: #94A3B8;
        }

        .node-milestone-locked .node-shape {
            color: #FFFFFF;
            border-color: #CBD5E1;
            background: #CBD5E1;
        }

        .node-milestone-mastered .node-shape {
            color: #FFFFFF;
            border-color: #12B981;
            background: #12B981;
            box-shadow: none;
        }

        .skill-node.node-mastered[aria-pressed="true"],
        .skill-node.node-milestone-mastered[aria-pressed="true"] {
            border-color: #12B981;
            box-shadow: 0 0 0 5px rgba(18, 185, 129, 0.10);
        }

        .skill-node.is-unlocking .node-shape {
            animation: unlock-reveal 900ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mastery-burst {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 5;
            width: 8px;
            height: 8px;
            margin: -4px 0 0 -4px;
            border-radius: 999px;
            pointer-events: none;
        }

        .mastery-burst::before,
        .mastery-burst::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: #FBBF24;
            opacity: 0;
            transform: scale(0.08) rotate(-8deg);
            box-shadow:
                0 -58px #FBBF24,
                41px -41px #60A5FA,
                58px 0 #A78BFA,
                41px 41px #34D399,
                0 58px #FB7185,
                -41px 41px #F59E0B,
                -58px 0 #22D3EE,
                -41px -41px #4ADE80;
            animation: mastery-firework 820ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .mastery-burst::after {
            width: 5px;
            height: 5px;
            margin: 1.5px;
            background: #FFFFFF;
            box-shadow:
                0 -42px #FFFFFF,
                30px -30px #FDE68A,
                42px 0 #BFDBFE,
                30px 30px #A7F3D0,
                0 42px #FBCFE8,
                -30px 30px #FED7AA,
                -42px 0 #CFFAFE,
                -30px -30px #DCFCE7;
            animation-delay: 70ms;
        }

        .mastery-burst-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(251, 191, 36, 0.78);
            border-radius: 999px;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.2);
            animation: mastery-ring 680ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .line-bundle {
            opacity: 1;
            transition: opacity 360ms ease;
        }

        .line-bundle.is-retired {
            opacity: 0;
        }

        .graph-line {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
            transition: stroke 800ms ease, opacity 360ms ease;
        }

        .line-bundle.connection-main .graph-line {
            stroke-width: 6;
        }

        .line-bundle.connection-branch-trunk .graph-line {
            stroke-width: 3;
            opacity: 0.78;
        }

        .line-bundle.connection-branch-arm .graph-line,
        .line-bundle.connection-branch-direct .graph-line {
            stroke-width: 2.5;
            opacity: 0.9;
        }

        .line-bundle.is-morphing {
            filter: drop-shadow(0 0 6px rgba(31, 95, 255, 0.16));
        }

        .line-bundle.is-active .graph-line {
            filter: drop-shadow(0 0 3px rgba(31, 95, 255, 0.18));
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.50); }
            70% { box-shadow: 0 0 0 16px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        @keyframes unlock-reveal {
            0% { transform: scale(0.72); box-shadow: 0 0 0 0 rgba(31, 95, 255, 0); }
            42% { transform: scale(1.09); box-shadow: 0 0 0 12px rgba(31, 95, 255, 0.14); }
            100% { transform: scale(1); box-shadow: 0 0 0 22px rgba(31, 95, 255, 0); }
        }

        @keyframes mastery-firework {
            0% { opacity: 0; transform: scale(0.08) rotate(-8deg); }
            14% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.08) rotate(7deg); }
        }

        @keyframes mastery-ring {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
            22% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(3.15); }
        }

        .drawer {
            transform: translateX(102%);
            transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .drawer.is-open {
            transform: translateX(0);
        }

        .modal-layer {
            opacity: 0;
            visibility: hidden;
            transition: opacity 180ms ease, visibility 180ms ease;
        }

        .modal-layer.is-open {
            opacity: 1;
            visibility: visible;
        }

        .modal-panel {
            transform: translateY(16px) scale(0.97);
            transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-layer.is-open .modal-panel {
            transform: translateY(0) scale(1);
        }

        .zoom-menu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 160ms ease, visibility 160ms ease, transform 160ms ease;
        }

        .zoom-menu.is-open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        @media (max-width: 1120px) {
            .workspace {
                grid-template-columns: 260px minmax(0, 1fr);
            }
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 224px minmax(0, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

        }
    </style>
</head>
<body class="font-sans text-ink antialiased">
    <div class="app-shell mx-auto flex flex-col overflow-hidden p-5">
        <header class="mb-3 flex h-[52px] shrink-0 items-center justify-between px-0.5">
            <div class="flex min-w-0 items-center gap-4">
                <button id="back-button" type="button" aria-label="返回上一页" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-white text-slate-600 shadow-soft transition active:scale-90">
                    <i class="ph-bold ph-caret-left text-xl" aria-hidden="true"></i>
                </button>
                <h1 class="truncate text-[32px] font-extrabold leading-none tracking-[-0.03em] text-slate-950">抖学 AI 能力模型</h1>
            </div>

            <div class="flex min-h-11 shrink-0 items-center gap-5 rounded-2xl border border-slate-200/80 bg-white/80 px-5 shadow-soft backdrop-blur">
                <span class="flex items-center gap-2 text-[13px] font-semibold text-slate-600"><span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>已掌握</span>
                <span class="flex items-center gap-2 text-[13px] font-semibold text-slate-600"><span class="h-2.5 w-2.5 rounded-full bg-brand"></span>攻坚中</span>
                <span class="flex items-center gap-2 text-[13px] font-semibold text-slate-600"><span class="h-2.5 w-2.5 rounded-full border-2 border-slate-300 bg-white"></span>待解锁</span>
            </div>
        </header>

        <main class="workspace grid min-h-0 gap-[18px]">
            <aside class="no-scrollbar native-scroll rounded-[24px] bg-white px-[22px] py-[22px] shadow-soft" aria-label="学习目标">
                <div id="goal-list" class="space-y-6"></div>
            </aside>

            <section class="relative min-w-0 overflow-hidden rounded-[24px] bg-white shadow-soft" aria-label="主能力横向主线与一级子能力分支画布">
                <div id="canvas-scroll" class="no-scrollbar native-scroll absolute inset-0">
                    <div class="stage-shell">
                        <div id="skill-stage" class="skill-stage" aria-live="polite"></div>
                    </div>
                </div>

                <aside id="node-drawer" class="drawer absolute inset-y-0 right-0 z-30 flex w-[360px] max-w-[calc(100%_-_40px)] flex-col border-l border-slate-100 bg-white shadow-[-16px_0_40px_rgba(15,23,42,0.08)]" aria-label="节点训练详情" aria-hidden="true">
                    <div class="flex items-start justify-between gap-3 px-5 pb-3 pt-5">
                        <div class="min-w-0">
                            <h2 id="drawer-title" class="truncate text-[24px] font-extrabold tracking-[-0.02em] text-slate-800"></h2>
                            <div id="drawer-status" class="mt-1.5 flex items-center gap-3"></div>
                        </div>
                        <button id="close-drawer" type="button" aria-label="关闭节点详情" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-slate-400 transition hover:bg-slate-50 active:scale-90">
                            <i class="ph-bold ph-x text-[24px]" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div id="drawer-content" class="no-scrollbar native-scroll min-h-0 flex-1 px-5 pb-5 pt-1"></div>
                </aside>

                <div class="absolute bottom-5 right-5 z-20">
                    <div id="zoom-menu" class="zoom-menu absolute bottom-[54px] right-0 w-44 overflow-hidden rounded-[20px] border border-white/90 bg-white/95 p-2 shadow-[0_14px_40px_rgba(15,23,42,0.14)] backdrop-blur" role="menu" aria-hidden="true">
                        <div id="zoom-options" class="space-y-0.5"></div>
                        <div class="my-1.5 h-px bg-slate-100"></div>
                        <button id="fit-content" type="button" role="menuitem" class="flex min-h-11 w-full items-center rounded-xl px-3 text-left text-[14px] font-semibold text-slate-700 transition hover:bg-slate-50 active:scale-95">缩放以适合内容</button>
                    </div>
                    <button id="zoom-trigger" type="button" title="滚轮或双指捏合可自由缩放" aria-haspopup="menu" aria-expanded="false" aria-label="当前缩放比例，打开缩放菜单；滚轮或双指捏合可自由缩放" class="flex h-12 min-w-[112px] items-center justify-center gap-2 rounded-full border border-white/80 bg-white/55 px-5 text-[15px] font-extrabold text-slate-900 shadow-[0_12px_32px_rgba(30,64,175,0.12),inset_0_1px_0_rgba(255,255,255,0.95)] backdrop-blur-xl transition hover:bg-white/70 active:scale-95">
                        <span id="zoom-label" class="font-mono">100%</span>
                        <i class="ph-bold ph-caret-down text-sm text-slate-400" aria-hidden="true"></i>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <div id="confirm-modal" class="modal-layer fixed inset-0 z-50 flex items-center justify-center bg-slate-900/35 p-5 backdrop-blur-[3px]" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-panel w-full max-w-[390px] rounded-[24px] bg-white p-6 shadow-[0_24px_70px_rgba(15,23,42,0.20)]">
            <h2 id="modal-title" class="text-center text-[20px] font-extrabold text-slate-900">要更改训练方案吗？</h2>
            <p class="mt-3 text-center text-[14px] leading-6 text-slate-500">
                <span class="block">更改训练方案不会清除当前练习进度，</span>
                <span class="block">之后可随时切换回来继续完成训练。</span>
            </p>
            <div class="mt-6 grid grid-cols-2 gap-3">
                <button id="cancel-change" type="button" class="min-h-12 rounded-[14px] bg-slate-100 px-4 text-[15px] font-bold text-slate-600 transition active:scale-95">取消</button>
                <button id="confirm-change" type="button" class="min-h-12 rounded-[14px] bg-red-500 px-4 text-[15px] font-bold text-white transition active:scale-95">确认更改</button>
            </div>
        </div>
    </div>

    <div id="toast" class="pointer-events-none fixed bottom-7 left-1/2 z-[60] -translate-x-1/2 translate-y-4 rounded-full bg-slate-900/90 px-5 py-3 text-[14px] font-semibold text-white opacity-0 shadow-xl transition" role="status" aria-live="polite"></div>

    <script>
        const planOptions = [
            {
                id: 'ai-smart',
                name: 'AI 智能强化',
                description: '按薄弱点动态调整题量与练习顺序',
                recommended: true
            },
            {
                id: 'high-frequency',
                name: '高频考点突击',
                description: '优先攻克考试中的高频核心知识'
            },
            {
                id: 'foundation',
                name: '地毯式巩固',
                description: '完整覆盖当前节点的全部知识点'
            }
        ];

        const GOAL_TITLE_MAX_LENGTH = 14;
        const MODE_NAMES = ['音记', '题库', '游戏'];
        const GROUP_NAME_BY_TONE = {
            active: '攻坚中',
            idle: '未开始',
            mastered: '已掌握'
        };
        const STATUS_META = {
            mastered: { label: '已掌握', nodeClass: 'node-mastered', text: 'text-emerald-600', badge: 'bg-emerald-50 text-emerald-600', icon: 'ph-check' },

        function getRankedNodeGroups(goal) {

            const outgoing = new Map(goal.nodes.map(node => [node.id, []]));
            const rankById = new Map(goal.nodes.map(node => [node.id, 0]));

            goal.links.forEach(([sourceId, targetId]) => {

                indegree.set(targetId, indegree.get(targetId) + 1);

            const queue = goal.nodes.filter(node => indegree.get(node.id) === 0).map(node => node.id);
