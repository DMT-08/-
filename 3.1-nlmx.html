                            const horizontalStart = firstHorizontal ? firstStart : secondStart;
                            const horizontalEnd = firstHorizontal ? firstEnd : secondEnd;
                            const verticalStart = firstHorizontal ? secondStart : firstStart;
                            const verticalEnd = firstHorizontal ? secondEnd : firstEnd;
                            const crossX = verticalStart.x;
                            const crossY = horizontalStart.y;
                            if (crossX > Math.min(horizontalStart.x, horizontalEnd.x) + 1 && crossX < Math.max(horizontalStart.x, horizontalEnd.x) - 1 && crossY > Math.min(verticalStart.y, verticalEnd.y) + 1 && crossY < Math.max(verticalStart.y, verticalEnd.y) - 1) {
                                crossings += 1;
                            }
                        }
                    }
                }
                return { conflict: false, crossings: crossings };
            }

            function topologyChannelIntentV143(index, count) {
                if (count <= 1) return { band: 'middle', depth: 0, index: index, count: count };
                const centeredIndex = index - (count - 1) / 2;
                return {
                    band: Math.abs(centeredIndex) < 0.1 ? 'middle' : (centeredIndex < 0 ? 'top' : 'bottom'),
                    depth: Math.abs(centeredIndex),
                    index: index,
                    count: count
                };
            }

            function topologyEdgeChannelProfilesV143(records) {
                const outgoing = new Map();
                const incoming = new Map();
                const profiles = new Map(records.map(function (record) {
                    return [record.edge.id, { record: record, sourceIntent: null, targetIntent: null }];
                }));
                records.forEach(function (record) {
                    if (!outgoing.has(record.edge.source)) outgoing.set(record.edge.source, []);
                    if (!incoming.has(record.edge.target)) incoming.set(record.edge.target, []);
                    outgoing.get(record.edge.source).push(record);
                    incoming.get(record.edge.target).push(record);
                });
                outgoing.forEach(function (group) {
                    group.sort(function (first, second) {
                        return first.end.y - second.end.y || first.end.x - second.end.x || first.edge.id.localeCompare(second.edge.id);
                    });
                    group.forEach(function (record, index) {
                        const slotIndex = record.startPort && Number.isInteger(record.startPort.slotIndex) ? record.startPort.slotIndex : index;
                        profiles.get(record.edge.id).sourceIntent = topologyChannelIntentV143(slotIndex, group.length);
                    });
                });
                incoming.forEach(function (group) {
                    group.sort(function (first, second) {
                        return first.start.y - second.start.y || first.start.x - second.start.x || first.edge.id.localeCompare(second.edge.id);
                    });
                    group.forEach(function (record, index) {
                        const slotIndex = record.endPort && Number.isInteger(record.endPort.slotIndex) ? record.endPort.slotIndex : index;
                        profiles.get(record.edge.id).targetIntent = topologyChannelIntentV143(slotIndex, group.length);
                    });
                });
                profiles.forEach(function (profile) {
                    const sourceIntent = profile.sourceIntent || topologyChannelIntentV143(0, 1);
                    const targetIntent = profile.targetIntent || topologyChannelIntentV143(0, 1);
                    const activeIntents = [sourceIntent, targetIntent].filter(function (intent) { return intent.band !== 'middle'; });
                    let preferredBand = 'middle';
                    if (activeIntents.length === 1 || (activeIntents.length === 2 && activeIntents[0].band === activeIntents[1].band)) {
                        preferredBand = activeIntents[0].band;
                    } else if (activeIntents.length === 2) {
                        const deltaY = profile.record.end.y - profile.record.start.y;
                        const naturalBand = Math.abs(deltaY) < 0.1 ? null : (deltaY < 0 ? 'top' : 'bottom');
                        if (naturalBand && activeIntents.some(function (intent) { return intent.band === naturalBand; })) {
                            preferredBand = naturalBand;
                        } else {
                            preferredBand = targetIntent.count >= sourceIntent.count ? targetIntent.band : sourceIntent.band;
                        }
                    }
                    profile.preferredBand = preferredBand;
                    profile.depth = Math.max.apply(null, [sourceIntent, targetIntent].filter(function (intent) {
                        return intent.band === preferredBand;
                    }).map(function (intent) { return intent.depth; }).concat([0]));
                    profile.pressure = Math.max(sourceIntent.count, targetIntent.count);
                });
                return profiles;
            }

            function topologyPathTrunkYV143(points) {
                const horizontalSegments = [];
                for (let index = 0; index < points.length - 1; index += 1) {
                    if (Math.abs(points[index].y - points[index + 1].y) > 0.1) continue;
                    horizontalSegments.push({
                        y: points[index].y,
                        length: Math.abs(points[index + 1].x - points[index].x),
                        interior: index > 0 && index < points.length - 2
                    });
                }
                horizontalSegments.sort(function (first, second) {
                    return second.length - first.length || Number(second.interior) - Number(first.interior) || first.y - second.y;
                });
                return horizontalSegments.length ? horizontalSegments[0].y : (points[0].y + points[points.length - 1].y) / 2;
            }

            function topologyCandidateChannelScoreV143(points, profile) {
                if (!profile) return { violations: 0, preferredViolation: 0, deviation: 0, trunkY: topologyPathTrunkYV143(points) };
                const trunkY = topologyPathTrunkYV143(points);
                let violations = 0;
                let deviation = 0;
                const verticalSegments = [];
                for (let index = 0; index < points.length - 1; index += 1) {
                    if (Math.abs(points[index].x - points[index + 1].x) < 0.1 && Math.abs(points[index].y - points[index + 1].y) > 0.1) {
                        verticalSegments.push({ fromY: points[index].y, toY: points[index + 1].y });
                    }
                }
                function intentResult(intent, endpoint) {
                    if (!intent || intent.band === 'middle' || !verticalSegments.length) return { violation: 0, deviation: 0 };
                    const segment = endpoint === 'source' ? verticalSegments[0] : verticalSegments[verticalSegments.length - 1];
                    let signedDistance = 0;
                    if (endpoint === 'source') signedDistance = segment.toY - segment.fromY;
                    else signedDistance = segment.fromY - segment.toY;
                    if (intent.band === 'top' && signedDistance > 0.1) return { violation: 1, deviation: signedDistance };
                    if (intent.band === 'bottom' && signedDistance < -0.1) return { violation: 1, deviation: -signedDistance };
                    return { violation: 0, deviation: 0 };
                }
                const sourceResult = intentResult(profile.sourceIntent, 'source');
                const targetResult = intentResult(profile.targetIntent, 'target');
                violations = sourceResult.violation + targetResult.violation;
                deviation = sourceResult.deviation + targetResult.deviation;
                let preferredViolation = 0;
                if (profile.sourceIntent && profile.sourceIntent.band === profile.preferredBand) preferredViolation += sourceResult.violation;
                if (profile.targetIntent && profile.targetIntent.band === profile.preferredBand) preferredViolation += targetResult.violation;
                return { violations: violations, preferredViolation: preferredViolation, deviation: deviation, trunkY: trunkY };
            }

            /* 16.4：节点穿越与线路黏连先硬过滤，再按交叉、折弯、长度依次选路。 */
            function selectLayeredOrthogonalRouteV143(options) {
                const ranked = [];
                options.candidates.forEach(function (candidatePoints, laneIndex) {
                    const points = topologyCompactOrthogonalPointsV132(candidatePoints);
                    if (!topologyRightLeftDirectionValidV139(points) || topologyForwardBacktrackV139(points)) return;
                    if (options.pathIsClear && !options.pathIsClear(points)) return;
                    const relation = topologyCandidateConflictV143(points, options.routed || []);
                    if (relation.conflict) return;
                    const channel = topologyCandidateChannelScoreV143(points, options.channelProfile);
                    ranked.push({
                        points: points,
                        length: topologyPathLengthV132(points),
                        bends: Math.max(0, points.length - 2),
                        crossings: relation.crossings,
                        channelViolations: channel.violations,
                        preferredChannelViolation: channel.preferredViolation,
                        channelDeviation: channel.deviation,
                        trunkY: channel.trunkY,
                        laneIndex: laneIndex
                    });
                });
                ranked.sort(function (first, second) {
                    return first.crossings - second.crossings ||
                        first.bends - second.bends ||
                        first.length - second.length ||
                        first.preferredChannelViolation - second.preferredChannelViolation ||
                        first.channelViolations - second.channelViolations ||
                        first.channelDeviation - second.channelDeviation ||
                        first.laneIndex - second.laneIndex;
                });
                return ranked[0] || null;
            }

            function topologyEdgeBaselineV137(edge, layout) {
                const source = layout.metricsById.get(edge.source);
                const target = layout.metricsById.get(edge.target);
                const horizontalGap = Math.max(0, Math.abs(target.centerX - source.centerX) - (source.width + target.width) / 2);
                const verticalGap = Math.max(0, Math.abs(target.centerY - source.centerY) - (source.height + target.height) / 2);
                return Math.max(44, horizontalGap + verticalGap);
            }

            function topologyCandidatePathsV143(startPort, endPort, lanes, layout) {
                const start = startPort.point;
                const end = endPort.point;
                const candidates = [];
                const seen = new Set();
                function add(points) {
                    const compact = topologyCompactOrthogonalPointsV132(points);
                    if (compact.length < 2 || compact.length - 2 > topologyRoutingConfigV143.maximumBends) return;
                    const key = compact.map(function (point) { return point.x.toFixed(1) + ':' + point.y.toFixed(1); }).join('|');
                    if (seen.has(key)) return;
                    seen.add(key);
                    candidates.push(compact);
                }

                if (end.x > start.x + 0.1 && Math.abs(start.y - end.y) < 0.1) add([start, end]);

                const fixedInsetColumns = [
                    start.x + Math.min(topologyRoutingConfigV143.trackInset, Math.max(1, end.x - start.x - 1)),
                    end.x - Math.min(topologyRoutingConfigV143.trackInset, Math.max(1, end.x - start.x - 1))
                ];
                const referenceColumns = fixedInsetColumns;
                let corridorXs = lanes.x.filter(function (x) {
                    return x > start.x + 0.1 && x < end.x - 0.1;
                }).sort(function (first, second) {
                    const firstDistance = Math.min.apply(null, referenceColumns.map(function (columnX) { return Math.abs(first - columnX); }));
                    const secondDistance = Math.min.apply(null, referenceColumns.map(function (columnX) { return Math.abs(second - columnX); }));
                    return firstDistance - secondDistance || first - second;
                });
                corridorXs.forEach(function (x) {
                    add([start, { x: x, y: start.y }, { x: x, y: end.y }, end]);
                });

                // 四折点只作为真实节点阻挡、端口黏线或循环反向边的外围避障回退。
                const forward = end.x > start.x;
                let sourceXs = lanes.x.filter(function (x) {
                    return x > start.x + 0.1 && (!forward || x < end.x - 0.1);
                }).sort(function (first, second) {
                    return Math.abs(first - start.x) - Math.abs(second - start.x) || first - second;
                }).slice(0, 8);
                let targetXs = lanes.x.filter(function (x) {
                    return x < end.x - 0.1 && (!forward || x > start.x + 0.1);
                }).sort(function (first, second) {
                    return Math.abs(first - end.x) - Math.abs(second - end.x) || second - first;
                }).slice(0, 8);
                const yValues = Array.from(new Set(lanes.y.concat([
                    layout.bounds.top - topologyRoutingConfigV143.outerMargin,
                    layout.bounds.bottom + topologyRoutingConfigV143.outerMargin
                ]))).filter(function (y) {
                    return y > 0 && y < layout.viewHeight;
                }).sort(function (first, second) {
                    const firstCost = Math.abs(first - start.y) + Math.abs(first - end.y);
                    const secondCost = Math.abs(second - start.y) + Math.abs(second - end.y);
                    return firstCost - secondCost || Math.abs(first - (start.y + end.y) / 2) - Math.abs(second - (start.y + end.y) / 2) || first - second;
                });
                sourceXs.forEach(function (sourceX) {
                    targetXs.forEach(function (targetX) {
                        if (forward && sourceX > targetX + 0.1) return;
                        yValues.forEach(function (y) {
                            add([
                                start,
                                { x: sourceX, y: start.y },
                                { x: sourceX, y: y },
                                { x: targetX, y: y },
                                { x: targetX, y: end.y },
                                end
                            ]);
                        });
                    });
                });
                return candidates;
            }

            function topologyForwardBacktrackV139(points) {
                const forward = points[points.length - 1].x > points[0].x;
                if (!forward) return false;
                for (let index = 0; index < points.length - 1; index += 1) {
                    const horizontal = Math.abs(points[index + 1].y - points[index].y) < 0.1;
                    if (horizontal && points[index + 1].x < points[index].x - 0.1) return true;
                }
                return false;
            }

            function routeOrthogonalRecordsV143(records, options) {
                const profiles = topologyEdgeChannelProfilesV143(records);
                function baseLength(record) {
                    return record.baseline != null
                        ? record.baseline
                        : Math.abs(record.end.x - record.start.x) + Math.abs(record.end.y - record.start.y);
                }
                function compareId(first, second) {
                    return first.edge.id.localeCompare(second.edge.id);
                }
                const strategies = [
                    records.slice().sort(function (first, second) {
                        const firstProfile = profiles.get(first.edge.id);
                        const secondProfile = profiles.get(second.edge.id);
                        return firstProfile.depth - secondProfile.depth ||
                            (first.span || 1) - (second.span || 1) ||
                            baseLength(first) - baseLength(second) || compareId(first, second);
                    }),
                    records.slice().sort(function (first, second) {
                        return first.end.y - second.end.y || first.start.y - second.start.y || compareId(first, second);
                    }),
                    records.slice().sort(function (first, second) {
                        return first.start.y - second.start.y || first.end.y - second.end.y || compareId(first, second);
                    }),
                    records.slice().sort(function (first, second) {
                        return baseLength(first) - baseLength(second) || (first.span || 1) - (second.span || 1) || compareId(first, second);
                    }),
                    records.slice().sort(function (first, second) {
                        const firstProfile = profiles.get(first.edge.id);
                        const secondProfile = profiles.get(second.edge.id);
                        return secondProfile.pressure - firstProfile.pressure ||
                            firstProfile.depth - secondProfile.depth || baseLength(first) - baseLength(second) || compareId(first, second);
                    })
                ];
                strategies.push(strategies[0].slice().reverse());
                const uniqueStrategies = [];
                const seenStrategies = new Set();
                strategies.forEach(function (strategy) {
                    const signature = strategy.map(function (record) { return record.edge.id; }).join('|');
                    if (seenStrategies.has(signature)) return;
                    seenStrategies.add(signature);
                    uniqueStrategies.push(strategy);
                });

                const successful = [];
                let lastError = null;
                uniqueStrategies.forEach(function (orderedRecords) {
                    try {
                        const routed = [];
                        orderedRecords.forEach(function (record) {
                            const profile = profiles.get(record.edge.id);
                            const selected = selectLayeredOrthogonalRouteV143({
                                edge: record.edge,
                                candidates: options.candidates(record),
                                routed: routed,
                                channelProfile: profile,
                                pathIsClear: function (points) { return options.pathIsClear(points, record); }
                            });
                            if (!selected) throw new Error(record.edge.id + '没有满足独立线距的可用正交路径。');
                            routed.push({
                                edge: record.edge,
                                points: selected.points,
                                d: topologyOrthogonalPathDataV132(selected.points),
                                kind: selected.bends === 0 ? 'direct' : (selected.bends <= 2 ? 'single-dogleg' : 'obstacle-detour'),
                                laneIndex: selected.laneIndex,
                                length: selected.length,
                                bends: selected.bends,
                                crossings: selected.crossings,
                                channelBand: profile.preferredBand,
                                channelDepth: profile.depth,
                                channelViolations: selected.channelViolations,
                                preferredChannelViolation: selected.preferredChannelViolation,
                                trunkY: selected.trunkY
                            });
                        });
                        if (options.validate) options.validate(routed);
                        successful.push({
                            routes: routed,
                            crossings: routed.reduce(function (sum, route) { return sum + route.crossings; }, 0),
                            preferredChannelViolations: routed.reduce(function (sum, route) { return sum + route.preferredChannelViolation; }, 0),
                            channelViolations: routed.reduce(function (sum, route) { return sum + route.channelViolations; }, 0),
                            length: routed.reduce(function (sum, route) { return sum + route.length; }, 0),
                            bends: routed.reduce(function (sum, route) { return sum + route.bends; }, 0),
                            directCount: routed.filter(function (route) { return route.bends === 0; }).length
                        });
                    } catch (error) {
                        lastError = error;
                    }
                });
                successful.sort(function (first, second) {
                    return first.crossings - second.crossings ||
                        first.bends - second.bends ||
                        first.length - second.length ||
                        first.preferredChannelViolations - second.preferredChannelViolations ||
                        first.channelViolations - second.channelViolations ||
                        second.directCount - first.directCount;
                });
                if (!successful.length) throw lastError || new Error('逐边独立正交自动布线失败。');
                return successful[0].routes;
            }

            function topologyRoutesV143(graph, layout) {
                const lanes = topologyRoutingLanesV143(layout);
                const portAssignments = topologyEdgePortsV143(graph, layout);
                const records = graph.edges.map(function (edge) {
                    const ports = portAssignments.get(edge.id);
                    const sourceRank = layout.rankById.get(edge.source) || 0;
                    const targetRank = layout.rankById.get(edge.target) || 0;
                    return {
                        edge: edge,
                        start: ports.startPort.point,
                        end: ports.endPort.point,
                        startPort: ports.startPort,
                        endPort: ports.endPort,
                        baseline: topologyEdgeBaselineV137(edge, layout),
                        span: Math.abs(targetRank - sourceRank)
                    };
                });
                return routeOrthogonalRecordsV143(records, {
                    candidates: function (record) {
                        return topologyCandidatePathsV143(record.startPort, record.endPort, lanes, layout);
                    },
                    pathIsClear: function (points, record) {
                        return topologyCandidatePathClearV143(points, record.edge, layout);
                    },
                    validate: function (routes) {
                        validateTopologyRoutesV133(graph, layout, routes);
                    }
                });
            }

            function validateTopologyRoutesV133(graph, layout, routes) {
                if (routes.length !== graph.edges.length) throw new Error('依赖路由数量不完整。');
                const routedEdgeIds = new Set();
                const endpointAnchors = new Map();
                const incomingArrowPoints = new Map();
                const outgoingStartPoints = new Map();
                function pointKey(point) {
                    return point.x.toFixed(2) + ':' + point.y.toFixed(2);
                }
                function onNodeBoundary(point, metrics) {
                    const epsilon = 0.11;
                    const vertical = (Math.abs(point.x - metrics.x) < epsilon || Math.abs(point.x - metrics.x - metrics.width) < epsilon) && point.y >= metrics.y - epsilon && point.y <= metrics.y + metrics.height + epsilon;
                    const horizontal = (Math.abs(point.y - metrics.y) < epsilon || Math.abs(point.y - metrics.y - metrics.height) < epsilon) && point.x >= metrics.x - epsilon && point.x <= metrics.x + metrics.width + epsilon;
                    return vertical || horizontal;
                }
                function recordAnchor(map, nodeId, point) {
                    if (!map.has(nodeId)) map.set(nodeId, new Set());
                    const key = pointKey(point);
                    if (map.get(nodeId).has(key)) throw new Error(nodeId + '存在重叠依赖锚点。');
                    map.get(nodeId).add(key);
                }

                routes.forEach(function (route) {
                    if (!route || !route.edge || !route.d || route.points.length < 2) throw new Error('依赖关系缺少连续路径。');
                    if (routedEdgeIds.has(route.edge.id)) throw new Error(route.edge.id + '被重复路由。');
                    routedEdgeIds.add(route.edge.id);
                    const sourceMetrics = layout.metricsById.get(route.edge.source);
                    const targetMetrics = layout.metricsById.get(route.edge.target);
                    const start = route.points[0];
                    const end = route.points[route.points.length - 1];
                    if (!onNodeBoundary(start, sourceMetrics) || !onNodeBoundary(end, targetMetrics)) throw new Error(route.edge.id + '未连接固定节点锚点。');
                    if (Math.abs(start.x - sourceMetrics.x - sourceMetrics.width) > 0.11 || Math.abs(end.x - targetMetrics.x) > 0.11) {
                        throw new Error(route.edge.id + '违反统一右侧出线、左侧入线规则。');
                    }
                    if (!topologyRightLeftDirectionValidV139(route.points)) throw new Error(route.edge.id + '端口方向发生回折。');
                    if (route.bends !== route.points.length - 2 || route.bends > topologyRoutingConfigV143.maximumBends) throw new Error(route.edge.id + '折弯计数无效。');
                    if (topologyForwardBacktrackV139(route.points)) throw new Error(route.edge.id + '存在无意义的前向回折。');
                    recordAnchor(endpointAnchors, route.edge.source, start);
                    recordAnchor(endpointAnchors, route.edge.target, end);
                    if (!outgoingStartPoints.has(route.edge.source)) outgoingStartPoints.set(route.edge.source, []);
                    outgoingStartPoints.get(route.edge.source).push(start);
                    if (!incomingArrowPoints.has(route.edge.target)) incomingArrowPoints.set(route.edge.target, []);
                    incomingArrowPoints.get(route.edge.target).push(end);
                    route.points.forEach(function (point) {
                        if (point.x < 0 || point.x > layout.viewWidth || point.y < 0 || point.y > layout.viewHeight) throw new Error(route.edge.id + '超出关系画布。');
                    });
                    for (let index = 0; index < route.points.length - 1; index += 1) {
                        const first = route.points[index];
                        const second = route.points[index + 1];
                        const orthogonal = Math.abs(first.x - second.x) < 0.1 || Math.abs(first.y - second.y) < 0.1;
                        if (!orthogonal || topologySegmentHitsNodeV132(first, second, route.edge, layout.metricsById)) throw new Error(route.edge.id + '存在穿越节点的非连续路由。');
                    }
                });

                function validatePortSpacing(pointsByNode, portKind) {
                    pointsByNode.forEach(function (points, nodeId) {
                        for (let firstIndex = 0; firstIndex < points.length; firstIndex += 1) {
                            for (let secondIndex = firstIndex + 1; secondIndex < points.length; secondIndex += 1) {
                                const distance = Math.hypot(points[firstIndex].x - points[secondIndex].x, points[firstIndex].y - points[secondIndex].y);
                                if (distance < topologyRoutingConfigV143.lineSeparation - 0.5) {
                                    throw new Error(nodeId + '的' + portKind + '端口间距小于 12px。');
                                }
                            }
                        }
                    });
                }
                validatePortSpacing(outgoingStartPoints, '右侧出线');
                validatePortSpacing(incomingArrowPoints, '左侧入线');

                function validateOrderedPorts(groupedRoutes, oppositeNodeId, endpoint, xDirection) {
                    groupedRoutes.forEach(function (nodeRoutes, nodeId) {
                        const ordered = nodeRoutes.slice().sort(function (first, second) {
                            const firstMetrics = layout.metricsById.get(oppositeNodeId(first.edge));
                            const secondMetrics = layout.metricsById.get(oppositeNodeId(second.edge));
                            return firstMetrics.centerY - secondMetrics.centerY || (firstMetrics.centerX - secondMetrics.centerX) * xDirection || first.edge.id.localeCompare(second.edge.id);
                        });
                        for (let index = 1; index < ordered.length; index += 1) {
                            const previousY = endpoint(ordered[index - 1]).y;
                            const currentY = endpoint(ordered[index]).y;
                            if (currentY < previousY - 0.1) throw new Error(nodeId + '的多边端口顺序与对端 Y 顺序不一致。');
                        }
                    });
                }

                const routesBySource = new Map();
                const routesByTarget = new Map();
                routes.forEach(function (route) {
                    if (!routesBySource.has(route.edge.source)) routesBySource.set(route.edge.source, []);
                    if (!routesByTarget.has(route.edge.target)) routesByTarget.set(route.edge.target, []);
                    routesBySource.get(route.edge.source).push(route);
                    routesByTarget.get(route.edge.target).push(route);
                });
                validateOrderedPorts(routesBySource, function (edge) { return edge.target; }, function (route) { return route.points[0]; }, 1);
                validateOrderedPorts(routesByTarget, function (edge) { return edge.source; }, function (route) { return route.points[route.points.length - 1]; }, -1);

                function routeSegments(route) {
                    const segments = [];
                    for (let index = 0; index < route.points.length - 1; index += 1) {
                        const first = route.points[index];
                        const second = route.points[index + 1];
                        const horizontal = Math.abs(first.y - second.y) < 0.1;
                        segments.push({
                            route: route,
                            horizontal: horizontal,
                            fixed: horizontal ? first.y : first.x,
                            minimum: horizontal ? Math.min(first.x, second.x) : Math.min(first.y, second.y),
                            maximum: horizontal ? Math.max(first.x, second.x) : Math.max(first.y, second.y)
                        });
                    }
                    return segments;
                }

                for (let firstRouteIndex = 0; firstRouteIndex < routes.length; firstRouteIndex += 1) {
                    const firstSegments = routeSegments(routes[firstRouteIndex]);
                    for (let secondRouteIndex = firstRouteIndex + 1; secondRouteIndex < routes.length; secondRouteIndex += 1) {
                        const secondSegments = routeSegments(routes[secondRouteIndex]);
                        firstSegments.forEach(function (firstSegment) {
                            secondSegments.forEach(function (secondSegment) {
                                if (firstSegment.horizontal !== secondSegment.horizontal) return;
                                const overlap = Math.min(firstSegment.maximum, secondSegment.maximum) - Math.max(firstSegment.minimum, secondSegment.minimum);
                                if (overlap <= 0.5) return;
                                const separation = Math.abs(firstSegment.fixed - secondSegment.fixed);
                                if (separation < topologyRoutingConfigV143.lineSeparation - 0.5) {
                                    throw new Error(routes[firstRouteIndex].edge.id + '与' + routes[secondRouteIndex].edge.id + '存在小于 12px 的平行黏线。');
                                }
                            });
                        });
                    }
                }
            }

            function appendTopologyPortsV139(stage, ports) {
                ports.forEach(function (port) {
                    const point = port.point;
                    stage.appendChild(svgElementV10('circle', {

            function appendTopologyNodeV139(parent, node, metrics, selected, ports) {
                appendTopologyNodeV129(parent, node, metrics, selected);
                const stage = parent.lastElementChild;
                if (stage) appendTopologyPortsV139(stage, ports);
            }

            function topologyContentFrameV150(layout, graph, routes, selectedNode) {
                let minimumX = Infinity;
                let maximumX = -Infinity;
                let minimumY = Infinity;
                let maximumY = -Infinity;
                layout.metricsById.forEach(function (metrics) {
                    minimumX = Math.min(minimumX, metrics.x);
                    maximumX = Math.max(maximumX, metrics.x + metrics.width);
                    minimumY = Math.min(minimumY, metrics.y);
                    maximumY = Math.max(maximumY, metrics.y + metrics.height);
                });
                routes.forEach(function (route) {
                    route.points.forEach(function (point) {
                        minimumX = Math.min(minimumX, point.x);
                        maximumX = Math.max(maximumX, point.x);
                        minimumY = Math.min(minimumY, point.y);
                        maximumY = Math.max(maximumY, point.y);
                    });
                });
                if (![minimumX, maximumX, minimumY, maximumY].every(Number.isFinite)) {
                    minimumX = 0;
                    maximumX = layout.viewWidth;
                    minimumY = 0;
                    maximumY = layout.viewHeight;
                }
                const selectedMetrics = layout.metricsById.get(selectedNode.id);
                const focus = selectedMetrics
                    ? { x: selectedMetrics.centerX, y: selectedMetrics.centerY }
                    : { x: (minimumX + maximumX) / 2, y: (minimumY + maximumY) / 2 };
                const hasIncoming = graph.edges.some(function (edge) { return edge.target === selectedNode.id; });
                const hasOutgoing = graph.edges.some(function (edge) { return edge.source === selectedNode.id; });
                const safety = 14;
                return {
                    bounds: {
                        x: minimumX - safety,
                        y: minimumY - safety,
                        width: Math.max(1, maximumX - minimumX + safety * 2),
                        height: Math.max(1, maximumY - minimumY + safety * 2)
                    },
                    focus: focus,
                    focusRatioX: !hasIncoming && hasOutgoing ? 0.34 : 0.5,
                    nodeCount: graph.nodes.length
                };
            }

            function drawTopologyLayoutV132(layout, graph, selectedNode) {
                const selectedMetrics = layout.metricsById.get(selectedNode.id);
                topologyFocusPointV130 = selectedMetrics
                    ? { x: selectedMetrics.centerX, y: selectedMetrics.centerY }
                    : { x: layout.viewWidth / 2, y: layout.viewHeight / 2 };
                topologyInteractionV138.setBounds({ x: 0, y: 0, width: layout.viewWidth, height: layout.viewHeight });
                while (topologyViewportV10.firstChild) topologyViewportV10.removeChild(topologyViewportV10.firstChild);

                const defs = svgElementV10('defs');
                appendTopologyMarkerV10(defs, 'topology-global-arrow-v133', '#8EA3C2', 8.5);
                appendTopologyMarkerV10(defs, 'topology-global-arrow-v133-focus', '#1F5FFF', 8.5);
                topologyViewportV10.appendChild(defs);

                const routes = topologyRoutesV143(graph, layout);
                topologyAutoFitFrameV150 = topologyContentFrameV150(layout, graph, routes, selectedNode);
                routes.sort(function (first, second) {
                    const firstFocus = first.edge.source === selectedNode.id || first.edge.target === selectedNode.id;
                    const secondFocus = second.edge.source === selectedNode.id || second.edge.target === selectedNode.id;
                    if (firstFocus !== secondFocus) return firstFocus ? 1 : -1;
                    return first.edge.id.localeCompare(second.edge.id);
                });
                const portsByNode = new Map();
                function recordPort(nodeId, side, point) {
                    if (!portsByNode.has(nodeId)) portsByNode.set(nodeId, []);
                    portsByNode.get(nodeId).push({ side: side, point: point });
                }
                routes.forEach(function (route) {
                    recordPort(route.edge.source, 'right', route.points[0]);
                    recordPort(route.edge.target, 'left', route.points[route.points.length - 1]);
                });
                const edgeLayer = svgElementV10('g', { 'aria-label': '正交有向依赖连线', 'pointer-events': 'none' });
                routes.forEach(function (route) {
                    const edge = route.edge;
                    const focused = edge.source === selectedNode.id || edge.target === selectedNode.id;
                    const cycle = layout.cycleEdgeIds.has(edge.id);
                    const stroke = focused ? '#1F5FFF' : '#8EA3C2';
                    const marker = focused ? 'url(#topology-global-arrow-v133-focus)' : 'url(#topology-global-arrow-v133)';
                    edgeLayer.appendChild(svgElementV10('path', {
                        d: route.d,
                        fill: 'none',
                        stroke: '#FFFFFF',
                        'stroke-width': '5.5',
                        'stroke-linecap': 'round',
                        'stroke-linejoin': 'round',
                        opacity: '0.96',
                        'vector-effect': 'non-scaling-stroke',
                        'data-topology-edge-halo': edge.id
                    }));
                    const path = svgElementV10('path', {
                        d: route.d,
                        fill: 'none',
                        stroke: stroke,
                        'stroke-width': '1.5',
                        'stroke-linecap': 'round',
                        'stroke-linejoin': 'round',
                        opacity: '1',
                        'vector-effect': 'non-scaling-stroke',
                        'marker-end': marker,
                        'data-topology-edge-id': edge.id,
                        'data-topology-edge-source': edge.source,
                        'data-topology-edge-target': edge.target,
                        'data-dependency-depth': '1',
                        'data-dependency-provenance': edge.provenance,
                        'data-route-kind': route.kind,
                        'data-route-bends': String(route.bends),
                        'data-route-length': String(Math.round(route.length * 10) / 10),
                        'data-route-lane': String(route.laneIndex),
                        'data-route-channel': route.channelBand,
                        'data-route-crossings': String(route.crossings),
                        'data-route-independent': 'true',
                        'data-cycle-edge': cycle ? 'true' : 'false'
                    });
                    const sourceNode = levelNodeByIdV10(edge.source);
                    const targetNode = levelNodeByIdV10(edge.target);
                    path.appendChild(svgElementV10('title', {}, nodeNamingV137(sourceNode).canonical + ' 指向 ' + nodeNamingV137(targetNode).canonical));
                    edgeLayer.appendChild(path);
                });
                topologyViewportV10.appendChild(edgeLayer);

                const nodeLayer = svgElementV10('g', { 'aria-label': '分层依赖能力节点' });
                graph.nodes.slice().sort(function (first, second) {
                    const firstMetrics = layout.metricsById.get(first.id);
                    const secondMetrics = layout.metricsById.get(second.id);
                    return firstMetrics.rank - secondMetrics.rank || firstMetrics.lane - secondMetrics.lane || topologyNodeOrderV129(first, second);
                }).forEach(function (node) {
                    const metrics = layout.metricsById.get(node.id);
                    if (metrics) appendTopologyNodeV139(nodeLayer, node, metrics, node.id === selectedNode.id, portsByNode.get(node.id) || []);
                });
                topologyViewportV10.appendChild(nodeLayer);
            }

            function applyTopologyAutoFitV150() {
                if (topologyAutoFitFrameV150) {
                    topologyInteractionV138.fitContent(topologyAutoFitFrameV150);
                    return;
                }
                topologyInteractionV138.fit();
            }

            function scheduleTopologyCenterV138() {
                window.cancelAnimationFrame(topologyCenterFrameV138);
                topologyCenterFrameV138 = window.requestAnimationFrame(function () {
                    topologyCenterFrameV138 = 0;
                    if (stateV10.dependencyMode === 'global') applyTopologyAutoFitV150();
                });
            }

            function renderTopologyV10() {
                if (stateV10.dependencyMode !== 'global') return;
                let selectedNode = selectedNodeV10();
                if (!selectedNode) {
                    selectedNode = levelNodesV10[0];
                    syncSelectedNodeV183(selectedNode);
                }
                const graph = collectGlobalDependencyGraphV129(selectedNode.id);
                updateTopologyContextV129(selectedNode, graph);
                topologyLoadingV127.classList.add('is-visible');
                try {
                    const layout = topologyLayeredLayoutV132(graph);
                    drawTopologyLayoutV132(layout, graph, selectedNode);
                    topologyLoadingV127.classList.remove('is-visible');
                    scheduleTopologyCenterV138();
                } catch {
                    topologyAutoFitFrameV150 = null;
                    topologyLoadingV127.classList.remove('is-visible');
                    while (topologyViewportV10.firstChild) topologyViewportV10.removeChild(topologyViewportV10.firstChild);
                    const message = svgElementV10('g', { 'aria-label': '依赖图暂时无法加载' });
                    message.appendChild(svgElementV10('text', { x: '500', y: '282', 'text-anchor': 'middle', fill: '#64748B', 'font-size': '17', 'font-weight': '900' }, '依赖图暂时无法加载'));
                    message.appendChild(svgElementV10('text', { x: '500', y: '312', 'text-anchor': 'middle', fill: '#94A3B8', 'font-size': '12', 'font-weight': '750' }, '请稍后重试'));
                    topologyViewportV10.appendChild(message);
                    topologyInteractionV138.setBounds({ x: 0, y: 0, width: 1000, height: 600 });
                    showTopologyMessageV10('依赖图布局失败，请稍后重试', 2600, true);
                }
            }

            abilityGridV10.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const moreButton = element.closest('[data-ability-more]');
                if (moreButton) {
                    event.stopPropagation();
                    const row = moreButton.closest('[data-ability-row]');
                    if (row) openDetailV10(row.dataset.abilityRow);
                    return;
                }
                const levelButton = element.closest('[data-level-node-id]');
                if (levelButton) {
                    const node = levelNodeByIdV10(levelButton.dataset.levelNodeId);
                    if (node) openDetailV10(node.abilityId, node.id);
                    return;
                }
                const abilityRow = element.closest('[data-ability-row]');
                if (abilityRow) openDetailV10(abilityRow.dataset.abilityRow);
            }, { signal: eventAbortV138.signal });

            abilityGridV10.addEventListener('scroll', function (event) {
                if (event.target instanceof Element && event.target.matches('[data-ability-scroll]')) scheduleOverviewMetricsV138();
            }, { passive: true, capture: true, signal: eventAbortV138.signal });

            document.getElementById('detail-mainline').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-level-node-id]') : null;
                if (target) selectDetailNodeV10(target.dataset.levelNodeId);
            }, { signal: eventAbortV138.signal });

            document.getElementById('dependency-hint-list').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-cross-mainline-node]') : null;
                if (!target) return;
                const node = levelNodeByIdV10(target.dataset.crossMainlineNode);
                if (!node) return;
                animateDetailSelectionV10(abilityForNodeV10(node), node, true, true);
            }, { signal: eventAbortV138.signal });

            topologySvgV10.addEventListener('click', function (event) {
                if (topologyInteractionV138.shouldSuppressClick()) return;
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const stageTarget = element.closest('[data-topology-node-id]');
                if (stageTarget) {
                    navigateTopologyNodeV136(stageTarget.dataset.topologyNodeId);
                    return;
                }
                hideTopologyHintV10();
            }, { signal: eventAbortV138.signal });

            topologySvgV10.addEventListener('keydown', function (event) {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const rawTarget = event.target instanceof Element ? event.target : null;
                if (!rawTarget) return;
                const element = rawTarget.closest('[data-topology-node-id]');
                if (!element) return;
                event.preventDefault();
                navigateTopologyNodeV136(element.dataset.topologyNodeId);
            }, { signal: eventAbortV138.signal });

            document.getElementById('overview-back-button').addEventListener('click', function () {
                window.history.back();
            }, { signal: eventAbortV138.signal });
            document.getElementById('detail-back-button').addEventListener('click', navigateBackFromDetailV10, { signal: eventAbortV138.signal });
            detailPathListV150.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const overflowButton = element.closest('[data-route-overflow-kind="detail"]');
                if (overflowButton) {
                    toggleRouteHistoryPopoverV185(overflowButton);
                    return;
                }
                if (element.closest('[data-detail-home]')) {
                    showPageV10('overview');
                    return;
                }
                const nodeButton = element.closest('[data-detail-path-index]');
                if (nodeButton) navigateDetailPathV150(nodeButton.dataset.detailPathIndex);
            }, { signal: eventAbortV138.signal });
            document.getElementById('detail-dependency-tab').addEventListener('click', openTopologyV10, { signal: eventAbortV138.signal });
            document.getElementById('topology-back-button').addEventListener('click', navigateBackFromTopologyV162, { signal: eventAbortV138.signal });
            document.getElementById('topology-task-tab').addEventListener('click', closeTopologyV149, { signal: eventAbortV138.signal });
            topologyMainlineV160.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target.closest('[data-level-node-id]') : null;
                if (element) navigateTopologyNodeV136(element.dataset.levelNodeId);
            }, { signal: eventAbortV138.signal });
            topologyPathListV149.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const overflowButton = element.closest('[data-route-overflow-kind="topology"]');
                if (overflowButton) {
                    toggleRouteHistoryPopoverV185(overflowButton);
                    return;
                }
                const homeButton = element.closest('[data-topology-home]');
                if (homeButton) {
                    setDependencyModeV127('direct', false);
                    showPageV10('overview');
                    return;
                }
                const nodeButton = element.closest('[data-topology-path-index]');
                if (nodeButton) navigateTopologyPathV155(nodeButton.dataset.topologyPathIndex);
            }, { signal: eventAbortV138.signal });
            routeHistoryPopoverListV185.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target.closest('[data-route-popover-index]') : null;
                if (!element) return;
                const kind = element.dataset.routePopoverKind;
                const pathIndex = element.dataset.routePopoverIndex;
                closeRouteHistoryPopoverV185(false);
                if (kind === 'detail') navigateDetailPathV150(pathIndex);
                if (kind === 'topology') navigateTopologyPathV155(pathIndex);
            }, { signal: eventAbortV138.signal });
            routeHistoryClearOtherV186.addEventListener('click', clearOtherRouteHistoryV186, { signal: eventAbortV138.signal });
            actionToastUndoV186.addEventListener('click', function () {
                const action = toastActionV186;
                if (typeof action !== 'function') return;
                dismissToastV186(false);
                action();
            }, { signal: eventAbortV138.signal });
            document.addEventListener('click', function (event) {
                if (routeHistoryPopoverV185.hidden) return;
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                if (routeHistoryPopoverV185.contains(element) || element.closest('[data-route-overflow-kind]')) return;
                closeRouteHistoryPopoverV185(false);
            }, { signal: eventAbortV138.signal });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && !routeHistoryPopoverV185.hidden) closeRouteHistoryPopoverV185(true);
            }, { signal: eventAbortV138.signal });
            document.getElementById('topology-zoom-out').addEventListener('click', function () {
                window.cancelAnimationFrame(topologyCenterFrameV138);
                topologyCenterFrameV138 = 0;
                topologyInteractionV138.zoomBy(1 / 1.2);
            }, { signal: eventAbortV138.signal });
            document.getElementById('topology-zoom-in').addEventListener('click', function () {
                window.cancelAnimationFrame(topologyCenterFrameV138);
                topologyCenterFrameV138 = 0;
                topologyInteractionV138.zoomBy(1.2);
            }, { signal: eventAbortV138.signal });
            document.getElementById('topology-fit').addEventListener('click', fitTopologyV10, { signal: eventAbortV138.signal });
            topologyResetButtonV10.addEventListener('click', clearTopologyFocusV10, { signal: eventAbortV138.signal });

            topologyResizeObserverV138 = new ResizeObserver(function () {
                if (stateV10.view === 'topology' && stateV10.dependencyMode === 'global') topologyInteractionV138.resize();
            });
            topologyResizeObserverV138.observe(topologySurfaceV138);
            overviewResizeObserverV138 = new ResizeObserver(function () {
                if (stateV10.view === 'overview') scheduleOverviewMetricsV138();
            });
            overviewResizeObserverV138.observe(overviewScrollV10);
            overviewResizeObserverV138.observe(abilityGridV10);
            routeResizeObserverV150 = new ResizeObserver(function () {
                if (stateV10.view === 'detail') renderDetailPathV150();
                if (stateV10.view === 'topology') renderTopologyPathV149();
            });
            routeResizeObserverV150.observe(detailPathNavV150);
            routeResizeObserverV150.observe(topologyPathNavV149);

            window.addEventListener('pagehide', function () {
                eventAbortV138.abort();
                topologyInteractionV138.destroy();
                topologyResizeObserverV138.disconnect();
                overviewResizeObserverV138.disconnect();
                routeResizeObserverV150.disconnect();
                if (localDependencyResizeObserverV132) localDependencyResizeObserverV132.disconnect();
                window.cancelAnimationFrame(topologyCenterFrameV138);
                window.cancelAnimationFrame(overviewMetricsFrameV138);
                window.cancelAnimationFrame(detailRevealFrameV138);
                window.cancelAnimationFrame(dependencyPanelFrameV138);
                window.cancelAnimationFrame(localDependencyLineFrameV132);
                window.clearTimeout(dependencyPanelTimerV138);
                window.clearTimeout(toastTimerV10);
                window.clearTimeout(topologyHintTimerV10);
                resetDetailSwitchMotionV10();
            }, { once: true });

            document.fonts.ready.then(function () {
                if (!eventAbortV138.signal.aborted) scheduleLocalDependencyLinesV132();
            });

            validateDataV10();
            renderOverviewV10();
            renderDetailV10();
        }());
    </script>
