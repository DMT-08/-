<!DOCTYPE html>
<!-- 版本 12.1：状态语义与场景强度统一。首页及详情主线以黄色整卡表达当前阶段；当前未解锁改用淡黄色底、橙色虚线与强化锁图标；普通未解锁保持灰色、已完成保持绿色；依赖关系节点改用中性卡片，仅由状态标签表达当前阶段。 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#EFF6FF">
    <title>抖学 AI 能力模型 12.1 · 状态语义与场景强度统一</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#1F5FFF',
                        ink: '#172033'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        soft: '0 4px 20px -4px rgba(0,0,0,0.03), 0 2px 8px -2px rgba(0,0,0,0.02)'
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        :root {
            --brand: #1F5FFF;
            --ink: #172033;
            --soft-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.03), 0 2px 8px -2px rgba(0, 0, 0, 0.02);
            --type-page-title: 32px;
            --type-section-title: 20px;
            --type-card-title: 17px;
            --type-body: 14px;
            --type-meta: 12px;
            --type-label: 11px;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #EFF6FF 0%, #DFE7FF 100%);
        }

        button {
            -webkit-appearance: none;
        }

        button:focus-visible,
        [role="button"]:focus-visible {
            outline: 3px solid rgba(31, 95, 255, 0.25);
            outline-offset: 2px;
        }

        .app-shell {
            width: min(1300px, 100vw);
            height: 100vh;
            height: 100dvh;
        }

        .page-view {
            display: none;
        }

        .page-view.is-active {
            display: flex;
            animation: page-enter 180ms ease-out;
        }

        .native-scroll {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
        }

        .horizontal-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            scrollbar-width: none;
        }

        .horizontal-scroll::-webkit-scrollbar,
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            scrollbar-width: none;
        }

        .ability-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ability-row {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 24px -22px rgba(15, 23, 42, 0.32);
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        .ability-row-track {
            min-width: max-content;
        }

        .ability-name-card {
            display: flex;
            width: 176px;
            height: 78px;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            border: 1px solid #C9D8FF;
            border-radius: 14px;
            background: #F4F7FF;
            padding: 0 15px;
            color: #173E9C;
            text-align: left;
        }

        .mainline-list {
            min-width: max-content;
        }

        .overview-mainline .mainline-node {
            width: 112px;
            min-width: 112px;
            height: 78px;
            padding: 9px 10px;
        }

        .overview-mainline .mainline-connector {
            width: 24px;
            height: 78px;
            flex-basis: 24px;
        }

        .overview-mainline .node-caption {
            max-width: 90px;
            margin-top: 3px;
            font-size: 10px;
        }

        .node-current-badge {
            position: absolute;
            right: 7px;
            top: 6px;
            border: 1px solid #F4CF79;
            border-radius: 6px;
            background: #FFF4CF;
            padding: 2px 5px;
            color: #8A4B08;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
        }

        .node-lock-badge {
            position: absolute;
            left: 8px;
            top: 7px;
            display: inline-flex;
            width: 22px;
            height: 22px;
            align-items: center;
            justify-content: center;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            background: #FFFFFF;
            color: #64748B;
            font-size: 13px;
            line-height: 1;
            box-shadow: 0 2px 5px rgba(15, 23, 42, 0.06);
            pointer-events: none;
        }

        .mainline-node.role-current.state-locked .node-lock-badge {
            width: 26px;
            height: 26px;
            border-color: #F6C76B;
            background: #FFF2C2;
            color: #C56A07;
            font-size: 15px;
            box-shadow: 0 3px 8px rgba(197, 106, 7, 0.12);
        }

        .mainline-node.role-target .node-lock-badge {
            color: #64748B;
        }

        .mainline-node {
            position: relative;
            display: flex;
            min-width: 66px;
            height: 68px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #DCE4EF;
            border-radius: 12px;
            background: #FFFFFF;
            color: #475569;
            transition: transform 150ms ease, border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
        }

        .mainline-node:active {
            transform: scale(0.95);
        }

        .mainline-node.role-completed {
            border-color: #BFE7CB;
            background: #F3FCF6;
            color: #166534;
        }

        .mainline-node.role-current {
            border-color: #F0C36A;
            background: #FFF4CF;
            color: #92400E;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.09);
        }

        .mainline-node.role-current.state-locked {
            border-width: 2px;
            border-color: #F59E0B;
            border-style: dashed;
            background: #FFFCF2;
            color: #9A5B13;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.05);
        }

        .mainline-node.role-upcoming {
            border-color: #D2DAE6;
            background: #FFFFFF;
            color: #64748B;
        }

        .mainline-node.role-upcoming.state-locked {
            border-style: dashed;
        }

        .mainline-node.role-target {
            border-color: #6F98FF;
            border-style: dashed;
            background: #EDF3FF;
            color: #1746B2;
        }

        .mainline-node::after {
            position: absolute;
            inset: -3px;
            border: 1.5px solid rgba(31, 95, 255, 0.68);
            border-radius: 14px;
            content: "";
            opacity: 0;
            pointer-events: none;
            transform: scale(0.97);
            transition: opacity 180ms linear, transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .mainline-node.is-selected::after {
            opacity: 1;
            transform: scale(1);
        }

        .node-level {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .node-caption {
            margin-top: 1px;
            max-width: 60px;
            overflow: hidden;
            color: currentColor;
            font-size: 9px;
            font-weight: 800;
            line-height: 1.15;
            opacity: 0.78;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .mini-stars {
            display: flex;
            height: 11px;
            align-items: center;
            gap: 1px;
            margin-top: 3px;
        }

        .mini-stars i {
            color: #D7DFEA;
            font-size: 9px;
        }

        .mini-stars i.is-filled {
            color: #F59E0B;
        }

        .role-completed .mini-stars i.is-filled {
            color: #35A760;
        }

        .mainline-connector {
            position: relative;
            display: flex;
            width: 25px;
            height: 68px;
            flex: 0 0 25px;
            align-items: center;
            justify-content: center;
            color: #CBD5E1;
        }

        .mainline-connector::before {
            width: 100%;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            content: "";
        }

        .mainline-connector i {
            position: absolute;
            right: -3px;
            padding: 1px 0;
            background: #FFFFFF;
            font-size: 11px;
        }

        .mainline-connector.is-passed {
            color: #86C99D;
        }

        .mainline-connector.is-current {
            color: #7DA1FF;
        }

        .mainline-connector.is-target {
            color: #CBD5E1;
        }

        .detail-mainline .mainline-node {
            min-width: 126px;
            height: 88px;
            border-radius: 14px;
            padding: 9px 10px;
        }

        .detail-mainline .mainline-connector {
            width: 42px;
            height: 88px;
            flex-basis: 42px;
        }

        .detail-mainline .node-level {
            font-size: 18px;
        }

        .detail-mainline .node-caption {
            max-width: 108px;
            margin-top: 3px;
            font-size: 10px;
        }

        .detail-mainline .mini-stars {
            margin-top: 5px;
        }

        .detail-mainline .mini-stars i {
            font-size: 11px;
        }

        .dependency-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 30px minmax(148px, 0.58fr) 30px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
        }

        .dependency-column {
            min-height: 126px;
            border: 1px solid #E1E9F5;
            border-radius: 16px;
            background: #FFFFFF;
            padding: 13px;
        }

        .dependency-column.is-empty {
            border-color: transparent;
            background: transparent;
            padding-inline: 7px;
        }

        .dependency-arrow {
            position: relative;
            display: flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            color: #5274C9;
        }

        .dependency-arrow::before {
            position: absolute;
            right: 3px;
            left: 3px;
            height: 2px;
            border-radius: 999px;
            background: #B8C8EB;
            content: "";
        }

        .dependency-arrow i {
            position: relative;
            right: -8px;
            z-index: 1;
            background: #FFFFFF;
            padding-left: 2px;
        }

        .dependency-chip {
            display: flex;
            width: 100%;
            min-height: 44px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            background: #FFFFFF;
            padding: 8px 10px;
            color: #475569;
            text-align: left;
            transition: transform 150ms ease, border-color 150ms ease, background-color 150ms ease;
        }

        .dependency-chip.role-completed {
            border-color: #E2E8F0;
            background: #FFFFFF;
        }

        .dependency-chip.role-current {
            border-color: #E2E8F0;
            background: #FFFFFF;
        }

        .dependency-chip.role-target {
            border-color: #E2E8F0;
            border-style: solid;
            background: #FFFFFF;
        }

        .dependency-relation-kind,
        .dependency-node-state {
            display: inline-flex;
            min-height: 20px;
            align-items: center;
            gap: 4px;
            border-radius: 6px;
            padding: 0 6px;
            font-size: 10px;
            font-weight: 850;
            line-height: 1;
        }

        .dependency-relation-kind.is-mainline {
            border: 1px solid #CAD8E8;
            background: #F3F7FB;
            color: #526B85;
        }

        .dependency-relation-kind.is-crossline {
            border: 1px solid #DDD3EA;
            background: #F8F5FB;
            color: #6B5D7D;
        }

        .dependency-node-state.is-completed {
            border: 1px solid #BFE7CB;
            background: #F3FCF6;
            color: #166534;
        }

        .dependency-node-state.is-current {
            border: 1px solid #F4CF79;
            background: #FFF4CF;
            color: #8A4B08;
        }

        .dependency-node-state.is-target {
            border: 1px dashed #5D8AFF;
            background: #EDF3FF;
            color: #1746B2;
        }

        .dependency-node-state.is-locked {
            border: 1px solid #CBD5E1;
            background: #FFFFFF;
            color: #526174;
        }

        .dependency-chip:active {
            transform: scale(0.97);
        }

        .dependency-focus {
            display: flex;
            min-height: 108px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #1F5FFF;
            border-radius: 14px;
            background: #F7F9FF;
            padding: 12px;
            text-align: center;
            box-shadow: 0 0 0 4px rgba(31, 95, 255, 0.07);
        }

        .dependency-focus-label {
            display: inline-flex;
            min-height: 22px;
            align-items: center;
            gap: 4px;
            border: 1px solid #BFD0FF;
            border-radius: 6px;
            background: #EAF0FF;
            padding: 0 7px;
            color: #1F5FFF;
            font-size: 10px;
            font-weight: 900;
        }

        .dependency-empty {
            display: flex;
            min-height: 46px;
            align-items: center;
            gap: 7px;
            border-top: 1px solid #E9EEF5;
            padding: 10px 2px 2px;
            color: #94A3B8;
            font-size: 11px;
            font-weight: 700;
        }

        .learning-card {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 20px -20px rgba(15, 23, 42, 0.34);
            transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
        }

        .learning-card:active:not(:disabled) {
            transform: scale(0.97);
        }

        .learning-card:disabled {
            cursor: not-allowed;
            border-color: #E2E8F0;
            background: #F8FAFC;
            box-shadow: none;
        }

        .topology-surface {
            position: relative;
            min-height: 0;
            overflow: hidden;
            background-color: #FAFCFF;
            background-image: radial-gradient(circle, rgba(148, 163, 184, 0.2) 1px, transparent 1.1px);
            background-size: 26px 26px;
            touch-action: none;
        }

        #topology-svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .graph-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .graph-control-button {
            display: flex;
            min-width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-radius: 10px;
            color: #475569;
            font-size: 11px;
            font-weight: 800;
            transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
        }

        .graph-control-button[hidden] {
            display: none;
        }

        .graph-control-button:active {
            transform: scale(0.9);
            background: #EFF6FF;
            color: #1F5FFF;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 50;
            display: flex;
            min-height: 44px;
            align-items: center;
            gap: 8px;
            border: 1px solid #DCE4EF;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.96);
            padding: 10px 14px;
            color: #334155;
            font-size: var(--type-meta);
            font-weight: 800;
            box-shadow: 0 16px 36px -20px rgba(15, 23, 42, 0.42);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 12px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .topology-hint {
            position: absolute;
            left: 50%;
            top: 14px;
            z-index: 4;
            display: flex;
            min-height: 40px;
            align-items: center;
            border: 1px solid rgba(191, 208, 255, 0.9);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            padding: 8px 13px;
            color: #2852B8;
            font-size: 11px;
            font-weight: 800;
            box-shadow: var(--soft-shadow);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -6px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .topology-hint.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .topology-hint.is-warning {
            border-color: #F7D7A6;
            background: rgba(255, 251, 235, 0.97);
            color: #9A5B13;
        }

        @media (hover: hover) and (pointer: fine) {
            .ability-row:hover {
                border-color: #BFD0FF;
                box-shadow: 0 18px 34px -27px rgba(31, 95, 255, 0.42);
                transform: translateY(-2px);
            }

            .mainline-node:hover {
                border-color: #7DA1FF;
                box-shadow: 0 8px 18px -14px rgba(31, 95, 255, 0.48);
                transform: translateY(-1px);
            }

            .dependency-chip:hover {
                border-color: #BFD0FF;
                background: #F8FAFF;
            }

            .learning-card:hover:not(:disabled) {
                border-color: #BFD0FF;
                box-shadow: 0 14px 26px -22px rgba(31, 95, 255, 0.5);
                transform: translateY(-1px);
            }

            .graph-control-button:hover {
                background: #EFF6FF;
                color: #1F5FFF;
            }
        }

        @media (max-width: 760px) {
            .app-shell {
                padding: 12px;
            }

            .ability-name-card {
                width: 164px;
            }

            .dependency-layout {
                grid-template-columns: minmax(0, 1fr);
            }

            .dependency-arrow {
                min-height: 20px;
                transform: rotate(90deg);
            }

            .learning-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @keyframes page-enter {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 10.2：统一无衬线排版与更明确的原生点击语义 */
        body,
        button,
        .node-level,
        #topology-svg text {
            font-family: Inter, system-ui, sans-serif !important;
            font-variant-numeric: tabular-nums;
        }

        .page-title {
            font-size: var(--type-page-title);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.035em;
        }

        .section-title {
            font-size: var(--type-section-title);
            font-weight: 800;
            line-height: 1.25;
        }

        .card-title {
            font-size: var(--type-card-title);
            font-weight: 800;
            line-height: 1.25;
        }

        .meta-text {
            font-size: var(--type-meta);
        }

        .label-text {
            font-size: var(--type-label);
        }

        button:not(:disabled),
        [role="button"] {
            cursor: pointer;
        }

        .overview-surface {
            border-radius: 24px;
            background: #FFFFFF;
            box-shadow: var(--soft-shadow);
        }

        .topology-context {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 10px;
        }

        .topology-mode-badge {
            display: inline-flex;
            min-height: 26px;
            flex: 0 0 auto;
            align-items: center;
            border: 1px solid #DCE3EC;
            border-radius: 6px;
            background: #F8FAFC;
            padding: 0 8px;
            color: #475569;
            font-size: var(--type-label);
            font-weight: 850;
            letter-spacing: 0.04em;
        }

        .topology-mode-badge.is-focus {
            border-color: #BFD0FF;
            background: #EAF0FF;
            color: #1F5FFF;
        }

        .topology-context-copy {
            overflow: hidden;
            color: #64748B;
            font-size: var(--type-meta);
            font-weight: 750;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .overview-scroll {
            background: #FFFFFF;
        }

        .overview-surface {
            position: relative;
            isolation: isolate;
        }

        .ability-list {
            gap: 0;
        }

        .ability-row {
            position: relative;
            border: 0;
            border-bottom: 1px solid #F1F5F9;
            border-radius: 0 !important;
            background: transparent;
            box-shadow: none;
            cursor: pointer;
            transform: none;
            transition: background-color 150ms ease;
        }

        .ability-row:last-child {
            border-bottom: 0;
        }

        .ability-row-scroll {
            padding: 7px 52px 7px 6px;
            scroll-padding-inline: 6px 52px;
        }

        .ability-row-entry {
            position: absolute;
            right: 0;
            top: 0;
            z-index: 3;
            display: flex;
            width: 52px;
            height: 100%;
            align-items: center;
            justify-content: center;
            border: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.9) 52%, #FFFFFF 100%);
            color: #5274C9;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: opacity 150ms ease, visibility 150ms ease;
        }

        .ability-row-entry.is-visible {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        .ability-row-entry i {
            font-size: 15px;
            transition: color 150ms ease, transform 150ms ease;
        }

        .ability-row:active {
            background: #F8FAFF;
        }

        .ability-row:active .ability-row-entry i {
            color: #7DA1FF;
            transform: translateX(1px) scale(0.9);
        }

        .overview-scroll-cue {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 6;

            function validateTopologyLayoutV10() {
                const abilityIds = new Set(abilitiesV10.map(function (ability) { return ability.id; }));
                const orderedIds = new Set(topologyAbilityOrderV10);
                if (abilityIds.size !== orderedIds.size || topologyAbilityOrderV10.some(function (id) { return !abilityIds.has(id); })) {
                    throw new Error('关系图主线顺序未覆盖全部能力。');
                }
                abilitiesV10.forEach(function (ability) {
                    ability.levels.forEach(function (node, levelIndex) {
                        const metrics = topologyStageMetricsV10(ability, levelIndex);
                        if (metrics.x < 0 || metrics.y < 0 || metrics.x + metrics.width > topologyLayoutV10.viewWidth || metrics.y + metrics.height > topologyLayoutV10.viewHeight) {
                            throw new Error(node.id + '超出关系图画布。');
                        }
                    });
                });
                const edges = graphStageEdgesV10();
                const targetChannelsByDirectionAndLevel = new Map();
                const sourcePortsByNode = new Map();
                const targetPortsByNode = new Map();
                edges.forEach(function (edge) {
                    const sourceNode = levelNodeByIdV10(edge.source);
                    const targetNode = levelNodeByIdV10(edge.target);
                    const sourceRow = topologyAbilityOrderV10.indexOf(sourceNode.abilityId);
                    const targetRow = topologyAbilityOrderV10.indexOf(targetNode.abilityId);
                    if (sourceRow === targetRow) throw new Error(edge.id + '不是跨主线关系。');
                    const route = topologyPathV10(edge, edges);
                    const sourceMetrics = topologyMetricsForNodeV10(edge.source);
                    const targetMetrics = topologyMetricsForNodeV10(edge.target);
                    if (!route) throw new Error(edge.id + '缺少有效路由。');
                    const isDownward = route.direction === 'down';
                    const expectedStartX = isDownward ? sourceMetrics.x + sourceMetrics.width : sourceMetrics.x;
                    const expectedEndX = isDownward ? targetMetrics.x : targetMetrics.x + targetMetrics.width;
                    if (route.start.x !== expectedStartX || route.end.x !== expectedEndX) throw new Error(edge.id + '未按真实方向对齐节点锚点。');
                    if (route.start.y <= sourceMetrics.y || route.start.y >= sourceMetrics.y + sourceMetrics.height || route.end.y <= targetMetrics.y || route.end.y >= targetMetrics.y + targetMetrics.height) {
                        throw new Error(edge.id + '的锚点超出节点边界。');
                    }
                    const targetGap = topologyHorizontalGapV10(targetNode, isDownward ? 'left' : 'right');
                    if (route.targetChannelX <= targetGap.min || route.targetChannelX >= targetGap.max) {
                        throw new Error(edge.id + '的独立入线通道超出节点侧方间距。');
                    }
                    const channelKey = route.direction + '-' + String(targetNode.level);
                    const levelChannels = targetChannelsByDirectionAndLevel.get(channelKey) || [];
                    levelChannels.push(route.targetChannelX);
                    targetChannelsByDirectionAndLevel.set(channelKey, levelChannels);
                    const sourcePorts = sourcePortsByNode.get(edge.source) || [];
                    sourcePorts.push(route.start.y);
                    sourcePortsByNode.set(edge.source, sourcePorts);
                    const targetPorts = targetPortsByNode.get(edge.target) || [];
                    targetPorts.push(route.end.y);
                    targetPortsByNode.set(edge.target, targetPorts);
                });
                targetChannelsByDirectionAndLevel.forEach(function (channels) {
                    const uniqueChannels = new Set(channels.map(function (value) { return value.toFixed(2); }));
                    if (uniqueChannels.size !== channels.length) throw new Error('跨主线入线通道发生重叠。');
                });
                [sourcePortsByNode, targetPortsByNode].forEach(function (portMap) {
                    portMap.forEach(function (ports) {
                        const uniquePorts = new Set(ports.map(function (value) { return value.toFixed(2); }));
                        if (uniquePorts.size !== ports.length) throw new Error('同一节点存在重叠锚点。');
                    });
                });

                const downwardProbe = edges.find(function (edge) {
                    return topologyRelationshipDirectionV10(edge) === 'down';
                });
                if (downwardProbe) {
                    const upwardProbe = {
                        id: 'layout-upward-probe',
                        source: downwardProbe.target,
                        target: downwardProbe.source,
                        sourceAbilityId: downwardProbe.targetAbilityId,
                        targetAbilityId: downwardProbe.sourceAbilityId,
                        reviewState: 'normal'
                    };
                    const upwardRoute = topologyPathV10(upwardProbe, [upwardProbe]);
                    const upwardSourceMetrics = topologyMetricsForNodeV10(upwardProbe.source);
                    const upwardTargetMetrics = topologyMetricsForNodeV10(upwardProbe.target);
                    if (!upwardRoute || upwardRoute.direction !== 'up' || upwardRoute.start.x !== upwardSourceMetrics.x || upwardRoute.end.x !== upwardTargetMetrics.x + upwardTargetMetrics.width || upwardRoute.targetChannelX <= upwardRoute.end.x) {
                        throw new Error('关系图未通过向上依赖路由校验。');
                    }
                    if (detectRelationshipCycleEdgeIdsV10([upwardProbe]).size !== 0) {
                        throw new Error('向上依赖被错误识别为循环关系。');
                    }
                    const cycleProbeIds = detectRelationshipCycleEdgeIdsV10([downwardProbe, upwardProbe]);
                    if (!cycleProbeIds.has(downwardProbe.id) || !cycleProbeIds.has(upwardProbe.id)) {
                        throw new Error('关系图未通过循环关系独立检测校验。');
                    }
                }
            }

            function validateDataV10() {
                const nodeIds = new Set();
                abilitiesV10.forEach(function (ability) {
                    if (!ability.levels.length) throw new Error(ability.name + '缺少主线节点。');
                    ability.levels.forEach(function (node, index) {
                        if (nodeIds.has(node.id)) throw new Error('重复节点：' + node.id);
                        nodeIds.add(node.id);
                        if (node.level !== index + 1) throw new Error(ability.name + '主线等级不连续。');
                        if (!Number.isInteger(node.masteryStars) || node.masteryStars < 0 || node.masteryStars > 5) {
                            throw new Error(node.id + '星级无效。');
                        }
                        if (typeof node.canStudy !== 'boolean') throw new Error(node.id + '缺少明确学习权限。');
                    });
                    if (!levelNodeByIdV10(ability.currentLevelNodeId) || !levelNodeByIdV10(ability.targetLevelNodeId)) {
                        throw new Error(ability.name + '缺少当前或目标节点。');
                    }
                    if (currentNodeV10(ability).role !== 'current' || targetNodeV10(ability).role !== 'target') {
                        throw new Error(ability.name + '的主线角色标记不完整。');
                    }
                });
                levelRelationshipsV10.forEach(function (relationship) {
                    const source = levelNodeByIdV10(relationship.source);
                    const target = levelNodeByIdV10(relationship.target);
                    if (!source || !target) throw new Error('子关系引用了不存在的节点。');
                    if (source.abilityId === target.abilityId) throw new Error('能力内部连续等级不得写入子关系。');
                });
                validateTopologyLayoutV10();
            }
