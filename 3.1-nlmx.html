        :root {
            --brand: #1F5FFF;
            --ink: #172033;
            --soft-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.03), 0 2px 8px -2px rgba(0, 0, 0, 0.02);
            --type-page-title: 32px;
            --type-section-title: 20px;
            --type-card-title: 17px;
            --type-body: 14px;
            --type-meta: 12px;
            --type-label: 11px;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #FBFCFE 0%, #F4F7FB 100%);
        }

        button {
            -webkit-appearance: none;
        }

        button:focus-visible,
        [role="button"]:focus-visible {
            outline: 3px solid rgba(31, 95, 255, 0.25);
            outline-offset: 2px;
        }

        .app-shell {
            width: min(1300px, 100vw);
            height: 100vh;
            height: 100dvh;
        }

        .page-view {
            display: none;
        }

        .page-view.is-active {
            display: flex;
            animation: page-enter 180ms ease-out;
        }

        .native-scroll {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
        }

        .horizontal-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            scrollbar-width: none;
        }

        .horizontal-scroll::-webkit-scrollbar,
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            scrollbar-width: none;
        }

        .ability-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ability-row {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 24px -22px rgba(15, 23, 42, 0.32);
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        .ability-name-card {
            display: flex;
            width: 176px;
            height: 78px;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            border: 1px solid #C9D8FF;
            border-radius: 14px;
            background: #F4F7FF;
            padding: 0 15px;
            color: #173E9C;
            text-align: left;

        .mainline-list {
            min-width: max-content;

        .overview-mainline .mainline-node {
            width: 112px;

            height: 78px;

            height: 78px;
            flex-basis: 24px;
        }

        .overview-mainline .node-caption {
            max-width: 90px;
            margin-top: 3px;
            font-size: 10px;
        }

        .node-current-badge {
            position: absolute;
            right: 7px;
            top: 6px;
            border: 1px solid #F4CF79;
            border-radius: 6px;
            background: #FFF4CF;
            padding: 2px 5px;
            color: #8A4B08;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
        }

        .node-lock-badge {
            position: absolute;
            left: 8px;
            top: 7px;
            display: inline-flex;
            width: 22px;
            height: 22px;
            align-items: center;
            justify-content: center;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            background: #FFFFFF;
            color: #64748B;
            font-size: 13px;
            line-height: 1;
            box-shadow: 0 2px 5px rgba(15, 23, 42, 0.06);
            pointer-events: none;

            width: 26px;
            height: 26px;
            border-color: #F6C76B;
            background: #FFF2C2;
            color: #C56A07;
            font-size: 15px;
            box-shadow: 0 3px 8px rgba(197, 106, 7, 0.12);
        }

        .mainline-node.role-target .node-lock-badge {
            color: #64748B;
        }

        .mainline-node {
            position: relative;
            display: flex;
            min-width: 66px;
            height: 68px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #DCE4EF;
            border-radius: 12px;
            background: #FFFFFF;
            color: #475569;
            transition: transform 150ms ease, border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
        }

        .mainline-node:active {
            transform: scale(0.95);
        }

        .mainline-node.role-completed {
            border-color: #BFE7CB;
            background: #F3FCF6;
            color: #166534;
        }

        .mainline-node.role-current {
            border-color: #F0C36A;
            background: #FFF4CF;
            color: #92400E;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.09);
        }

        .mainline-node.role-current.state-locked {
            border-width: 2px;
            border-color: #F59E0B;
            border-style: dashed;
            background: #FFFCF2;
            color: #9A5B13;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.05);
        }

        .mainline-node.role-upcoming {
            border-color: #D2DAE6;
            background: #FFFFFF;
            color: #64748B;
        }

        .mainline-node.role-upcoming.state-locked {
            border-style: dashed;
        }

        .mainline-node.role-target {
            border-color: #6F98FF;
            border-style: dashed;
            background: #EDF3FF;
            color: #1746B2;
        }

        .mainline-node::after {
            position: absolute;
            inset: -3px;
            border: 1.5px solid rgba(31, 95, 255, 0.68);
            border-radius: 14px;
            content: "";
            opacity: 0;
            pointer-events: none;
            transform: scale(0.97);
            transition: opacity 180ms linear, transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .mainline-node.is-selected::after {
            opacity: 1;
            transform: scale(1);
        }

        .node-level {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .node-caption {
            margin-top: 1px;
            max-width: 60px;
            overflow: hidden;
            color: currentColor;
            font-size: 9px;
            font-weight: 800;
            line-height: 1.15;
            opacity: 0.78;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .mini-stars {
            --star-size: 9px;
            display: flex;
            height: 11px;
            align-items: center;
            gap: 1px;
            margin-top: 3px;
        }

        .mini-stars .star-icon {
            display: block;
            width: var(--star-size);
            height: var(--star-size);
            flex: 0 0 var(--star-size);
            overflow: visible;
            shape-rendering: geometricPrecision;
        }

        .mini-stars .star-icon__shape {
            fill: var(--star-fill, #D7DFEA);
            stroke: var(--star-stroke, transparent);
            stroke-width: var(--star-stroke-width, 0);
            paint-order: stroke fill markers;
            vector-effect: non-scaling-stroke;
        }

        .mini-stars .star-icon.is-earned {
            --star-fill: #F59E0B;
        }

        .role-completed .mini-stars .star-icon.is-earned {
            --star-fill: #35A760;
        }

        .mainline-connector {
            position: relative;
            display: flex;
            width: 25px;
            height: 68px;
            flex: 0 0 25px;
            align-items: center;
            justify-content: center;
            color: #CBD5E1;
        }

        .mainline-connector::before {
            width: 100%;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            content: "";

        .mainline-connector i {
            position: absolute;
            right: -3px;
            padding: 1px 0;
            background: #FFFFFF;
            font-size: 11px;
        }

        .mainline-connector.is-passed {

        }

        .mainline-connector.is-current {
            color: #7DA1FF;
        }

        .mainline-connector.is-target {
            color: #CBD5E1;
        }

        }

        .detail-mainline .mini-stars {

            margin-top: 5px;
        }

        .learning-card {
            border: 1px solid #E4EAF2;
            background: #FFFFFF;
            box-shadow: 0 8px 20px -20px rgba(15, 23, 42, 0.34);
            transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
        }

        .learning-card:active:not(:disabled) {
            transform: scale(0.95);
        }

        .learning-card:disabled {
            cursor: not-allowed;
            border-color: #E2E8F0;
            background: #F8FAFC;
            box-shadow: none;
        }

        .topology-surface {
            position: relative;
            min-height: 0;
            overflow: hidden;
            background-color: #FAFCFF;
            background-image: radial-gradient(circle, rgba(148, 163, 184, 0.2) 1px, transparent 1.1px);
            background-size: 26px 26px;
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .topology-surface.is-panning {
            cursor: grabbing;
        }

        #topology-svg {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .graph-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .graph-control-button {
            display: flex;
            min-width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-radius: 10px;
            color: #475569;
            font-size: 11px;
            font-weight: 800;
            transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
        }

        .graph-control-button[hidden] {
            display: none;
        }

        .graph-control-button:active {
            transform: scale(0.9);
            background: #EFF6FF;
            color: #1F5FFF;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 50;
            display: flex;
            min-height: 44px;
            align-items: center;
            gap: 8px;
            border: 1px solid #DCE4EF;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.96);
            padding: 10px 14px;
            color: #334155;
            font-size: var(--type-meta);
            font-weight: 800;
            box-shadow: 0 16px 36px -20px rgba(15, 23, 42, 0.42);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 12px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .topology-hint {
            position: absolute;
            left: 50%;
            top: 14px;
            z-index: 4;
            display: flex;
            min-height: 40px;
            align-items: center;
            border: 1px solid rgba(191, 208, 255, 0.9);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.96);
            padding: 8px 13px;
            color: #2852B8;
            font-size: 11px;
            font-weight: 800;
            box-shadow: var(--soft-shadow);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -6px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .topology-hint.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .topology-hint.is-warning {
            border-color: #F7D7A6;
            background: rgba(255, 251, 235, 0.97);
            color: #9A5B13;
        }

        /* 15.5：首页整行浅蓝仅表示鼠标悬停；常驻业务状态只落在具体阶段节点上。 */
        @media (hover: hover) and (pointer: fine) {
            .ability-row:hover {
                border-color: #BFD0FF;
                box-shadow: 0 18px 34px -27px rgba(31, 95, 255, 0.42);
                transform: translateY(-2px);
            }

            .mainline-node:hover {
                border-color: #7DA1FF;
                box-shadow: 0 8px 18px -14px rgba(31, 95, 255, 0.48);
                transform: translateY(-1px);
            }

            .learning-card:hover:not(:disabled) {
                border-color: #BFD0FF;
                box-shadow: 0 14px 26px -22px rgba(31, 95, 255, 0.5);
                transform: translateY(-1px);
            }

            .graph-control-button:hover {
                background: #EFF6FF;
                color: #1F5FFF;
            }
        }

        @media (max-width: 760px) {
            .app-shell {
                padding: 12px;
            }

            .ability-name-card {
                width: 164px;
            }

            .learning-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @keyframes page-enter {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            min-height: 44px;

            border: 0;
            border-radius: 10px;

            border-radius: 10px;
            background: rgba(255, 255, 255, 0.58);
            content: "";

        }

        /* 15.7：任务卡按可用宽度自动生成列，iPad 横屏优先容纳 4–5 张并均分余量。 */
        .task-learning-grid {
            grid-template-columns: repeat(auto-fill, minmax(min(224px, 100%), 1fr));
            column-gap: 8px;
            row-gap: 6px;
        }

        .task-learning-grid .learning-card {
            min-width: 0;
            height: 68px;
            min-height: 68px;
            max-height: 68px;
            padding: 6px 10px;
        }

        .task-learning-grid .learning-task-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-size: 15px;
        }

        .task-learning-grid .learning-task-title {
            font-size: 14.5px;
        }

        /* 空状态退化为一行说明，不再生成整行白色或虚线空卡。 */
        .task-learning-grid.is-empty .learning-empty-state {
            width: auto !important;
            min-height: 44px;
            justify-self: start;
            justify-content: flex-start;
            border: 0;
            border-radius: 0;
            background: transparent;
            padding: 0 2px;
            color: #64748B;
            font-size: 13px;
        }

        @media (hover: hover) and (pointer: fine) {
            .dependency-hint-item:hover {
                color: #1F5FFF;
            }

            .dependency-hint-item:hover::before {
                border-color: #BFD0FF;
                background: rgba(245, 248, 255, 0.9);
            }
        }

        /* 18.5：当前标题保持空间优先级；路由在剩余宽度内围绕当前节点连续展开。 */
        .compact-header-context {
            overflow: visible;
        }

        .compact-header-title {
            max-width: none;
            flex: 0 0 auto;
            overflow: visible;
            text-overflow: clip;
        }

        .compact-route-nav {
            min-width: 88px;
            flex: 1 1 0;
            -webkit-mask-image: none !important;
            mask-image: none !important;
        }

        .compact-route-list {
            max-width: none;
        }

        /* 16.1：首页左列冻结，右侧以页面底色的极轻渐隐衔接滚动内容。 */
        .ability-row {
            isolation: isolate;
        }

        .ability-row-scroll {
            position: relative;
            padding-right: 40px;
            scroll-padding-left: 184px;
            scroll-padding-right: 40px;
            -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 40px), transparent 100%);
            mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 40px), transparent 100%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        .overview-mainline .mainline-start-item {
            position: sticky;
            left: 0;
            z-index: 6;
            flex: 0 0 154px;
            align-self: stretch;
            background: #F8FAFD;
            box-shadow: none;
            scroll-snap-align: none;
            scroll-snap-stop: normal;
        }

        .overview-mainline .mainline-start-item::after {
            position: absolute;
            top: 0;
            right: -16px;
            width: 16px;
            height: 100%;
            background: linear-gradient(to right, rgba(248, 250, 253, 0.98), rgba(248, 250, 253, 0));
            content: "";
            pointer-events: none;
        }

        .overview-mainline .ability-name-card {
            width: 154px;
            background: transparent;
        }

        .ability-row-entry {
            z-index: 8;
        }

        /* 未解锁只限制任务操作，不隐藏任务内容、主线、关联或依赖入口。 */
        .task-learning-grid.is-locked .learning-card:disabled {
            border-color: #DDE5EE;
            background: #F4F7FA;
            opacity: 1;
        }

        /* 底部内容只由原生滚动区收口，彻底移除 mask、伪元素、阴影与固定遮罩。 */
        .overview-surface,
        .overview-scroll,
        .task-workspace,
        .task-learning-scroll {
            -webkit-mask: none !important;
            mask: none !important;
            box-shadow: none !important;
        }

        .overview-surface::before,
        .overview-surface::after,
        .overview-scroll::before,
        .overview-scroll::after,
        .task-workspace::before,
        .task-workspace::after,
        .task-learning-scroll::before,
        .task-learning-scroll::after {
            display: none !important;
            content: none !important;
        }

        .overview-scroll {
            padding-bottom: max(10px, env(safe-area-inset-bottom)) !important;
            scroll-padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        .task-learning-scroll {
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            scroll-padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        /* 15.7：所有标题仅依靠字号、字重与颜色建立层级，不使用文字或滤镜投影。 */
        h1,
        h2,
        h3,
        .page-title,
        .section-title,
        .card-title,
        .compact-header-title,
        .ability-name-card .card-title,
        .node-caption {
            text-shadow: none !important;
            filter: none !important;
        }

        @media (max-width: 900px) {
            .compact-header-title {
                max-width: none;
            }
        }

        @media (max-width: 760px) {
            .ability-row-scroll {
                scroll-padding-left: 166px;
            }

            .overview-mainline .mainline-start-item,
            .overview-mainline .ability-name-card {
                width: 136px;
                flex-basis: 136px;
            }

        }

        /* 17.7：首页沿用 15.9 的轻盈比例；描边星使用极浅灰实心与纯金描边，无描边星保持更深灰实心。 */
        .mini-stars .star-icon.is-unstarted,
        .mini-stars .star-icon.is-unearned {
            --star-fill: #C3CEDB;
            --star-stroke: transparent;
            --star-stroke-width: 0;
        }

        .mini-stars .star-icon.is-learning {
            --star-fill: #E4E9EF;
            --star-stroke: #F5B000;
            --star-stroke-width: 1.2px;
        }

        .mini-stars .star-icon.is-learning .star-icon__shape {
            paint-order: fill stroke markers;
        }

        /* 跨主线直接关联复用同一星级规则；锁定节点只显示锁，不渲染星级。 */
        .dependency-hint-item {
            gap: 10px;
        }

        .dependency-hint-node-label {
            min-width: 0;
        }

        .dependency-hint-item .mini-stars,
        .dependency-hint-lock {
            height: 14px;
            margin-top: 0;
            border-left: 1px solid #D8E1ED;
            padding-left: 10px;
        }

        .dependency-hint-item .mini-stars {
            --star-size: 9px;
            gap: 1px;
        }

        .dependency-hint-lock {
            display: inline-flex;
            align-items: center;
            color: #64748B;
            font-size: 13px;
            line-height: 1;
        }

        /* 依赖视图直接使用任务视图的完整主线规格。 */
        .topology-workspace > .task-mainline-strip {
            flex: 0 0 auto;
        }

        /* 任务类型仅由左侧图标表达，状态与任务名继续保留文字。 */
        .task-learning-grid .learning-task-copy {
            justify-content: center;
        }

        /* 17.9：三项本地图标集中存放于零尺寸 SVG symbol 精灵，不参与页面布局。 */
        .learning-task-symbol-sprite {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* 16.7：四类任务图标共用同一容器规格；课堂使用老师与黑板组合语义。 */
        .task-learning-grid .learning-task-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
        }

        .task-learning-grid .learning-task-icon img,
        .task-learning-grid .learning-task-icon svg {
            display: block;
            width: 22px;
            height: 22px;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .task-learning-grid .learning-task-icon i {
            font-size: 18px;
            line-height: 1;
        }

        .learning-card:disabled .learning-task-icon img,
        .learning-card:disabled .learning-task-icon svg {
            filter: grayscale(1);
            opacity: 0.48;
        }

        /* 16.3：任务状态缩小并降饱和，视觉权重明显低于任务名称。 */
        .task-learning-grid .learning-task-semantic {
            width: 52px;
            min-width: 52px;
            height: 17px;
            min-height: 17px;
            align-self: flex-start;
            justify-content: center;
            padding-inline: 5px;
            border-color: #D9E2F3;
            background: #F6F8FC;
            color: #64789F;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        /* 17.8：进行中与主线当前阶段共用同一套浅黄底、金色边框与深棕文字。 */
        .task-learning-grid .learning-task-semantic.is-in-progress {
            border-color: #F0C36A;
            background: #FFF4CF;
            color: #92400E;
        }

        .task-learning-grid .learning-task-semantic.is-not-started {
            border-color: #D8E0EA;
            background: #F1F5F9;
            color: #64748B;
        }

        .task-learning-grid .learning-task-semantic.is-completed {
            border-color: #B7E2C6;
            background: #ECF9F1;
            color: #157A3F;
        }

        .node-current-badge {
            min-width: 30px;
            text-align: center;
        }

        .node-current-badge.is-learning {
            border-color: #EFC27D;
            background: #FFF7E8;
            background-image: none;
            color: #A65300;
            box-shadow: none;
        }

        /* 19.6：所有状态保留同一 12px 盒子；学习态路径仅在盒内光学放大 7%，不改变基线、间距与总宽。 */
        .mini-stars {
            --star-size: 12px;
            height: 13px;
            gap: 1.5px;
        }

        .detail-mainline .mini-stars {
            --star-size: 12px;
            height: 15px;
        }

        .dependency-hint-item .mini-stars {
            --star-size: 12px;
            height: 16px;
            gap: 1.5px;
        }

        .mini-stars .star-icon__inset {
            display: none;
            fill: #FFFFFF;
            stroke: none;
            pointer-events: none;
        }

        .mini-stars .star-icon.is-learning {
            --star-fill: #F5B000;
            --star-stroke: transparent;
            --star-stroke-width: 0;
        }

        .mini-stars .star-icon.is-learning .star-icon__inset {
            display: block;
        }

        /* 折叠历史的清理操作与可撤销提示均保留 44px 原生点击区域。 */
        .route-history-popover-actions {
            border-top: 1px solid #E7EDF5;
            padding: 4px;
        }

        .route-history-clear-other {
            display: flex;
            width: 100%;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #B42318;
            font-size: 13px;
            font-weight: 850;
            touch-action: manipulation;
            transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
        }

        .route-history-clear-other:active {
            transform: scale(0.95);
            background: #FFF1F0;
            color: #912018;
        }

        .toast.has-action {
            gap: 10px;
            padding: 4px 4px 4px 14px;
            pointer-events: auto;
        }

        .toast-action {
            display: inline-flex;
            min-width: 58px;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 10px;
            background: #EDF3FF;
            padding: 0 12px;
            color: #1746B2;
            font-size: 13px;
            font-weight: 900;
            touch-action: manipulation;
            transition: transform 150ms ease, background-color 150ms ease;
        }

        .toast-action[hidden] {
            display: none;
        }

        .toast-action:active {
            transform: scale(0.95);
            background: #DCE7FF;
        }

        @media (hover: hover) and (pointer: fine) {
            .route-history-clear-other:hover {
                background: #FFF7F6;
                color: #912018;
            }

            .toast-action:hover {
                background: #E0E9FF;
            }
        }
    </style>

                        const sourceNode = sourceAbility.levels[Math.min(index, sourceAbility.levels.length - 1)];

            /* 14.4：Sugiyama 分层内使用双向 barycenter / median sweep；坐标阶段增加根锚定、分叉/汇聚中心对齐与紧凑层约束。 */
            function topologyLayerCrossingCountV143(graph, rankById, slots) {

                        const rightRatio = (gapRank + 1 - sourceRank) / span;
                        if (!segmentsByGap.has(gapRank)) segmentsByGap.set(gapRank, []);
                        segmentsByGap.get(gapRank).push({

                            right: sourceSlot + (targetSlot - sourceSlot) * rightRatio

            function topologyLaneSlotsV144(graph, rankById) {

                function sweep(orders, direction) {

                    if (direction === 'backward') ranks.reverse();
                    ranks.forEach(function (rank) {
                        const nodeIds = orders.get(rank);
                        if (nodeIds.length < 2) return;
                        const slots = slotsForOrders(orders);
                        const previousIndex = new Map(nodeIds.map(function (nodeId, index) { return [nodeId, index]; }));
                        nodeIds.sort(function (firstId, secondId) {
                            const firstScore = neighborScore(firstId, direction, slots);
                            const secondScore = neighborScore(secondId, direction, slots);
                            if (firstScore && secondScore) {
                                return firstScore.median - secondScore.median ||
                                    firstScore.barycenter - secondScore.barycenter ||
                                    previousIndex.get(firstId) - previousIndex.get(secondId) ||
                                    topologyNodeOrderV129(nodeById.get(firstId), nodeById.get(secondId));
                            }
                            if (firstScore) return -1;
                            if (secondScore) return 1;
                            return previousIndex.get(firstId) - previousIndex.get(secondId) ||
                                topologyNodeOrderV129(nodeById.get(firstId), nodeById.get(secondId));
                        });
                    });
                }

                function orderingScore(orders, initialIndexById) {
                    const slots = slotsForOrders(orders);
                    const crossings = topologyLayerCrossingCountV143(graph, rankById, slots);
                    const obstructions = topologyLayerObstacleCountV143(graph, rankById, slots);
                    const alignment = topologyLayerAlignmentMetricsV144(graph, rankById, slots);
                    let movement = 0;
                    orders.forEach(function (nodeIds) {
                        nodeIds.forEach(function (nodeId, index) { movement += Math.abs(index - initialIndexById.get(nodeId)); });
                    });
                    return { orders: copyOrders(orders), slots: slots, crossings: crossings, obstructions: obstructions, alignment: alignment, movement: movement };
                }

                const initialIndexById = new Map();
                initialOrders.forEach(function (nodeIds) {
                    nodeIds.forEach(function (nodeId, index) { initialIndexById.set(nodeId, index); });
                });
                const initialScore = orderingScore(initialOrders, initialIndexById);
                const candidates = [initialScore];
                [copyOrders(initialOrders), new Map(Array.from(initialOrders.entries()).map(function (entry) {
                    return [entry[0], entry[1].slice().reverse()];
                }))].forEach(function (seed) {
                    const orders = copyOrders(seed);
                    for (let pass = 0; pass < 10; pass += 1) {

                candidates.sort(function (first, second) {
                    return first.crossings - second.crossings ||
                        first.alignment.anchorDrift - second.alignment.anchorDrift ||
                        first.alignment.rootGroupMisalignment - second.alignment.rootGroupMisalignment ||
                        first.alignment.groupMisalignment - second.alignment.groupMisalignment ||
                        first.alignment.maximumGroupMisalignment - second.alignment.maximumGroupMisalignment ||
                        first.alignment.layerDrift - second.alignment.layerDrift ||
                        first.alignment.edgeSpan - second.alignment.edgeSpan ||
                        first.obstructions - second.obstructions ||
                        first.movement - second.movement;
                });
                // 根层保持绝对锚定；其他层仅允许半个 lane 的奇偶校正，禁止为虚拟长边整体漂移数个 lane。
                function optimizeLayerOffsets(orders) {

                        const slots = new Map(baseSlots);

                            if (rank === rootRank || Math.abs(offset) < 0.1) return;
                            (orders.get(rank) || []).forEach(function (nodeId) { slots.set(nodeId, (slots.get(nodeId) || 0) + offset); });
                        });
                        return slots;
                    }
                    function offsetScore(offsets) {
                        const candidateSlots = offsetSlots(offsets);
                        const alignment = topologyLayerAlignmentMetricsV144(graph, rankById, candidateSlots);
                        let movement = 0;
                        candidateSlots.forEach(function (slot, nodeId) { movement += Math.abs(slot - (baseSlots.get(nodeId) || 0)); });
                        return {
                            slots: candidateSlots,
                            crossings: topologyLayerCrossingCountV143(graph, rankById, candidateSlots),
                            obstructions: topologyLayerObstacleCountV143(graph, rankById, candidateSlots),
                            alignment: alignment,
                            movement: movement,
                            offsets: new Map(offsets)

                    }
                    function compareOffsetScores(first, second) {
                        return first.crossings - second.crossings ||
                            first.alignment.anchorDrift - second.alignment.anchorDrift ||
                            first.alignment.rootGroupMisalignment - second.alignment.rootGroupMisalignment ||
                            first.alignment.groupMisalignment - second.alignment.groupMisalignment ||
                            first.alignment.maximumGroupMisalignment - second.alignment.maximumGroupMisalignment ||
                            first.alignment.layerDrift - second.alignment.layerDrift ||

                    });
                    const beamWidth = ranks.length <= 7 ? Math.pow(3, ranks.length) : 128;
                    let states = [{ offsets: new Map([[rootRank, 0]]), score: offsetScore(new Map([[rootRank, 0]])) }];
                    ranks.forEach(function (rank) {

                        states.forEach(function (state) {

                        states = expanded.slice(0, beamWidth);
                    });
                    states.sort(function (first, second) { return compareOffsetScores(first.score, second.score); });

                }
                const shifted = optimizeLayerOffsets(candidates[0].orders);
                return {
                    slots: shifted.slots,
                    initialCrossingCount: initialScore.crossings,

                    initialObstacleCount: initialScore.obstructions,
                    obstacleCount: shifted.obstructions,
                    initialAlignmentScore: initialScore.alignment.groupMisalignment,
                    alignmentScore: shifted.alignment.groupMisalignment,

                    initialEdgeSpan: initialScore.alignment.edgeSpan,
                    edgeSpan: shifted.alignment.edgeSpan,
                    layerDriftScore: shifted.alignment.layerDrift,
                    maximumLayerDrift: shifted.alignment.maximumLayerDrift,
                    compactnessScore: shifted.alignment.compactness,
                    method: 'sugiyama-barycenter-median-anchored-compact'

            }

            function topologyLayeredLayoutV132(graph) {
                const nodeWidth = 168;
                const incomingDegree = new Map(graph.nodes.map(function (node) { return [node.id, 0]; }));
                const outgoingDegree = new Map(graph.nodes.map(function (node) { return [node.id, 0]; }));
                graph.edges.forEach(function (edge) {
                    outgoingDegree.set(edge.source, (outgoingDegree.get(edge.source) || 0) + 1);
                    incomingDegree.set(edge.target, (incomingDegree.get(edge.target) || 0) + 1);
                });
                const maximumPortDegree = Math.max(1, ...Array.from(incomingDegree.values()), ...Array.from(outgoingDegree.values()));
                const nodeHeight = Math.max(
                    76,

                const rowGap = Math.max(
                    44,
                    topologyRoutingConfigV143.nodeClearance * 2 +

                    const targetRank = rankData.rankById.get(edge.target) || 0;

                const corridorGap = Math.max(
                    84,
                    topologyRoutingConfigV143.nodeClearance * 2 +

                const columnStep = nodeWidth + corridorGap;
                const laneLayout = topologyLaneSlotsV144(graph, rankData.rankById);
                const laneSlots = laneLayout.slots;
                const rawMetrics = new Map();
                graph.nodes.forEach(function (node) {
                    const centerX = (rankData.rankById.get(node.id) || 0) * columnStep;
                    const centerY = (laneSlots.get(node.id) || 0) * rowStep;
                    rawMetrics.set(node.id, {
                        id: node.id,
                        x: centerX - nodeWidth / 2,
                        y: centerY - nodeHeight / 2,
                        width: nodeWidth,
                        height: nodeHeight,
                        centerX: centerX,
                        centerY: centerY,
                        rank: rankData.rankById.get(node.id) || 0,
                        lane: laneSlots.get(node.id) || 0

                });
                let minimumX = Infinity;
                let maximumX = -Infinity;
                let minimumY = Infinity;
                let maximumY = -Infinity;
                rawMetrics.forEach(function (metrics) {
                    minimumX = Math.min(minimumX, metrics.x);
                    maximumX = Math.max(maximumX, metrics.x + metrics.width);
                    minimumY = Math.min(minimumY, metrics.y);
                    maximumY = Math.max(maximumY, metrics.y + metrics.height);
                });
                if (!Number.isFinite(minimumX)) {
                    minimumX = -nodeWidth / 2;
                    maximumX = nodeWidth / 2;
                    minimumY = -nodeHeight / 2;
                    maximumY = nodeHeight / 2;
                }
                const outerRouteCount = graph.edges.filter(function (edge) {
                    const sourceRank = rankData.rankById.get(edge.source) || 0;
                    const targetRank = rankData.rankById.get(edge.target) || 0;
                    return rankData.cycleEdgeIds.has(edge.id) || targetRank <= sourceRank;
                }).length;
                const outerLaneDepth = Math.max(1, Math.ceil(outerRouteCount / 2));
                const paddingX = Math.max(170, 92 + outerLaneDepth * 28);
                const paddingY = Math.max(150, 92 + outerLaneDepth * 28);
                const horizontalExtent = Math.max(Math.abs(minimumX), Math.abs(maximumX));
                const verticalExtent = Math.max(Math.abs(minimumY), Math.abs(maximumY));
                const viewWidth = Math.max(1100, (horizontalExtent + paddingX) * 2);
                const viewHeight = Math.max(680, (verticalExtent + paddingY) * 2);
                const shiftX = viewWidth / 2;
                const shiftY = viewHeight / 2;
                const metricsById = new Map();
                rawMetrics.forEach(function (metrics, nodeId) {
                    metricsById.set(nodeId, {
                        id: nodeId,
                        x: metrics.x + shiftX,
                        y: metrics.y + shiftY,
                        width: metrics.width,
                        height: metrics.height,

                        centerY: metrics.centerY + shiftY,

                const layerCenters = new Map();
                metricsById.forEach(function (metrics) {
                    bounds.left = Math.min(bounds.left, metrics.x);
                    bounds.right = Math.max(bounds.right, metrics.x + metrics.width);
                    bounds.top = Math.min(bounds.top, metrics.y);
                    bounds.bottom = Math.max(bounds.bottom, metrics.y + metrics.height);

                    viewWidth: viewWidth,
                    viewHeight: viewHeight,
                    metricsById: metricsById,

                    componentByNode: rankData.componentByNode,
                    bounds: bounds,
                    layerCenters: layerCenters,
                    nodeWidth: nodeWidth,
                    nodeHeight: nodeHeight,
                    rowGap: rowGap,
                    rowStep: rowStep,
                    columnStep: columnStep,
                    rankZeroX: shiftX,
                    orderingMethod: laneLayout.method,
                    initialCrossingCount: laneLayout.initialCrossingCount,
                    crossingCount: laneLayout.crossingCount,
                    initialObstacleCount: laneLayout.initialObstacleCount,
                    obstacleCount: laneLayout.obstacleCount,
                    initialAlignmentScore: laneLayout.initialAlignmentScore,
                    alignmentScore: laneLayout.alignmentScore,
                    rootGroupMisalignment: laneLayout.rootGroupMisalignment,
                    initialEdgeSpan: laneLayout.initialEdgeSpan,
                    edgeSpan: laneLayout.edgeSpan,
                    layerDriftScore: laneLayout.layerDriftScore,

            function topologyCompactOrthogonalPointsV132(points) {
                const compact = [];
                points.forEach(function (point) {
                    const previous = compact[compact.length - 1];
                    if (previous && Math.abs(previous.x - point.x) < 0.1 && Math.abs(previous.y - point.y) < 0.1) return;
                    compact.push({ x: point.x, y: point.y });
                    while (compact.length >= 3) {
                        const first = compact[compact.length - 3];
                        const middle = compact[compact.length - 2];
                        const last = compact[compact.length - 1];
                        const sameX = Math.abs(first.x - middle.x) < 0.1 && Math.abs(middle.x - last.x) < 0.1;
                        const sameY = Math.abs(first.y - middle.y) < 0.1 && Math.abs(middle.y - last.y) < 0.1;
                        if (!sameX && !sameY) break;
                        compact.splice(compact.length - 2, 1);
                    }
                });
                return compact;
            }

            function topologyOrthogonalPathDataV132(points) {
                const compact = topologyCompactOrthogonalPointsV132(points);
                return compact.map(function (point, index) {
                    if (index === 0) return 'M ' + point.x.toFixed(2) + ' ' + point.y.toFixed(2);
                    const previous = compact[index - 1];
                    if (Math.abs(previous.y - point.y) < 0.1) return 'H ' + point.x.toFixed(2);
                    if (Math.abs(previous.x - point.x) < 0.1) return 'V ' + point.y.toFixed(2);
                    return 'H ' + point.x.toFixed(2) + ' V ' + point.y.toFixed(2);
                }).join(' ');
            }

            function topologySegmentHitsNodeV132(first, second, edge, metricsById) {
                const horizontal = Math.abs(first.y - second.y) < 0.1;
                const vertical = Math.abs(first.x - second.x) < 0.1;
                if (!horizontal && !vertical) return true;
                let blocked = false;
                metricsById.forEach(function (metrics, nodeId) {
                    if (blocked || nodeId === edge.source || nodeId === edge.target) return;
                    const padding = topologyRoutingConfigV143.nodeClearance;
                    const left = metrics.x - padding;
                    const right = metrics.x + metrics.width + padding;
                    const top = metrics.y - padding;
                    const bottom = metrics.y + metrics.height + padding;
                    if (horizontal) {
                        const minimumX = Math.min(first.x, second.x);
                        const maximumX = Math.max(first.x, second.x);
                        if (first.y > top && first.y < bottom && maximumX > left && minimumX < right) blocked = true;
                    } else {
                        const minimumY = Math.min(first.y, second.y);
                        const maximumY = Math.max(first.y, second.y);
                        if (first.x > left && first.x < right && maximumY > top && minimumY < bottom) blocked = true;
                    }
                });
                return blocked;
            }

            function topologyPathLengthV132(points) {
                let length = 0;
                for (let index = 0; index < points.length - 1; index += 1) {
                    length += Math.abs(points[index + 1].x - points[index].x) + Math.abs(points[index + 1].y - points[index].y);
                }
                return length;
            }

            /* 16.4：每条边独占端口和通道；12px 线距、16px 节点净空在所有依赖图中共享。 */
            const topologyRoutingConfigV143 = Object.freeze({
                grid: 12,
                lineSeparation: 12,
                nodeClearance: 16,
                trackInset: 28,
                outerMargin: 24,
                maximumBends: 4

            function topologyPortPointV143(metrics, side, offset) {

            function topologyPortOffsetsV143(count, metrics) {
                if (count <= 1) return [0];
                const step = topologyRoutingConfigV143.lineSeparation;
                const halfSpan = (count - 1) * step / 2;

            function topologyEdgePortsV143(graph, layout) {
                const outgoing = new Map();
                const incoming = new Map();
                const assignments = new Map();
                graph.edges.forEach(function (edge) {
                    if (!outgoing.has(edge.source)) outgoing.set(edge.source, []);
                    if (!incoming.has(edge.target)) incoming.set(edge.target, []);
                    outgoing.get(edge.source).push(edge);
                    incoming.get(edge.target).push(edge);

                outgoing.forEach(function (edges, nodeId) {
                    const metrics = layout.metricsById.get(nodeId);

                        const firstTarget = layout.metricsById.get(first.target);
                        const secondTarget = layout.metricsById.get(second.target);

            function topologyRoutingLanesV143(layout) {
                const xValues = new Set();

                const ranks = Array.from(layout.layerCenters.keys());

                for (let rank = minimumRank - 1; rank <= maximumRank; rank += 1) {

            function topologyRightLeftDirectionValidV139(points) {

            function topologySegmentHitsMetricsV137(first, second, metrics, padding) {

            function topologyCandidatePathClearV143(points, edge, layout) {

            function topologyCandidateConflictV143(points, routed) {
                let crossings = 0;
                for (let firstIndex = 0; firstIndex < points.length - 1; firstIndex += 1) {
                    const firstStart = points[firstIndex];
                    const firstEnd = points[firstIndex + 1];
                    const firstHorizontal = Math.abs(firstStart.y - firstEnd.y) < 0.1;
                    for (let routeIndex = 0; routeIndex < routed.length; routeIndex += 1) {
                        const route = routed[routeIndex];
                        for (let secondIndex = 0; secondIndex < route.points.length - 1; secondIndex += 1) {
                            const secondStart = route.points[secondIndex];
                            const secondEnd = route.points[secondIndex + 1];
                            const secondHorizontal = Math.abs(secondStart.y - secondEnd.y) < 0.1;
                            if (firstHorizontal === secondHorizontal) {
                                const firstFixed = firstHorizontal ? firstStart.y : firstStart.x;
                                const secondFixed = secondHorizontal ? secondStart.y : secondStart.x;
                                const firstMinimum = firstHorizontal ? Math.min(firstStart.x, firstEnd.x) : Math.min(firstStart.y, firstEnd.y);
                                const firstMaximum = firstHorizontal ? Math.max(firstStart.x, firstEnd.x) : Math.max(firstStart.y, firstEnd.y);
                                const secondMinimum = secondHorizontal ? Math.min(secondStart.x, secondEnd.x) : Math.min(secondStart.y, secondEnd.y);
                                const secondMaximum = secondHorizontal ? Math.max(secondStart.x, secondEnd.x) : Math.max(secondStart.y, secondEnd.y);
                                const overlap = Math.min(firstMaximum, secondMaximum) - Math.max(firstMinimum, secondMinimum);
                                if (overlap > 0.5 && Math.abs(firstFixed - secondFixed) < topologyRoutingConfigV143.lineSeparation - 0.5) {

                                continue;
