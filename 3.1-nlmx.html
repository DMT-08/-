                abilityGridV10.innerHTML = abilitiesV10.map(function (ability) {
                    return (
                        '<article class="ability-row min-w-0 overflow-hidden" data-ability-row="' + escapeHtmlV10(ability.id) + '" aria-labelledby="ability-title-' + escapeHtmlV10(ability.id) + '">' +
                            '<div class="overview-mainline ability-row-scroll horizontal-scroll" data-ability-scroll="' + escapeHtmlV10(ability.id) + '">' +
                                mainlineMarkupV10(ability, null, false) +
                            '</div>' +
                            '<button type="button" class="ability-row-entry is-visible" data-ability-more="' + escapeHtmlV10(ability.id) + '" aria-label="查看' + escapeHtmlV10(ability.name) + '后续阶段" aria-hidden="false" tabindex="0"><i class="ph-bold ph-caret-right" aria-hidden="true"></i></button>' +
                        '</article>'
                    );
                }).join('');
                window.requestAnimationFrame(function () {
                    updateOverviewScrollCueV10();
                    updateAbilityRowOverflowV10();
                });
            }

            function updateAbilityRowOverflowV10() {
                abilityGridV10.querySelectorAll('[data-ability-row]').forEach(function (row) {
                    const scroller = row.querySelector('[data-ability-scroll]');
                    const moreButton = row.querySelector('[data-ability-more]');
                    if (!scroller || !moreButton) return;
                    moreButton.classList.add('is-visible');
                    moreButton.setAttribute('aria-hidden', 'false');
                    moreButton.tabIndex = 0;
                });
            }

            function updateOverviewScrollCueV10() {
                if (!overviewScrollV10 || !overviewScrollCueV10) return;
                const overflow = overviewScrollV10.scrollHeight > overviewScrollV10.clientHeight + 2;
                const remaining = overviewScrollV10.scrollHeight - overviewScrollV10.clientHeight - overviewScrollV10.scrollTop;
                const nearStart = overviewScrollV10.scrollTop <= 12;
                const shouldShow = overflow && remaining > 4 && overviewScrollV10.scrollTop < 112;
                overviewScrollCueV10.classList.toggle('is-visible', shouldShow);
                overviewScrollCueV10.classList.toggle('is-soft', shouldShow && !nearStart);
            }

            function selectedNodeV10() {
                return levelNodeByIdV10(stateV10.selectedLevelNodeId);
            }

            function updateDetailBackButtonV10() {
                const button = document.getElementById('detail-back-button');
                if (!button) return;
                const previousNodeId = stateV10.detailNodeHistory[stateV10.detailNodeHistory.length - 1];
                const previousNode = levelNodeByIdV10(previousNodeId);
                if (!previousNode) {
                    button.setAttribute('aria-label', '返回英语能力');
                    return;
                }
                const previousAbility = abilityForNodeV10(previousNode);
                button.setAttribute('aria-label', '返回上一节点，' + previousAbility.name + ' ' + formatLevelV10(previousNode.level));
            }

            function clearDetailNodeHistoryV10() {
                stateV10.detailNodeHistory.length = 0;
                updateDetailBackButtonV10();
            }

            function recordCurrentDetailNodeV10() {
                const currentNode = selectedNodeV10();
                if (!currentNode) return;
                const lastNodeId = stateV10.detailNodeHistory[stateV10.detailNodeHistory.length - 1];
                if (lastNodeId !== currentNode.id) stateV10.detailNodeHistory.push(currentNode.id);
                updateDetailBackButtonV10();
            }

            function takePreviousDetailNodeV10() {
                while (stateV10.detailNodeHistory.length) {
                    const previousNode = levelNodeByIdV10(stateV10.detailNodeHistory.pop());
                    if (previousNode) return previousNode;
                }
                return null;
            }

            function relationStateMarkupV10(node) {
                let markup = '';
                if (node.role === 'completed') {
                    markup += '<span class="dependency-node-state is-completed"><i class="ph-bold ph-check" aria-hidden="true"></i>已完成</span>';
                }
                if (node.role === 'current') {
                    markup += '<span class="dependency-node-state is-current">当前阶段</span>';
                }
                if (node.role === 'target') {
                    markup += '<span class="dependency-node-state is-target"><i class="ph-bold ph-flag" aria-hidden="true"></i>目标</span>';
                }
                if (node.studyState === 'locked') {
                    markup += '<span class="dependency-node-state is-locked"><i class="ph-bold ph-lock-key" aria-hidden="true"></i>未解锁</span>';
                }
                return markup;
            }

            function relationChipMarkupV10(node, relationKind) {
                const ability = abilityForNodeV10(node);
                const aria = '查看' + ability.name + ' ' + formatLevelV10(node.level);
                const relationKindLabel = relationKind === 'mainline' ? '本主线' : '跨主线';
                return (
                    '<button type="button" data-jump-level-node="' + escapeHtmlV10(node.id) + '" class="dependency-chip role-' + escapeHtmlV10(node.role) + ' state-' + escapeHtmlV10(node.studyState) + '" aria-label="' + escapeHtmlV10(aria) + '">' +
                        '<span class="min-w-0 flex-1">' +
                            '<span class="mb-1.5 flex flex-wrap items-center gap-1.5">' +
                                '<span class="dependency-relation-kind ' + (relationKind === 'mainline' ? 'is-mainline' : 'is-crossline') + '">' + relationKindLabel + '</span>' +
                                relationStateMarkupV10(node) +
                            '</span>' +
                            '<span class="block truncate text-[13px] font-extrabold text-slate-800">' + escapeHtmlV10(ability.name) + '<span class="mx-1 font-bold text-slate-400">· ' + formatLevelV10(node.level) + ' ·</span>' + escapeHtmlV10(node.definition) + '</span>' +
                        '</span>' +
                        '<i class="dependency-chip-caret ph-bold ph-caret-right" aria-hidden="true"></i>' +
                    '</button>'
                );
            }

            function emptyRelationMarkupV10(label) {
                return '<div class="dependency-empty"><i class="ph-bold ph-minus" aria-hidden="true"></i><span>' + label + '</span></div>';
            }

            function renderDependenciesV10(node) {
                const ability = abilityForNodeV10(node);
                const levelIndex = ability.levels.findIndex(function (item) { return item.id === node.id; });
                const previousNode = levelIndex > 0 ? ability.levels[levelIndex - 1] : null;
                const nextNode = levelIndex < ability.levels.length - 1 ? ability.levels[levelIndex + 1] : null;
                const incoming = (previousNode ? [{ node: previousNode, relationKind: 'mainline' }] : []).concat(levelRelationshipsV10.filter(function (relationship) {
                    return relationship.target === node.id;
                }).map(function (relationship) {
                    return { node: levelNodeByIdV10(relationship.source), relationKind: 'crossline' };
                }));
                const outgoing = (nextNode ? [{ node: nextNode, relationKind: 'mainline' }] : []).concat(levelRelationshipsV10.filter(function (relationship) {
                    return relationship.source === node.id;
                }).map(function (relationship) {
                    return { node: levelNodeByIdV10(relationship.target), relationKind: 'crossline' };
                }));
                document.getElementById('dependency-view').innerHTML =
                    '<div class="dependency-layout">' +
                        '<div class="dependency-column' + (incoming.length ? '' : ' is-empty') + '">' +
                            '<div class="mb-2 flex items-center justify-between gap-2 text-[12px] font-extrabold text-slate-600"><span>直接前置</span><span class="font-mono text-[10px] text-slate-400">' + incoming.length + '</span></div>' +
                            '<div class="space-y-2">' + (incoming.length ? incoming.map(function (item) { return relationChipMarkupV10(item.node, item.relationKind); }).join('') : emptyRelationMarkupV10('无直接前置')) + '</div>' +
                        '</div>' +
                        '<div class="dependency-arrow" aria-hidden="true"><i class="ph-bold ph-arrow-right text-[22px]"></i></div>' +
                        '<div class="dependency-focus">' +
                            '<span class="dependency-focus-label mb-2"><i class="ph-bold ph-crosshair" aria-hidden="true"></i>正在查看</span>' +
                            '<strong class="card-title text-center text-slate-950">' + escapeHtmlV10(ability.name) + '<span class="mx-1 text-[13px] font-bold text-brand">· ' + formatLevelV10(node.level) + ' ·</span>' + escapeHtmlV10(node.definition) + '</strong>' +
                            '<span class="mt-2 text-[12px] font-semibold leading-[1.4] text-slate-500">' + escapeHtmlV10(node.description) + '</span>' +
                            '<span class="mt-2 flex flex-wrap items-center justify-center gap-1.5">' + relationStateMarkupV10(node) + '</span>' +
                        '</div>' +
                        '<div class="dependency-arrow" aria-hidden="true"><i class="ph-bold ph-arrow-right text-[22px]"></i></div>' +
                        '<div class="dependency-column' + (outgoing.length ? '' : ' is-empty') + '">' +
                            '<div class="mb-2 flex items-center justify-between gap-2 text-[12px] font-extrabold text-slate-600"><span>直接后续</span><span class="font-mono text-[10px] text-slate-400">' + outgoing.length + '</span></div>' +
                            '<div class="space-y-2">' + (outgoing.length ? outgoing.map(function (item) { return relationChipMarkupV10(item.node, item.relationKind); }).join('') : emptyRelationMarkupV10('无直接后续')) + '</div>' +
                        '</div>' +
                    '</div>';
            }

            function renderLearningV10(ability, node) {
                document.getElementById('learning-title').textContent = ability.name + ' · ' + formatLevelV10(node.level) + ' 学习内容';
                const status = document.getElementById('learning-status');
                status.className = 'shrink-0 rounded-[6px] border px-2 py-1 text-[11px] font-extrabold ' + stateBadgeClassesV10(node);
                status.textContent = node.canStudy ? (node.studyState === 'completed' ? '可复习' : '可学习') : '暂不可用';
                document.getElementById('learning-grid').innerHTML = learningTypesV10.map(function (type) {
                    const disabled = !node.canStudy;
                    const actionLabel = '开始';
                    return (
                        '<button type="button" data-learning-type="' + escapeHtmlV10(type.name) + '" class="learning-card group flex min-h-[72px] w-full items-center gap-3 rounded-[14px] p-3 text-left active:scale-[0.97]"' + (disabled ? ' disabled aria-disabled="true"' : '') + ' aria-label="' + escapeHtmlV10((disabled ? '待解锁' : actionLabel) + ability.name + ' ' + formatLevelV10(node.level) + '的' + type.name) + '">' +
                            '<span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-[10px] ' + (disabled ? 'bg-slate-100 opacity-55' : type.iconClass) + '"><img src="' + type.icon + '" alt="" class="' + type.iconSizeClass + '" aria-hidden="true"></span>' +
                            '<span class="card-title min-w-0 flex-1 truncate ' + (disabled ? 'text-slate-400' : 'text-slate-900') + '">' + escapeHtmlV10(type.name) + '</span>' +
                            (disabled
                                ? '<span class="shrink-0 text-[11px] font-extrabold text-slate-400">待解锁</span>'
                                : '<span class="flex shrink-0 items-center gap-1 text-[12px] font-extrabold text-brand">' + actionLabel + '<i class="ph-bold ph-caret-right text-[14px]" aria-hidden="true"></i></span>') +
                        '</button>'
                    );
                }).join('');
            }

            function teacherReviewContextV10(ability, node) {
                const nodeIndex = ability.levels.findIndex(function (item) { return item.id === node.id; });
                const previousNode = nodeIndex > 0 ? ability.levels[nodeIndex - 1] : null;
                const nextNode = nodeIndex < ability.levels.length - 1 ? ability.levels[nodeIndex + 1] : null;
                if (node.role === 'completed' && nextNode && nextNode.role === 'current' && nextNode.studyState === 'locked') {
                    return { assessmentNode: node, nextNode: nextNode, isGateReview: true };
                }
                if (node.role === 'current' && node.studyState === 'locked' && previousNode && previousNode.role === 'completed') {
                    return { assessmentNode: previousNode, nextNode: node, isGateReview: true };
                }
                if (node.role === 'current' && node.canStudy && nextNode) {
                    return { assessmentNode: node, nextNode: nextNode, isGateReview: false };
                }
                return null;
            }

            function renderTeacherReviewV10(ability, node) {
                const container = document.getElementById('teacher-review');
                const context = teacherReviewContextV10(ability, node);
                if (!context) {
                    container.hidden = true;
                    container.className = '';
                    container.innerHTML = '';
                    return;
                }
                const reminderKey = context.assessmentNode.id + '--' + context.nextNode.id;
                const reminded = teacherReminderKeysV10.has(reminderKey);
                const starCopy = context.assessmentNode.masteryStars > 0 ? context.assessmentNode.masteryStars + ' 星记录' : '本阶段表现';
                const guidance = context.isGateReview
                    ? '请老师复核 ' + formatLevelV10(context.assessmentNode.level) + ' 的 ' + starCopy + '，并确认是否进入 ' + formatLevelV10(context.nextNode.level)
                    : '完成后提醒老师评定星级，并确认是否进入 ' + formatLevelV10(context.nextNode.level);
                const stateBadge = reminded
                    ? '<span class="rounded-[6px] border border-green-200 bg-green-50 px-1.5 py-1 text-[10px] font-extrabold text-green-700">已送达</span>'
                    : '<span class="rounded-[6px] border border-blue-100 bg-white px-1.5 py-1 text-[10px] font-extrabold text-blue-600">待评定</span>';
                const actionMarkup = reminded
                    ? '<button type="button" class="flex min-h-11 shrink-0 cursor-default items-center justify-center gap-1.5 rounded-[10px] border border-green-200 bg-green-50 px-3 text-[13px] font-extrabold text-green-700" disabled aria-disabled="true"><i class="ph-bold ph-check-circle text-[17px]" aria-hidden="true"></i>已提醒</button>'
                    : '<button type="button" data-teacher-reminder="' + escapeHtmlV10(reminderKey) + '" class="flex min-h-11 shrink-0 items-center justify-center gap-1.5 rounded-[10px] border border-blue-200 bg-white px-3 text-[13px] font-extrabold text-brand transition active:scale-95" aria-label="提醒老师评定星级并确认是否进入下一节点"><i class="ph-bold ph-bell-ringing text-[17px]" aria-hidden="true"></i>提醒老师</button>';
                container.hidden = false;
                container.className = 'mt-3';
                container.innerHTML =
                    '<div class="flex min-h-[64px] flex-wrap items-center gap-3 rounded-[14px] border border-blue-100 bg-blue-50/40 px-3 py-2.5 sm:flex-nowrap">' +
                        '<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-white text-brand shadow-sm"><i class="ph-bold ph-chalkboard-teacher text-[19px]" aria-hidden="true"></i></span>' +
                        '<span class="min-w-[180px] flex-1">' +
                            '<span class="flex flex-wrap items-center gap-2"><strong class="text-[13px] font-extrabold text-slate-800">阶段评定</strong>' + stateBadge + '</span>' +
                            '<span class="mt-1 block text-[12px] font-semibold leading-[1.4] text-slate-500">' + escapeHtmlV10(reminded ? '老师处理后会同步星级与下一节点状态' : guidance) + '</span>' +
                        '</span>' +
                        actionMarkup +
                    '</div>';
            }

            function renderDetailV10() {
                const ability = abilityByIdV10(stateV10.selectedAbilityId);
                const node = selectedNodeV10();
                if (!ability || !node || node.abilityId !== ability.id) return;
                document.getElementById('detail-header-title').textContent = ability.name;
                document.getElementById('detail-mainline').innerHTML = mainlineMarkupV10(ability, node.id, true);
                renderDependenciesV10(node);
                renderLearningV10(ability, node);
                renderTeacherReviewV10(ability, node);
                updateDetailBackButtonV10();
            }

            function revealSelectedDetailNodeV10(smooth) {
                window.requestAnimationFrame(function () {
                    const scroller = document.getElementById('detail-mainline');
                    const selected = scroller ? scroller.querySelector('[data-level-node-id="' + stateV10.selectedLevelNodeId + '"]') : null;
                    if (!scroller || !selected) return;
                    const targetLeft = Math.max(0, selected.offsetLeft - (scroller.clientWidth - selected.offsetWidth) / 2);
                    scroller.scrollTo({ left: targetLeft, behavior: smooth ? 'smooth' : 'auto' });
                });
            }

            function detailSwitchTargetsV10(includeHeader) {
                const selectors = [
                    '#dependency-view',
                    '#learning-title',
                    '#learning-status',
                    '#learning-grid',
                    '#teacher-review'
                ];
                if (includeHeader) selectors.unshift('#detail-header-title', '#detail-mainline');
                return Array.from(document.querySelectorAll(selectors.join(',')));
            }

            function clearDetailSwitchGhostsV10() {
                detailSwitchGhostsV10.forEach(function (ghost) { ghost.remove(); });
                detailSwitchGhostsV10 = [];
            }

            function captureDetailSwitchGhostsV10(targets) {
                if (!detailMotionLayerV10) return [];
                const viewportWidth = document.documentElement.clientWidth;
                const viewportHeight = document.documentElement.clientHeight;
                detailSwitchGhostsV10 = targets.map(function (target) {
                    const rect = target.getBoundingClientRect();
                    if (rect.width < 1 || rect.height < 1 || rect.right <= 0 || rect.bottom <= 0 || rect.left >= viewportWidth || rect.top >= viewportHeight) return null;
                    const shell = document.createElement('div');
                    const clone = target.cloneNode(true);
                    shell.className = 'detail-switch-ghost';
                    shell.style.left = rect.left + 'px';
                    shell.style.top = rect.top + 'px';
                    shell.style.width = rect.width + 'px';
                    shell.style.height = rect.height + 'px';
                    clone.removeAttribute('id');
                    clone.removeAttribute('aria-live');
                    clone.setAttribute('aria-hidden', 'true');
                    clone.setAttribute('inert', '');
                    clone.querySelectorAll('[id]').forEach(function (element) { element.removeAttribute('id'); });
                    clone.querySelectorAll('button, a, input, [tabindex]').forEach(function (element) { element.setAttribute('tabindex', '-1'); });
                    shell.appendChild(clone);
                    detailMotionLayerV10.appendChild(shell);
                    clone.scrollLeft = target.scrollLeft;
                    clone.scrollTop = target.scrollTop;
                    return shell;
                }).filter(Boolean);
                return detailSwitchGhostsV10;
            }

            function resetDetailSwitchMotionV10() {
                detailSwitchSequenceV10 += 1;
                if (detailSwitchTimelineV10) {
                    detailSwitchTimelineV10.kill();
                    detailSwitchTimelineV10 = null;
                }
                clearDetailSwitchGhostsV10();
                if (window.gsap) {
                    const activeTargets = detailSwitchTargetsV10(true);
                    if (activeTargets.length) window.gsap.set(activeTargets, { clearProps: 'opacity,transform,willChange' });
                }
                pagesV10.detail.removeAttribute('aria-busy');
            }

            function updateDetailMainlineSelectionV10(ability, node) {
                const mainline = document.getElementById('detail-mainline');
                if (!mainline) return;
                mainline.querySelectorAll('[data-level-node-id]').forEach(function (button) {
                    const buttonNode = levelNodeByIdV10(button.dataset.levelNodeId);
                    if (!buttonNode) return;
                    const isViewed = buttonNode.id === node.id;
                    button.classList.toggle('is-selected', isViewed);
                    button.setAttribute('aria-pressed', isViewed ? 'true' : 'false');
                    button.setAttribute('aria-label', ability.name + ' ' + formatLevelV10(buttonNode.level) + '，' + buttonNode.definition + '，' + roleLabelV10(buttonNode) + (isViewed ? '，正在查看' : ''));
                });
            }

            function detailSwitchDirectionV10(ability, node) {
                const previousNode = selectedNodeV10();
                if (!previousNode) return 1;
                if (previousNode.abilityId === ability.id) {
                    const previousIndex = ability.levels.findIndex(function (item) { return item.id === previousNode.id; });
                    const nextIndex = ability.levels.findIndex(function (item) { return item.id === node.id; });
                    return nextIndex < previousIndex ? -1 : 1;
                }
                const previousAbilityIndex = abilitiesV10.findIndex(function (item) { return item.id === previousNode.abilityId; });
                const nextAbilityIndex = abilitiesV10.findIndex(function (item) { return item.id === ability.id; });
                return nextAbilityIndex < previousAbilityIndex ? -1 : 1;
            }

            function commitDetailSelectionV10(ability, node, resetScroll, smoothScroll, abilityChanged) {
                stateV10.selectedAbilityId = ability.id;
                stateV10.selectedLevelNodeId = node.id;
                if (abilityChanged) {
                    renderDetailV10();
                } else {
                    updateDetailMainlineSelectionV10(ability, node);
                    renderDependenciesV10(node);
                    renderLearningV10(ability, node);
                    renderTeacherReviewV10(ability, node);
                }
                revealSelectedDetailNodeV10(smoothScroll);
                if (resetScroll) {
                    const detailScroller = document.querySelector('#detail-page .native-scroll');
                    if (detailScroller) detailScroller.scrollTop = 0;
                }
                updateDetailBackButtonV10();
            }

            function animateDetailSelectionV10(ability, node, resetScroll, recordHistory) {
                if (!ability || !node) return;
                const abilityChanged = ability.id !== stateV10.selectedAbilityId;
                if (!abilityChanged && node.id === stateV10.selectedLevelNodeId) return;
                if (recordHistory !== false) recordCurrentDetailNodeV10();
                const reducedMotion = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const direction = detailSwitchDirectionV10(ability, node);
                resetDetailSwitchMotionV10();
                const sequence = detailSwitchSequenceV10;
                if (!window.gsap || reducedMotion) {
                    commitDetailSelectionV10(ability, node, resetScroll, false, abilityChanged);
                    return;
                }

                const outgoingTargets = detailSwitchTargetsV10(abilityChanged);
                const outgoingGhosts = captureDetailSwitchGhostsV10(outgoingTargets);
                commitDetailSelectionV10(ability, node, resetScroll, true, abilityChanged);
                const incomingTargets = detailSwitchTargetsV10(abilityChanged);
                pagesV10.detail.setAttribute('aria-busy', 'true');
                window.gsap.set(incomingTargets, {
                    opacity: 0,
                    x: direction * 12,
                    force3D: true,
                    willChange: 'transform,opacity'
                });
                detailSwitchTimelineV10 = window.gsap.timeline({
                    onComplete: function () {
                        if (sequence !== detailSwitchSequenceV10) return;
                        clearDetailSwitchGhostsV10();
                        pagesV10.detail.removeAttribute('aria-busy');
                        detailSwitchTimelineV10 = null;
                    }
                });
                if (outgoingGhosts.length) {
                    detailSwitchTimelineV10.to(outgoingGhosts, {
                        opacity: 0,
                        x: direction * -12,
                        duration: 0.28,
                        ease: 'sine.inOut'
                    }, 0);
                }
                detailSwitchTimelineV10.to(incomingTargets, {
                    opacity: 1,
                    x: 0,
                    duration: 0.28,
                    ease: 'sine.inOut',
                    clearProps: 'opacity,transform,willChange'
                }, 0);
            }

            function showPageV10(name) {
                if (name !== 'detail') resetDetailSwitchMotionV10();
                if (name === 'overview') clearDetailNodeHistoryV10();
                Object.keys(pagesV10).forEach(function (pageName) {
                    pagesV10[pageName].classList.toggle('is-active', pageName === name);
                });
                stateV10.view = name;
                if (name === 'overview') {
                    window.requestAnimationFrame(function () {
                        updateOverviewScrollCueV10();
                        updateAbilityRowOverflowV10();
                    });
                }
            }

            function openDetailV10(abilityId, levelNodeId) {
                const ability = abilityByIdV10(abilityId);
                if (!ability) return;
                const requested = levelNodeByIdV10(levelNodeId);
                const node = requested && requested.abilityId === ability.id ? requested : levelNodeByIdV10(ability.currentLevelNodeId);
                if (!node) return;
                if (stateV10.view === 'detail') {
                    animateDetailSelectionV10(ability, node, true, true);
                    return;
                }
                clearDetailNodeHistoryV10();
                stateV10.selectedAbilityId = ability.id;
                stateV10.selectedLevelNodeId = node.id;
                showPageV10('detail');
                renderDetailV10();
                revealSelectedDetailNodeV10(false);
                const detailScroller = document.querySelector('#detail-page .native-scroll');
                if (detailScroller) detailScroller.scrollTop = 0;
            }

            function selectDetailNodeV10(levelNodeId) {
                const node = levelNodeByIdV10(levelNodeId);
                if (!node || node.abilityId !== stateV10.selectedAbilityId) return;
                const ability = abilityByIdV10(node.abilityId);
                animateDetailSelectionV10(ability, node, false, true);
            }

            function navigateBackFromDetailV10() {
                const previousNode = takePreviousDetailNodeV10();
                if (!previousNode) {
                    showPageV10('overview');
                    return;
                }
                const previousAbility = abilityForNodeV10(previousNode);
                const abilityChanged = previousAbility.id !== stateV10.selectedAbilityId;
                animateDetailSelectionV10(previousAbility, previousNode, abilityChanged, false);
            }

            function showToastV10(message) {
                const toast = document.getElementById('action-toast');
                document.getElementById('action-toast-text').textContent = message;
                window.clearTimeout(toastTimerV10);
                toast.classList.add('is-visible');
                toastTimerV10 = window.setTimeout(function () {
                    toast.classList.remove('is-visible');
                }, 1800);
            }

            function svgElementV10(name, attributes, text) {
                const element = document.createElementNS('http://www.w3.org/2000/svg', name);
                Object.keys(attributes || {}).forEach(function (key) {
                    element.setAttribute(key, String(attributes[key]));
                });
                if (typeof text === 'string') element.textContent = text;
                return element;
            }

            function appendTopologyLockIconV10(parent, metrics) {
                const foreignObject = svgElementV10('foreignObject', {
                    x: String(metrics.x + metrics.width - 28),
                    y: String(metrics.y + metrics.height - 27),
                    width: '20',
                    height: '20',
                    'pointer-events': 'none'
                });
                const wrapper = document.createElementNS('http://www.w3.org/1999/xhtml', 'span');
                wrapper.setAttribute('class', 'topology-lock-icon');
                const icon = document.createElementNS('http://www.w3.org/1999/xhtml', 'i');
                icon.setAttribute('class', 'ph-bold ph-lock-key');
                icon.setAttribute('aria-hidden', 'true');
                wrapper.appendChild(icon);
                foreignObject.appendChild(wrapper);
                parent.appendChild(foreignObject);
            }

            function graphStageEdgesV10() {
                return levelRelationshipsV10.map(function (relationship, index) {
                    const sourceNode = levelNodeByIdV10(relationship.source);
                    const targetNode = levelNodeByIdV10(relationship.target);
                    return {
                        id: relationship.id || 'stage-edge-' + index,
                        source: sourceNode.id,
                        target: targetNode.id,
                        sourceAbilityId: sourceNode.abilityId,
                        targetAbilityId: targetNode.abilityId,
                        reviewState: relationship.reviewState || 'normal'
                    };
                });
            }

            function collectTopologyFocusV10(selectedNodeId) {
                const nodeIds = new Set();
                const incomingNodeIds = new Set();
                const outgoingNodeIds = new Set();
                const edgeIds = new Set();
                const mainlineEdgeIds = new Set();
                function result() {
                    return {
                        nodeIds: nodeIds,
                        incomingNodeIds: incomingNodeIds,
                        outgoingNodeIds: outgoingNodeIds,
                        edgeIds: edgeIds,
                        mainlineEdgeIds: mainlineEdgeIds
                    };
                }
                function includeNode(node) {
                    if (!node) return;
                    nodeIds.add(node.id);
                }
                if (!selectedNodeId) return result();
                const selectedNode = levelNodeByIdV10(selectedNodeId);
                if (!selectedNode) return result();
                includeNode(selectedNode);
                const selectedAbility = abilityForNodeV10(selectedNode);
                const selectedIndex = selectedAbility.levels.findIndex(function (node) { return node.id === selectedNode.id; });
                const previousNode = selectedIndex > 0 ? selectedAbility.levels[selectedIndex - 1] : null;
                const nextNode = selectedIndex < selectedAbility.levels.length - 1 ? selectedAbility.levels[selectedIndex + 1] : null;
                if (previousNode) {
                    incomingNodeIds.add(previousNode.id);
                    mainlineEdgeIds.add(previousNode.id + '->' + selectedNode.id);
                    includeNode(previousNode);
                }
                if (nextNode) {
                    outgoingNodeIds.add(nextNode.id);
                    mainlineEdgeIds.add(selectedNode.id + '->' + nextNode.id);
                    includeNode(nextNode);
                }
                const edges = graphStageEdgesV10();
                edges.forEach(function (edge) {
                    if (edge.source !== selectedNode.id && edge.target !== selectedNode.id) return;
                    edgeIds.add(edge.id);
                    if (edge.target === selectedNode.id) {
                        incomingNodeIds.add(edge.source);
                        includeNode(levelNodeByIdV10(edge.source));
                    }
                    if (edge.source === selectedNode.id) {
                        outgoingNodeIds.add(edge.target);
                        includeNode(levelNodeByIdV10(edge.target));
                    }
                });
                return result();
            }

            function topologyNodePaletteV10(node) {
                if (node.role === 'completed') return { fill: '#F3FCF6', stroke: '#BFE7CB', text: '#166534', dash: '' };
                if (node.studyState === 'locked') return { fill: '#F1F5F9', stroke: '#CBD5E1', text: '#64748B', dash: '5 3' };
                if (node.role === 'current') return { fill: '#FFFFFF', stroke: '#D7E0EA', text: '#475569', dash: '' };
                if (node.role === 'target') return { fill: '#EDF3FF', stroke: '#5D8AFF', text: '#1746B2', dash: '6 4' };
                return { fill: '#F7F9FF', stroke: '#C9D8FF', text: '#405572', dash: '' };
            }

            function topologyStageMetricsV10(ability, levelIndex) {
                const rowIndex = topologyAbilityOrderV10.indexOf(ability.id);
                const x = topologyLayoutV10.stageStartX + levelIndex * topologyLayoutV10.stageStepX;
                const y = topologyLayoutV10.rowStartY + rowIndex * topologyLayoutV10.rowPitch;
                return {
                    x: x,
                    y: y,
                    width: topologyLayoutV10.stageWidth,
                    height: topologyLayoutV10.stageHeight,
                    centerX: x + topologyLayoutV10.stageWidth / 2,
                    centerY: y + topologyLayoutV10.stageHeight / 2
                };
            }

            function topologyMetricsForNodeV10(nodeId) {
                const node = levelNodeByIdV10(nodeId);
                const ability = abilityForNodeV10(node);
                if (!node || !ability) return null;
                return topologyStageMetricsV10(ability, ability.levels.findIndex(function (item) { return item.id === node.id; }));
            }

            function topologyNodeRowV10(nodeId) {
                const node = levelNodeByIdV10(nodeId);
                return node ? topologyAbilityOrderV10.indexOf(node.abilityId) : -1;
            }

            function topologyRelationshipDirectionV10(edge) {
                return topologyNodeRowV10(edge.target) > topologyNodeRowV10(edge.source) ? 'down' : 'up';
            }

            function topologyEndpointPeersV10(edges, edge, endpoint) {
                const peerEndpoint = endpoint === 'source' ? 'target' : 'source';
                return edges.filter(function (item) {
                    return item[endpoint] === edge[endpoint] && topologyRelationshipDirectionV10(item) === topologyRelationshipDirectionV10(edge);
                }).sort(function (first, second) {
                    const rowDifference = topologyNodeRowV10(first[peerEndpoint]) - topologyNodeRowV10(second[peerEndpoint]);
                    const firstPeer = levelNodeByIdV10(first[peerEndpoint]);
                    const secondPeer = levelNodeByIdV10(second[peerEndpoint]);
                    const levelDifference = firstPeer.level - secondPeer.level;
                    return rowDifference || levelDifference || edges.indexOf(first) - edges.indexOf(second);
                });
            }

            function topologyTargetChannelPeersV10(edges, edge) {
                const targetNode = levelNodeByIdV10(edge.target);
                const direction = topologyRelationshipDirectionV10(edge);
                return edges.filter(function (item) {
                    const itemTarget = levelNodeByIdV10(item.target);
                    return itemTarget && targetNode && itemTarget.level === targetNode.level && topologyRelationshipDirectionV10(item) === direction;
                }).sort(function (first, second) {
                    const targetRowDifference = topologyNodeRowV10(first.target) - topologyNodeRowV10(second.target);
                    const sourceRowDifference = topologyNodeRowV10(first.source) - topologyNodeRowV10(second.source);
                    return targetRowDifference || sourceRowDifference || edges.indexOf(first) - edges.indexOf(second);
                });
            }

            function topologyHorizontalGapV10(node, side) {
                const ability = abilityForNodeV10(node);
                const index = ability.levels.findIndex(function (item) { return item.id === node.id; });
                const metrics = topologyStageMetricsV10(ability, index);
                if (side === 'left') {
                    const previousRight = index === 0
                        ? topologyLayoutV10.labelX + topologyLayoutV10.labelWidth
                        : topologyStageMetricsV10(ability, index - 1).x + topologyLayoutV10.stageWidth;
                    return { min: previousRight + 4, max: metrics.x - 4 };
                }
                const nextLeft = index === ability.levels.length - 1
                    ? topologyLayoutV10.viewWidth - 8
                    : topologyStageMetricsV10(ability, index + 1).x;
                return { min: metrics.x + metrics.width + 4, max: nextLeft - 4 };
            }

            function topologyChannelXInGapV10(node, side, peerCount, peerIndex) {
                const gap = topologyHorizontalGapV10(node, side);
                const fraction = (peerIndex + 1) / (peerCount + 1);
                return side === 'left'
                    ? gap.max - (gap.max - gap.min) * fraction
                    : gap.min + (gap.max - gap.min) * fraction;
            }

            function topologyPortYV10(metrics, peerCount, peerIndex, half) {
                const topMin = metrics.y + 13;
                const topMax = metrics.centerY - 6;
                const bottomMin = metrics.centerY + 6;
                const bottomMax = metrics.y + metrics.height - 13;
                const start = half === 'top' ? topMin : bottomMin;
                const end = half === 'top' ? topMax : bottomMax;
                if (peerCount <= 1) return (start + end) / 2;
                return start + (end - start) * peerIndex / (peerCount - 1);
            }

            function topologySourceLaneYV10(metrics, direction, peerCount, peerIndex) {
                const rowGap = topologyLayoutV10.rowPitch - topologyLayoutV10.stageHeight;
                const start = direction === 'down'
                    ? metrics.y + metrics.height + rowGap / 2 + 1
                    : metrics.y - rowGap + 4;
                const end = direction === 'down'
                    ? metrics.y + metrics.height + rowGap - 4
                    : metrics.y - rowGap / 2 - 1;
                if (peerCount <= 1) return (start + end) / 2;
                return start + (end - start) * peerIndex / (peerCount - 1);
            }

            function topologyPathV10(edge, edges) {
                const sourceMetrics = topologyMetricsForNodeV10(edge.source);
                const targetMetrics = topologyMetricsForNodeV10(edge.target);
                if (!sourceMetrics || !targetMetrics) return null;
                const sourceNode = levelNodeByIdV10(edge.source);
                const targetNode = levelNodeByIdV10(edge.target);
                const sourcePeers = topologyEndpointPeersV10(edges, edge, 'source');
                const targetPeers = topologyEndpointPeersV10(edges, edge, 'target');
                const targetChannelPeers = topologyTargetChannelPeersV10(edges, edge);
                const sourceIndex = sourcePeers.findIndex(function (item) { return item.id === edge.id; });
                const targetIndex = targetPeers.findIndex(function (item) { return item.id === edge.id; });
                const targetChannelIndex = targetChannelPeers.findIndex(function (item) { return item.id === edge.id; });
                const direction = topologyRelationshipDirectionV10(edge);
                const sourceSide = direction === 'down' ? 'right' : 'left';
                const targetSide = direction === 'down' ? 'left' : 'right';
                const start = {
                    x: sourceSide === 'right' ? sourceMetrics.x + sourceMetrics.width : sourceMetrics.x,
                    y: topologyPortYV10(sourceMetrics, sourcePeers.length, sourceIndex, direction === 'down' ? 'bottom' : 'top')
                };
                const end = {
                    x: targetSide === 'left' ? targetMetrics.x : targetMetrics.x + targetMetrics.width,
                    y: topologyPortYV10(targetMetrics, targetPeers.length, targetIndex, direction === 'down' ? 'top' : 'bottom')
                };
                const sourceExitX = topologyChannelXInGapV10(sourceNode, sourceSide, sourcePeers.length, sourceIndex);
                const sourceLaneY = topologySourceLaneYV10(sourceMetrics, direction, sourcePeers.length, sourceIndex);
                const targetChannelX = topologyChannelXInGapV10(targetNode, targetSide, targetChannelPeers.length, targetChannelIndex);
                return {
                    d: 'M ' + start.x.toFixed(2) + ' ' + start.y.toFixed(2) +
                        ' H ' + sourceExitX.toFixed(2) +
                        ' V ' + sourceLaneY.toFixed(2) +
                        ' H ' + targetChannelX.toFixed(2) +
                        ' V ' + end.y.toFixed(2) +
                        ' H ' + end.x.toFixed(2),
                    start: start,
                    end: end,
                    sourceExitX: sourceExitX,
                    sourceLaneY: sourceLaneY,
                    targetChannelX: targetChannelX,
                    sourceIndex: sourceIndex,
                    targetIndex: targetIndex,
                    targetChannelIndex: targetChannelIndex,
                    sourceNode: sourceNode,
                    targetNode: targetNode,
                    direction: direction
                };
            }

            function detectRelationshipCycleEdgeIdsV10(edges) {
                const adjacency = new Map();
                const nodeIds = new Set();
                edges.forEach(function (edge) {
                    nodeIds.add(edge.source);
                    nodeIds.add(edge.target);
                    const outgoing = adjacency.get(edge.source) || [];
                    outgoing.push(edge);
                    adjacency.set(edge.source, outgoing);
                });
                let visitIndex = 0;
                const indexes = new Map();
                const lowLinks = new Map();
                const stack = [];
                const onStack = new Set();
                const componentByNode = new Map();
                const componentSizes = new Map();
                let componentIndex = 0;

                function visit(nodeId) {
                    indexes.set(nodeId, visitIndex);
                    lowLinks.set(nodeId, visitIndex);
                    visitIndex += 1;
                    stack.push(nodeId);
                    onStack.add(nodeId);
                    (adjacency.get(nodeId) || []).forEach(function (edge) {
                        if (!indexes.has(edge.target)) {
                            visit(edge.target);
                            lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), lowLinks.get(edge.target)));
                        } else if (onStack.has(edge.target)) {
                            lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), indexes.get(edge.target)));
                        }
                    });
                    if (lowLinks.get(nodeId) !== indexes.get(nodeId)) return;
                    let memberCount = 0;
                    let memberId = null;
                    do {
                        memberId = stack.pop();
                        onStack.delete(memberId);
                        componentByNode.set(memberId, componentIndex);
                        memberCount += 1;
                    } while (memberId !== nodeId);
                    componentSizes.set(componentIndex, memberCount);
                    componentIndex += 1;
                }

                nodeIds.forEach(function (nodeId) {
                    if (!indexes.has(nodeId)) visit(nodeId);
                });
                const cycleEdgeIds = new Set();
                edges.forEach(function (edge) {
                    const component = componentByNode.get(edge.source);
                    if (component !== componentByNode.get(edge.target)) return;
                    if (edge.source === edge.target || componentSizes.get(component) > 1) cycleEdgeIds.add(edge.id);
                });
                return cycleEdgeIds;
            }

            function relationshipAuditVisibleV10() {
                const params = new URLSearchParams(window.location.search);
                return params.get('debug') === '1' || params.get('audience') === 'teacher' || params.get('audience') === 'admin';
            }

            function invalidCycleEdgeIdsV10(edges) {
                if (!relationshipAuditVisibleV10()) return new Set();
                const structuralCycleEdgeIds = detectRelationshipCycleEdgeIdsV10(edges);
                return new Set(edges.filter(function (edge) {
                    return edge.reviewState === 'invalid-cycle' && structuralCycleEdgeIds.has(edge.id);
                }).map(function (edge) { return edge.id; }));
            }

                const markerPrefix = kind === 'cross' ? 'topology-cross-arrow-v10-' : 'topology-main-arrow-v10-';
                if (kind === 'mainline') {

                            opacity: String(hasFocus && !isDirectlyRelated ? 0.24 : 1)
                        });
                        stage.appendChild(svgElementV10('title', {}, ability.name + ' · ' + formatLevelV10(node.level) + ' ' + node.definition + ' · ' + roleLabelV10(node) + (node.masteryStars > 0 ? ' · ' + node.masteryStars + ' 星' : '') + '。点按查看一层直接依赖。'));
                        if (selected) {
                            visual.appendChild(svgElementV10('rect', {
                                x: String(metrics.x - 7),
                                y: String(metrics.y - 7),
                                width: String(metrics.width + 14),
                                height: String(metrics.height + 14),
                                rx: '16',
                                fill: 'none',
                                stroke: '#DCE8FF',
                                'stroke-width': '5.5',
                                opacity: '0.92'
                            }));
                            visual.appendChild(svgElementV10('rect', {
                                x: String(metrics.x - 4),
                                y: String(metrics.y - 4),
                                width: String(metrics.width + 8),
                                height: String(metrics.height + 8),
                                rx: '14',
                                fill: 'none',
                                stroke: '#1F5FFF',
                                'stroke-width': '2.2'
                            }));
                        }
                        visual.appendChild(svgElementV10('rect', {
                            x: String(metrics.x),
                            y: String(metrics.y),
                            width: String(metrics.width),
                            height: String(metrics.height),
                            rx: '11',
                            fill: palette.fill,
                            stroke: palette.stroke,
                            'stroke-width': node.role === 'current' ? '1.7' : (node.role === 'target' || node.studyState === 'locked' ? '1.4' : '1.1'),
                            'stroke-dasharray': palette.dash
                        }));
                        visual.appendChild(svgElementV10('text', {
                            x: String(metrics.x + 13),
                            y: String(metrics.centerY + 7),
                            fill: palette.text,
                            'font-size': '16',
                            'font-weight': '900'
                        }, formatLevelV10(node.level)));
                        visual.appendChild(svgElementV10('text', {
                            x: String(metrics.x + 48),
                            y: String(metrics.centerY + 7),
                            fill: palette.text,
                            'font-size': '14',
                            'font-weight': '800'
                        }, node.definition));
                        if (node.role === 'current' || node.role === 'target') {
                            const badgeLabel = node.role === 'current' ? '当前阶段' : '目标';
                            const badgeWidth = node.role === 'current' ? 52 : 34;
                            visual.appendChild(svgElementV10('rect', {
                                x: String(metrics.x + metrics.width - badgeWidth - 7),
                                y: String(metrics.y + 5),
                                width: String(badgeWidth),
                                height: '14',
                                rx: '4',
                                fill: node.role === 'current' ? '#FFF4CF' : '#EDF3FF',
                                stroke: node.role === 'current' ? '#F4CF79' : '#5D8AFF',
                                'stroke-width': '0.8',
                                'stroke-dasharray': node.role === 'target' ? '3 2' : ''
                            }));
                            visual.appendChild(svgElementV10('text', {
                                x: String(metrics.x + metrics.width - badgeWidth / 2 - 7),
                                y: String(metrics.y + 15),
                                'text-anchor': 'middle',
                                fill: node.role === 'current' ? '#8A4B08' : '#1746B2',
                                'font-size': '9',
                                'font-weight': '900'
                            }, badgeLabel));
                        } else if (node.role === 'completed') {
                            visual.appendChild(svgElementV10('circle', {
                                cx: String(metrics.x + metrics.width - 14),
                                cy: String(metrics.y + 13),
                                r: '7',
                                fill: '#DFF5E6'
                            }));
                            visual.appendChild(svgElementV10('text', {
                                x: String(metrics.x + metrics.width - 14),
                                y: String(metrics.y + 16),
                                'text-anchor': 'middle',
                                fill: '#198444',
                                'font-size': '10',
                                'font-weight': '900'
                            }, '✓'));
                            visual.appendChild(svgElementV10('text', {
                                x: String(metrics.x + metrics.width - 11),
                                y: String(metrics.y + metrics.height - 9),
                                'text-anchor': 'end',
                                fill: '#198444',
                                'font-size': '10',
                                'font-weight': '900'
                            }, String(node.masteryStars) + ' 星'));
                        }
                        if (node.studyState === 'locked') appendTopologyLockIconV10(visual, metrics);
                        stage.appendChild(visual);
                        stageGroup.appendChild(stage);
                    });
                });
                topologyViewportV10.appendChild(stageGroup);

                const anchorGroup = svgElementV10('g', { 'aria-hidden': 'true', 'pointer-events': 'none' });
                visibleRouteRecords.forEach(function (record) {
                    const style = topologyDependencyStyleV10('cross', invalidCycleEdgeIds.has(record.edge.id));
                    anchorGroup.appendChild(svgElementV10('circle', {
                        cx: String(record.route.start.x),
                        cy: String(record.route.start.y),
                        r: '3.8',
                        fill: '#FFFFFF',
                        stroke: style.stroke,
                        'stroke-width': '1.9',
                        opacity: '1',
                        'vector-effect': 'non-scaling-stroke'
                    }));
                });
                topologyViewportV10.appendChild(anchorGroup);
            }

            function initialiseTopologyPanZoomV10() {
                if (topologyPanZoomV10) {
                    topologyPanZoomV10.resize();
                    topologyPanZoomV10.fit();
                    topologyPanZoomV10.center();
                    return;
                }
                if (typeof window.svgPanZoom !== 'function') return;
                topologyPanZoomV10 = window.svgPanZoom('#topology-svg', {
                    viewportSelector: '#topology-viewport',
                    controlIconsEnabled: false,
                    zoomEnabled: true,
                    panEnabled: true,
                    dblClickZoomEnabled: false,
                    mouseWheelZoomEnabled: true,
                    preventMouseEventsDefault: true,
                    minZoom: 0.5,
                    maxZoom: 2.8,
                    fit: true,
                    center: true
                });
            }

            function fitTopologyV10() {
                if (!topologyPanZoomV10) return;
                topologyPanZoomV10.resize();
                topologyPanZoomV10.fit();
                topologyPanZoomV10.center();
            }

            function clearTopologyFocusV10() {
                if (!stateV10.topologySelectedNodeId) return;
                stateV10.topologySelectedNodeId = null;
                renderTopologyV10();
                hideTopologyHintV10();
                window.requestAnimationFrame(fitTopologyV10);
            }

            function hideTopologyHintV10() {
                const hint = document.getElementById('topology-hint');
                window.clearTimeout(topologyHintTimerV10);
                hint.classList.remove('is-visible', 'is-warning');
            }

            function showTopologyMessageV10(message, duration, warning) {
                const hint = document.getElementById('topology-hint');
                window.clearTimeout(topologyHintTimerV10);
                hint.textContent = message;
                hint.classList.toggle('is-warning', Boolean(warning));
                hint.classList.add('is-visible');
                topologyHintTimerV10 = window.setTimeout(function () {
                    hint.classList.remove('is-visible');
                }, duration || 2400);
            }

            function showTopologyGuidanceV10() {
                if (stateV10.topologyHintShown) return;
                stateV10.topologyHintShown = true;
                showTopologyMessageV10('点按阶段查看其他主线关联', 2400, false);
            }

            function announceTopologyFocusV10() {
                const selectedNode = levelNodeByIdV10(stateV10.topologySelectedNodeId);
                if (!selectedNode) {
                    hideTopologyHintV10();
                    return;
                }
                const focus = collectTopologyFocusV10(selectedNode.id);
                const invalidCycleEdgeIds = invalidCycleEdgeIdsV10(graphStageEdgesV10());
                const focusedInvalidCycle = Array.from(focus.edgeIds).some(function (edgeId) {
                    return invalidCycleEdgeIds.has(edgeId);
                });
                if (focusedInvalidCycle) {
                    showTopologyMessageV10('存在循环关系，请检查配置', 2800, true);
                    return;
                }
                if (focus.edgeIds.size === 0) {
                    showTopologyMessageV10('该节点暂无跨主线直接关联', 2600, false);
                    return;
                }
                hideTopologyHintV10();
            }

            function openTopologyV10() {
                stateV10.previousView = stateV10.view === 'detail' ? 'detail' : 'overview';
                stateV10.topologySelectedNodeId = stateV10.view === 'detail' ? stateV10.selectedLevelNodeId : null;
                showPageV10('topology');
                renderTopologyV10();
                if (stateV10.topologySelectedNodeId) {
                    announceTopologyFocusV10();
                } else {
                    const invalidCycleEdgeIds = invalidCycleEdgeIdsV10(graphStageEdgesV10());
                    if (invalidCycleEdgeIds.size) showTopologyMessageV10('存在循环关系，请检查配置', 2800, true);
                    else showTopologyGuidanceV10();
                }
                window.requestAnimationFrame(function () {
                    initialiseTopologyPanZoomV10();
                    fitTopologyV10();
                });
            }

            abilityGridV10.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const moreButton = element.closest('[data-ability-more]');
                if (moreButton) {
                    event.stopPropagation();
                    const row = moreButton.closest('[data-ability-row]');
                    const scroller = row ? row.querySelector('[data-ability-scroll]') : null;
                    if (scroller) {
                        const remaining = scroller.scrollWidth - scroller.clientWidth - scroller.scrollLeft;
                        if (remaining > 3) {
                            scroller.scrollBy({ left: Math.max(360, scroller.clientWidth * 0.58), behavior: 'smooth' });
                            window.setTimeout(updateAbilityRowOverflowV10, 360);
                        } else if (row) {
                            openDetailV10(row.dataset.abilityRow);
                        }
                    }
                    return;
                }
                const levelButton = element.closest('[data-level-node-id]');
                if (levelButton) {
                    const node = levelNodeByIdV10(levelButton.dataset.levelNodeId);
                    if (node) openDetailV10(node.abilityId, node.id);
                    return;
                }
                const abilityRow = element.closest('[data-ability-row]');
                if (abilityRow) openDetailV10(abilityRow.dataset.abilityRow);
            });

            overviewScrollV10.addEventListener('scroll', updateOverviewScrollCueV10, { passive: true });
            abilityGridV10.addEventListener('scroll', function (event) {
                if (event.target instanceof Element && event.target.matches('[data-ability-scroll]')) updateAbilityRowOverflowV10();
            }, { passive: true, capture: true });

            document.getElementById('detail-mainline').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-level-node-id]') : null;
                if (target) selectDetailNodeV10(target.dataset.levelNodeId);
            });

            document.getElementById('dependency-view').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-jump-level-node]') : null;
                if (!target) return;
                const node = levelNodeByIdV10(target.dataset.jumpLevelNode);
                if (node) openDetailV10(node.abilityId, node.id);
            });

            document.getElementById('learning-grid').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-learning-type]') : null;
                if (!target || target.disabled) return;
                const ability = abilityByIdV10(stateV10.selectedAbilityId);
                const node = selectedNodeV10();
                showToastV10('已选择 ' + ability.name + ' ' + formatLevelV10(node.level) + ' · ' + target.dataset.learningType);
            });

            document.getElementById('teacher-review').addEventListener('click', function (event) {
                const target = event.target instanceof Element ? event.target.closest('[data-teacher-reminder]') : null;
                if (!target || target.disabled) return;
                const ability = abilityByIdV10(stateV10.selectedAbilityId);
                const node = selectedNodeV10();
                const context = ability && node ? teacherReviewContextV10(ability, node) : null;
                if (!context) return;
                const reminderKey = context.assessmentNode.id + '--' + context.nextNode.id;
                if (target.dataset.teacherReminder !== reminderKey || teacherReminderKeysV10.has(reminderKey)) return;
                teacherReminderKeysV10.add(reminderKey);
                renderTeacherReviewV10(ability, node);
                showToastV10('已提醒老师评定 ' + formatLevelV10(context.assessmentNode.level) + '，结果会同步到能力路径');
            });

            topologySvgV10.addEventListener('click', function (event) {
                const element = event.target instanceof Element ? event.target : null;
                if (!element) return;
                const stageTarget = element.closest('[data-topology-node-id]');
                if (stageTarget) {
                    const nodeId = stageTarget.dataset.topologyNodeId;
                    if (stateV10.topologySelectedNodeId === nodeId) {
                        clearTopologyFocusV10();
                        return;
                    }
                    stateV10.topologySelectedNodeId = nodeId;
                    renderTopologyV10();
                    announceTopologyFocusV10();
                    return;
                }
                clearTopologyFocusV10();
            });

            topologySvgV10.addEventListener('keydown', function (event) {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const element = event.target instanceof Element ? event.target.closest('[data-topology-node-id]') : null;
                if (!element) return;
                const nodeId = element.dataset.topologyNodeId;
                if (stateV10.topologySelectedNodeId === nodeId) {
                    clearTopologyFocusV10();
                    return;
                }
                stateV10.topologySelectedNodeId = nodeId;
                renderTopologyV10();
                announceTopologyFocusV10();
            });

            document.getElementById('overview-back-button').addEventListener('click', function () {
                window.history.back();
            });
            document.getElementById('overview-topology-button').addEventListener('click', openTopologyV10);
            document.getElementById('detail-back-button').addEventListener('click', navigateBackFromDetailV10);
            document.getElementById('detail-breadcrumb-overview').addEventListener('click', function () {
                showPageV10('overview');
            });
            document.getElementById('detail-topology-button').addEventListener('click', openTopologyV10);
            document.getElementById('topology-back-button').addEventListener('click', function () {
                showPageV10(stateV10.previousView);
                if (stateV10.previousView === 'detail') renderDetailV10();
            });
            document.getElementById('topology-breadcrumb-overview').addEventListener('click', function () {
                showPageV10('overview');
            });
            document.getElementById('topology-zoom-out').addEventListener('click', function () {
                if (topologyPanZoomV10) topologyPanZoomV10.zoomOut();
            });
            document.getElementById('topology-zoom-in').addEventListener('click', function () {
                if (topologyPanZoomV10) topologyPanZoomV10.zoomIn();
            });
            document.getElementById('topology-fit').addEventListener('click', fitTopologyV10);
            topologyResetButtonV10.addEventListener('click', clearTopologyFocusV10);

            if (typeof ResizeObserver !== 'undefined') {
                const topologyResizeObserver = new ResizeObserver(function () {
                    if (stateV10.view === 'topology') window.requestAnimationFrame(fitTopologyV10);
                });
                topologyResizeObserver.observe(document.getElementById('topology-surface'));
                const overviewResizeObserver = new ResizeObserver(function () {
                    if (stateV10.view === 'overview') {
                        window.requestAnimationFrame(function () {
                            updateOverviewScrollCueV10();
                            updateAbilityRowOverflowV10();
                        });
                    }
                });
                overviewResizeObserver.observe(overviewScrollV10);
                overviewResizeObserver.observe(abilityGridV10);
            }

            validateDataV10();
            renderOverviewV10();
            renderDetailV10();
            renderTopologyV10();
        }());
    </script>
</body>
</html>
