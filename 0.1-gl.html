<!DOCTYPE html>
<!-- 版本 7.6：动态复杂度与精确路由。节点按直接关联数连续放大并限制最大尺寸；扩充多分支、多依赖、多路径汇聚的 DAG 示例；统一主线、直接依赖与跨阶段共享的正交路由、居中箭头及卡片安全距离。 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#EFF6FF">
    <title>抖学 AI 能力模型 · 动态复杂度与精确路由</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#1F5FFF',
                        ink: '#172033',
                        mastered: '#12B981'
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
                    },
                    boxShadow: {
                        soft: '0 4px 20px -4px rgba(0,0,0,0.03), 0 2px 8px -2px rgba(0,0,0,0.02)'
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --brand: #1F5FFF;
            --mastered: #12B981;
            --muted: #94A3B8;
            --graph-zoom: 1;
            --stage-width: 960px;
            --stage-height: 640px;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #EFF6FF 0%, #DFE7FF 100%);
        }

        button {
            -webkit-appearance: none;
        }

        .app-shell {
            width: min(1300px, 100vw);
            height: 100vh;
            height: 100dvh;
        }

        .page-view {
            display: flex;
        }

        .page-view.is-hidden {
            display: none;
        }

        .native-scroll {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .no-scrollbar {
            scrollbar-width: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .goal-group-body {
            display: grid;
            grid-template-rows: 1fr;
            opacity: 1;
            transition: grid-template-rows 240ms cubic-bezier(0.16, 1, 0.3, 1), opacity 180ms ease;
        }

        .goal-group-body.is-collapsed {
            grid-template-rows: 0fr;
            opacity: 0;
        }

        .goal-group-clip {
            min-height: 0;
            overflow: hidden;
        }

        .goal-progress-fill {
            width: 100%;
            transform-origin: left center;
            transition: transform 700ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        #graph-scroll {
            background-color: #FFFFFF;
            background-image: radial-gradient(circle, rgba(203, 213, 225, 0.48) 1px, transparent 1.1px);
            background-size: 30px 30px;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
        }

        #graph-scroll.is-panning {
            cursor: grabbing;
        }

        .graph-stage-shell {
            position: relative;
            width: calc(var(--stage-width) * var(--graph-zoom));
            height: calc(var(--stage-height) * var(--graph-zoom));
            min-width: calc(var(--stage-width) * var(--graph-zoom));
            min-height: calc(var(--stage-height) * var(--graph-zoom));
        }

        .graph-stage {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--stage-width);
            height: var(--stage-height);
            transform: scale(var(--graph-zoom));
            transform-origin: left top;
            opacity: 1;
            transition: opacity 170ms ease;
        }

        .graph-stage.is-switching {
            opacity: 0;
        }

        .graph-edge-underlay,
        .graph-edge {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .graph-edge-underlay {
            stroke: rgba(255,255,255,0.98);
            stroke-width: 9;
        }

        .graph-edge-underlay.underlay-main {
            stroke-width: 16;
        }

        .graph-edge {
            stroke: #A3AFBF;
            stroke-width: 2;
        }

        .graph-edge.edge-main {
            stroke: #243249;
            stroke-width: 6;
            filter: drop-shadow(0 2px 2px rgba(36,50,73,0.16));
        }

        .graph-edge.edge-dependency {
            stroke: #A3AFBF;
            stroke-width: 2.2;
            opacity: 0.92;
        }

        .graph-edge.edge-shared {
            stroke: #66758A;
            stroke-width: 2.4;
            stroke-dasharray: 8 7;
            opacity: 0.9;
        }

        .graph-node {
            position: absolute;
            width: var(--node-width);
            height: var(--node-height);
            transform: translate(-50%, -50%);
            border: 0;
            padding: 0;
            color: inherit;
            text-align: left;
            background: transparent;
            transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), filter 180ms ease;
        }

        .graph-node.is-branch {
            opacity: 0.82;
            transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), filter 180ms ease, opacity 180ms ease;
        }

        .graph-node.is-branch:hover,
        .graph-node.is-branch:focus-visible {
            opacity: 1;
        }

        .node-detail:active {
            transform: scale(0.97);
        }

        .node-entry:active {
            transform: scale(0.95);
        }

        .node-card {
            position: relative;
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            border: 1px solid;
            border-radius: 16px;
            box-shadow: 0 4px 14px -12px rgba(15,23,42,0.18), 0 1px 4px -4px rgba(15,23,42,0.08);
            transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
        }

        .node-detail {
            display: flex;
            min-height: 0;
            width: 100%;
            flex: 1 1 auto;
            flex-direction: column;
            justify-content: center;
            gap: 7px;
            border: 0;
            background: transparent;
            padding: 10px 11px;
            color: inherit;
            text-align: left;
            transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), background-color 160ms ease;
        }

        .node-detail:focus-visible,
        .node-entry:focus-visible {
            outline: 3px solid rgba(36, 50, 73, 0.24);
            outline-offset: -3px;
        }

        .node-entry {
            display: flex;
            min-height: 58px;
            width: 100%;
            flex: 0 0 auto;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border: 0;
            border-top: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(255, 255, 255, 0.68);
            padding: 0 11px;
            color: #334155;
            text-align: left;
            transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), background-color 160ms ease;
        }

        .node-entry:hover,
        .node-entry:focus-visible {
            background: rgba(255, 255, 255, 0.92);
        }

        .graph-node:hover .node-card {
            box-shadow: 0 12px 26px -16px rgba(15,23,42,0.30), 0 3px 8px -5px rgba(15,23,42,0.10);
        }

        .graph-node.is-main .node-card {
            border-width: 3px;
            border-radius: 22px;
            box-shadow: 0 22px 46px -24px rgba(15,23,42,0.36), 0 8px 18px -12px rgba(15,23,42,0.24);
        }

        .graph-node.is-main .node-detail {
            gap: 10px;
            padding: 15px 16px;
        }

        .graph-node.is-main .node-entry {
            padding: 0 16px;
        }

        .node-relation-pill {
            display: inline-flex;
            min-height: 20px;
            align-items: center;
            gap: 4px;
            align-self: flex-start;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.72);
            padding: 0 6px;
            color: #64748B;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1;
        }

        .node-relation-pill.is-shared {
            border-color: #CBD5E1;
            background: rgba(248, 250, 252, 0.94);
            color: #475569;
        }

        .node-complexity {
            display: inline-flex;
            min-height: 20px;
            align-items: center;
            gap: 4px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.66);
            padding: 0 6px;
            color: #94A3B8;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 9px;
            font-weight: 800;
            line-height: 1;
        }

        .graph-node.is-main .node-complexity {
            background: rgba(255, 255, 255, 0.9);
            color: #64748B;
        }

        .graph-node.status-mastered .node-card {
            border-color: #A7E8CC;
            background: #F2FCF7;
            color: #047857;
        }

        .graph-node.status-active .node-card {
            border-color: #9CC0FF;
            background: #EFF6FF;
            color: #1749C6;
        }

        .graph-node.status-locked .node-card {
            border-color: #D9E2EE;
            background: #F8FAFC;
            color: #64748B;
        }

        .graph-node.is-main.status-mastered .node-card {
            border-color: #70D5AD;
            background: #F5FFFA;
        }

        .graph-node.is-main.status-active .node-card {
            border-color: var(--brand);
            background: #F7FAFF;
        }

        .graph-node.is-main.status-locked .node-card {
            border-color: #C9D3DF;
            background: #FBFCFE;
        }

        .node-status-icon {
            display: inline-flex;
            width: 24px;
            height: 24px;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            background: rgba(255,255,255,0.74);
        }

        .graph-node.is-main .node-status-icon {
            width: 28px;
            height: 28px;
            border-radius: 9px;
        }

        .node-title {
            display: -webkit-box;
            overflow: hidden;
            line-height: 1.25;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .graph-node.is-main .node-title {
            display: block;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .breadcrumb-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-inline: contain;
            scroll-behavior: smooth;
        }

        .breadcrumb-scroll > * {
            flex: 0 0 auto;
        }

        .node-progress-track {
            height: 4px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(148,163,184,0.20);
        }

        .node-progress-value {
            height: 100%;
            border-radius: inherit;
            background: currentColor;
        }

        @keyframes return-focus {
            0%, 100% {
                box-shadow: 0 20px 42px -22px rgba(15,23,42,0.34), 0 6px 14px -9px rgba(15,23,42,0.22);
            }
            28%, 68% {
                box-shadow: 0 0 0 6px rgba(51,65,85,0.15), 0 20px 42px -20px rgba(15,23,42,0.34);
            }
        }

        .graph-node.is-return-focus .node-card {
            animation: return-focus 1.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .drawer {
            transform: translateX(102%);
            transition: transform 250ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .drawer.is-open {
            transform: translateX(0);
        }

        .toast {
            opacity: 0;
            transform: translate(-50%, 12px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 900px) {
            #goal-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .header-legend [data-legend-label] {
                display: none;
            }

            #graph-stats {
                display: none;
            }
        }

        @media (max-width: 650px) {
            #goal-list {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="font-sans text-ink antialiased">
    <div id="goal-page" class="page-view app-shell mx-auto flex-col overflow-hidden p-5">
        <header class="mb-4 flex shrink-0 items-end justify-between px-1">
            <div>
                <p class="text-[11px] font-extrabold tracking-[0.12em] text-brand">能力路径</p>
                <h1 class="mt-1 text-[32px] font-extrabold leading-none tracking-[-0.03em] text-slate-950">选择学习目标</h1>
                <p class="mt-2 text-[13px] font-semibold text-slate-500">选择目标后进入对应能力图</p>
            </div>
            <span id="goal-count" class="flex h-10 min-w-10 items-center justify-center rounded-xl bg-white px-3 font-mono text-[13px] font-extrabold text-slate-500 shadow-soft"></span>
        </header>

        <main class="min-h-0 flex-1 overflow-hidden rounded-[24px] bg-white p-5 shadow-soft" aria-label="能力目标选择">
            <div id="goal-list" class="no-scrollbar native-scroll grid h-full grid-cols-3 items-start gap-4 pr-1"></div>
        </main>
    </div>

    <div id="graph-page" class="page-view is-hidden app-shell mx-auto flex-col overflow-hidden">
        <section class="relative min-h-0 flex-1 overflow-hidden bg-white" aria-label="有向能力路由画布">
            <div class="absolute inset-x-0 top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-100/80 bg-white/95 px-4 backdrop-blur">
                <button id="back-button" type="button" aria-label="返回能力目标" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-slate-50 text-slate-600 transition active:scale-90">
                    <i class="ph-bold ph-caret-left text-xl" aria-hidden="true"></i>
                </button>
                <nav id="breadcrumbs" class="breadcrumb-scroll no-scrollbar flex min-h-11 min-w-0 flex-1 items-center" aria-label="当前能力路径"></nav>
                <span id="graph-stats" class="shrink-0 rounded-lg border border-slate-100 bg-slate-50 px-2.5 py-1.5 font-mono text-[10px] font-extrabold text-slate-500"></span>
                <div class="header-legend flex min-h-11 shrink-0 items-center gap-4 px-2">
                    <span class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-500"><span class="h-2 w-2 rounded-full bg-emerald-500"></span><span data-legend-label>已掌握</span></span>
                    <span class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-500"><span class="h-2 w-2 rounded-full bg-brand"></span><span data-legend-label>攻坚中</span></span>
                    <span class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-500"><span class="h-2 w-2 rounded-full bg-slate-300"></span><span data-legend-label>未完成</span></span>
                </div>
            </div>

            <div id="graph-scroll" class="no-scrollbar native-scroll absolute inset-x-0 bottom-0 top-16" aria-label="能力关系图，可拖动、双指或滚轮缩放">
                <div id="graph-stage-shell" class="graph-stage-shell">
                    <div id="graph-stage" class="graph-stage" aria-live="polite"></div>
                </div>
            </div>

            <div class="pointer-events-none absolute bottom-4 left-4 z-10 flex items-center gap-4 rounded-xl border border-slate-100 bg-white/92 px-3 py-2.5 text-[10px] font-extrabold text-slate-500 shadow-soft backdrop-blur">
                <span class="flex items-center gap-1"><span class="h-[6px] w-8 rounded-full bg-slate-700"></span><i class="ph-fill ph-arrow-right -ml-2.5 text-[17px] text-slate-700" aria-hidden="true"></i>核心主线</span>
                <span class="flex items-center gap-1"><span class="h-[2px] w-7 rounded-full bg-slate-400"></span><i class="ph-fill ph-arrow-right -ml-2 text-[14px] text-slate-400" aria-hidden="true"></i>直接依赖</span>
                <span class="flex items-center gap-1"><span class="w-7 border-t-2 border-dashed border-slate-500"></span><i class="ph-fill ph-arrow-right -ml-2 text-[14px] text-slate-500" aria-hidden="true"></i>跨阶段共享</span>
            </div>

            <div class="absolute bottom-4 right-4 z-20 flex min-h-12 items-center rounded-full bg-white/88 p-1 shadow-soft backdrop-blur">
                <button id="zoom-out" type="button" aria-label="缩小画布" class="flex h-10 w-10 items-center justify-center rounded-full text-slate-500 transition active:scale-90"><i class="ph-bold ph-minus text-[17px]" aria-hidden="true"></i></button>
                <button id="zoom-fit" type="button" aria-label="适合画布" class="flex h-10 min-w-[64px] items-center justify-center rounded-full px-2 font-mono text-[12px] font-extrabold text-slate-700 transition active:scale-95"><span id="zoom-label">100%</span></button>
                <button id="zoom-in" type="button" aria-label="放大画布" class="flex h-10 w-10 items-center justify-center rounded-full text-slate-500 transition active:scale-90"><i class="ph-bold ph-plus text-[17px]" aria-hidden="true"></i></button>
            </div>

            <aside id="node-drawer" class="drawer absolute inset-y-0 right-0 z-30 flex w-[360px] max-w-[calc(100%_-_24px)] flex-col border-l border-slate-100 bg-white shadow-[-16px_0_40px_rgba(15,23,42,0.08)]" aria-label="能力详情" aria-hidden="true">
                <div class="flex items-start justify-between gap-3 px-5 pb-3 pt-5">
                    <div class="min-w-0">
                        <p id="drawer-kicker" class="text-[10px] font-extrabold tracking-[0.12em] text-slate-400"></p>
                        <h2 id="drawer-title" class="mt-1 truncate text-[24px] font-extrabold tracking-[-0.02em] text-slate-900"></h2>
                    </div>
                    <button id="close-drawer" type="button" aria-label="关闭能力详情" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-slate-400 transition active:scale-90"><i class="ph-bold ph-x text-[22px]" aria-hidden="true"></i></button>
                </div>
                <div id="drawer-content" class="no-scrollbar native-scroll min-h-0 flex-1 px-5 pb-5"></div>
            </aside>
        </section>
    </div>

    <div id="toast" class="toast pointer-events-none fixed bottom-7 left-1/2 z-[60] rounded-full bg-slate-900/92 px-5 py-3 text-[13px] font-bold text-white shadow-xl" role="status" aria-live="polite"></div>

    <script>
        const STATUS_META = {
            mastered: { label: '已掌握', icon: 'ph-check', badge: 'border-emerald-200 bg-emerald-50 text-emerald-700', fill: 'bg-emerald-500' },
            active: { label: '攻坚中', icon: 'ph-lightning', badge: 'border-blue-200 bg-blue-50 text-brand', fill: 'bg-brand' },
            locked: { label: '未完成', icon: 'ph-lock-simple', badge: 'border-slate-200 bg-slate-100 text-slate-500', fill: 'bg-slate-300' }
        };

        const routes = {
            commerce: {
                id: 'commerce',
                title: '电商前端全流程',
                mainline: ['base', 'interaction', 'transaction', 'release'],
                nodes: [
                    { id: 'base', title: '前端基础', status: 'mastered', progress: 100 },
                    { id: 'interaction', title: '交互与状态', status: 'mastered', progress: 100 },
                    { id: 'transaction', title: '购物与交易', status: 'active', progress: 66, childRoute: 'cart' },
                    { id: 'release', title: '上线与优化', status: 'locked', progress: 0 },
                    { id: 'html-css', title: 'HTML / CSS 布局', status: 'mastered', progress: 100, cluster: 0, side: 'top' },
                    { id: 'javascript', title: 'JavaScript 语法', status: 'mastered', progress: 100, cluster: 0, side: 'bottom' },
                    { id: 'browser-runtime', title: '浏览器运行机制', status: 'mastered', progress: 100, cluster: 0, side: 'top' },
                    { id: 'accessibility', title: '可访问性语义', status: 'mastered', progress: 100, cluster: 0, side: 'bottom' },
                    { id: 'type-system', title: '类型约束', status: 'mastered', progress: 100, cluster: 0, shared: true, sharedSide: 'top' },

                    { id: 'component-boundary', title: '组件边界', status: 'mastered', progress: 100, cluster: 1, side: 'top' },
                    { id: 'journey', title: '用户流程拆解', status: 'mastered', progress: 100, cluster: 1, side: 'bottom' },
                    { id: 'state-model', title: '状态建模', status: 'active', progress: 72, cluster: 1, side: 'top' },
                    { id: 'test-contract', title: '交互测试契约', status: 'active', progress: 64, cluster: 1, side: 'bottom' },
                    { id: 'design-tokens', title: '设计令牌体系', status: 'active', progress: 76, cluster: 1, shared: true, sharedSide: 'bottom' },

                    { id: 'api', title: '接口数据渲染', status: 'active', progress: 42, childRoute: 'api-route', cluster: 2, side: 'top' },
                    { id: 'commerce-rules', title: '商品与库存规则', status: 'active', progress: 54, cluster: 2, side: 'bottom' },
                    { id: 'inventory-sync', title: '库存同步', status: 'active', progress: 38, cluster: 2, side: 'top' },
                    { id: 'checkout-guard', title: '结算前校验', status: 'active', progress: 47, cluster: 2, side: 'bottom' },
                    { id: 'data-contract', title: '数据契约', status: 'active', progress: 48, cluster: 2, shared: true, sharedSide: 'top' },

                    { id: 'performance', title: '性能与适配', status: 'locked', progress: 0, cluster: 3, side: 'top' },
                    { id: 'observability', title: '异常监控', status: 'locked', progress: 0, cluster: 3, side: 'bottom' },
                    { id: 'release-pipeline', title: '发布流水线', status: 'locked', progress: 0, cluster: 3, side: 'top' },
                    { id: 'security-review', title: '安全审查', status: 'locked', progress: 0, cluster: 3, side: 'bottom' }
                ],
                edges: [
                    ['base', 'interaction'], ['interaction', 'transaction'], ['transaction', 'release'],
                    ['html-css', 'base'], ['javascript', 'base'], ['accessibility', 'base'],
                    ['html-css', 'component-boundary'], ['javascript', 'state-model'],

        function isMainEdge(route, sourceId, targetId) {
            const index = route.mainline.indexOf(sourceId);
            return index >= 0 && route.mainline[index + 1] === targetId;
        }

        function dependencyRanks(route) {
            const nodeIds = route.nodes.map(node => node.id);
            const nodeOrder = new Map(nodeIds.map((id, index) => [id, index]));
            const indegree = new Map(nodeIds.map(id => [id, 0]));
            const outgoing = new Map(nodeIds.map(id => [id, []]));
            route.edges.forEach(([source, target]) => {
                if (!indegree.has(source) || !indegree.has(target)) return;
                indegree.set(target, indegree.get(target) + 1);
                outgoing.get(source).push(target);
            });

            const rank = new Map(nodeIds.map(id => [id, 0]));
            const queue = nodeIds.filter(id => indegree.get(id) === 0)
                .sort((a, b) => nodeOrder.get(a) - nodeOrder.get(b));
            let visited = 0;
            while (queue.length) {
                const source = queue.shift();
                visited += 1;
                outgoing.get(source).forEach(target => {
                    rank.set(target, Math.max(rank.get(target), rank.get(source) + 1));
                    indegree.set(target, indegree.get(target) - 1);
                    if (indegree.get(target) === 0) {
                        queue.push(target);
                        queue.sort((a, b) => nodeOrder.get(a) - nodeOrder.get(b));
                    }
                });
            }

            if (visited !== nodeIds.length) {
                const resolvedMax = Math.max(0, ...nodeIds.filter(id => indegree.get(id) === 0).map(id => rank.get(id)));
                nodeIds.filter(id => indegree.get(id) > 0).forEach(id => rank.set(id, resolvedMax + 1));
            }
            return { rank, hasCycle: visited !== nodeIds.length };
        }

        function clampNumber(value, minimum, maximum) {
            return Math.min(maximum, Math.max(minimum, value));
        }

        function nodeDimensions(node, isMain, relationCount) {
            if (isMain) {
                const relationGrowth = Math.max(0, relationCount - 2);
                const width = Math.round(clampNumber(224 + relationGrowth * 9, 224, 278));
                const bodyHeight = Math.round(clampNumber(120 + relationGrowth * 4.5, 120, 148));
                return { width, height: bodyHeight + (node.childRoute ? 58 : 0) };
            }

            const relationGrowth = Math.max(0, relationCount - 1);
            const width = Math.round(clampNumber(146 + relationGrowth * 10, 146, 186));
            const bodyHeight = Math.round(clampNumber(82 + relationGrowth * 7 + (node.shared ? 16 : 0), 82, 126));
            return { width, height: bodyHeight + (node.childRoute ? 58 : 0) };
        }

        function calculateLayout(route) {
            const dependency = dependencyRanks(route);
