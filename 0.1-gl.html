            const mainIndex = new Map(route.mainline.map((id, index) => [id, index]));
            const nodeById = new Map(route.nodes.map(node => [node.id, node]));
            const incoming = new Map(route.nodes.map(node => [node.id, []]));
            const outgoing = new Map(route.nodes.map(node => [node.id, []]));
            route.edges.forEach(([source, target]) => {
                incoming.get(target)?.push(source);
                outgoing.get(source)?.push(target);
            });

            const gapX = route.mainline.length > 4 ? 370 : 420;
            const contentWidth = Math.max(1480, 420 + gapX * Math.max(1, route.mainline.length - 1));
            const contentMarginX = (contentWidth - gapX * Math.max(1, route.mainline.length - 1)) / 2;
            const normalOffset = 208;
            const normalRowGap = 146;
            const sharedOffset = 360;
            const canvasPaddingX = 780;
            const canvasPaddingY = 620;
            const clusters = route.mainline.map((mainId, index) => ({
                id: mainId,
                index,
                x: canvasPaddingX + contentMarginX + index * gapX,
                members: []
            }));

            route.nodes.forEach(node => {
                if (mainIndex.has(node.id)) return;
                const clusterIndex = Math.min(
                    route.mainline.length - 1,
                    Math.max(0, Number.isInteger(node.cluster) ? node.cluster : 0)
                );
                clusters[clusterIndex].members.push(node);
            });

            const sideAssignments = new Map();
            let maxNormalRows = 1;
            clusters.forEach(cluster => {
                const normalMembers = cluster.members.filter(node => !node.shared);
                normalMembers.forEach((node, index) => {
                    const side = node.side === 'top'
                        ? -1
                        : node.side === 'bottom'
                            ? 1
                            : (index + cluster.index) % 2 === 0 ? -1 : 1;
                    sideAssignments.set(node.id, side);
                });
                const topCount = normalMembers.filter(node => sideAssignments.get(node.id) === -1).length;
                const bottomCount = normalMembers.length - topCount;
                maxNormalRows = Math.max(maxNormalRows, Math.ceil(topCount / 2), Math.ceil(bottomCount / 2));
            });

            const maxVerticalOffset = Math.max(sharedOffset, normalOffset + (maxNormalRows - 1) * normalRowGap);
            const contentHeight = Math.max(940, (maxVerticalOffset + 88) * 2);
            const stageWidth = contentWidth + canvasPaddingX * 2;
            const stageHeight = contentHeight + canvasPaddingY * 2;
            const centerY = canvasPaddingY + contentHeight / 2;
            const positions = new Map();

            function relationData(nodeId) {
                const nodeIncoming = incoming.get(nodeId) || [];
                const nodeOutgoing = outgoing.get(nodeId) || [];
                return {
                    incoming: nodeIncoming,
                    outgoing: nodeOutgoing,
                    relationCount: new Set([...nodeIncoming, ...nodeOutgoing]).size
                };
            }

            route.mainline.forEach((nodeId, index) => {
                const node = nodeById.get(nodeId);
                if (!node) return;
                const relations = relationData(node.id);
                const dimensions = nodeDimensions(node, true, relations.relationCount);
                positions.set(node.id, {
                    id: node.id,
                    x: clusters[index].x,
                    y: centerY,
                    ...dimensions,
                    clusterIndex: index,
                    centerY,
                    side: 0,
                    lane: 0,
                    isMain: true,
                    ...relations,
                    dependencyIncoming: relations.incoming.filter(sourceId => !isMainEdge(route, sourceId, node.id)),
                    isShared: false
                });
            });

            clusters.forEach(cluster => {
                const normalMembers = cluster.members.filter(node => !node.shared);
                [-1, 1].forEach(side => {
                    const members = normalMembers.filter(node => sideAssignments.get(node.id) === side);
                    for (let row = 0; row < Math.ceil(members.length / 2); row += 1) {
                        const pair = members.slice(row * 2, row * 2 + 2).map(node => {
                            const relations = relationData(node.id);
                            return { node, relations, dimensions: nodeDimensions(node, false, relations.relationCount) };
                        });
                        const pairGap = 32;
                        pair.forEach((item, slot) => {
                            const x = pair.length === 1
                                ? cluster.x + ((side === -1 ? -1 : 1) * (item.dimensions.width / 2 + 18))
                                : slot === 0
                                    ? cluster.x - item.dimensions.width / 2 - pairGap / 2
                                    : cluster.x + item.dimensions.width / 2 + pairGap / 2;
                            positions.set(item.node.id, {
                                id: item.node.id,
                                x,
                                y: centerY + side * (normalOffset + row * normalRowGap),
                                ...item.dimensions,
                                clusterIndex: cluster.index,
                                centerY,
                                side,
                                lane: row + 1,
                                isMain: false,
                                ...item.relations,
                                dependencyIncoming: item.relations.incoming,
                                isShared: false
                            });
                        });
                    }
                });
            });

            const sharedNodes = route.nodes.filter(node => node.shared);
            sharedNodes.forEach((node, index) => {
                const relations = relationData(node.id);
                const dimensions = nodeDimensions(node, false, relations.relationCount);
                const fallbackIndex = Math.min(route.mainline.length - 1, Math.max(0, Number(node.cluster) || 0));
                const targetIndexes = relations.outgoing.map(targetId => {
                    if (mainIndex.has(targetId)) return mainIndex.get(targetId);
                    const targetNode = nodeById.get(targetId);
                    return Number.isInteger(targetNode?.cluster) ? targetNode.cluster : null;
                }).filter(Number.isInteger);
                const targetX = targetIndexes.length
                    ? targetIndexes.reduce((sum, targetIndex) => sum + clusters[targetIndex].x, 0) / targetIndexes.length
                    : clusters[fallbackIndex].x;
                const side = node.sharedSide === 'top'
                    ? -1
                    : node.sharedSide === 'bottom'
                        ? 1
                        : index % 2 === 0 ? -1 : 1;
                positions.set(node.id, {
                    id: node.id,
                    x: clampNumber(targetX + (Number(node.xBias) || 0), canvasPaddingX + 80, canvasPaddingX + contentWidth - 80),
                    y: centerY + side * sharedOffset,
                    ...dimensions,
                    clusterIndex: fallbackIndex,
                    centerY,
                    side,
                    lane: 3,
                    isMain: false,
                    ...relations,
                    dependencyIncoming: relations.incoming,
                    isShared: true
                });
            });

            return {
                stageWidth,
                stageHeight,
                centerY,
                gapX,
                normalOffset,
                sharedOffset,
                positions,
                clusters,
                contentLeft: canvasPaddingX,
                contentTop: canvasPaddingY,
                contentWidth,
                contentHeight,
                hasCycle: false
            };
        }

        const PORT_VECTORS = {
            top: { x: 0, y: -1 },
            right: { x: 1, y: 0 },
            bottom: { x: 0, y: 1 },
            left: { x: -1, y: 0 }
        };

        function oppositeSide(side) {
            return { top: 'bottom', right: 'left', bottom: 'top', left: 'right' }[side];
        }

        function portCorridorIsClear(node, side, otherNode, layout) {
            const start = portPoint(node, side, 10, 0);
            const end = leadPoint(start, side, 34);
            const segment = { a: start, b: end };
            return Array.from(layout.positions.values())
                .filter(position => position.id !== node.id && position.id !== otherNode.id)
                .every(position => !segmentIntersectsRectangle(segment, {
                    left: position.x - position.width / 2 - 18,
                    right: position.x + position.width / 2 + 18,
                    top: position.y - position.height / 2 - 18,
                    bottom: position.y + position.height / 2 + 18
                }));
        }

        function resolvePortSide(node, preferredSide, otherNode, layout) {
            const horizontalToward = otherNode.x >= node.x ? 'right' : 'left';
            const verticalToward = otherNode.y >= node.y ? 'bottom' : 'top';
            const outward = node.side < 0 ? 'top' : node.side > 0 ? 'bottom' : verticalToward;
            const candidates = [
                preferredSide,
                outward,
                horizontalToward,
                oppositeSide(horizontalToward),
                verticalToward,
                oppositeSide(verticalToward)
            ].filter((side, index, list) => side && list.indexOf(side) === index);
            return candidates.find(side => portCorridorIsClear(node, side, otherNode, layout)) || preferredSide;
        }

        function edgePortSides(source, target, tone, layout) {
            if (tone === 'main') return { sourceSide: 'right', targetSide: 'left' };
            const finalize = preferred => ({
                sourceSide: resolvePortSide(source, preferred.sourceSide, target, layout),
                targetSide: resolvePortSide(target, preferred.targetSide, source, layout)
            });
            if (tone === 'shared') {
                const sourceSide = source.y < layout.centerY ? 'top' : 'bottom';
                const targetSide = source.y < target.y ? 'top' : 'bottom';
                return finalize({ sourceSide, targetSide });
            }

            const deltaX = target.x - source.x;
            const deltaY = target.y - source.y;
            const verticalDirection = deltaY >= 0 ? { sourceSide: 'bottom', targetSide: 'top' } : { sourceSide: 'top', targetSide: 'bottom' };
            const horizontalDirection = deltaX >= 0 ? { sourceSide: 'right', targetSide: 'left' } : { sourceSide: 'left', targetSide: 'right' };
            const sourceOuterSide = source.side < 0 ? 'top' : source.side > 0 ? 'bottom' : horizontalDirection.sourceSide;
            const targetOuterSide = target.side < 0 ? 'top' : target.side > 0 ? 'bottom' : horizontalDirection.targetSide;

            if (!source.isMain && !target.isMain && (source.clusterIndex !== target.clusterIndex || source.side !== target.side)) {
                return finalize({ sourceSide: sourceOuterSide, targetSide: targetOuterSide });
            }

            if (target.isMain && Math.abs(deltaY) > 52) {
                return finalize({
                    sourceSide: source.clusterIndex === target.clusterIndex ? verticalDirection.sourceSide : sourceOuterSide,
                    targetSide: verticalDirection.targetSide
                });
            }
            if (source.isMain && Math.abs(deltaY) > 52) {
                return finalize({
                    sourceSide: verticalDirection.sourceSide,
                    targetSide: Math.abs(deltaX) < layout.gapX * 0.62 ? verticalDirection.targetSide : horizontalDirection.targetSide
                });
            }
            return finalize(Math.abs(deltaX) >= Math.abs(deltaY) * 0.78 ? horizontalDirection : verticalDirection);
        }

        function assignEdgePortOffsets(records, layout) {
            const groups = new Map();
            records.forEach(record => {
                const source = layout.positions.get(record.sourceId);
                const target = layout.positions.get(record.targetId);
                if (!source || !target) return;
                const sides = edgePortSides(source, target, record.tone, layout);
                record.sourceSide = sides.sourceSide;
                record.targetSide = sides.targetSide;
                if (record.tone === 'main') {
                    record.sourceOffset = 0;
                    record.targetOffset = 0;
                    return;
                }
                [
                    { role: 'source', node: source, side: record.sourceSide, other: target },
                    { role: 'target', node: target, side: record.targetSide, other: source }
                ].forEach(entry => {
                    const category = record.tone === 'shared' ? 'shared' : 'direct';
                    const key = `${entry.role}:${entry.node.id}:${entry.side}:${category}`;
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push({ record, ...entry });
                });
            });

            groups.forEach(entries => {
                const side = entries[0].side;
                const node = entries[0].node;
                const horizontalSide = side === 'top' || side === 'bottom';
                const availableSpan = Math.max(0, (horizontalSide ? node.width : node.height) - 46);
                const halfSpan = availableSpan / 2;
                entries.forEach(entry => {
                    const projected = entry.record.tone === 'shared' && entry.role === 'target'
                        ? 0
                        : horizontalSide ? entry.other.x - node.x : entry.other.y - node.y;
                    entry.projectedOffset = clampNumber(projected, -halfSpan, halfSpan);
                });
                entries.sort((first, second) => first.projectedOffset - second.projectedOffset);
                const minimumStep = entries.length > 1 ? Math.min(22, availableSpan / (entries.length - 1)) : 0;
                const offsets = entries.map(entry => entry.projectedOffset);
                for (let index = 1; index < offsets.length; index += 1) {
                    offsets[index] = Math.max(offsets[index], offsets[index - 1] + minimumStep);
                }
                if (offsets.length && offsets[offsets.length - 1] > halfSpan) {
                    const shift = offsets[offsets.length - 1] - halfSpan;
                    for (let index = 0; index < offsets.length; index += 1) offsets[index] -= shift;
                }
                for (let index = offsets.length - 2; index >= 0; index -= 1) {
                    offsets[index] = Math.min(offsets[index], offsets[index + 1] - minimumStep);
                }
                if (offsets.length && offsets[0] < -halfSpan) {
                    const shift = -halfSpan - offsets[0];
                    for (let index = 0; index < offsets.length; index += 1) offsets[index] += shift;
                }
                entries.forEach((entry, index) => {
                    entry.record[`${entry.role}Offset`] = offsets[index] || 0;
                });
            });
        }

        function portPoint(node, side, gap, offset = 0) {
            const vector = PORT_VECTORS[side];
            const horizontalSide = side === 'top' || side === 'bottom';
            return {
                x: node.x + vector.x * (node.width / 2 + gap) + (horizontalSide ? offset : 0),
                y: node.y + vector.y * (node.height / 2 + gap) + (horizontalSide ? 0 : offset)
            };
        }

        function leadPoint(point, side, distance) {
            const vector = PORT_VECTORS[side];
            return { x: point.x + vector.x * distance, y: point.y + vector.y * distance };
        }

        function cleanOrthogonalPoints(points) {
            const cleaned = [];
            points.forEach(point => {
                const previous = cleaned[cleaned.length - 1];
                if (!previous || Math.abs(previous.x - point.x) > 0.1 || Math.abs(previous.y - point.y) > 0.1) {
                    cleaned.push({ x: point.x, y: point.y });
                }
            });
            let index = 1;
            while (index < cleaned.length - 1) {
                const previous = cleaned[index - 1];
                const current = cleaned[index];
                const next = cleaned[index + 1];
                const sameX = Math.abs(previous.x - current.x) < 0.1 && Math.abs(current.x - next.x) < 0.1;
                const sameY = Math.abs(previous.y - current.y) < 0.1 && Math.abs(current.y - next.y) < 0.1;
                if (sameX || sameY) cleaned.splice(index, 1);
                else index += 1;
            }
            return cleaned;
        }

        function orthogonalSegments(points) {
            const cleaned = cleanOrthogonalPoints(points);
            return cleaned.slice(0, -1).map((point, index) => ({ a: point, b: cleaned[index + 1] }));
        }

        function segmentIntersectsRectangle(segment, rectangle) {
            const { a, b } = segment;
            if (Math.abs(a.y - b.y) < 0.1) {
                const minimumX = Math.min(a.x, b.x);
                const maximumX = Math.max(a.x, b.x);
                return a.y > rectangle.top && a.y < rectangle.bottom && maximumX > rectangle.left && minimumX < rectangle.right;
            }
            if (Math.abs(a.x - b.x) < 0.1) {
                const minimumY = Math.min(a.y, b.y);
                const maximumY = Math.max(a.y, b.y);
                return a.x > rectangle.left && a.x < rectangle.right && maximumY > rectangle.top && minimumY < rectangle.bottom;
            }
            return true;
        }

        function routeIsClear(points, obstacles) {
            return orthogonalSegments(points).every(segment => obstacles.every(rectangle => !segmentIntersectsRectangle(segment, rectangle)));
        }

        function routeLength(points) {
            return orthogonalSegments(points).reduce((sum, segment) => sum + Math.abs(segment.b.x - segment.a.x) + Math.abs(segment.b.y - segment.a.y), 0);
        }

        function segmentInterference(first, second) {
            const firstHorizontal = Math.abs(first.a.y - first.b.y) < 0.1;
            const secondHorizontal = Math.abs(second.a.y - second.b.y) < 0.1;
            if (firstHorizontal === secondHorizontal) {
                if (firstHorizontal && Math.abs(first.a.y - second.a.y) < 1) {
                    const overlap = Math.min(Math.max(first.a.x, first.b.x), Math.max(second.a.x, second.b.x))
                        - Math.max(Math.min(first.a.x, first.b.x), Math.min(second.a.x, second.b.x));
                    return overlap > 0 ? 90 + overlap * 0.35 : 0;
                }
                if (!firstHorizontal && Math.abs(first.a.x - second.a.x) < 1) {
                    const overlap = Math.min(Math.max(first.a.y, first.b.y), Math.max(second.a.y, second.b.y))
                        - Math.max(Math.min(first.a.y, first.b.y), Math.min(second.a.y, second.b.y));
                    return overlap > 0 ? 90 + overlap * 0.35 : 0;
                }
                return 0;
            }

            const horizontal = firstHorizontal ? first : second;
            const vertical = firstHorizontal ? second : first;
            const crossesX = vertical.a.x > Math.min(horizontal.a.x, horizontal.b.x) && vertical.a.x < Math.max(horizontal.a.x, horizontal.b.x);
            const crossesY = horizontal.a.y > Math.min(vertical.a.y, vertical.b.y) && horizontal.a.y < Math.max(vertical.a.y, vertical.b.y);
            return crossesX && crossesY ? 48 : 0;
        }

        function routingInterference(points, usedSegments) {
            return orthogonalSegments(points).reduce((score, segment) => (
                score + usedSegments.reduce((segmentScore, used) => segmentScore + segmentInterference(segment, used), 0)
            ), 0);
        }

        function roundedOrthogonalPath(points, radius = 12) {
            const cleaned = cleanOrthogonalPoints(points);
            const format = value => Math.round(value * 10) / 10;
            if (cleaned.length < 2) return '';
            let path = `M ${format(cleaned[0].x)} ${format(cleaned[0].y)}`;
            for (let index = 1; index < cleaned.length; index += 1) {
                const current = cleaned[index];
                if (index === cleaned.length - 1) {
                    path += ` L ${format(current.x)} ${format(current.y)}`;
                    continue;
                }
                const previous = cleaned[index - 1];
                const next = cleaned[index + 1];
                const incomingLength = Math.abs(current.x - previous.x) + Math.abs(current.y - previous.y);
                const outgoingLength = Math.abs(next.x - current.x) + Math.abs(next.y - current.y);
                const cornerRadius = Math.min(radius, incomingLength / 2, outgoingLength / 2);
                const incomingX = Math.sign(current.x - previous.x);
                const incomingY = Math.sign(current.y - previous.y);
                const outgoingX = Math.sign(next.x - current.x);
                const outgoingY = Math.sign(next.y - current.y);
                const before = { x: current.x - incomingX * cornerRadius, y: current.y - incomingY * cornerRadius };
                const after = { x: current.x + outgoingX * cornerRadius, y: current.y + outgoingY * cornerRadius };
                path += ` L ${format(before.x)} ${format(before.y)} Q ${format(current.x)} ${format(current.y)} ${format(after.x)} ${format(after.y)}`;
            }
            return path;
        }

        function pathForEdge(record, layout, routingContext) {
            const source = layout.positions.get(record.sourceId);
            const target = layout.positions.get(record.targetId);
            const startGap = record.tone === 'main' ? 11 : 10;
            const endGap = record.tone === 'main' ? 23 : record.tone === 'shared' ? 19 : 17;
            const start = portPoint(source, record.sourceSide, startGap, record.sourceOffset || 0);
            const end = portPoint(target, record.targetSide, endGap, record.targetOffset || 0);

            if (record.tone === 'main') {
                const points = [start, end];
                routingContext.usedSegments.push(...orthogonalSegments(points));
                return roundedOrthogonalPath(points, 0);
            }

            const startLead = leadPoint(start, record.sourceSide, 28);
            const endLead = leadPoint(end, record.targetSide, 32);
            const obstacleMargin = 22;
            const obstacles = Array.from(layout.positions.values())
                .filter(position => position.id !== source.id && position.id !== target.id)
                .map(position => ({
                    left: position.x - position.width / 2 - obstacleMargin,
                    right: position.x + position.width / 2 + obstacleMargin,
                    top: position.y - position.height / 2 - obstacleMargin,
                    bottom: position.y + position.height / 2 + obstacleMargin
                }));
            const candidates = [];
            const seen = new Set();
            const addCandidate = points => {
                const cleaned = cleanOrthogonalPoints([start, ...points, end]);
                const key = cleaned.map(point => `${Math.round(point.x)},${Math.round(point.y)}`).join('|');
                if (seen.has(key)) return;
                seen.add(key);
                candidates.push(cleaned);
            };

            if (Math.abs(startLead.x - endLead.x) < 0.1 || Math.abs(startLead.y - endLead.y) < 0.1) {
                addCandidate([startLead, endLead]);
            }
            addCandidate([startLead, { x: endLead.x, y: startLead.y }, endLead]);
            addCandidate([startLead, { x: startLead.x, y: endLead.y }, endLead]);

            const candidateXs = [
                (startLead.x + endLead.x) / 2,
                layout.contentLeft + 8,
                layout.contentLeft + layout.contentWidth - 8,
                ...layout.clusters.slice(0, -1).map((cluster, index) => (cluster.x + layout.clusters[index + 1].x) / 2),
                ...obstacles.flatMap(rectangle => [rectangle.left - 12, rectangle.right + 12])
            ];
            const preferredSharedRail = source.y < layout.centerY
                ? layout.contentTop + 8
                : layout.contentTop + layout.contentHeight - 8;
            const candidateYs = [
                (startLead.y + endLead.y) / 2,
                layout.centerY - layout.normalOffset / 2,
                layout.centerY + layout.normalOffset / 2,
                layout.contentTop + 8,
                layout.contentTop + layout.contentHeight - 8,
                preferredSharedRail,
                ...obstacles.flatMap(rectangle => [rectangle.top - 12, rectangle.bottom + 12])
            ];

            [...new Set(candidateXs.map(value => Math.round(value * 10) / 10))].forEach(x => {
                addCandidate([startLead, { x, y: startLead.y }, { x, y: endLead.y }, endLead]);
            });
            [...new Set(candidateYs.map(value => Math.round(value * 10) / 10))].forEach(y => {
                addCandidate([startLead, { x: startLead.x, y }, { x: endLead.x, y }, endLead]);
            });

            const topRail = layout.contentTop + 8;
            const bottomRail = layout.contentTop + layout.contentHeight - 8;
            const sourceRailY = record.sourceSide === 'top' ? topRail : record.sourceSide === 'bottom' ? bottomRail : startLead.y;
            const targetRailY = record.targetSide === 'top' ? topRail : record.targetSide === 'bottom' ? bottomRail : endLead.y;
            const outerXs = [
                layout.contentLeft + 8,
                layout.contentLeft + layout.contentWidth - 8,
                (startLead.x + endLead.x) / 2,
                ...layout.clusters.slice(0, -1).map((cluster, index) => (cluster.x + layout.clusters[index + 1].x) / 2)
            ];
            [...new Set(outerXs.map(value => Math.round(value * 10) / 10))].forEach(x => {
                addCandidate([
                    startLead,
                    { x: startLead.x, y: sourceRailY },
                    { x, y: sourceRailY },
                    { x, y: targetRailY },
                    { x: endLead.x, y: targetRailY },
                    endLead
                ]);
            });

            const clearCandidates = candidates.filter(points => routeIsClear(points, obstacles));
            const candidatePool = clearCandidates.length ? clearCandidates : candidates;
            const chosen = candidatePool.reduce((best, points) => {
                const segments = orthogonalSegments(points);
                const usesPreferredSharedRail = record.tone === 'shared' && segments.some(segment => (
                    Math.abs(segment.a.y - segment.b.y) < 0.1 && Math.abs(segment.a.y - preferredSharedRail) < 1
                ));
                const collisionPenalty = routeIsClear(points, obstacles)
                    ? 0
                    : segments.reduce((sum, segment) => sum + obstacles.filter(rectangle => segmentIntersectsRectangle(segment, rectangle)).length * 10000, 0);
                const score = routeLength(points)
                    + Math.max(0, points.length - 2) * 34
                    + routingInterference(points, routingContext.usedSegments)
                    + collisionPenalty
                    - (usesPreferredSharedRail ? 150 : 0);
                return !best || score < best.score ? { points, score } : best;
            }, null)?.points || [start, end];

            routingContext.usedSegments.push(...orthogonalSegments(chosen));
            return roundedOrthogonalPath(chosen, record.tone === 'shared' ? 14 : 12);
        }

        function edgeTone(route, sourceId, targetId) {
            if (isMainEdge(route, sourceId, targetId)) return 'main';
            const sourceNode = route.nodes.find(node => node.id === sourceId);
            if (sourceNode?.shared) return 'shared';
            return 'dependency';
        }

        function relationMeta(position, node) {
            if (position.isShared) {
                return { label: '跨阶段共享', icon: 'ph-share-network', shared: true };
            }
            return position.isMain
                ? { label: '主线能力', icon: '', shared: false }
                : { label: '直接依赖', icon: '', shared: false };
        }

        function nodeMarkup(route, node, position) {
            const meta = STATUS_META[node.status];
            const mainlineIndex = route.mainline.indexOf(node.id);
            const relation = relationMeta(position, node);
            const childRoute = node.childRoute ? routes[node.childRoute] : null;
            const complexityMarkup = `<span class="node-complexity"><i class="ph-bold ph-git-branch" aria-hidden="true"></i>${position.relationCount} 关联</span>`;
            const statusMarkup = node.status === 'active'
                ? `
                    <span class="flex items-center justify-between gap-2 text-[10px] font-extrabold">
                        <span>${meta.label}</span>
                        <span class="flex items-center gap-1.5">${complexityMarkup}<span class="font-mono">${node.progress}%</span></span>
                    </span>
                    <span class="node-progress-track"><span class="node-progress-value block" style="width:${node.progress}%"></span></span>
                `
                : `<span class="flex items-center justify-between gap-2"><span class="text-[10px] font-extrabold opacity-70">${meta.label}</span>${complexityMarkup}</span>`;
            return `
                <div class="graph-node ${position.isMain ? 'is-main' : 'is-branch'} ${position.isShared ? 'is-shared' : ''} status-${node.status}" data-graph-node="${node.id}" style="left:${position.x}px;top:${position.y}px;--node-width:${position.width}px;--node-height:${position.height}px">
                    <div class="node-card">
                        <button type="button" data-node-id="${node.id}" class="node-detail" aria-label="查看能力详情：${escapeHtml(node.title)}，${meta.label}，${relation.label}">
                            ${position.isShared ? `
                                <span class="node-relation-pill is-shared"><i class="ph-bold ${relation.icon}" aria-hidden="true"></i>${relation.label}</span>
                            ` : ''}
                            <span class="flex min-w-0 items-center gap-2.5">
                                ${position.isMain ? `<span class="flex h-7 min-w-7 items-center justify-center rounded-lg bg-white/70 font-mono text-[10px] font-extrabold text-slate-400">${String(mainlineIndex + 1).padStart(2, '0')}</span>` : ''}
                                <span class="node-status-icon"><i class="ph-bold ${meta.icon} ${position.isMain ? 'text-[15px]' : 'text-[12px]'}" aria-hidden="true"></i></span>
                                <span class="node-title min-w-0 flex-1 ${position.isMain ? 'text-[18px]' : 'text-[13px]'} font-extrabold tracking-[-0.01em]">${escapeHtml(node.title)}</span>
                            </span>
                            ${statusMarkup}
                        </button>
                        ${childRoute ? `
                            <button type="button" data-enter-child-route="${node.childRoute}" data-source-node="${node.id}" class="node-entry" aria-label="查看下一级能力图：${escapeHtml(childRoute.title)}">
                                <span class="flex min-w-0 items-center gap-1.5 truncate text-[11px] font-extrabold">查看能力图<i class="ph-bold ph-arrow-right text-[13px]" aria-hidden="true"></i></span>
                                <span class="shrink-0 font-mono text-[9px] font-bold text-slate-400">${childRoute.nodes.length} 项</span>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderGraph({ restoreView = false } = {}) {
            const route = currentRoute();
            graphLayout = calculateLayout(route);
            document.documentElement.style.setProperty('--stage-width', `${graphLayout.stageWidth}px`);
            document.documentElement.style.setProperty('--stage-height', `${graphLayout.stageHeight}px`);
            const branchCount = route.nodes.length - route.mainline.length;
            const sharedCount = route.nodes.filter(node => node.shared).length;
            const dependencyCount = branchCount - sharedCount;
            graphStats.textContent = `${route.mainline.length} 阶段 · ${dependencyCount} 依赖 · ${sharedCount} 共享 · ${route.edges.length} 关系`;
            graphScroll.setAttribute('aria-label', `${route.title}能力依赖图，共${route.mainline.length}个主线阶段、${dependencyCount}个直接依赖、${sharedCount}个跨阶段共享能力、${route.edges.length}条无环关系，箭头指向下一步`);

            const edgeRecords = route.edges.map(([sourceId, targetId]) => ({
                sourceId,
                targetId,
                tone: edgeTone(route, sourceId, targetId)
            }));
            assignEdgePortOffsets(edgeRecords, graphLayout);
            edgeRecords.sort((first, second) => {
                const priority = { dependency: 0, shared: 1, main: 2 };
                return priority[first.tone] - priority[second.tone];
            });

            const routingContext = { usedSegments: [] };
            const edges = edgeRecords.map(record => {
                const { sourceId, targetId, tone } = record;
                if (!graphLayout.positions.has(sourceId) || !graphLayout.positions.has(targetId)) return '';
                const path = pathForEdge(record, graphLayout, routingContext);
                const underlay = `<path class="graph-edge-underlay ${tone === 'main' ? 'underlay-main' : ''}" d="${path}"></path>`;
                return `${underlay}<path class="graph-edge edge-${tone}" d="${path}" marker-end="url(#arrow-${tone})"></path>`;
            }).join('');

            graphStage.innerHTML = `
                <svg class="absolute inset-0 h-full w-full overflow-visible" viewBox="0 0 ${graphLayout.stageWidth} ${graphLayout.stageHeight}" aria-hidden="true">
                    <defs>
                        <marker id="arrow-main" viewBox="0 0 22 22" refX="21" refY="11" markerWidth="22" markerHeight="22" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
                            <path d="M 2 2 L 21 11 L 2 20 Z" fill="#243249" stroke="#FFFFFF" stroke-width="2.3" stroke-linejoin="round"></path>
                        </marker>
                        <marker id="arrow-dependency" viewBox="0 0 18 18" refX="17.5" refY="9" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
                            <path d="M 2 2 L 17.5 9 L 2 16 Z" fill="#A3AFBF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"></path>
                        </marker>
                        <marker id="arrow-shared" viewBox="0 0 18 18" refX="17.5" refY="9" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
                            <path d="M 2 2 L 17.5 9 L 2 16 Z" fill="#66758A" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"></path>
                        </marker>
                    </defs>
                    ${edges}
                </svg>
                ${route.nodes.map(node => nodeMarkup(route, node, graphLayout.positions.get(node.id))).join('')}
            `;

            const snapshot = restoreView ? routeViewStates.get(routePathKey()) : null;
            window.requestAnimationFrame(() => restoreGraphView(snapshot));
        }

        function transitionRoute(nextStack, { restoreView = false, returnFocusNodeId = null } = {}) {
            window.clearTimeout(routeTransitionTimer);
            captureGraphView(returnFocusNodeId);
            closeDrawer();
            graphStage.classList.add('is-switching');
            routeTransitionTimer = window.setTimeout(() => {
                state.routeStack = nextStack;
                renderBreadcrumbs();
                renderGraph({ restoreView });
                window.requestAnimationFrame(() => graphStage.classList.remove('is-switching'));
            }, 150);
        }

        function enterRoute(routeId, sourceNodeId) {
            if (!routes[routeId]) return;
            const nextStack = [...state.routeStack, routeId];
            routeViewStates.delete(routePathKey(nextStack));
            transitionRoute(nextStack, { returnFocusNodeId: sourceNodeId });
        }

        function navigateToDepth(index) {
            if (index < 0 || index >= state.routeStack.length - 1) return;
            transitionRoute(state.routeStack.slice(0, index + 1), { restoreView: true });
        }

        function showGoalPage() {
            state.view = 'goals';
            activePointers.clear();
            panState = null;
            pinchState = null;
            graphScroll.classList.remove('is-panning');
            closeDrawer();
            graphPage.classList.add('is-hidden');
            goalPage.classList.remove('is-hidden');
            renderGoals();
        }

        function showGraphPage() {
            state.view = 'graph';
            goalPage.classList.add('is-hidden');
            graphPage.classList.remove('is-hidden');
        }

        function navigateUp() {
            if (state.routeStack.length <= 1) {
                showGoalPage();
                return;
            }
            transitionRoute(state.routeStack.slice(0, -1), { restoreView: true });
        }

        function selectGoal(goalId) {
            const goal = allGoals().find(item => item.id === goalId);
            if (!goal) return;
            state.goalId = goal.id;
            state.routeStack = [goal.routeId];
            state.zoom = 1;
            routeViewStates.clear();
            closeDrawer();
            showGraphPage();
            renderBreadcrumbs();
            graphStage.classList.add('is-switching');
            window.requestAnimationFrame(() => {
                renderGraph();
                window.requestAnimationFrame(() => graphStage.classList.remove('is-switching'));
            });
        }

        function openNode(nodeId) {
            const route = currentRoute();
            const node = route.nodes.find(item => item.id === nodeId);
            const position = graphLayout?.positions.get(nodeId);
            if (!node || !position) return;
            const meta = STATUS_META[node.status];
            state.nodeId = node.id;
            state.drawerOpen = true;
            drawerKicker.textContent = position.isShared ? '跨阶段共享能力' : '能力详情';
            drawerTitle.textContent = node.title;

            const prerequisites = position.incoming.map(id => route.nodes.find(item => item.id === id)?.title).filter(Boolean);
            const dependents = position.outgoing.map(id => route.nodes.find(item => item.id === id)?.title).filter(Boolean);
            const actionLabel = node.status === 'mastered' ? '复习巩固' : node.status === 'active' ? '继续攻坚' : '尚未解锁';
            drawerContent.innerHTML = `
                <div class="flex items-center justify-between gap-3">
                    <span class="inline-flex min-h-8 items-center gap-1.5 rounded-lg border px-2.5 text-[11px] font-extrabold ${meta.badge}"><i class="ph-bold ${meta.icon}" aria-hidden="true"></i>${meta.label}</span>
                    ${node.status === 'active' ? `<span class="font-mono text-[20px] font-extrabold text-brand">${node.progress}%</span>` : ''}
                </div>
                ${node.status === 'active' ? `<div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full ${meta.fill}" style="width:${node.progress}%"></div></div>` : ''}

                <section class="mt-5 rounded-[18px] bg-slate-50/80 p-4">
                    <h3 class="text-[13px] font-extrabold text-slate-900">依赖关系</h3>
                    <div class="mt-3 grid grid-cols-2 gap-2">
                        <div class="rounded-xl bg-white p-3">
                            <p class="text-[9px] font-extrabold tracking-[0.08em] text-slate-400">前置能力</p>
                            <p class="mt-1.5 text-[12px] font-bold leading-5 text-slate-700">${prerequisites.length ? prerequisites.map(escapeHtml).join('、') : '无，可直接开始'}</p>
                        </div>
                        <div class="rounded-xl bg-white p-3">
                            <p class="text-[9px] font-extrabold tracking-[0.08em] text-slate-400">后续能力</p>
                            <p class="mt-1.5 text-[12px] font-bold leading-5 text-slate-700">${dependents.length ? dependents.map(escapeHtml).join('、') : '当前路线终点'}</p>
                        </div>
                    </div>
                </section>

                <section class="mt-5">
                    <h3 class="mb-3 text-[14px] font-extrabold text-slate-900">训练内容</h3>
                    <div class="space-y-2">
                        ${[
                            ['ph-speaker-high', '音记', '听辨与跟读'],
                            ['ph-note-pencil', '题库', '核心概念辨析'],
                            ['ph-game-controller', '游戏', '情境化应用']
                        ].map(([icon, name, description]) => `
                            <button type="button" data-training="${name}" ${node.status === 'locked' ? 'disabled' : ''} class="flex min-h-[62px] w-full items-center gap-3 rounded-[14px] bg-slate-50 px-3.5 text-left transition active:scale-[0.98] disabled:text-slate-300">
                                <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ${node.status === 'locked' ? 'bg-slate-100 text-slate-300' : 'bg-blue-50 text-brand'}"><i class="ph-bold ${icon} text-[19px]" aria-hidden="true"></i></span>
                                <span class="min-w-0 flex-1"><span class="block text-[13px] font-extrabold">${name}</span><span class="mt-0.5 block text-[10px] font-semibold text-slate-400">${description}</span></span>
                                <i class="ph-bold ph-caret-right text-slate-300" aria-hidden="true"></i>
                            </button>
                        `).join('')}
                    </div>
                </section>

                <button type="button" data-primary-action ${node.status === 'locked' ? 'disabled' : ''} class="mt-5 flex min-h-12 w-full items-center justify-center gap-2 rounded-[14px] bg-brand px-5 text-[14px] font-extrabold text-white transition active:scale-95 disabled:bg-slate-200 disabled:text-slate-400">
                    ${actionLabel}<i class="ph-bold ph-arrow-right" aria-hidden="true"></i>
                </button>
            `;
            drawer.classList.add('is-open');
            drawer.setAttribute('aria-hidden', 'false');
        }

        function closeDrawer() {
            state.drawerOpen = false;
            state.nodeId = null;
            drawer.classList.remove('is-open');
            drawer.setAttribute('aria-hidden', 'true');
        }

        function clampZoom(value) {
            return Math.min(1.8, Math.max(0.45, Number(value) || 1));
        }

        function setZoom(value) {
            state.zoom = clampZoom(value);
            document.documentElement.style.setProperty('--graph-zoom', state.zoom);
            zoomLabel.textContent = `${Math.round(state.zoom * 100)}%`;
        }

        function applyZoom(value, preserveCenter = true) {
            const previous = state.zoom;
            const centerX = (graphScroll.scrollLeft + graphScroll.clientWidth / 2) / previous;
            const centerY = (graphScroll.scrollTop + graphScroll.clientHeight / 2) / previous;
            setZoom(value);
            if (preserveCenter) {
                window.requestAnimationFrame(() => {
                    graphScroll.scrollLeft = Math.max(0, centerX * state.zoom - graphScroll.clientWidth / 2);
                    graphScroll.scrollTop = Math.max(0, centerY * state.zoom - graphScroll.clientHeight / 2);
                });
            }
        }

        function zoomAtPoint(value, clientX, clientY) {
            const rect = graphScroll.getBoundingClientRect();
            const localX = clientX - rect.left;
            const localY = clientY - rect.top;
            const canvasX = (graphScroll.scrollLeft + localX) / state.zoom;
            const canvasY = (graphScroll.scrollTop + localY) / state.zoom;
            setZoom(value);
            graphScroll.scrollLeft = Math.max(0, canvasX * state.zoom - localX);
            graphScroll.scrollTop = Math.max(0, canvasY * state.zoom - localY);
        }

        function fitGraph() {
            if (!graphLayout) return;
            const horizontalPadding = 28;
            const verticalPadding = 32;
            const fit = Math.min(
                1,
                Math.max(0.45, (graphScroll.clientWidth - horizontalPadding * 2) / graphLayout.contentWidth),
                Math.max(0.45, (graphScroll.clientHeight - verticalPadding * 2) / graphLayout.contentHeight)
            );
            applyZoom(fit, false);
            window.requestAnimationFrame(() => {
                const contentCenterX = graphLayout.contentLeft + graphLayout.contentWidth / 2;
                const contentCenterY = graphLayout.contentTop + graphLayout.contentHeight / 2;
                graphScroll.scrollLeft = Math.max(0, contentCenterX * state.zoom - graphScroll.clientWidth / 2);
                graphScroll.scrollTop = Math.max(0, contentCenterY * state.zoom - graphScroll.clientHeight / 2);
            });
        }

        function pointerPair() {
            return Array.from(activePointers.values()).slice(0, 2);
        }

        function pairMetrics(points) {
            const [first, second] = points;
            return {
                distance: Math.hypot(second.x - first.x, second.y - first.y),
                x: (first.x + second.x) / 2,
                y: (first.y + second.y) / 2
            };
        }

        function beginPinch() {
            const points = pointerPair();
            if (points.length < 2) return;
            const metrics = pairMetrics(points);
            const rect = graphScroll.getBoundingClientRect();
            pinchState = {
                distance: Math.max(1, metrics.distance),
                zoom: state.zoom,
                canvasX: (graphScroll.scrollLeft + metrics.x - rect.left) / state.zoom,
                canvasY: (graphScroll.scrollTop + metrics.y - rect.top) / state.zoom
            };
            panState = null;
        }

        function beginPan(pointer) {
            panState = {
                id: pointer.id,
                x: pointer.x,
                y: pointer.y,
                scrollLeft: graphScroll.scrollLeft,
                scrollTop: graphScroll.scrollTop,
                moved: false
            };
            pinchState = null;
        }

        function endPointer(event) {
            if (!activePointers.has(event.pointerId)) return;
            activePointers.delete(event.pointerId);
            try {
                if (graphScroll.hasPointerCapture(event.pointerId)) graphScroll.releasePointerCapture(event.pointerId);
            } catch (error) {
                /* 指针已由浏览器释放，无需额外处理。 */
            }
            if (activePointers.size >= 2) {
                beginPinch();
            } else if (activePointers.size === 1) {
                const remaining = activePointers.values().next().value;
                beginPan(remaining);
            } else {
                panState = null;
                pinchState = null;
                graphScroll.classList.remove('is-panning');
            }
        }

        function showToast(message) {
            window.clearTimeout(toastTimer);
            toast.textContent = message;
            toast.classList.add('is-visible');
            toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1800);
        }

        graphScroll.addEventListener('pointerdown', event => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            const pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
            activePointers.set(event.pointerId, pointer);
            graphScroll.classList.add('is-panning');
            if (activePointers.size >= 2) {
                activePointers.forEach(item => {
                    try {
                        if (!graphScroll.hasPointerCapture(item.id)) graphScroll.setPointerCapture(item.id);
                    } catch (error) {
                        /* 失效指针会在 pointercancel 中清理。 */
                    }
                });
                beginPinch();
            } else {
                beginPan(pointer);
            }
        });

        graphScroll.addEventListener('pointermove', event => {
            if (!activePointers.has(event.pointerId)) return;
            activePointers.set(event.pointerId, { id: event.pointerId, x: event.clientX, y: event.clientY });

            if (activePointers.size >= 2) {
                if (!pinchState) beginPinch();
                const metrics = pairMetrics(pointerPair());
                const rect = graphScroll.getBoundingClientRect();
                const nextZoom = clampZoom(pinchState.zoom * (metrics.distance / pinchState.distance));
                setZoom(nextZoom);
                graphScroll.scrollLeft = Math.max(0, pinchState.canvasX * state.zoom - (metrics.x - rect.left));
                graphScroll.scrollTop = Math.max(0, pinchState.canvasY * state.zoom - (metrics.y - rect.top));
                state.suppressClickUntil = Date.now() + 180;
                return;
            }

            if (!panState || panState.id !== event.pointerId) return;
            const deltaX = event.clientX - panState.x;
            const deltaY = event.clientY - panState.y;
            if (!panState.moved && Math.hypot(deltaX, deltaY) > 5) {
                panState.moved = true;
                try {
                    if (!graphScroll.hasPointerCapture(event.pointerId)) graphScroll.setPointerCapture(event.pointerId);
                } catch (error) {
                    /* 保留当前局部拖动，不影响后续点击。 */
                }
            }
            if (!panState.moved) return;
            graphScroll.scrollLeft = Math.max(0, panState.scrollLeft - deltaX);
            graphScroll.scrollTop = Math.max(0, panState.scrollTop - deltaY);
            state.suppressClickUntil = Date.now() + 180;
        });

        graphScroll.addEventListener('pointerup', endPointer);
        graphScroll.addEventListener('pointercancel', endPointer);
        graphScroll.addEventListener('lostpointercapture', endPointer);
        graphScroll.addEventListener('wheel', event => {
            event.preventDefault();
            const factor = Math.exp(-event.deltaY * 0.0015);
            zoomAtPoint(state.zoom * factor, event.clientX, event.clientY);
            state.suppressClickUntil = Date.now() + 120;
        }, { passive: false });

        goalList.addEventListener('click', event => {
            const target = event.target instanceof Element ? event.target : null;
            const groupButton = target?.closest('[data-toggle-group]');
            if (groupButton) {
                const groupName = groupButton.dataset.toggleGroup;
                if (collapsedGroups.has(groupName)) collapsedGroups.delete(groupName);
                else collapsedGroups.add(groupName);
                renderGoals();
                return;
            }
            const goalButton = target?.closest('[data-goal-id]');
            if (goalButton) selectGoal(goalButton.dataset.goalId);
        });

        breadcrumbs.addEventListener('click', event => {
            const target = event.target instanceof Element ? event.target : null;
            if (target?.closest('[data-open-goals]')) {
                showGoalPage();
                return;
            }
            const button = target?.closest('[data-breadcrumb-depth]');
            if (button) navigateToDepth(Number(button.dataset.breadcrumbDepth));
        });

        graphStage.addEventListener('click', event => {
            if (Date.now() < state.suppressClickUntil) return;
            const target = event.target instanceof Element ? event.target : null;
            const childRoute = target?.closest('[data-enter-child-route]');
            if (childRoute) {
                enterRoute(childRoute.dataset.enterChildRoute, childRoute.dataset.sourceNode);
                return;
            }
            const nodeButton = target?.closest('[data-node-id]');
            if (nodeButton) openNode(nodeButton.dataset.nodeId);
        });

        drawerContent.addEventListener('click', event => {
            const target = event.target instanceof Element ? event.target : null;
            const childRoute = target?.closest('[data-enter-child-route]');
            if (childRoute) {
                enterRoute(childRoute.dataset.enterChildRoute, state.nodeId);
                return;
            }
            const training = target?.closest('[data-training]');
            if (training) showToast(`已进入「${training.dataset.training}」训练`);
            if (target?.closest('[data-primary-action]')) showToast('训练任务已准备');
        });

        document.getElementById('close-drawer').addEventListener('click', closeDrawer);
        document.getElementById('back-button').addEventListener('click', navigateUp);
        document.getElementById('zoom-out').addEventListener('click', () => applyZoom(state.zoom - 0.1));
        document.getElementById('zoom-in').addEventListener('click', () => applyZoom(state.zoom + 0.1));
        document.getElementById('zoom-fit').addEventListener('click', fitGraph);

        renderGoals();
        showGoalPage();
    </script>
</body>
</html>
